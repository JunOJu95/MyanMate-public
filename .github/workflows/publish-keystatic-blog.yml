name: Publish Keystatic content

on:
  push:
    branches:
      - 'keystatic/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: keystatic-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      contains_reviews: ${{ steps.content.outputs.contains_reviews }}
    steps:
      - name: Check out the Keystatic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow blog and review content files only
        id: content
        shell: bash
        run: |
          git fetch origin main
          mapfile -t changed_files < <(git diff --name-only origin/main...HEAD)

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changes found against main."
            exit 1
          fi

          invalid_files=()
          contains_reviews=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/content/posts/*|src/content/blog-media/*) ;;
              src/content/reviews/*) contains_reviews=true ;;
              *) invalid_files+=("$file") ;;
            esac
          done

          echo "contains_reviews=$contains_reviews" >> "$GITHUB_OUTPUT"

          if (( ${#invalid_files[@]} > 0 )); then
            echo "Keystatic publishing only accepts blog and review content files:"
            printf '  %s\n' "${invalid_files[@]}"
            exit 1
          fi

      - name: Reject empty inline image descriptions
        shell: bash
        run: |
          if grep -R -n -E '!\[\]\(' src/content/posts --include='*.mdoc'; then
            echo "Add alternative text to every inline blog image."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse the pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [[ -z "$pr_url" ]]; then
            article_name="${GITHUB_REF_NAME#keystatic/}"
            if [[ "${{ needs.validate.outputs.contains_reviews }}" == "true" ]]; then
              pr_title="Review Korean class testimonials: $article_name"
              pr_body="Korean class review changes need a manual check against the student's Google Form publication consent before merging. Private feedback and application names must stay out of public content."
            else
              pr_title="Publish Keystatic blog: $article_name"
              pr_body="Created automatically after the Keystatic blog save passed the content-only, accessibility, and build checks."
            fi
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "$pr_title" \
              --body "$pr_body")"
          fi

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Squash merge and publish
        if: needs.validate.outputs.contains_reviews == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
