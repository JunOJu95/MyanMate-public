title: E-7 Specific Activity Visa
category: visa
order: 5
lastReviewed: 2026-07-31
en:
  title: E-7 Specific Activity Visa — work in a designated field
  summary: |-
    E-7 is a work-related residence status for foreigners who will do a job designated by Korean immigration. It is not one simple work visa. The exact subtype, occupation code, employer, salary, education, experience, and documents are reviewed together.
  eligibility: |-
    E-7 can be reviewed when the job is inside a designated occupation or activity accepted by the Ministry of Justice.
    The applicant normally needs an employer in Korea, a contract, and evidence that their education, experience, license, or work history matches the exact occupation code.
    The employer is also reviewed. Immigration may check the business, workplace, tax records, hiring need, salary, and whether the company can hire for that E-7 role.
    For people already in Korea, the current visa type matters. A D-10 job seeker may check E-7-1 when the job is a professional occupation. An E-9, E-10, or H-2 worker usually checks the E-7-4 skilled-worker route if they want to change to long-term skilled work.
  subtypes: |-
    E-7-1 Professional workers — for designated professional, specialist, management, research, engineering, IT, design, overseas sales, or similar professional roles. The exact occupation code controls the education, experience, salary, and employer evidence.
    E-7-2 Semi-professional workers — for designated semi-professional service or technical roles. It is not the same as E-7-1, and the allowed jobs are narrower than general employment.
    E-7-3 General skilled workers — for designated general-skilled roles. The job must match an accepted code; general labor or any ordinary job does not automatically qualify.
    E-7-4 Skilled workers — a points-based change route for experienced E-9, E-10, or H-2 workers. It reviews Korean work history, points, income, Korean ability, recommendation, employer conditions, and disqualification items.
    E-7-M Manufacturing-focused skilled talent — a route connected to foreign graduates trained in Korea for manufacturing fields. School, major, employer, job, salary, regional or industry conditions, and document rules must be checked against the latest immigration notice.
  documents: |-
    Common applicant documents: application or visa form, passport, photo, residence card if applying in Korea, fee, and proof of address if required.
    Employment documents: employment contract, job description, workplace, salary, employment period, and documents showing why the role is needed.
    Applicant evidence: degree, career certificate, license, portfolio, Korean-language evidence, or other proof required by the exact occupation code.
    Employer evidence: business registration, tax documents, employment records, financial or business documents, and recommendation or approval documents if the occupation requires them.
    For E-7-4: proof of eligible E-9, E-10, or H-2 stay and work history, income records, points evidence, Korean-language evidence, employer recommendation, and any bonus or deduction documents.
  steps: |-
    First decide which E-7 subtype you are checking: E-7-1, E-7-2, E-7-3, or E-7-4.
    Find the exact occupation code or skilled-worker route. Do not prepare documents only from the visa name.
    Compare the job, salary, education, experience, license, Korean ability, work history, and employer conditions with the current rule.
    Prepare applicant and employer documents together. For overseas cases, the Korean employer may need to start the Certificate of Visa Issuance process.
    Apply through the route confirmed by the Korean embassy, HiKorea, or the immigration office. Do not start work until the required status or permission is granted.
    After approval, keep workplace, contract, address, passport, and registration information updated. Workplace change or job-duty change may require permission or reporting.
  watchout: |-
    E-7 is not available for every job. The job must match a designated occupation or route.
    E-7-1, E-7-2, E-7-3, and E-7-4 are different. Requirements from one subtype should not be mixed with another.
    A job offer alone is not enough. The occupation code, applicant qualification, employer condition, salary, and documents must match.
    E-7-4 is not only a score. Current stay type, work period, employer recommendation, income, Korean ability, conduct, tax, and immigration history can affect review.
    Salary standards, occupation lists, quotas, employer limits, and document lists can change. Confirm the current rule on the filing date.
  notes: |-
    The 2026 Ministry of Justice E-7 wage notice separates wage standards for E-7-1, E-7-2, E-7-3, and E-7-4. Use the current annual notice, not an old amount.
    E-7 can connect to D-10, E-9, E-10, H-2, or later residence planning, but each path has separate rules.
    This page is an overview. Before acting, confirm the exact occupation code, current notice, and application route with HiKorea, 1345, the immigration office, or the Korean embassy.
ko:
  title: E-7 특정활동 비자 — 지정 분야 취업 체류자격
  summary: |-
    E-7은 한국 출입국이 지정한 직종이나 활동으로 일하려는 외국인을 위한 취업 관련 체류자격입니다. 단순한 하나의 취업비자가 아니라 세부 유형, 직종코드, 고용기관, 임금, 학력, 경력, 서류를 함께 심사합니다.
  eligibility: |-
    E-7은 법무부가 인정하는 지정 직종 또는 활동에 해당하는 경우 검토될 수 있습니다.
    신청자는 보통 한국의 고용기관, 고용계약, 그리고 정확한 직종코드에 맞는 학력·경력·자격·근무이력 증빙이 필요합니다.
    고용기관도 함께 심사됩니다. 사업장, 세금, 고용 필요성, 임금, 해당 E-7 직종 고용 가능 여부 등을 확인할 수 있습니다.
    국내 체류자는 현재 체류자격이 중요합니다. D-10 구직자는 전문 직종 취업이면 E-7-1을 확인할 수 있고, E-9·E-10·H-2 근로자가 장기 숙련 취업으로 전환하려면 보통 E-7-4 경로를 확인합니다.
  subtypes: |-
    E-7-1 전문인력 — 지정된 전문직, 특수직, 관리자, 연구, 공학, IT, 디자인, 해외영업 등 전문 역할. 정확한 직종코드가 학력, 경력, 임금, 고용기관 증빙을 결정합니다.
    E-7-2 준전문인력 — 지정된 준전문 서비스 또는 기술 역할. E-7-1과 다르며 허용되는 직무 범위가 일반 취업보다 좁습니다.
    E-7-3 일반기능인력 — 지정된 일반기능 직종. 직무가 허용 코드와 맞아야 하며 일반 단순노무나 모든 보통 일자리가 자동으로 해당되지는 않습니다.
    E-7-4 숙련기능인력 — E-9·E-10·H-2 경력이 있는 근로자를 위한 점수제 전환 경로. 국내 근무이력, 점수, 소득, 한국어, 추천, 고용기관 요건과 결격사유를 봅니다.
    E-7-M 제조업 특화 숙련인력 — 한국에서 제조 분야 교육을 받은 외국인 졸업생과 연결되는 경로입니다. 학교, 전공, 고용기관, 직무, 임금, 지역 또는 업종 조건과 서류 기준은 최신 출입국 공고로 확인해야 합니다.
  documents: |-
    공통 신청인 서류: 신청서 또는 사증 서류, 여권, 사진, 국내 신청 시 외국인등록증, 수수료, 필요한 경우 체류지 입증서류
    고용 서류: 고용계약서, 직무 설명, 근무지, 임금, 고용기간, 해당 인력이 필요한 이유를 보여주는 자료
    신청인 증빙: 정확한 직종코드에서 요구하는 학위증, 경력증명서, 자격증, 포트폴리오, 한국어 증빙 또는 기타 자료
    고용기관 증빙: 사업자등록, 납세자료, 고용현황, 재무·사업 관련 자료, 직종에 따라 필요한 추천서 또는 승인서
    E-7-4: E-9·E-10·H-2 체류와 국내 근무이력, 소득자료, 점수 증빙, 한국어 증빙, 기업 추천서, 가점·감점 관련 자료
  steps: |-
    먼저 E-7-1, E-7-2, E-7-3, E-7-4 중 어느 세부 유형을 확인하는지 정합니다.
    정확한 직종코드 또는 숙련기능인력 경로를 찾습니다. 비자 이름만 보고 서류를 준비하지 마세요.
    직무, 임금, 학력, 경력, 자격, 한국어, 근무이력, 고용기관 조건이 현재 기준에 맞는지 비교합니다.
    신청인 서류와 고용기관 서류를 함께 준비합니다. 해외 신청은 한국 고용기관이 사증발급인정서 절차를 먼저 진행해야 할 수 있습니다.
    재외공관, 하이코리아 또는 출입국에서 확인한 경로로 신청합니다. 필요한 체류자격이나 허가를 받기 전에는 근무를 시작하지 마세요.
    허가 후 근무처, 계약, 체류지, 여권, 등록사항을 최신 상태로 유지합니다. 근무처 변경이나 업무 변경은 허가 또는 신고가 필요할 수 있습니다.
  watchout: |-
    E-7은 모든 일자리에 가능한 비자가 아닙니다. 직무가 지정 직종 또는 경로와 맞아야 합니다.
    E-7-1, E-7-2, E-7-3, E-7-4는 서로 다릅니다. 한 유형의 요건을 다른 유형에 섞어 적용하면 안 됩니다.
    취업 제안만으로는 부족합니다. 직종코드, 신청인 자격, 고용기관 조건, 임금, 서류가 맞아야 합니다.
    E-7-4는 점수만 보는 제도가 아닙니다. 현재 체류자격, 근무기간, 기업 추천, 소득, 한국어, 품행, 세금, 출입국 이력이 영향을 줄 수 있습니다.
    임금 기준, 직종 목록, 쿼터, 고용기관 한도와 서류 목록은 바뀔 수 있습니다. 신청일 기준의 최신 규정을 확인하세요.
  notes: |-
    2026년 법무부 E-7 임금요건 공고는 E-7-1, E-7-2, E-7-3, E-7-4의 임금 기준을 구분합니다. 오래된 금액이 아니라 현재 연도 공고를 사용하세요.
    E-7은 D-10, E-9, E-10, H-2 또는 이후 거주 계획과 연결될 수 있지만 경로마다 규칙이 다릅니다.
    이 페이지는 개요입니다. 실제 진행 전 하이코리아, 1345, 관할 출입국 또는 재외공관에서 정확한 직종코드, 최신 공고와 신청 경로를 확인하세요.
my:
  title: E-7 အထူးလုပ်ငန်း ဗီဇာ
  summary: |-
    E-7 သည် ကိုရီးယားလူဝင်မှုရုံးက သတ်မှတ်ထားသော အလုပ်အမျိုးအစားတွင် အလုပ်လုပ်မည့် နိုင်ငံခြားသားများအတွက် အလုပ်ဆိုင်ရာနေထိုင်ခွင့်ဖြစ်သည်။ အလုပ်ဗီဇာတစ်မျိုးတည်းလို မယူဆဘဲ E-7 အမျိုးအစားခွဲ၊ အလုပ်ကုဒ်၊ အလုပ်ရှင်၊ လစာ၊ ပညာရေး၊ အတွေ့အကြုံနှင့် စာရွက်စာတမ်းများကို အတူစစ်ဆေးသည်။
  eligibility: |-
    E-7 ကို တရားရေးဝန်ကြီးဌာနက လက်ခံထားသော သတ်မှတ်အလုပ် သို့မဟုတ် လုပ်ငန်းအမျိုးအစားနှင့် ကိုက်ညီသောအခါ စစ်ဆေးနိုင်သည်။
    လျှောက်ထားသူတွင် ကိုရီးယားရှိ အလုပ်ရှင်၊ အလုပ်စာချုပ်နှင့် အလုပ်ကုဒ်နှင့် ကိုက်ညီသော ပညာရေး၊ အတွေ့အကြုံ၊ လိုင်စင် သို့မဟုတ် အလုပ်သမိုင်းအထောက်အထား လိုနိုင်သည်။
    အလုပ်ရှင်ဘက်ကိုလည်း စစ်ဆေးနိုင်သည်။ ကုမ္ပဏီအခြေအနေ၊ အလုပ်နေရာ၊ အခွန်၊ အလုပ်ခန့်ရန်လိုအပ်ချက်၊ လစာနှင့် ထို E-7 အလုပ်အတွက် ခန့်နိုင်မနိုင် စစ်နိုင်သည်။
    ကိုရီးယားအတွင်းနေသူများအတွက် လက်ရှိဗီဇာအမျိုးအစားလည်း အရေးကြီးသည်။ D-10 ဖြင့် အလုပ်ရှာနေသူသည် ပညာရှင်အလုပ်ဖြစ်ပါက E-7-1 ကို စစ်နိုင်သည်။ E-9၊ E-10 သို့မဟုတ် H-2 ဖြင့် အလုပ်လုပ်နေသူသည် ရေရှည်ကျွမ်းကျင်အလုပ်သို့ ပြောင်းလိုပါက ယေဘုယျအားဖြင့် E-7-4 လမ်းကြောင်းကို စစ်သည်။
  subtypes: |-
    E-7-1 ပညာရှင်လုပ်သား — ပညာရှင်၊ အထူးကျွမ်းကျင်၊ မန်နေဂျာ၊ သုတေသန၊ အင်ဂျင်နီယာ၊ IT၊ ဒီဇိုင်း၊ နိုင်ငံခြားအရောင်း စသည့် သတ်မှတ်ထားသော အလုပ်များအတွက် ဖြစ်သည်။ အတိအကျ အလုပ်ကုဒ်အလိုက် ပညာရေး၊ အတွေ့အကြုံ၊ လစာနှင့် ကုမ္ပဏီစာရွက်များ ကွာနိုင်သည်။
    E-7-2 အလယ်အဆင့်ပညာရှင်လုပ်သား — သတ်မှတ်ထားသော ဝန်ဆောင်မှု သို့မဟုတ် နည်းပညာအလုပ်အချို့အတွက် ဖြစ်သည်။ E-7-1 နှင့် မတူသလို အလုပ်တိုင်းကို ခွင့်ပြုသည့် ဗီဇာလည်း မဟုတ်ပါ။
    E-7-3 အထွေထွေကျွမ်းကျင်လုပ်သား — သတ်မှတ်ထားသော ကျွမ်းကျင်လုပ်ငန်းအချို့အတွက် ဖြစ်သည်။ အလုပ်သည် လက်ခံထားသော အလုပ်ကုဒ်နှင့် ကိုက်ညီရမည်။ သာမန်အလုပ် သို့မဟုတ် အလုပ်တိုင်းကို အလိုအလျောက် မပါဝင်ပါ။
    E-7-4 ကျွမ်းကျင်လုပ်သား — E-9၊ E-10 သို့မဟုတ် H-2 ဖြင့် အတွေ့အကြုံရှိသူများအတွက် အမှတ်စနစ်ဖြင့် ပြောင်းလဲစစ်ဆေးသောလမ်းကြောင်းဖြစ်သည်။ ကိုရီးယားအလုပ်သမိုင်း၊ အမှတ်၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ၊ ထောက်ခံချက်၊ အလုပ်ရှင်စံနှုန်းနှင့် ပိတ်ပင်ချက်များကို စစ်သည်။
    E-7-M ထုတ်လုပ်ရေးဆိုင်ရာ ကျွမ်းကျင်လုပ်သား — ကိုရီးယားတွင် ထုတ်လုပ်ရေးနယ်ပယ်နှင့် ဆက်စပ်သင်ယူထားသော နိုင်ငံခြားသားဘွဲ့ရများအတွက် စစ်ဆေးနိုင်သော လမ်းကြောင်းဖြစ်သည်။ ကျောင်း၊ major၊ အလုပ်ရှင်၊ အလုပ်တာဝန်၊ လစာ၊ ဒေသ သို့မဟုတ် လုပ်ငန်းနယ်ပယ်စံနှုန်းနှင့် စာရွက်စာတမ်းများကို လတ်တလောလူဝင်မှုကြေညာချက်တွင် အတည်ပြုရမည်။
  documents: |-
    အများသုံးစာရွက်များ: လျှောက်လွှာ သို့မဟုတ် ဗီဇာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ လိုအပ်ပါက နေရပ်အထောက်အထား
    အလုပ်ဆိုင်ရာစာရွက်များ: အလုပ်စာချုပ်၊ လုပ်ငန်းတာဝန်ရှင်းလင်းချက်၊ အလုပ်နေရာ၊ လစာ၊ အလုပ်ကာလနှင့် ထိုအလုပ်ခန့်ရန်လိုအပ်ကြောင်း ပြသောစာရွက်များ
    လျှောက်ထားသူအထောက်အထား: အတိအကျ အလုပ်ကုဒ်အလိုက် လိုအပ်သော ဘွဲ့လက်မှတ်၊ အတွေ့အကြုံလက်မှတ်၊ လိုင်စင်၊ portfolio၊ ကိုရီးယားဘာသာအထောက်အထား သို့မဟုတ် အခြားစာရွက်များ
    အလုပ်ရှင်အထောက်အထား: ကုမ္ပဏီမှတ်ပုံတင်၊ အခွန်စာရွက်၊ အလုပ်ခန့်ထားမှုမှတ်တမ်း၊ ငွေကြေး/လုပ်ငန်းဆိုင်ရာစာရွက်များနှင့် အလုပ်အလိုက် လိုအပ်သော ထောက်ခံစာ သို့မဟုတ် ခွင့်ပြုစာ
    E-7-4 အတွက်: E-9၊ E-10 သို့မဟုတ် H-2 နေထိုင်မှုနှင့် ကိုရီးယားအလုပ်သမိုင်း၊ ဝင်ငွေစာရွက်၊ အမှတ်အထောက်အထား၊ ကိုရီးယားဘာသာအထောက်အထား၊ ကုမ္ပဏီထောက်ခံစာနှင့် အပိုအမှတ်/လျှော့အမှတ်ဆိုင်ရာစာရွက်များ
  steps: |-
    ပထမဦးစွာ E-7-1၊ E-7-2၊ E-7-3၊ E-7-4 ထဲမှ မည်သည့်အမျိုးအစားကို စစ်မည်ဆိုတာ သတ်မှတ်ပါ။
    အတိအကျ အလုပ်ကုဒ် သို့မဟုတ် ကျွမ်းကျင်လုပ်သားလမ်းကြောင်းကို ရှာပါ။ ဗီဇာအမည်တစ်ခုတည်းကြည့်ပြီး စာရွက်မပြင်ပါနှင့်။
    အလုပ်တာဝန်၊ လစာ၊ ပညာရေး၊ အတွေ့အကြုံ၊ လိုင်စင်၊ ကိုရီးယားဘာသာ၊ အလုပ်သမိုင်းနှင့် အလုပ်ရှင်စံနှုန်းသည် လတ်တလောစည်းမျဉ်းနှင့် ကိုက်မကိုက် နှိုင်းယှဉ်ပါ။
    လျှောက်ထားသူစာရွက်နှင့် အလုပ်ရှင်စာရွက်ကို အတူပြင်ပါ။ ပြည်ပမှလျှောက်ပါက ကိုရီးယားအလုပ်ရှင်ဘက်မှ ဗီဇာထုတ်ပေးမှုအတည်ပြုစာ လုပ်ငန်းစဉ်ကို စတင်ရနိုင်သည်။
    သံရုံး၊ HiKorea သို့မဟုတ် လူဝင်မှုရုံးက အတည်ပြုသောလမ်းကြောင်းဖြင့် လျှောက်ပါ။ လိုအပ်သောနေထိုင်ခွင့် သို့မဟုတ် ခွင့်ပြုချက်မရမီ အလုပ်မစပါနှင့်။
    ခွင့်ပြုပြီးနောက် အလုပ်နေရာ၊ စာချုပ်၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ်နှင့် မှတ်ပုံတင်အချက်အလက်များကို နောက်ဆုံးအခြေအနေအတိုင်း ထိန်းသိမ်းပါ။ အလုပ်နေရာပြောင်းခြင်း သို့မဟုတ် တာဝန်ပြောင်းခြင်းသည် ခွင့်ပြုချက် သို့မဟုတ် တင်ပြချက် လိုနိုင်သည်။
  watchout: |-
    E-7 သည် အလုပ်တိုင်းအတွက် ရနိုင်သော ဗီဇာမဟုတ်ပါ။ အလုပ်သည် သတ်မှတ်ထားသော အလုပ်ကုဒ် သို့မဟုတ် လမ်းကြောင်းနှင့် ကိုက်ညီရမည်။
    E-7-1၊ E-7-2၊ E-7-3 နှင့် E-7-4 သည် မတူပါ။ တစ်မျိုး၏လိုအပ်ချက်ကို အခြားတစ်မျိုးနှင့် မရောပါနှင့်။
    အလုပ်ကမ်းလှမ်းချက်ရုံဖြင့် မလုံလောက်ပါ။ အလုပ်ကုဒ်၊ လျှောက်ထားသူအရည်အချင်း၊ အလုပ်ရှင်အခြေအနေ၊ လစာနှင့် စာရွက်များ ကိုက်ညီရမည်။
    E-7-4 သည် အမှတ်တစ်ခုတည်းမဟုတ်ပါ။ လက်ရှိဗီဇာ၊ အလုပ်ကာလ၊ ကုမ္ပဏီထောက်ခံချက်၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ၊ အကျင့်စာရိတ္တ၊ အခွန်နှင့် လူဝင်မှုသမိုင်းတို့ သက်ရောက်နိုင်သည်။
    လစာစံနှုန်း၊ အလုပ်ကုဒ်စာရင်း၊ quota၊ ကုမ္ပဏီခန့်ထားနိုင်မှုနှင့် စာရွက်စာတမ်းစာရင်းများ ပြောင်းနိုင်သည်။ လျှောက်သည့်နေ့၏ လတ်တလောစည်းမျဉ်းကို အတည်ပြုပါ။
  notes: |-
    ၂၀၂၆ ခုနှစ် တရားရေးဝန်ကြီးဌာန E-7 လစာစံနှုန်းကြေညာချက်တွင် E-7-1၊ E-7-2၊ E-7-3 နှင့် E-7-4 ကို သီးခြားခွဲထားသည်။ အဟောင်းပမာဏမဟုတ်ဘဲ လတ်တလောနှစ်စဉ်ကြေညာချက်ကို အသုံးပြုပါ။
    E-7 သည် D-10၊ E-9၊ E-10၊ H-2 သို့မဟုတ် နောက်ပိုင်းနေထိုင်ခွင့်အစီအစဉ်နှင့် ဆက်နိုင်သော်လည်း လမ်းကြောင်းတိုင်းတွင် စည်းမျဉ်းမတူပါ။
    ဤစာမျက်နှာသည် အကျဉ်းချုပ်ဖြစ်သည်။ မလုပ်မီ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကိုရီးယားသံရုံးတွင် အတိအကျ အလုပ်ကုဒ်၊ လတ်တလောကြေညာချက်နှင့် လျှောက်လမ်းကို အတည်ပြုပါ။
