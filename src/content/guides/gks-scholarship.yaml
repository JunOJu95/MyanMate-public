title: GKS Scholarship
category: study
order: 6
lastReviewed: 2026-07-30
en:
  title: What is GKS Scholarship?
  summary: >-
    GKS, or Global Korea Scholarship, is a Korean government scholarship program
    for selected international students. It can support degree study and some
    exchange programs in Korea, but the exact track, quota, benefit, deadline,
    eligible country, university list, and document rule must be checked from
    the official notice for that application year.
  eligibility: >-
    You want to understand GKS before applying to study in Korea

    You are comparing GKS with university scholarships or other scholarship types

    You need to know the difference between embassy track and university track

    You want to check whether GKS is for undergraduate, graduate, or exchange study

    You want to avoid relying only on social media posts or old application guides
  subtypes: >-
    GKS degree programs are for students who want to study at a Korean higher education institution. Depending on the notice, this can include undergraduate and graduate routes.

    Embassy track usually means you apply through the Korean embassy or the official application channel connected to your country of citizenship. The first screening is handled through that route.

    University track usually means you apply directly to one of the designated Korean universities listed in the official GKS notice. The first screening is handled by the university.

    GKS exchange programs are different from full degree scholarships. They are usually for students already enrolled at an overseas university that has an exchange agreement with a Korean university.

    GKS benefits may include items such as tuition support, Korean language training, allowance, airfare, or insurance, depending on the program. Do not copy benefit amounts from old posts without checking the current notice.
  documents: >-
    Official GKS application guideline for the exact year and program

    Application form and personal statement or study plan from the official notice

    Passport or identity document, and nationality or family documents if required

    Transcript, graduation certificate, expected graduation certificate, or degree certificate

    Recommendation letter, research plan, portfolio, or published work if the program asks for it

    TOPIK, English score, GPA proof, ranking proof, or other academic proof if required

    University list, major list, embassy or university submission method, deadline, and result schedule
  steps: >-
    First check which GKS program you are interested in: undergraduate, graduate, exchange, or another special program.

    Read the official notice for that year before preparing documents. GKS rules can change by year, country, program, and track.

    Decide whether you are applying through embassy track or university track. Do not apply to the wrong route without checking the notice.

    Check whether Myanmar is included for that program and whether your education level, age, grades, nationality, and health requirements fit the notice.

    Choose schools and majors only from the official GKS university and major list for that year.

    Prepare documents exactly as the notice asks, including translation, notarization, apostille, consular confirmation, or online submission if required.

    Submit before the first-round deadline and keep checking announcements from the embassy, university, and Study in Korea notice board.

    After selection, confirm admission, scholarship result, visa documents, arrival schedule, and Korean language training rules from official channels.
  watchout: >-
    Do not assume GKS opens at the same time every year

    Do not use an old GKS guideline as the final rule for a new application year

    Do not mix embassy track and university track rules without checking the notice

    Do not choose a school or major that is not in the official GKS list for that year

    Do not believe anyone who says GKS, admission, or visa can be guaranteed

    Do not submit fake certificates, edited transcripts, fake language scores, fake recommendation letters, or false family documents
  notes: >-
    Study in Korea GKS scholarship page: official overview and notice board for GKS programs

    Study in Korea GKS Notice: official application guidelines, forms, university list, revisions, and result announcements

    Korean Embassy in Myanmar or the embassy connected to your citizenship: embassy track deadline and submission method

    Designated Korean university admission page: university track deadline, available majors, document rules, and contact point
ko:
  title: GKS 장학금이란?
  summary: >-
    GKS, Global Korea Scholarship은 선발된 외국인 학생을 위한 한국 정부
    장학금입니다. 한국의 학위 과정과 일부 교환 프로그램을 지원할 수 있지만,
    지원 트랙, 선발 인원, 혜택, 마감일, 대상 국가, 대학 목록과 서류 규정은
    반드시 해당 연도의 공식 공지에서 확인해야 합니다.
  eligibility: >-
    한국 유학 지원 전에 GKS가 무엇인지 이해하고 싶을 때

    GKS와 대학 장학금 또는 다른 장학금 종류를 비교하고 있을 때

    공관 전형과 대학 전형의 차이를 알아야 할 때

    GKS가 학부, 대학원 또는 교환학생 중 어떤 과정에 해당하는지 확인하고 싶을 때

    SNS 글이나 오래된 모집요강만 보고 준비하는 실수를 피하고 싶을 때
  subtypes: >-
    GKS 학위 과정은 한국 고등교육기관에서 학위를 취득하려는 학생을 위한 장학금입니다. 공지에 따라 학부와 대학원 과정이 포함될 수 있습니다.

    공관 전형은 보통 본인의 국적 국가에 있는 한국 공관 또는 그와 연결된 공식 지원 경로를 통해 지원하는 방식입니다. 1차 심사는 그 경로에서 진행됩니다.

    대학 전형은 보통 공식 GKS 공지에 지정된 한국 대학에 직접 지원하는 방식입니다. 1차 심사는 대학에서 진행됩니다.

    GKS 교환학생 프로그램은 정규 학위 장학금과 다릅니다. 보통 한국 대학과 교환 협정을 맺은 해외 대학에 재학 중인 학생을 대상으로 합니다.

    GKS 혜택에는 프로그램에 따라 등록금 지원, 한국어 연수, 장려금, 항공료 또는 보험 등이 포함될 수 있습니다. 오래된 글의 금액을 그대로 믿지 말고 현재 공지를 확인해야 합니다.
  documents: >-
    해당 연도와 프로그램의 공식 GKS 모집요강

    공식 공지에서 제공하는 지원서, 자기소개서 또는 학업계획서

    필요한 경우 여권 또는 신분증, 국적 또는 가족 관련 서류

    성적증명서, 졸업증명서, 졸업예정증명서 또는 학위증명서

    프로그램에서 요구하는 경우 추천서, 연구계획서, 포트폴리오 또는 연구 실적

    요구되는 경우 TOPIK, 영어 성적, GPA 증빙, 석차 증빙 또는 기타 학업 증빙

    대학 목록, 전공 목록, 공관 또는 대학 제출 방법, 마감일과 결과 발표 일정
  steps: >-
    먼저 관심 있는 GKS 프로그램을 확인합니다: 학부, 대학원, 교환학생 또는 기타 특별 프로그램.

    서류를 준비하기 전에 해당 연도 공식 공지를 읽습니다. GKS 규정은 연도, 국가, 프로그램과 전형에 따라 바뀔 수 있습니다.

    공관 전형으로 지원할지 대학 전형으로 지원할지 결정합니다. 공지를 확인하지 않고 잘못된 전형으로 지원하면 안 됩니다.

    해당 프로그램에 미얀마가 포함되는지, 본인의 학력, 나이, 성적, 국적과 건강 조건이 공지와 맞는지 확인합니다.

    해당 연도 공식 GKS 대학 및 전공 목록 안에서만 학교와 전공을 선택합니다.

    번역, 공증, 아포스티유, 영사확인 또는 온라인 제출 등 공지에서 요구하는 방식대로 서류를 준비합니다.

    1차 마감일 전에 제출하고 공관, 대학과 Study in Korea 공지사항을 계속 확인합니다.

    선발 후 합격, 장학금 결과, 비자 서류, 입국 일정과 한국어 연수 규정을 공식 채널에서 확인합니다.
  watchout: >-
    GKS가 매년 같은 시기에 열린다고 단정하면 안 됨

    오래된 GKS 모집요강을 새 지원 연도의 최종 규정으로 사용하면 안 됨

    공관 전형과 대학 전형 규칙을 공지 확인 없이 섞어서 이해하면 안 됨

    해당 연도 공식 GKS 목록에 없는 학교나 전공을 선택하면 안 됨

    GKS, 입학 또는 비자를 보장한다고 말하는 사람을 믿으면 안 됨

    허위 증명서, 수정된 성적표, 허위 어학 성적, 허위 추천서 또는 허위 가족 서류를 제출하면 안 됨
  notes: >-
    Study in Korea GKS 장학금 페이지: GKS 프로그램 공식 소개와 공지 확인

    Study in Korea GKS Notice: 공식 모집요강, 지원서, 대학 목록, 수정 공지와 결과 발표 확인

    주미얀마 대한민국 대사관 또는 본인 국적과 연결된 한국 공관: 공관 전형 마감일과 제출 방법 확인

    지정 한국 대학 입학 페이지: 대학 전형 마감일, 모집 전공, 서류 규정과 문의처 확인
my:
  title: GKS Scholarship ဆိုတာဘာလဲ
  summary: >-
    GKS သည် Global Korea Scholarship ၏အတိုကောက်ဖြစ်ပြီး ကိုရီးယားအစိုးရက
    ရွေးချယ်ထားသော နိုင်ငံခြားသားကျောင်းသားများအတွက် ပေးသော ပညာသင်ဆုဖြစ်ပါသည်။
    ကိုရီးယားတွင် ဘွဲ့တက်ရန် သို့မဟုတ် အချို့သော exchange program များအတွက်
    အထောက်အပံ့ဖြစ်နိုင်သော်လည်း track၊ quota၊ benefit၊ deadline၊ eligible country၊
    university list နှင့် document rule များကို ကိုယ်လျှောက်မည့်နှစ်၏ official notice
    ထဲတွင် ပြန်စစ်ရပါသည်။
  eligibility: >-
    ကိုရီးယားမှာ ပညာသင်ရန် GKS အကြောင်း အရင်နားလည်ချင်သောအခါ

    GKS ကို university scholarship သို့မဟုတ် အခြား scholarship များနှင့် နှိုင်းယှဉ်နေသောအခါ

    Embassy track နှင့် University track ဘာကွာလဲ သိချင်သောအခါ

    GKS က undergraduate၊ graduate သို့မဟုတ် exchange အတွက်လား စစ်ချင်သောအခါ

    Social media post သို့မဟုတ် ဟောင်းနေသော guideline တစ်ခုတည်းကို မမှီခိုချင်သောအခါ
  subtypes: >-
    GKS degree program သည် ကိုရီးယားတက္ကသိုလ်တွင် ဘွဲ့တက်ချင်သောကျောင်းသားများအတွက်ဖြစ်ပါသည်။ Official notice အလိုက် undergraduate နှင့် graduate လမ်းကြောင်းများ ပါနိုင်ပါသည်။

    Embassy track ဆိုသည်မှာ များသောအားဖြင့် ကိုယ့်နိုင်ငံသားဖြစ်သောနိုင်ငံရှိ ကိုရီးယားသံရုံး သို့မဟုတ် ထိုနိုင်ငံနှင့်ဆက်စပ်သော official application channel မှတစ်ဆင့် လျှောက်သောလမ်းကြောင်းဖြစ်ပါသည်။ ပထမအဆင့်ရွေးချယ်မှုကို ထိုလမ်းကြောင်းမှ စစ်ဆေးပါသည်။

    University track ဆိုသည်မှာ official GKS notice ထဲတွင် ပါသော designated Korean university များထဲမှ တက္ကသိုလ်သို့ တိုက်ရိုက်လျှောက်သောလမ်းကြောင်းဖြစ်ပါသည်။ ပထမအဆင့်ရွေးချယ်မှုကို တက္ကသိုလ်မှ စစ်ဆေးပါသည်။

    GKS exchange program သည် full degree scholarship နှင့် မတူပါ။ များသောအားဖြင့် ကိုရီးယားတက္ကသိုလ်နှင့် exchange agreement ရှိသော ပြည်ပတက္ကသိုလ်တွင် လက်ရှိတက်နေသောကျောင်းသားများအတွက်ဖြစ်ပါသည်။

    GKS benefit တွင် program အလိုက် tuition support၊ ကိုရီးယားဘာသာသင်တန်း၊ allowance၊ airfare သို့မဟုတ် insurance စသည်တို့ ပါနိုင်ပါသည်။ ဟောင်းနေသော post ထဲမှ amount များကို မကူးယူဘဲ လက်ရှိ official notice ကို စစ်ပါ။
  documents: >-
    ကိုယ်လျှောက်မည့် year နှင့် program အတွက် official GKS application guideline

    Official notice ထဲမှ application form နှင့် personal statement သို့မဟုတ် study plan

    လိုအပ်ပါက passport သို့မဟုတ် identity document၊ nationality/family documents

    Transcript၊ graduation certificate၊ expected graduation certificate သို့မဟုတ် degree certificate

    Program က တောင်းပါက recommendation letter၊ research plan၊ portfolio သို့မဟုတ် research record

    လိုအပ်ပါက TOPIK၊ English score၊ GPA proof၊ ranking proof သို့မဟုတ် academic proof

    University list၊ major list၊ embassy သို့မဟုတ် university submission method၊ deadline နှင့် result schedule
  steps: >-
    အရင်ဆုံး ကိုယ်စိတ်ဝင်စားသော GKS program ကို ခွဲခြားပါ: undergraduate၊ graduate၊ exchange သို့မဟုတ် special program။

    စာရွက်စာတမ်းမပြင်ဆင်မီ ထိုနှစ်၏ official notice ကို အရင်ဖတ်ပါ။ GKS rule များသည် year၊ country၊ program နှင့် track အလိုက် ပြောင်းနိုင်ပါသည်။

    Embassy track ဖြင့်လျှောက်မလား၊ University track ဖြင့်လျှောက်မလား ဆုံးဖြတ်ပါ။ Notice မစစ်ဘဲ မှားသော route ဖြင့် မလျှောက်သင့်ပါ။

    ထို program တွင် Myanmar ပါမပါ၊ ကိုယ့် education level၊ age၊ grades၊ nationality နှင့် health requirement များ ကိုက်မကိုက် စစ်ပါ။

    ထိုနှစ် official GKS university and major list ထဲမှာ ပါသော ကျောင်းနှင့် Major များထဲမှသာ ရွေးပါ။

    Translation၊ notarization၊ apostille၊ consular confirmation သို့မဟုတ် online submission လိုမလိုကို notice အတိုင်း ပြင်ဆင်ပါ။

    First-round deadline မတိုင်မီ တင်ပါ။ သံရုံး၊ တက္ကသိုလ်နှင့် Study in Korea notice board မှ announcement များကို ဆက်စစ်ပါ။

    ရွေးချယ်ခံရပြီးနောက် admission၊ scholarship result၊ visa documents၊ arrival schedule နှင့် ကိုရီးယားဘာသာသင်တန်းစည်းကမ်းများကို official channel မှာ အတည်ပြုပါ။
  watchout: >-
    GKS က နှစ်တိုင်း တူညီသောအချိန်တွင် ဖွင့်မည်ဟု မယူဆပါနှင့်

    ဟောင်းနေသော GKS guideline ကို နှစ်သစ် application အတွက် final rule အဖြစ် မသုံးပါနှင့်

    Embassy track နှင့် University track rule များကို notice မစစ်ဘဲ ရောထွေးမယူဆပါနှင့်

    ထိုနှစ် official GKS list ထဲမှာ မပါသော ကျောင်း သို့မဟုတ် Major ကို မရွေးပါနှင့်

    GKS၊ admission သို့မဟုတ် visa ကို guarantee ပေးနိုင်သည်ဟု ပြောသူများကို မယုံပါနှင့်

    Fake certificate၊ ပြင်ထားသော transcript၊ fake language score၊ fake recommendation letter သို့မဟုတ် false family documents မတင်ပါနှင့်
  notes: >-
    Study in Korea GKS scholarship page: GKS program overview နှင့် notice board ကို စစ်ရန်

    Study in Korea GKS Notice: official application guideline၊ forms၊ university list၊ revision နှင့် result announcement များကို စစ်ရန်

    Myanmar ရှိ ကိုရီးယားသံရုံး သို့မဟုတ် ကိုယ့်နိုင်ငံသားဖြစ်သောနိုင်ငံနှင့်ဆက်စပ်သော ကိုရီးယားသံရုံး: embassy track deadline နှင့် submission method စစ်ရန်

    Designated Korean university admission page: university track deadline၊ available majors၊ document rules နှင့် contact point စစ်ရန်
