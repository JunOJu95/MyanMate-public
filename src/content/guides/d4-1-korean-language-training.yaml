title: D-4-1 Korean Language Training Visa
category: visa
order: 11
lastReviewed: 2026-07-31
en:
  title: D-4-1 Korean Language Training Visa
  summary: |-
    D-4-1 is the Korean-language training route inside the D-4 category. It is usually used by students who will study Korean at a university-affiliated language institute in Korea. The exact document list can change by school, embassy, and applicant history, so confirm before applying.
  eligibility: |-
    This route is usually for people who have at least high-school graduation or an equivalent education record.
    The Korean program should normally be run by a language institute attached to a recognized college or university.
    If the study period is 90 days or less, a short-stay visa may be used instead of D-4-1, depending on the case.
    D-4-1 is for language training. It is different from D-2, which is normally for degree study.
  subtypes: ''
  documents: |-
    Visa application form, passport, photo, and visa fee
    Certificate of admission or standard admission certificate from the school
    School or language-institute documents requested by the embassy or immigration office
    Final education record, such as graduation certificate or transcript, with verification if required
    Financial proof showing that tuition and living costs can be covered
    Study plan or training plan if requested
    Additional documents may be requested depending on nationality, school, sponsor, previous visa history, or embassy review.
  steps: |-
    Choose a Korean-language program and confirm that the school can issue the required admission document.
    Ask the school and the Korean embassy or consulate which D-4-1 documents are currently required for your country.
    Prepare education, financial, passport, photo, and admission documents. Do not use fake bank, school, or family documents.
    Apply through the correct visa channel before traveling to Korea.
    After entering Korea, register as a foreigner within 90 days if your stay is more than 90 days.
    Keep attendance, address, passport, and school information updated during your stay.
  watchout: |-
    D-4-1 does not automatically allow work. Language-training students may need to wait for the required period and must get school confirmation and immigration permission before part-time work.
    Low attendance can affect extension, school transfer, and future visa review.
    Financial-proof rules and required amounts can change. Check the latest notice before preparing the bank document.
    Changing school or program can affect your stay status. Confirm with the school or immigration office before changing.
    Do not overstay, work without permission, or submit false documents. These can create visa refusal, cancellation, or future entry problems.
  notes: |-
    D-4-1 is useful for people whose main goal is to improve Korean before degree study, work preparation, or daily life in Korea.
    If your final goal is university degree study, also check D-2 because D-4-1 and D-2 are reviewed differently.
    Official confirmation should come from the Korean embassy or consulate, HiKorea, 1345, your language school, or the immigration office.
ko:
  title: D-4-1 한국어 연수 비자
  summary: |-
    D-4-1은 D-4 체류자격 안에 있는 한국어 연수 경로입니다. 보통 한국의 대학 부설 어학원에서 한국어를 공부하려는 학생이 이용합니다. 실제 서류는 학교, 재외공관, 신청자의 이력에 따라 달라질 수 있으므로 신청 전에 확인해야 합니다.
  eligibility: |-
    보통 고등학교 졸업 이상 또는 이에 준하는 학력 이력이 있는 사람이 대상입니다.
    한국어 과정은 일반적으로 인정되는 대학 또는 전문대학 부설 어학원에서 운영되는 과정이어야 합니다.
    연수 기간이 90일 이하라면 사례에 따라 D-4-1이 아니라 단기 체류 경로를 확인해야 할 수 있습니다.
    D-4-1은 어학연수 목적입니다. 학위과정 유학에 주로 쓰이는 D-2와는 다릅니다.
  subtypes: ''
  documents: |-
    사증발급신청서, 여권, 사진, 수수료
    학교에서 발급한 입학허가서 또는 표준입학허가서
    재외공관 또는 출입국에서 요구하는 학교·어학원 관련 서류
    최종학력 입증서류. 필요한 경우 인증 또는 확인 절차가 필요할 수 있습니다.
    등록금과 체재비를 감당할 수 있음을 보여주는 재정 입증자료
    요구되는 경우 연수계획서 또는 학업계획서
    국적, 학교, 재정보증인, 과거 체류이력, 공관 심사에 따라 추가 서류가 요청될 수 있습니다.
  steps: |-
    한국어 과정을 선택하고 학교가 필요한 입학서류를 발급할 수 있는지 확인합니다.
    학교와 대한민국 대사관·영사관에 현재 본인 국가에서 필요한 D-4-1 서류를 확인합니다.
    학력, 재정, 여권, 사진, 입학서류를 준비합니다. 허위 은행서류, 학교서류, 가족서류는 사용하지 마세요.
    한국에 오기 전에 올바른 사증 절차로 신청합니다.
    입국 후 90일을 초과해 체류한다면 90일 이내에 외국인등록을 합니다.
    체류 중 출석, 주소, 여권, 학교 정보를 최신 상태로 유지합니다.
  watchout: |-
    D-4-1이라고 해서 바로 일할 수 있는 것은 아닙니다. 어학연수생은 필요한 기간이 지난 뒤 학교 확인과 출입국 허가를 받아야 시간제 취업을 할 수 있습니다.
    출석률이 낮으면 연장, 학교 변경, 이후 체류심사에 영향을 줄 수 있습니다.
    재정 입증 기준과 필요 금액은 바뀔 수 있습니다. 은행서류를 준비하기 전에 최신 공지를 확인하세요.
    학교나 과정을 바꾸면 체류자격에 영향이 있을 수 있습니다. 변경 전에 학교 또는 출입국에 확인하세요.
    불법체류, 무허가 취업, 허위서류 제출은 비자 거절, 취소, 향후 입국 문제로 이어질 수 있습니다.
  notes: |-
    D-4-1은 학위과정, 취업 준비 또는 한국 생활 전에 한국어를 먼저 준비하려는 사람에게 도움이 될 수 있습니다.
    최종 목표가 대학 학위과정이라면 D-2도 함께 확인하세요. D-4-1과 D-2는 심사 목적이 다릅니다.
    공식 확인은 대한민국 대사관·영사관, 하이코리아, 1345, 소속 어학원 또는 관할 출입국·외국인관서에서 받아야 합니다.
my:
  title: D-4-1 ကိုရီးယားဘာသာသင်တန်း ဗီဇာ
  summary: |-
    D-4-1 သည် D-4 ဗီဇာအတွင်းရှိ ကိုရီးယားဘာသာသင်တန်းအတွက် လမ်းကြောင်းဖြစ်သည်။ ကိုရီးယားရှိ တက္ကသိုလ်တွဲဖက် ဘာသာစကားသင်တန်းကျောင်းတွင် ကိုရီးယားဘာသာ လေ့လာမည့်သူများအတွက် အသုံးများသည်။ လိုအပ်သောစာရွက်စာတမ်းများသည် ကျောင်း၊ သံရုံး၊ မိမိ၏ဗီဇာသမိုင်းအလိုက် ကွာနိုင်သောကြောင့် မလျှောက်မီ အတည်ပြုပါ။
  eligibility: |-
    ယေဘုယျအားဖြင့် အထက်တန်းအောင် သို့မဟုတ် အလားတူပညာရေးအထောက်အထားရှိသူများအတွက် ဖြစ်သည်။
    ကိုရီးယားဘာသာသင်တန်းသည် အသိအမှတ်ပြု တက္ကသိုလ် သို့မဟုတ် ကောလိပ်တွဲဖက် ဘာသာစကားသင်တန်းဖြစ်ရမည်။
    သင်တန်းကာလ ၉၀ ရက်အောက်ဖြစ်ပါက D-4-1 မဟုတ်ဘဲ တိုတောင်းကာလဗီဇာဖြင့် သင့်တော်မတော် စစ်ရနိုင်သည်။
    D-4-1 သည် ဘာသာစကားသင်တန်းအတွက် ဖြစ်ပြီး ဘွဲ့သင်တန်းအတွက် အသုံးများသော D-2 နှင့် မတူပါ။
  subtypes: ''
  documents: |-
    ဗီဇာလျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး
    ကျောင်းမှထုတ်ပေးသော ဝင်ခွင့်စာ သို့မဟုတ် စံဝင်ခွင့်လက်မှတ်
    သံရုံး သို့မဟုတ် လူဝင်မှုရုံးက တောင်းသော ကျောင်း/ဘာသာစကားသင်တန်းဆိုင်ရာစာရွက်များ
    နောက်ဆုံးပညာအရည်အချင်းအထောက်အထား။ လိုအပ်ပါက အတည်ပြုခြင်း သို့မဟုတ် စစ်ဆေးခြင်း လိုနိုင်သည်။
    ကျောင်းလခနှင့် နေထိုင်စရိတ်ကို ထောက်ပံ့နိုင်ကြောင်းပြသော ငွေကြေးအထောက်အထား
    တောင်းပါက သင်ယူမည့်အစီအစဉ် သို့မဟုတ် Study Plan
    နိုင်ငံသား၊ ကျောင်း၊ ငွေကြေးထောက်ပံ့သူ၊ ယခင်ဗီဇာသမိုင်း၊ သံရုံးစစ်ဆေးမှုအလိုက် အပိုစာရွက်များ တောင်းနိုင်သည်။
  steps: |-
    ကိုရီးယားဘာသာသင်တန်းကို ရွေးပြီး ကျောင်းက လိုအပ်သောဝင်ခွင့်စာရွက် ထုတ်ပေးနိုင်မနိုင် စစ်ပါ။
    မိမိနိုင်ငံအတွက် လတ်တလော D-4-1 စာရွက်စာတမ်းစာရင်းကို ကျောင်းနှင့် ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံးတွင် မေးပါ။
    ပညာရေး၊ ငွေကြေး၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံနှင့် ဝင်ခွင့်စာရွက်များ ပြင်ဆင်ပါ။ မမှန်သောဘဏ်စာရွက်၊ ကျောင်းစာရွက်၊ မိသားစုစာရွက် မသုံးပါနှင့်။
    ကိုရီးယားမလာမီ မှန်ကန်သောဗီဇာလုပ်ငန်းစဉ်ဖြင့် လျှောက်ပါ။
    ကိုရီးယားရောက်ပြီး ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
    နေထိုင်နေစဉ် ကျောင်းခေါ်ချိန်၊ နေရပ်လိပ်စာ၊ နိုင်ငံကူးလက်မှတ်နှင့် ကျောင်းအချက်အလက်ကို နောက်ဆုံးအခြေအနေအတိုင်း ထားပါ။
  watchout: |-
    D-4-1 ရှိရုံဖြင့် အလုပ်လုပ်ခွင့်ရသည်ဟု မယူဆပါနှင့်။ ဘာသာစကားသင်တန်းသားများသည် သတ်မှတ်ကာလပြည့်ပြီး ကျောင်းအတည်ပြုချက်နှင့် လူဝင်မှုရုံးခွင့်ပြုချက် ရပြီးမှသာ အချိန်ပိုင်းအလုပ်လုပ်နိုင်သည်။
    ကျောင်းခေါ်ချိန်နည်းပါက သက်တမ်းတိုးခြင်း၊ ကျောင်းပြောင်းခြင်း၊ နောက်ပိုင်းဗီဇာစစ်ဆေးမှုတို့ကို ထိခိုက်နိုင်သည်။
    ငွေကြေးအထောက်အထားစံနှုန်းနှင့် လိုအပ်သောပမာဏများ ပြောင်းနိုင်သည်။ ဘဏ်စာရွက်မပြင်မီ လတ်တလောအချက်အလက်ကို စစ်ပါ။
    ကျောင်း သို့မဟုတ် သင်တန်းပြောင်းခြင်းသည် နေထိုင်ခွင့်ကို သက်ရောက်နိုင်သည်။ မပြောင်းမီ ကျောင်း သို့မဟုတ် လူဝင်မှုရုံးတွင် အတည်ပြုပါ။
    ရက်ကျော်နေခြင်း၊ ခွင့်ပြုချက်မရှိဘဲ အလုပ်လုပ်ခြင်း၊ မမှန်သောစာရွက်တင်ခြင်းတို့သည် ဗီဇာငြင်းပယ်ခြင်း၊ ပယ်ဖျက်ခြင်း သို့မဟုတ် နောင်ဝင်ခွင့်ပြဿနာ ဖြစ်နိုင်သည်။
  notes: |-
    D-4-1 သည် ဘွဲ့သင်တန်းမတက်မီ၊ အလုပ်အတွက်ပြင်ဆင်မီ သို့မဟုတ် ကိုရီးယားနေ့စဉ်ဘဝအတွက် ကိုရီးယားဘာသာကို အရင်လေ့လာလိုသူများအတွက် အသုံးဝင်နိုင်သည်။
    နောက်ဆုံးရည်မှန်းချက်က တက္ကသိုလ်ဘွဲ့သင်တန်းဖြစ်ပါက D-2 ကိုပါ စစ်ပါ။ D-4-1 နှင့် D-2 သည် စစ်ဆေးသည့်ရည်ရွယ်ချက် မတူပါ။
    တရားဝင်အတည်ပြုချက်ကို ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံး၊ HiKorea၊ 1345၊ မိမိတက်မည့်ဘာသာစကားသင်တန်းကျောင်း သို့မဟုတ် လူဝင်မှုရုံးမှ ရယူပါ။
