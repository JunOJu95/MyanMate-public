title: TOPIK II
category: study
order: 3
lastReviewed: 2026-07-29
en:
  title: TOPIK II
  summary: >-
    TOPIK II is the intermediate to advanced Korean test for Level 3 to Level 6.
    It is the more important TOPIK path for Korean-taught university study,
    scholarships, graduation rules, and stronger Korean proof.
  eligibility: >-
    Your target school, major, scholarship, or graduation rule asks for Level 3 or higher

    You plan to study in a Korean-taught program or take classes where Korean academic reading matters

    You already understand basic Korean and want to prove intermediate or advanced ability

    You need Korean proof for a competitive scholarship, school requirement, job preparation, or future residence/work plan

    Your goal requires writing ability, not only listening and reading
  subtypes: >-
    TOPIK II is the intermediate to advanced TOPIK test. It is for people who need Level 3, Level 4, Level 5, or Level 6.

    It is usually the more important TOPIK path for Korean-taught university study, scholarships, graduation rules, and stronger Korean proof.

    PBT TOPIK II checks Listening, Writing, and Reading.

    PBT TOPIK II total score is 300. Level 3 is 120 to 149 points, Level 4 is 150 to 189, Level 5 is 190 to 229, and Level 6 is 230 to 300.

    Level 3-4 usually means you can handle more daily, social, study, and work communication than beginner level.

    Level 5-6 usually means advanced Korean for more complex academic, professional, or public topics.

    IBT TOPIK II uses 600 total points and different score ranges, so check the official IBT notice if your test center uses IBT.
  documents: >-
    Accepted ID for registration and test day

    TOPIK account or registration login

    Photo or profile image if the registration system asks for it

    Payment method for the test fee

    Admission ticket after registration

    TOPIK II score report after results are released

    School, scholarship, graduation, job, or residence notice that says which Level 3-6 score is accepted
  steps: >-
    Set a real target level based on the official requirement, not only your current feeling.

    Build vocabulary and grammar by topic: school, society, work, culture, science, economy, and public issues.

    Practice listening with longer conversations, lectures, interviews, news-style explanations, and opinion-based questions.

    Practice reading under time limits because long passages and similar answer choices can slow you down.

    Prepare writing separately: short answers, graph/table description, and essay-style writing need different practice.

    Take timed mock tests and review why each wrong answer is wrong.

    Before using the score, confirm accepted level, score type, result date, validity, and submission format.
  watchout: >-
    Writing is often the weakest part for students who only studied vocabulary and grammar

    A high Listening or Reading score may not be enough if Writing is too low

    Level 3 may be acceptable for some cases, but scholarships or Korean-taught majors may prefer Level 4 or higher

    Do not use expired scores or scores released after the application deadline

    Do not assume every department in the same university has the same TOPIK rule

    Avoid proxy testing, leaked questions, score guarantees, or any illegal shortcut
  notes: >-
    NIIED official TOPIK page: TOPIK II section, time, total score, and level range

    Official TOPIK site or local test center: registration, test date, test type, fee, ID rule, and result release

    School, scholarship, employer, or graduation office: required level, accepted test type, valid score date, and submission format

    If TOPIK affects admission, scholarship money, graduation, employment, or residence planning, confirm directly with the institution
ko:
  title: TOPIK II
  summary: >-
    TOPIK II는 3급부터 6급에 해당하는 중급~고급 한국어 시험입니다. 한국어 수업, 장학금, 졸업 요건, 더 높은 한국어
    증명이 필요한 경우에 더 중요한 TOPIK 경로입니다.
  eligibility: >-
    목표 학교, 전공, 장학금, 졸업 요건에서 3급 이상을 요구할 때

    한국어로 수업하는 과정에 지원하거나 학업용 한국어 읽기가 필요한 수업을 들을 계획일 때

    기본 한국어를 이미 이해하고 중급 또는 고급 실력을 증명하고 싶을 때

    경쟁이 있는 장학금, 학교 요건, 취업 준비, 향후 체류/취업 계획에 한국어 증명이 필요할 때

    듣기와 읽기뿐 아니라 쓰기 실력도 필요한 목표일 때
  subtypes: >-
    TOPIK II는 중급~고급 TOPIK 시험입니다. 3급, 4급, 5급, 6급이 필요한 사람을 위한 시험입니다.

    한국어 수업, 장학금, 졸업 요건, 더 높은 한국어 증명이 필요한 경우에 더 중요한 TOPIK 경로가 되는 경우가 많습니다.

    PBT TOPIK II는 듣기, 쓰기, 읽기를 봅니다.

    PBT TOPIK II 총점은 300점입니다. 3급은 120~149점, 4급은 150~189점, 5급은 190~229점, 6급은 230~300점입니다.

    3~4급은 보통 초급보다 높은 생활, 사회, 학업, 업무 의사소통이 가능한 수준으로 볼 수 있습니다.

    5~6급은 더 복잡한 학업, 전문, 공공 주제를 다룰 수 있는 고급 한국어로 볼 수 있습니다.

    IBT TOPIK II는 총점 600점과 다른 등급 범위를 사용하므로 IBT를 보는 경우 공식 IBT 공지를 확인해야 합니다.
  documents: >-
    접수 및 시험 당일 인정되는 신분증

    TOPIK 계정 또는 접수 로그인 정보

    접수 시스템에서 요구하는 경우 사진 또는 프로필 이미지

    응시료 결제 수단

    접수 후 수험표

    성적 발표 후 TOPIK II 성적표

    3급~6급 중 어떤 성적을 인정하는지 적힌 학교, 장학금, 졸업, 취업, 체류 관련 공지
  steps: >-
    현재 느낌이 아니라 공식 요건을 기준으로 목표 급수를 정합니다.

    학교, 사회, 일, 문화, 과학, 경제, 공공 이슈 등 주제별 어휘와 문법을 쌓습니다.

    긴 대화, 강의, 인터뷰, 뉴스식 설명, 의견 문제 듣기를 연습합니다.

    긴 지문과 비슷한 선택지가 시간을 빼앗기므로 제한 시간을 두고 읽기를 연습합니다.

    쓰기는 따로 준비합니다. 단답형, 그래프/표 설명, 에세이형 쓰기는 각각 다른 연습이 필요합니다.

    실전처럼 시간을 재고 모의고사를 풀며 틀린 이유를 복습합니다.

    성적을 사용하기 전 인정 급수, 시험 종류, 성적 발표일, 유효기간, 제출 형식을 확인합니다.
  watchout: >-
    어휘와 문법만 공부한 학생에게 쓰기가 가장 약한 부분이 되는 경우가 많음

    듣기나 읽기 점수가 높아도 쓰기가 너무 낮으면 목표 급수가 나오기 어려울 수 있음

    3급이 인정되는 경우도 있지만 장학금이나 한국어 전공 수업은 4급 이상을 선호할 수 있음

    만료된 성적이나 지원 마감 후 발표되는 성적을 사용하면 안 됨

    같은 대학 안에서도 학과마다 TOPIK 규정이 다를 수 있음

    대리시험, 유출 문제, 점수 보장, 불법 shortcut은 피해야 함
  notes: >-
    NIIED 공식 TOPIK 페이지: TOPIK II 영역, 시간, 총점, 등급 범위 확인

    공식 TOPIK 사이트 또는 현지 시험장: 접수, 시험일, 시험 종류, 응시료, 신분증 규정, 성적 발표 확인

    학교, 장학금, 고용주, 졸업 담당 부서: 요구 급수, 인정 시험 종류, 유효한 성적 날짜, 제출 형식 확인

    TOPIK이 입학, 장학금, 졸업, 취업, 체류 계획에 영향을 준다면 해당 기관에 직접 확인
my:
  title: TOPIK II
  summary: >-
    TOPIK II သည် Level 3 မှ Level 6 အထိ Intermediate မှ Advanced
    ကိုရီးယားစာ စာမေးပွဲဖြစ်ပါသည်။ ကိုရီးယားဘာသာဖြင့် တက္ကသိုလ်တက်ခြင်း၊
    Scholarship၊ ဘွဲ့ရရန်လိုအပ်ချက်နှင့် ပိုမြင့်သော ကိုရီးယားစာအထောက်အထားအတွက်
    အရေးကြီးသော TOPIK လမ်းကြောင်းဖြစ်ပါသည်။
  eligibility: >-
    လျှောက်မည့် ကျောင်း၊ Major၊ Scholarship သို့မဟုတ် ဘွဲ့ရရန်လိုအပ်ချက်က Level 3 အထက် တောင်းသောအခါ

    ကိုရီးယားဘာသာဖြင့် သင်ကြားသော Program ကို လျှောက်မည် သို့မဟုတ် academic Korean reading လိုသော class များ တက်မည့်အခါ

    အခြေခံကိုရီးယားစာကို နားလည်ပြီး Intermediate သို့မဟုတ် Advanced level ကို တရားဝင် score ဖြင့် ပြချင်သောအခါ

    Competitive scholarship၊ school requirement၊ အလုပ်အတွက်ပြင်ဆင်မှု သို့မဟုတ် နောင်နေထိုင်ရေး/အလုပ်အစီအစဉ်အတွက် Korean proof လိုသောအခါ

    Listening နှင့် Reading သာမက Writing ability ပါ လိုသောရည်မှန်းချက်ရှိသောအခါ
  subtypes: >-
    TOPIK II သည် Intermediate မှ Advanced အထိ TOPIK စာမေးပွဲဖြစ်ပါသည်။ Level 3၊ Level 4၊ Level 5 သို့မဟုတ် Level 6 လိုသူများအတွက်ဖြစ်ပါသည်။

    ကိုရီးယားဘာသာဖြင့် တက္ကသိုလ်တက်ခြင်း၊ Scholarship၊ ဘွဲ့ရရန်လိုအပ်ချက်နှင့် ပိုခိုင်မာသော Korean proof အတွက် TOPIK II ကို ပိုလိုတတ်ပါသည်။

    PBT TOPIK II တွင် Listening၊ Writing နှင့် Reading ပါပါသည်။

    PBT TOPIK II သည် စုစုပေါင်း 300 မှတ်ဖြစ်ပါသည်။ Level 3 သည် 120 မှ 149 မှတ်၊ Level 4 သည် 150 မှ 189 မှတ်၊ Level 5 သည် 190 မှ 229 မှတ်၊ Level 6 သည် 230 မှ 300 မှတ်ဖြစ်ပါသည်။

    Level 3-4 သည် အခြေခံအဆင့်ထက် ပိုခိုင်မာပြီး နေ့စဉ်ဘဝ၊ လူမှုရေး၊ ပညာသင်နှင့် အလုပ်ဆက်သွယ်ရေးကို ပိုကောင်းကောင်း ကိုင်တွယ်နိုင်သောအဆင့်ဟု နားလည်နိုင်ပါသည်။

    Level 5-6 သည် academic၊ professional သို့မဟုတ် public topic ကဲ့သို့ ပိုရှုပ်ထွေးသောအကြောင်းအရာများကို ကိုင်တွယ်နိုင်သော Advanced Korean ဟု နားလည်နိုင်ပါသည်။

    IBT TOPIK II တွင် total score 600 ဖြစ်ပြီး score range ကွာသောကြောင့် IBT ဖြေမည်ဆိုပါက official IBT notice ကို စစ်ပါ။
  documents: >-
    Registration နှင့် exam day အတွက် လက်ခံသော ID

    TOPIK account သို့မဟုတ် registration login information

    Registration system က တောင်းပါက ဓာတ်ပုံ သို့မဟုတ် profile image

    Exam fee ပေးရန် payment method

    Registration ပြီးနောက် admission ticket

    Result ထွက်ပြီးနောက် TOPIK II score report

    Level 3 မှ Level 6 ထဲက ဘယ် score ကို လက်ခံသလဲ ရေးထားသော ကျောင်း၊ Scholarship၊ graduation၊ job သို့မဟုတ် residence notice
  steps: >-
    လက်ရှိခံစားချက်အပေါ်မဟုတ်ဘဲ official requirement အပေါ်မူတည်၍ target level ကို သတ်မှတ်ပါ။

    School၊ society၊ work၊ culture၊ science၊ economy နှင့် public issue စသော topic အလိုက် vocabulary နှင့် grammar ကို စနစ်တကျ တည်ဆောက်ပါ။

    Longer conversation၊ lecture၊ interview၊ news-style explanation နှင့် opinion-based question များကို Listening လေ့ကျင့်ပါ။

    Passage ရှည်များနှင့် ဆင်တူသော answer choice များကြောင့် အချိန်ကုန်နိုင်ပါသည်။ ထို့ကြောင့် Reading ကို time limit ဖြင့် လေ့ကျင့်ပါ။

    Writing ကို သီးခြားပြင်ဆင်ပါ။ Short answer၊ graph/table description နှင့် essay-style writing များသည် လေ့ကျင့်နည်းမတူပါ။

    Mock test ကို time limit ဖြင့် ဖြေပြီး မှားသောမေးခွန်းတိုင်းကို ဘာကြောင့်မှားသလဲ ပြန်စစ်ပါ။

    Score အသုံးမပြုမီ accepted level၊ score type၊ result date၊ validity နှင့် submission format ကို စစ်ပါ။
  watchout: >-
    Vocabulary နှင့် grammar သာ လေ့လာသောကျောင်းသားများအတွက် Writing သည် အားနည်းဆုံးပိုင်းဖြစ်လေ့ရှိပါသည်

    Listening သို့မဟုတ် Reading score မြင့်သော်လည်း Writing နိမ့်လျှင် target level မရနိုင်ပါ

    Level 3 လက်ခံသော case များရှိသော်လည်း Scholarship သို့မဟုတ် Korean-taught major များတွင် Level 4 အထက်ကို ပိုနှစ်သက်နိုင်ပါသည်

    သက်တမ်းကုန်သွားသော score သို့မဟုတ် application deadline ပြီးမှ ထွက်သော score ကို မသုံးပါနှင့်

    တက္ကသိုလ်တစ်ခုအတွင်းပင် Department အလိုက် TOPIK rule ကွာနိုင်ပါသည်

    ကိုယ်စားဝင်ဖြေခြင်း၊ မေးခွန်းပေါက်ကြားမှုကို အသုံးပြုခြင်း၊ score အာမခံပေးမည်ဟု ပြောခြင်း သို့မဟုတ် တရားမဝင် shortcut များကို လုံးဝရှောင်ပါ
  notes: >-
    NIIED official TOPIK page: TOPIK II section၊ time၊ total score နှင့် level range စစ်ရန်

    Official TOPIK site သို့မဟုတ် local test center: registration၊ test date၊ test type၊ fee၊ ID rule နှင့် result release စစ်ရန်

    School၊ Scholarship၊ employer သို့မဟုတ် graduation office: required level၊ accepted test type၊ valid score date နှင့် submission format စစ်ရန်

    TOPIK သည် admission၊ scholarship money၊ graduation၊ employment သို့မဟုတ် residence planning ကို ထိခိုက်နိုင်ပါက သက်ဆိုင်ရာ institution တွင် တိုက်ရိုက်အတည်ပြုပါ
