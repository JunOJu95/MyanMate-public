title: F-2 Resident Visa
category: visa
order: 6
lastReviewed: 2026-07-31
en:
  title: F-2 Resident Visa — residence status in Korea
  summary: |-
    F-2 is a residence status for people who have a recognized reason to live in Korea more stably. It is not one single visa rule. There are several F-2 routes, and each route has different conditions and documents.
  eligibility: |-
    F-2 may be reviewed when a person fits one of the current residence routes recognized by Korean immigration.
    The route can be connected to family, refugee recognition, investment, long-term stay, regional talent, or points-based talent.
    Before preparing documents, check which F-2 route matches your current visa, stay history, family situation, work, income, recommendation, or official decision.
  subtypes: |-
    F-2-7 points-based talent — a points-based route for people who fit the current applicant group and score rules
    F-2-7S potential talent — a special talent route connected to designated science and technology education or research backgrounds
    Family-related F-2 — routes connected to certain family relationships and the main resident's status
    Refugee-related F-2 — residence routes connected to recognized refugee-related cases
    F-2-99 long-term resident — a long-term residence route with separate stay and review conditions
    Investment and public-interest investment F-2 — routes connected to qualifying investment programs
    Regional talent or other F-2 routes — routes that depend on current government or local-government programs
  documents: |-
    Common documents usually include an application form, passport, photo, residence card if already registered, fee, and proof of address.
    The important documents depend on the route. Immigration may ask for family documents, income records, employment documents, tax records, investment evidence, refugee-related documents, recommendation letters, stay-history evidence, or points evidence.
    Foreign-issued documents may need translation, Apostille, consular confirmation, or original verification.
    This page is not a final document checklist. Confirm the exact list for your route before applying.
  steps: |-
    First, identify which F-2 route you are checking.
    Confirm the latest requirements through HiKorea, 1345, the immigration office, or the official notice for that route.
    Prepare the common documents and the route-specific evidence.
    If your route allows an in-country change of status, reserve a visit or use the available HiKorea procedure before your current stay expires.
    After approval, keep your address, passport, income, employment, family, and status information updated because they may matter at extension.
  watchout: |-
    F-2 is not automatically available just because you have lived in Korea for a long time.
    A route name alone is not enough. You must match the current conditions and prove them with documents.
    F-2-7 is only one type of F-2. Do not treat every F-2 application as a points-based application.
    Rules, route names, score tables, income standards, and document lists can change.
    F-2 can give more stable residence than many visa types, but it does not remove every reporting duty or every legal restriction.
  notes: |-
    Use this page as an overview of F-2. For detailed preparation, check the specific route you plan to apply for.
    F-2-7, F-2-99, investment routes, family routes, and regional-talent routes should be checked separately because the evidence is different.
    This is a summary. Confirm the exact route and latest requirements with HiKorea, 1345, or the immigration office before applying.
ko:
  title: F-2 거주 비자 — 한국 거주 체류자격
  summary: |-
    F-2는 한국에서 비교적 안정적으로 거주할 필요가 인정되는 사람에게 적용되는 거주 체류자격입니다. 하나의 규칙으로 운영되는 비자가 아니라 여러 경로가 있고, 경로마다 조건과 서류가 다릅니다.
  eligibility: |-
    F-2는 한국 출입국에서 인정하는 현재 거주 경로 중 하나에 해당하는 경우 검토될 수 있습니다.
    경로는 가족관계, 난민 인정, 투자, 장기체류, 지역 인재, 점수제 우수인재 등과 연결될 수 있습니다.
    서류를 준비하기 전에 현재 체류자격, 체류이력, 가족관계, 직업, 소득, 추천 또는 공식 결정이 어떤 F-2 경로와 맞는지 확인해야 합니다.
  subtypes: |-
    F-2-7 점수제 우수인재 — 현재 신청 대상 유형과 점수 기준을 충족해야 하는 점수제 경로
    F-2-7S 잠재적 우수인재 — 지정된 과학기술 교육 또는 연구 배경과 연결된 특별 인재 경로
    가족 관련 F-2 — 특정 가족관계와 주 체류자의 체류자격에 연결되는 경로
    난민 관련 F-2 — 난민 인정 등 난민 관련 사례와 연결되는 거주 경로
    F-2-99 장기체류자 — 별도의 체류기간과 심사조건이 있는 장기체류 경로
    투자 및 공익사업 투자 F-2 — 일정한 투자 프로그램과 연결되는 경로
    지역 인재 또는 기타 F-2 — 현재 정부 또는 지방자치단체 프로그램에 따라 달라지는 경로
  documents: |-
    공통서류는 보통 신청서, 여권, 사진, 외국인등록증(등록외국인), 수수료, 체류지 입증서류입니다.
    중요한 서류는 경로마다 다릅니다. 가족관계 서류, 소득자료, 재직자료, 납세자료, 투자 입증자료, 난민 관련 서류, 추천서, 체류이력, 점수 증빙 등을 요구받을 수 있습니다.
    해외 발급 서류는 번역, 아포스티유, 영사확인 또는 원본 확인이 필요할 수 있습니다.
    이 페이지는 최종 서류 체크리스트가 아닙니다. 신청 전 본인 경로의 정확한 목록을 확인하세요.
  steps: |-
    먼저 어떤 F-2 경로를 확인할지 정합니다.
    하이코리아, 1345, 관할 출입국·외국인관서 또는 해당 경로의 공식 안내에서 최신 요건을 확인합니다.
    공통서류와 경로별 증빙자료를 준비합니다.
    국내 자격변경이 가능한 경로라면 현재 체류기간이 끝나기 전에 방문예약 또는 가능한 하이코리아 절차를 이용합니다.
    허가 후에는 체류지, 여권, 소득, 고용, 가족관계, 체류자격 정보를 최신 상태로 관리합니다. 연장 때 영향을 줄 수 있습니다.
  watchout: |-
    한국에 오래 살았다고 F-2가 자동으로 가능한 것은 아닙니다.
    경로 이름만으로는 부족합니다. 현재 조건에 맞고 그 조건을 서류로 입증해야 합니다.
    F-2-7은 F-2의 한 종류일 뿐입니다. 모든 F-2 신청을 점수제 신청처럼 보면 안 됩니다.
    규정, 경로 명칭, 배점표, 소득기준, 서류목록은 바뀔 수 있습니다.
    F-2는 여러 체류자격보다 안정적인 거주가 가능할 수 있지만 모든 신고의무와 법적 제한이 사라지는 것은 아닙니다.
  notes: |-
    이 페이지는 F-2 전체를 이해하기 위한 개요입니다. 실제 준비는 본인이 신청하려는 세부 경로를 따로 확인해야 합니다.
    F-2-7, F-2-99, 투자 경로, 가족 경로, 지역 인재 경로는 증빙이 다르므로 별도로 확인하는 것이 좋습니다.
    본 정보는 요약입니다. 신청 전 하이코리아, 1345 또는 관할 출입국·외국인관서에서 정확한 경로와 최신 요건을 확인하세요.
my:
  title: F-2 နေထိုင်ခွင့်ဗီဇာ — ကိုရီးယားတွင် နေထိုင်ခွင့်အမျိုးအစား
  summary: |-
    F-2 သည် ကိုရီးယားတွင် ပိုမိုတည်ငြိမ်စွာ နေထိုင်ရန် အကြောင်းပြချက်ရှိသူများအတွက် စစ်ဆေးနိုင်သော နေထိုင်ခွင့်အမျိုးအစားဖြစ်သည်။ စည်းမျဉ်းတစ်ခုတည်းရှိသော ဗီဇာမဟုတ်ဘဲ F-2 လမ်းကြောင်းများစွာရှိပြီး လမ်းကြောင်းတိုင်းတွင် လိုအပ်ချက်နှင့် စာရွက်စာတမ်း မတူပါ။
  eligibility: |-
    F-2 ကို ကိုရီးယားလူဝင်မှုရုံးက အသိအမှတ်ပြုထားသော နေထိုင်ခွင့်လမ်းကြောင်းတစ်ခုနှင့် ကိုက်ညီသောအခါ စစ်ဆေးနိုင်သည်။
    လမ်းကြောင်းသည် မိသားစုဆက်နွယ်မှု၊ ဒုက္ခသည်အသိအမှတ်ပြုမှု၊ ရင်းနှီးမြှုပ်နှံမှု၊ ရေရှည်နေထိုင်မှု၊ ဒေသအခြေပြုအရည်အချင်းရှိသူ သို့မဟုတ် အမှတ်စနစ်ထူးချွန်သူတို့နှင့် ဆက်စပ်နိုင်သည်။
    စာရွက်မပြင်မီ လက်ရှိဗီဇာ၊ နေထိုင်သမိုင်း၊ မိသားစုအခြေအနေ၊ အလုပ်၊ ဝင်ငွေ၊ အကြံပြုစာ သို့မဟုတ် တရားဝင်ဆုံးဖြတ်ချက်သည် မည်သည့် F-2 လမ်းကြောင်းနှင့် ကိုက်ညီသည်ကို အရင်စစ်ပါ။
  subtypes: |-
    F-2-7 အမှတ်စနစ် ထူးချွန်သူ — လက်ရှိသတ်မှတ်ထားသော လျှောက်ထားသူအုပ်စုနှင့် အမှတ်စံနှုန်းကို ဖြည့်ရသော လမ်းကြောင်း
    F-2-7S အလားအလာရှိထူးချွန်သူ — သတ်မှတ်ထားသော သိပ္ပံနည်းပညာ ပညာရေး သို့မဟုတ် သုတေသနနောက်ခံနှင့် ဆက်စပ်သော အထူးလမ်းကြောင်း
    မိသားစုဆိုင်ရာ F-2 — အချို့မိသားစုဆက်နွယ်မှုနှင့် အဓိကနေထိုင်သူ၏ နေထိုင်ခွင့်အပေါ် မူတည်သော လမ်းကြောင်း
    ဒုက္ခသည်ဆိုင်ရာ F-2 — ဒုက္ခသည်အသိအမှတ်ပြုမှုစသည့် ကိစ္စများနှင့် ဆက်စပ်သော နေထိုင်ခွင့်လမ်းကြောင်း
    F-2-99 ရေရှည်နေထိုင်သူ — သီးခြားနေထိုင်ကာလနှင့် စစ်ဆေးစံနှုန်းရှိသော ရေရှည်နေထိုင်ခွင့်လမ်းကြောင်း
    ရင်းနှီးမြှုပ်နှံမှုနှင့် အများပြည်သူအကျိုးရင်းနှီးမြှုပ်နှံမှု F-2 — သတ်မှတ်ထားသော ရင်းနှီးမြှုပ်နှံမှုအစီအစဉ်နှင့် ဆက်စပ်သော လမ်းကြောင်း
    ဒေသအခြေပြုအရည်အချင်းရှိသူ သို့မဟုတ် အခြား F-2 — လက်ရှိအစိုးရ သို့မဟုတ် ဒေသအစိုးရအစီအစဉ်အပေါ် မူတည်သော လမ်းကြောင်း
  documents: |-
    အများသုံးစာရွက်များမှာ လျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် ရှိပါက၊ အခကြေးငွေ၊ နေရပ်အထောက်အထားတို့ ဖြစ်နိုင်သည်။
    အရေးကြီးသောစာရွက်များသည် လမ်းကြောင်းအလိုက် မတူပါ။ မိသားစုစာရွက်၊ ဝင်ငွေစာရွက်၊ အလုပ်လက်မှတ်၊ အခွန်စာရွက်၊ ရင်းနှီးမြှုပ်နှံမှုအထောက်အထား၊ ဒုက္ခသည်ဆိုင်ရာစာရွက်၊ အကြံပြုစာ၊ နေထိုင်သမိုင်း သို့မဟုတ် အမှတ်အထောက်အထား တောင်းနိုင်သည်။
    နိုင်ငံခြားမှထုတ်ထားသောစာရွက်များသည် ဘာသာပြန်၊ Apostille၊ ကောင်စစ်အတည်ပြုခြင်း သို့မဟုတ် မူရင်းစစ်ဆေးခြင်း လိုနိုင်သည်။
    ဤစာမျက်နှာသည် နောက်ဆုံးစာရွက်စာတမ်းစာရင်း မဟုတ်ပါ။ မလျှောက်မီ ကိုယ့်လမ်းကြောင်းအတွက် တိကျသောစာရင်းကို အတည်ပြုပါ။
  steps: |-
    ပထမဦးစွာ မည်သည့် F-2 လမ်းကြောင်းကို စစ်မည်ဆိုတာ သတ်မှတ်ပါ။
    HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် သက်ဆိုင်ရာလမ်းကြောင်း၏ တရားဝင်အသိပေးချက်မှ လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
    အများသုံးစာရွက်များနှင့် ကိုယ့်လမ်းကြောင်းအတွက် လိုအပ်သောအထောက်အထားများကို ပြင်ဆင်ပါ။
    ကိုရီးယားအတွင်း နေထိုင်ခွင့်ပြောင်းလဲလျှောက်ထားနိုင်သော လမ်းကြောင်းဖြစ်ပါက လက်ရှိနေထိုင်ခွင့်မကုန်မီ ချိန်းဆိုခြင်း သို့မဟုတ် အသုံးပြုနိုင်သော HiKorea လုပ်ငန်းစဉ်ကို အသုံးပြုပါ။
    ခွင့်ပြုပြီးနောက် နေရပ်၊ နိုင်ငံကူးလက်မှတ်၊ ဝင်ငွေ၊ အလုပ်၊ မိသားစုအခြေအနေနှင့် နေထိုင်ခွင့်အချက်အလက်များကို နောက်ဆုံးအခြေအနေအတိုင်း ထိန်းသိမ်းပါ။ သက်တမ်းတိုးချိန်တွင် သက်ရောက်နိုင်သည်။
  watchout: |-
    ကိုရီးယားတွင် ကြာကြာနေခဲ့သည်ဆိုရုံဖြင့် F-2 အလိုအလျောက်ရနိုင်တာ မဟုတ်ပါ။
    လမ်းကြောင်းအမည်ကို သိရုံဖြင့် မလုံလောက်ပါ။ လက်ရှိစံနှုန်းနှင့် ကိုက်ညီပြီး စာရွက်ဖြင့် သက်သေပြနိုင်ရမည်။
    F-2-7 သည် F-2 အမျိုးအစားတစ်ခုသာ ဖြစ်သည်။ F-2 အားလုံးကို အမှတ်စနစ်လျှောက်လွှာလို မယူဆပါနှင့်။
    စည်းမျဉ်း၊ လမ်းကြောင်းအမည်၊ အမှတ်ဇယား၊ ဝင်ငွေစံနှုန်းနှင့် စာရွက်စာတမ်းစာရင်းများ ပြောင်းနိုင်သည်။
    F-2 သည် ဗီဇာအမျိုးအစားများစွာထက် ပိုတည်ငြိမ်စွာ နေထိုင်နိုင်စေသော်လည်း တင်ပြရမည့်တာဝန်နှင့် ဥပဒေကန့်သတ်ချက်အားလုံး မပျောက်ပါ။
  notes: |-
    ဤစာမျက်နှာသည် F-2 ကို အကျဉ်းချုပ်နားလည်ရန်ဖြစ်သည်။ တကယ်ပြင်ဆင်မည်ဆိုလျှင် ကိုယ်လျှောက်မည့် လမ်းကြောင်းကို သီးခြားစစ်ရမည်။
    F-2-7၊ F-2-99၊ ရင်းနှီးမြှုပ်နှံမှုလမ်းကြောင်း၊ မိသားစုလမ်းကြောင်းနှင့် ဒေသအခြေပြုလမ်းကြောင်းများသည် အထောက်အထားမတူသောကြောင့် သီးခြားစစ်ရန်လိုသည်။
    ဤအချက်အလက်သည် အကျဉ်းချုပ်ဖြစ်သည်။ မလျှောက်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် တိကျသောလမ်းကြောင်းနှင့် လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
