title: F-2-99 Long-Term Resident Visa
category: visa
order: 10
lastReviewed: 2026-07-31
en:
  title: F-2-99 Long-Term Resident Visa
  summary: |-
    F-2-99 is a long-term residence route inside the F-2 category. It is usually reviewed for people who have legally lived in Korea for a long period on an eligible status and can prove that their life base is in Korea. Do not apply just because you have stayed many years. First confirm whether your current visa history can count.
  eligibility: |-
    F-2-99 is for some long-term registered foreigners, not for every foreigner who has lived in Korea for a long time.
    The key review points are usually continuous legal stay in an eligible status, stable livelihood, clean stay history, address and residence record, and basic Korean society or language evidence.
    The official rule describes 7 years or more of continuous stay with a life base in Korea. For some professional statuses, such as E-1 to E-5 or E-7, the minimum stay period is described as 5 years. The exact counting can depend on your current and past visa types, periods outside Korea, status changes, and any violation history.
    The eligible visa list is very important. Do not assume D, E, F, or other long-term statuses automatically count. Confirm the current list with HiKorea, 1345, or the immigration office.
  subtypes: |-
    Main applicant — a person who has maintained an eligible long-term status and can prove continuous residence, livelihood, address, and compliance
    Family situation — accompanying family rules can be different from the main applicant's rule, so spouse or child cases should be checked separately
    Not a points route — F-2-99 is different from F-2-7, so do not prepare only a points table without confirming the long-term-residence checklist
  documents: |-
    Common: integrated application form, passport, photo, residence card, fee, and proof of address
    Reason for application or statement explaining why Korea is your life base
    Immigration stay history, entry and exit record, and documents showing continuous lawful residence
    Income, tax, employment, business, or other livelihood evidence requested for your case
    Asset proof such as Korean bank balance, savings, deposit, securities, lease deposit, or other accepted evidence if requested
    Basic Korean society or language evidence, such as accepted KIIP, pre-evaluation, Korean school graduation, or another officially accepted document
    Documents for family members, translation, Apostille, consular confirmation, criminal record, tax payment, or other review items if immigration requests them
  steps: |-
    First confirm whether your current and past visa statuses are eligible for F-2-99.
    Check whether your residence period is continuous. Long trips outside Korea, illegal stay, departure orders, or status gaps can affect the count.
    Confirm the latest income, livelihood, asset, Korean society/language, and compliance requirements through HiKorea, 1345, or the immigration office.
    Prepare evidence for every period of stay, not only the most recent year.
    Before your current stay expires, reserve a visit if required and apply for change of status through the available immigration procedure.
    After approval, keep address, passport, tax, income, employment, and family information updated for future extensions.
  watchout: |-
    Long total stay and continuous eligible stay are not the same. A visa change to a non-eligible status may reset or break the period.
    Time outside Korea can affect the count. The exact rule should be confirmed before applying.
    Income, asset, and basic Korean society or language standards can change. Do not rely on old blog posts, screenshots, or old immigration-office answers.
    Tax debt, immigration violations, illegal employment, criminal record, or unclear address history can become a serious problem.
    F-2-99 may give more stable residence than many visas, but it does not remove reporting duties or every work/legal restriction.
  notes: |-
    This page is a cautious overview. It is not a final eligibility decision or legal advice.
    F-2-99 is useful for people who have really built a stable life in Korea but do not fit F-2-7 or another specific F-2 route.
    Before preparing documents, confirm three things officially: eligible visa history, how your residence years are counted, and the current livelihood/basic-knowledge evidence list.
    Confirm the latest requirements with HiKorea, 1345, or your immigration office before applying.
ko:
  title: F-2-99 장기체류자 거주 비자
  summary: |-
    F-2-99는 F-2 안에 있는 장기체류자 거주 경로입니다. 보통 적격 체류자격으로 한국에 장기간 합법적으로 체류했고 생활근거지가 한국에 있음을 입증할 수 있는 사람을 심사하는 경로입니다. 오래 살았다는 이유만으로 바로 신청하지 말고, 먼저 본인의 체류이력이 인정될 수 있는지 확인하세요.
  eligibility: |-
    F-2-99는 한국에 오래 산 모든 외국인을 위한 자격이 아니라 일부 장기 등록외국인을 위한 경로입니다.
    주요 심사 포인트는 보통 적격 체류자격으로의 계속 체류, 안정적인 생계, 깨끗한 체류이력, 주소와 거주 기록, 한국사회 또는 한국어 관련 기본소양 입증입니다.
    공식 규정은 국내 생활근거지가 있는 사람의 7년 이상 계속 체류를 설명하고, E-1부터 E-5 또는 E-7 등 일부 전문 체류자격은 최소 체류기간을 5년으로 설명합니다. 실제 기간 계산은 현재와 과거 체류자격, 해외 체류기간, 자격변경, 위반 이력에 따라 달라질 수 있습니다.
    인정되는 체류자격 목록이 매우 중요합니다. D, E, F 등 장기 체류자격이라고 해서 자동으로 모두 계산된다고 보면 안 됩니다. 현재 목록을 하이코리아, 1345 또는 출입국·외국인관서에서 확인하세요.
  subtypes: |-
    주 신청자 — 적격 장기 체류자격을 유지했고 계속 거주, 생계, 주소, 준법 이력을 입증할 수 있는 사람
    가족 상황 — 동반가족 기준은 주 신청자 기준과 다를 수 있으므로 배우자나 자녀 사례는 별도로 확인해야 합니다
    점수제 경로가 아님 — F-2-99는 F-2-7과 다르므로 장기체류자 체크리스트를 확인하지 않고 점수표만 준비하면 안 됩니다
  documents: |-
    공통: 통합신청서, 여권, 사진, 외국인등록증, 수수료, 체류지 입증서류
    한국이 생활근거지임을 설명하는 신청사유서 또는 진술서
    체류이력, 출입국 사실, 계속된 합법 체류를 보여주는 자료
    본인 사례에서 요구되는 소득, 납세, 재직, 사업 또는 기타 생계 입증자료
    요구되는 경우 국내 은행 잔액, 예금, 적금, 증권, 임대차보증금 등 인정되는 자산 증빙
    사회통합프로그램, 사전평가, 국내 학교 졸업 또는 공식적으로 인정되는 기본소양·한국어 입증자료
    가족 서류, 번역, 아포스티유, 영사확인, 범죄경력, 세금 납부 또는 출입국에서 요청하는 기타 심사자료
  steps: |-
    먼저 현재와 과거 체류자격이 F-2-99 대상 체류이력에 해당하는지 확인합니다.
    체류기간이 계속된 것으로 인정되는지 확인합니다. 장기 해외 체류, 불법체류, 출국명령, 체류 공백은 계산에 영향을 줄 수 있습니다.
    최신 소득, 생계, 자산, 한국사회·한국어, 준법 요건을 하이코리아, 1345 또는 출입국·외국인관서에서 확인합니다.
    최근 1년만이 아니라 전체 체류기간을 입증할 자료를 준비합니다.
    현재 체류기간이 끝나기 전에 필요한 경우 방문예약을 하고 가능한 출입국 절차로 자격변경을 신청합니다.
    허가 후에는 주소, 여권, 세금, 소득, 고용, 가족 정보를 최신 상태로 유지합니다.
  watchout: |-
    전체 체류기간이 길다는 것과 적격 체류자격으로 계속 체류했다는 것은 다릅니다. 비대상 체류자격으로 변경된 이력이 있으면 기간이 끊기거나 다시 계산될 수 있습니다.
    해외 체류기간은 계산에 영향을 줄 수 있습니다. 정확한 기준은 신청 전에 확인해야 합니다.
    소득, 자산, 한국사회·한국어 기준은 바뀔 수 있습니다. 오래된 블로그, 화면 캡처, 오래전 출입국 답변만 믿지 마세요.
    세금 체납, 출입국 위반, 불법취업, 범죄경력, 주소이력 불명확은 큰 문제가 될 수 있습니다.
    F-2-99는 여러 체류자격보다 안정적인 거주가 가능할 수 있지만 모든 신고의무와 취업·법적 제한이 사라지는 것은 아닙니다.
  notes: |-
    이 페이지는 조심스럽게 정리한 개요입니다. 최종 자격판단이나 법률자문이 아닙니다.
    F-2-99는 한국에 안정적인 생활기반을 만들었지만 F-2-7 또는 다른 특정 F-2 경로와 맞지 않는 사람에게 도움이 될 수 있습니다.
    서류를 준비하기 전에 적격 체류이력, 체류기간 계산 방식, 현재 생계·기본소양 증빙 목록 세 가지를 공식적으로 확인하세요.
    신청 전 하이코리아, 1345 또는 관할 출입국·외국인관서에서 최신 요건을 확인하세요.
my:
  title: F-2-99 ရေရှည်နေထိုင်သူ ဗီဇာ
  summary: |-
    F-2-99 သည် F-2 အတွင်းရှိ ရေရှည်နေထိုင်သူလမ်းကြောင်းဖြစ်သည်။ ယေဘုယျအားဖြင့် ကိုရီးယားတွင် သတ်မှတ်ထားသော နေထိုင်ခွင့်ဖြင့် တရားဝင်ကြာရှည်နေထိုင်ခဲ့ပြီး ကိုယ့်ဘဝအခြေခံသည် ကိုရီးယားတွင်ရှိကြောင်း သက်သေပြနိုင်သူများကို စစ်ဆေးသော လမ်းကြောင်းဖြစ်သည်။ ကြာကြာနေခဲ့သည်ဆိုရုံဖြင့် မလျှောက်မီ ကိုယ့်နေထိုင်သမိုင်းကို တွက်နိုင်မနိုင် အရင်စစ်ပါ။
  eligibility: |-
    F-2-99 သည် ကိုရီးယားတွင် ကြာကြာနေသူအားလုံးအတွက် မဟုတ်ဘဲ အချို့ရေရှည်မှတ်ပုံတင်ထားသော နိုင်ငံခြားသားများအတွက် ဖြစ်သည်။
    အဓိကစစ်ဆေးချက်များမှာ သတ်မှတ်ထားသော နေထိုင်ခွင့်ဖြင့် ဆက်တိုက်တရားဝင်နေထိုင်မှု၊ အသက်မွေးဝမ်းကျောင်းတည်ငြိမ်မှု၊ သန့်ရှင်းသောနေထိုင်သမိုင်း၊ နေရပ်မှတ်တမ်း၊ ကိုရီးယားလူမှုရေး သို့မဟုတ် ကိုရီးယားဘာသာ အခြေခံအထောက်အထားတို့ ဖြစ်နိုင်သည်။
    တရားဝင်စည်းမျဉ်းတွင် ကိုရီးယားတွင် ဘဝအခြေခံရှိပြီး ၇ နှစ်အထက် ဆက်တိုက်နေထိုင်ထားသူကို ဖော်ပြထားသည်။ E-1 မှ E-5 သို့မဟုတ် E-7 ကဲ့သို့ ပညာရှင်နေထိုင်ခွင့်အချို့အတွက် အနည်းဆုံးနေထိုင်ကာလကို ၅ နှစ်ဟု ဖော်ပြထားသည်။ တကယ်တွက်ရာတွင် လက်ရှိနှင့် ယခင်ဗီဇာအမျိုးအစား၊ ကိုရီးယားပြင်ပနေခဲ့သည့်ကာလ၊ ဗီဇာပြောင်းခဲ့မှု၊ ဥပဒေချိုးဖောက်မှုရှိမရှိတို့အပေါ် မူတည်နိုင်သည်။
    တွက်ခွင့်ရှိသော ဗီဇာစာရင်းသည် အရေးကြီးသည်။ D၊ E၊ F စသည့် ရေရှည်ဗီဇာဖြစ်ရုံဖြင့် အလိုအလျောက်တွက်နိုင်သည်ဟု မယူဆပါနှင့်။ လက်ရှိစာရင်းကို HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် အတည်ပြုပါ။
  subtypes: |-
    အဓိကလျှောက်ထားသူ — သတ်မှတ်ထားသော ရေရှည်နေထိုင်ခွင့်ကို ထိန်းထားပြီး ဆက်တိုက်နေထိုင်မှု၊ အသက်မွေးဝမ်းကျောင်း၊ နေရပ်နှင့် ဥပဒေလိုက်နာမှုကို သက်သေပြနိုင်သူ
    မိသားစုအခြေအနေ — မိသားစုဝင်စံနှုန်းသည် အဓိကလျှောက်ထားသူစံနှုန်းနှင့် မတူနိုင်သောကြောင့် အိမ်ထောင်ဖက် သို့မဟုတ် ကလေးကိစ္စကို သီးခြားစစ်ရမည်
    အမှတ်စနစ်မဟုတ် — F-2-99 သည် F-2-7 နှင့် မတူသောကြောင့် ရေရှည်နေထိုင်သူ checklist မစစ်ဘဲ အမှတ်ဇယားတစ်ခုတည်း မပြင်ပါနှင့်
  documents: |-
    အများသုံး: ပေါင်းစပ်လျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ နေရပ်အထောက်အထား
    ကိုရီးယားသည် ကိုယ့်ဘဝအခြေခံနေရာဖြစ်ကြောင်း ရှင်းပြသော လျှောက်ထားရခြင်းအကြောင်းပြစာ သို့မဟုတ် ရှင်းလင်းစာ
    နေထိုင်သမိုင်း၊ ဝင်ထွက်မှတ်တမ်းနှင့် ဆက်တိုက်တရားဝင်နေထိုင်မှုကို ပြသောစာရွက်များ
    ကိုယ့်ကိစ္စအတွက် တောင်းသော ဝင်ငွေ၊ အခွန်၊ အလုပ်လက်မှတ်၊ လုပ်ငန်း သို့မဟုတ် အခြားအသက်မွေးဝမ်းကျောင်းအထောက်အထား
    တောင်းပါက ကိုရီးယားဘဏ်လက်ကျန်၊ စုငွေ၊ အပ်ငွေ၊ securities၊ အိမ်ငှားအာမခံငွေ စသည့် လက်ခံသော ပိုင်ဆိုင်မှုအထောက်အထား
    KIIP၊ pre-evaluation၊ ကိုရီးယားကျောင်းပြီးဆုံးမှု သို့မဟုတ် တရားဝင်လက်ခံသော ကိုရီးယားလူမှုရေး/ဘာသာအခြေခံအထောက်အထား
    မိသားစုစာရွက်၊ ဘာသာပြန်၊ Apostille၊ ကောင်စစ်အတည်ပြု၊ ရာဇဝတ်မှတ်တမ်း၊ အခွန်ပေးချေမှု သို့မဟုတ် လူဝင်မှုရုံးက တောင်းသော အခြားစစ်ဆေးစာရွက်များ
  steps: |-
    ပထမဦးစွာ လက်ရှိနှင့် ယခင်ဗီဇာများသည် F-2-99 အတွက် တွက်ခွင့်ရှိသော နေထိုင်သမိုင်းဖြစ်မဖြစ် စစ်ပါ။
    နေထိုင်ကာလကို ဆက်တိုက်အဖြစ် အသိအမှတ်ပြုနိုင်မနိုင် စစ်ပါ။ ကိုရီးယားပြင်ပတွင် ကြာကြာနေခြင်း၊ တရားမဝင်နေထိုင်ခြင်း၊ ထွက်ခွာမိန့်၊ နေထိုင်ခွင့်ကွာဟမှုတို့သည် တွက်ချက်မှုကို သက်ရောက်နိုင်သည်။
    လတ်တလော ဝင်ငွေ၊ အသက်မွေးဝမ်းကျောင်း၊ ပိုင်ဆိုင်မှု၊ ကိုရီးယားလူမှုရေး/ဘာသာနှင့် ဥပဒေလိုက်နာမှုလိုအပ်ချက်ကို HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် အတည်ပြုပါ။
    နောက်ဆုံး ၁ နှစ်စာသာမက နေထိုင်ကာလတစ်လျှောက်လုံးကို သက်သေပြနိုင်သောစာရွက်များ ပြင်ဆင်ပါ။
    လက်ရှိနေထိုင်ခွင့်မကုန်မီ လိုအပ်ပါက ချိန်းဆိုပြီး လူဝင်မှုလုပ်ငန်းစဉ်မှ နေထိုင်ခွင့်ပြောင်းလဲရန် လျှောက်ပါ။
    ခွင့်ပြုပြီးနောက် နေရပ်၊ နိုင်ငံကူးလက်မှတ်၊ အခွန်၊ ဝင်ငွေ၊ အလုပ်နှင့် မိသားစုအချက်အလက်ကို နောက်ဆုံးအခြေအနေအတိုင်း ထိန်းသိမ်းပါ။
  watchout: |-
    စုစုပေါင်းကြာကြာနေခဲ့ခြင်းနှင့် သတ်မှတ်ထားသော နေထိုင်ခွင့်ဖြင့် ဆက်တိုက်နေထိုင်ခြင်းသည် မတူပါ။ မတွက်နိုင်သော နေထိုင်ခွင့်သို့ ပြောင်းခဲ့ပါက ကာလပြတ်နိုင်သည် သို့မဟုတ် ပြန်စတွက်ရနိုင်သည်။
    ကိုရီးယားပြင်ပနေခဲ့သည့်ကာလသည် တွက်ချက်မှုကို သက်ရောက်နိုင်သည်။ တိကျသောစံနှုန်းကို မလျှောက်မီ စစ်ပါ။
    ဝင်ငွေ၊ ပိုင်ဆိုင်မှု၊ ကိုရီးယားလူမှုရေး/ဘာသာစံနှုန်းများ ပြောင်းနိုင်သည်။ အဟောင်း blog၊ screenshot သို့မဟုတ် အရင်က လူဝင်မှုရုံးအဖြေတစ်ခုတည်းကို မယုံပါနှင့်။
    အခွန်ကြွေးကျန်ခြင်း၊ လူဝင်မှုဥပဒေချိုးဖောက်မှု၊ တရားမဝင်အလုပ်လုပ်မှု၊ ရာဇဝတ်မှတ်တမ်း၊ နေရပ်သမိုင်းမရှင်းလင်းမှုတို့သည် ကြီးမားသောပြဿနာဖြစ်နိုင်သည်။
    F-2-99 သည် ဗီဇာအမျိုးအစားများစွာထက် ပိုတည်ငြိမ်စွာနေထိုင်နိုင်စေသော်လည်း တင်ပြရမည့်တာဝန်နှင့် အလုပ်/ဥပဒေကန့်သတ်ချက်အားလုံး မပျောက်ပါ။
  notes: |-
    ဤစာမျက်နှာသည် သတိထားရေးထားသော အကျဉ်းချုပ်ဖြစ်သည်။ နောက်ဆုံးအရည်အချင်းဆုံးဖြတ်ချက် သို့မဟုတ် ဥပဒေအကြံဉာဏ် မဟုတ်ပါ။
    F-2-99 သည် ကိုရီးယားတွင် တည်ငြိမ်သောဘဝအခြေခံရှိပြီး F-2-7 သို့မဟုတ် အခြား F-2 လမ်းကြောင်းနှင့် မကိုက်သူအချို့အတွက် အသုံးဝင်နိုင်သည်။
    စာရွက်မပြင်မီ အချက် ၃ ခုကို တရားဝင်အတည်ပြုပါ — တွက်ခွင့်ရှိသော ဗီဇာသမိုင်း၊ နေထိုင်နှစ်များကို တွက်သည့်နည်း၊ လက်ရှိအသက်မွေးဝမ်းကျောင်းနှင့် အခြေခံအထောက်အထားစာရင်း။
    မလျှောက်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
