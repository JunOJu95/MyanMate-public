title: D-4 General Training Visa
category: visa
order: 2
lastReviewed: 2026-07-31
en:
  title: D-4 General Training Visa
  summary: |-
    D-4 is a general training status for approved non-degree training in Korea. It is used when the main purpose is training or an approved program that does not fit D-2 degree study.
  eligibility: |-
    D-4 is used when your main purpose is training or a non-degree program that does not fit D-2 degree study.
    The training institution, program purpose, study or training period, and supporting documents must match D-4 review.
    If the program is 90 days or less, confirm whether a short-stay route is more appropriate instead of D-4.
  subtypes: |-
    D-4-1 Korean language training — for Korean study at an approved training institution
    D-4-2 General training — for approved non-degree training or practical training cases
    D-4-3 School-age study — for eligible elementary, middle, or high-school study cases
    D-4-5 Korean culinary training — for eligible Korean food training cases
    D-4-6 Private training institution — for approved vocational or technical training cases
    D-4-7 Foreign language training — for approved foreign-language training cases
  documents: |-
    Visa application form, passport, photo, and visa fee
    Admission, invitation, or training confirmation document from the school or training organization
    Training institution or organization registration documents if requested
    Education record, enrolment record, or training eligibility document if requested
    Financial, scholarship, sponsor, or support documents if requested for your case
    Study plan, training plan, timetable, instructor, facility, or program explanation if requested
    Extra documents can differ by program, nationality, school, and embassy review.
  steps: |-
    First confirm that your purpose is non-degree training and that D-4 is the correct parent visa category.
    Ask the school, training organization, embassy, or HiKorea which documents apply to your D-4 case.
    Prepare the admission/training, education, financial, passport, photo, and program documents requested for your case.
    Apply through the correct visa channel before traveling to Korea.
    If you stay in Korea for more than 90 days, complete foreigner registration within 90 days after arrival.
  watchout: |-
    Do not choose D-4 only because it looks easier than D-2 or a work visa. The purpose must match your real training program.
    D-4 does not automatically allow work. Before any part-time work or training-related activity outside the approved program, confirm whether separate immigration permission is required.
    Attendance and training participation matter. Low attendance or stopping the program can affect extension and future visa review.
    Financial-proof rules and required documents can change. Confirm the current list before preparing bank or sponsor documents.
  notes: |-
    If your purpose is a university degree, check D-2 instead of D-4.
    If your purpose is work, D-4 is not the correct work visa. Check the proper work status before accepting any job.
    This is a summary. Confirm the exact route with the Korean embassy or consulate, HiKorea, 1345, your school, or the immigration office before applying.
ko:
  title: D-4 일반연수 비자
  summary: |-
    D-4는 한국에서 학위과정이 아닌 승인된 연수나 교육을 받기 위한 일반연수 체류자격입니다. 주된 목적이 연수 또는 D-2 학위과정에 해당하지 않는 승인된 프로그램일 때 검토됩니다.
  eligibility: |-
    D-4는 주된 목적이 연수 또는 D-2 학위과정에 해당하지 않는 비학위 과정일 때 검토됩니다.
    연수기관, 프로그램 목적, 연수 기간, 제출서류가 D-4 심사 목적과 맞아야 합니다.
    과정이 90일 이하라면 D-4가 아니라 단기 체류 경로가 맞는지 먼저 확인하세요.
  subtypes: |-
    D-4-1 한국어 연수 — 승인된 연수기관에서 한국어를 공부하는 경우
    D-4-2 일반연수 — 승인된 비학위 연수 또는 실무연수 사례
    D-4-3 초·중·고 유학 — 초·중·고등학교 유학 대상 사례
    D-4-5 한식조리연수 — 요건을 갖춘 한식 조리 연수 사례
    D-4-6 사설 교육기관 연수 — 승인된 직업·기술 연수 사례
    D-4-7 외국어연수 — 승인된 외국어 연수 사례
  documents: |-
    사증발급신청서, 여권, 사진, 수수료
    학교 또는 연수기관에서 발급한 입학, 초청, 연수 확인 서류
    요구되는 경우 연수기관 또는 단체 등록 관련 서류
    요구되는 경우 학력, 재학 또는 연수 대상 입증서류
    본인 사례에 따라 요구되는 재정, 장학금, 보증인 또는 지원 관련 서류
    요구되는 경우 학업계획서, 연수계획서, 시간표, 강사, 시설, 프로그램 설명 자료
    추가 서류는 프로그램, 국적, 학교, 공관 심사에 따라 달라질 수 있습니다.
  steps: |-
    먼저 본인 목적이 학위과정이 아닌 연수인지, D-4가 맞는 상위 체류자격인지 확인합니다.
    학교, 연수기관, 대한민국 대사관·영사관 또는 하이코리아에서 본인 D-4 사례의 현재 서류를 확인합니다.
    본인 사례에 필요한 입학/연수, 학력, 재정, 여권, 사진, 프로그램 서류를 준비합니다.
    한국에 오기 전에 올바른 사증 절차로 신청합니다.
    90일을 초과해 체류한다면 입국 후 90일 이내에 외국인등록을 합니다.
  watchout: |-
    D-2나 취업비자보다 쉬워 보여서 D-4를 고르면 안 됩니다. 실제 목적이 연수 프로그램과 맞아야 합니다.
    D-4라고 해서 바로 일할 수 있는 것은 아닙니다. 시간제 취업이나 허가된 프로그램 밖의 활동을 하기 전에는 별도 출입국 허가가 필요한지 확인해야 합니다.
    출석과 연수 참여가 중요합니다. 출석률이 낮거나 과정을 중단하면 연장과 이후 체류심사에 영향을 줄 수 있습니다.
    재정 입증 기준과 서류는 바뀔 수 있습니다. 은행 또는 보증인 서류를 준비하기 전에 최신 목록을 확인하세요.
  notes: |-
    대학 학위과정이 목적이라면 D-4가 아니라 D-2를 확인해야 합니다.
    취업이 목적이라면 D-4는 취업비자가 아닙니다. 일을 시작하기 전에 맞는 취업 자격을 확인하세요.
    본 정보는 요약입니다. 신청 전 대한민국 대사관·영사관, 하이코리아, 1345, 학교 또는 관할 출입국·외국인관서에서 정확한 경로를 확인하세요.
my:
  title: D-4 အထွေထွေသင်တန်း ဗီဇာ
  summary: |-
    D-4 သည် ကိုရီးယားတွင် ဘွဲ့သင်တန်းမဟုတ်သော ခွင့်ပြုထားသည့် သင်တန်း သို့မဟုတ် လေ့ကျင့်ရေးအတွက် သုံးသော အထွေထွေသင်တန်း ဗီဇာဖြစ်သည်။ မိမိရည်ရွယ်ချက်က D-2 ဘွဲ့သင်တန်းမဟုတ်ဘဲ ခွင့်ပြုထားသော non-degree program ဖြစ်သောအခါ စစ်ဆေးနိုင်သည်။
  eligibility: |-
    D-4 သည် မိမိလာရောက်မည့်ရည်ရွယ်ချက်က ဘွဲ့သင်တန်းမဟုတ်ဘဲ သင်တန်း သို့မဟုတ် လေ့ကျင့်ရေးဖြစ်သောအခါ စစ်ဆေးနိုင်သော ဗီဇာဖြစ်သည်။
    သင်တန်းအဖွဲ့၊ Program ရည်ရွယ်ချက်၊ သင်တန်းကာလနှင့် တင်မည့်စာရွက်စာတမ်းများသည် D-4 စစ်ဆေးသည့်ရည်ရွယ်ချက်နှင့် ကိုက်ရမည်။
    သင်တန်းကာလ ၉၀ ရက်အောက်ဖြစ်ပါက D-4 မဟုတ်ဘဲ တိုတောင်းကာလဗီဇာဖြင့် သင့်တော်မတော် အရင်စစ်ပါ။
  subtypes: |-
    D-4-1 ကိုရီးယားဘာသာသင်တန်း — ခွင့်ပြုထားသော သင်တန်းအဖွဲ့တွင် ကိုရီးယားဘာသာလေ့လာခြင်း
    D-4-2 အထွေထွေသင်တန်း — ခွင့်ပြုထားသော ဘွဲ့မဟုတ်သည့် သင်တန်း သို့မဟုတ် လက်တွေ့လေ့ကျင့်ရေးကိစ္စများ
    D-4-3 ကျောင်းတက်ရန် — မူလတန်း၊ အလယ်တန်း၊ အထက်တန်းကျောင်းတက်ရန် ကိုက်ညီသောကိစ္စများ
    D-4-5 ကိုရီးယားအစားအသောက်သင်တန်း — စံနှုန်းပြည့်သော ကိုရီးယားအစားအသောက်လေ့ကျင့်ရေးကိစ္စများ
    D-4-6 ပုဂ္ဂလိကသင်တန်းအဖွဲ့ — ခွင့်ပြုထားသော အသက်မွေးဝမ်းကျောင်း သို့မဟုတ် နည်းပညာသင်တန်းကိစ္စများ
    D-4-7 နိုင်ငံခြားဘာသာသင်တန်း — ခွင့်ပြုထားသော နိုင်ငံခြားဘာသာသင်တန်းကိစ္စများ
  documents: |-
    ဗီဇာလျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး
    ကျောင်း သို့မဟုတ် သင်တန်းအဖွဲ့မှ ထုတ်ပေးသော ဝင်ခွင့်စာ၊ ဖိတ်ကြားစာ သို့မဟုတ် သင်တန်းအတည်ပြုစာ
    သင်တန်းအဖွဲ့ သို့မဟုတ် အဖွဲ့အစည်းမှတ်ပုံတင်ဆိုင်ရာစာရွက် (လိုအပ်ပါက)
    ပညာအရည်အချင်း၊ ကျောင်းတက်နေကြောင်း သို့မဟုတ် သင်တန်းတက်ခွင့်အထောက်အထား (လိုအပ်ပါက)
    မိမိကိစ္စအလိုက် တောင်းနိုင်သော ငွေကြေးအထောက်အထား၊ Scholarship စာ၊ Sponsor စာ သို့မဟုတ် ထောက်ပံ့သူစာရွက်
    တောင်းပါက Study Plan၊ သင်တန်းအစီအစဉ်၊ အချိန်ဇယား၊ ဆရာ/ဆရာမ၊ သင်တန်းနေရာနှင့် Program ရှင်းလင်းချက်
    အပိုစာရွက်များသည် Program၊ နိုင်ငံသား၊ ကျောင်းနှင့် သံရုံးစစ်ဆေးမှုအလိုက် ကွာနိုင်သည်။
  steps: |-
    ပထမဦးစွာ မိမိရည်ရွယ်ချက်သည် ဘွဲ့သင်တန်းမဟုတ်သော သင်တန်း/လေ့ကျင့်ရေးဖြစ်မဖြစ်၊ D-4 သည် မှန်သော အပေါ်ဗီဇာအမျိုးအစားဖြစ်မဖြစ် စစ်ပါ။
    မိမိ D-4 ကိစ္စအတွက် လတ်တလောလိုအပ်စာရွက်များကို ကျောင်း၊ သင်တန်းအဖွဲ့၊ ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံး သို့မဟုတ် HiKorea တွင် အတည်ပြုပါ။
    မိမိကိစ္စအတွက်လိုသော ဝင်ခွင့်/သင်တန်းစာရွက်၊ ပညာရေး၊ ငွေကြေး၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံနှင့် Program စာရွက်များကို ပြင်ဆင်ပါ။
    ကိုရီးယားမလာမီ မှန်ကန်သောဗီဇာလုပ်ငန်းစဉ်ဖြင့် လျှောက်ပါ။
    ကိုရီးယားတွင် ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ရောက်ပြီး ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
  watchout: |-
    D-2 သို့မဟုတ် အလုပ်ဗီဇာထက် လွယ်မယ်ထင်လို့ D-4 ကို မရွေးပါနှင့်။ မိမိရည်ရွယ်ချက်သည် တကယ်သင်တန်း/လေ့ကျင့်ရေးနှင့် ကိုက်ရမည်။
    D-4 ရှိရုံဖြင့် အလုပ်လုပ်ခွင့်ရသည်ဟု မယူဆပါနှင့်။ အချိန်ပိုင်းအလုပ် သို့မဟုတ် ခွင့်ပြုထားသော Program အပြင်ဘက် လှုပ်ရှားမှုမလုပ်မီ လူဝင်မှုရုံးခွင့်ပြုချက် လိုမလို အတည်ပြုပါ။
    ကျောင်းခေါ်ချိန်နှင့် သင်တန်းတက်ရောက်မှု အရေးကြီးသည်။ တက်ရောက်မှုနည်းခြင်း သို့မဟုတ် သင်တန်းရပ်ခြင်းသည် သက်တမ်းတိုးခြင်းနှင့် နောက်ပိုင်းဗီဇာစစ်ဆေးမှုကို ထိခိုက်နိုင်သည်။
    ငွေကြေးအထောက်အထားစံနှုန်းနှင့် စာရွက်စာတမ်းစာရင်းများ ပြောင်းနိုင်သည်။ ဘဏ်စာရွက် သို့မဟုတ် Sponsor စာ မပြင်မီ လတ်တလောစာရင်းကို စစ်ပါ။
  notes: |-
    တက္ကသိုလ်ဘွဲ့သင်တန်းတက်ရန်ဖြစ်ပါက D-4 မဟုတ်ဘဲ D-2 ကို စစ်ရမည်။
    အလုပ်လုပ်ရန်ဖြစ်ပါက D-4 သည် အလုပ်ဗီဇာမဟုတ်ပါ။ အလုပ်မစမီ သင့်တော်သောအလုပ်ဗီဇာ/ခွင့်ပြုချက်ကို စစ်ပါ။
    ဤအချက်အလက်သည် အကျဉ်းချုပ်ဖြစ်သည်။ မလျှောက်မီ ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံး၊ HiKorea၊ 1345၊ ကျောင်း သို့မဟုတ် လူဝင်မှုရုံးတွင် မှန်ကန်သောလမ်းကြောင်းကို အတည်ပြုပါ။
