title: D-2-1 Associate Degree Visa
category: visa
order: 14
lastReviewed: 2026-07-31
en:
  title: D-2-1 Associate Degree Visa
  summary: |-
    D-2-1 is the D-2 route for associate degree study at an eligible Korean junior college or equivalent institution. It is for degree study, not short training or language study.
  eligibility: |-
    You have admission to an eligible associate degree program in Korea.
    Your previous education must support entry into an associate degree program.
    The school must issue the correct Standard Admission Letter and visa documents for D-2-1.
    Your financial proof must satisfy the school, embassy, or immigration checklist for your case.
  subtypes: ''
  documents: |-
    Visa application or visa issuance documents, passport, photo, fee, and residence card if applying in Korea
    Standard Admission Letter from the Korean school
    Copy of the school's business registration or registration-number certificate
    Final education proof, such as graduation certificate or transcript, with Apostille or consular confirmation if required
    Financial proof such as bank balance, scholarship certificate, sponsor proof, and family relationship documents if needed
    TB test or additional embassy/school documents if applicable
  steps: |-
    Confirm that the program is an eligible associate degree program and that D-2-1 is the correct route.
    Receive the Standard Admission Letter and school documents.
    Prepare final education and financial documents according to the embassy or immigration checklist.
    Apply through the Korean embassy/consulate or Certificate of Visa Issuance route if the school uses it.
    After entering Korea, complete foreigner registration within 90 days if staying more than 90 days.
  watchout: |-
    D-2-1 is not for Korean language training. For Korean language training, check D-4-1.
    Do not rely only on the school name. The program and admission document must match D-2-1.
    Financial document validity periods can be short, so check issue-date rules before ordering bank documents.
    Part-time work requires school confirmation and immigration permission.
  notes: |-
    D-2-1 is commonly connected to junior college or associate degree study.
    Stay period and extension are tied to the academic schedule and immigration review.
    Confirm the latest documents with your school, Korean embassy, HiKorea, 1345, or immigration office before applying.
ko:
  title: D-2-1 전문학사 유학 비자
  summary: |-
    D-2-1은 한국의 전문대학 또는 이에 준하는 대상 기관에서 전문학사 학위과정을 공부하기 위한 D-2 경로입니다. 짧은 연수나 어학연수가 아니라 학위과정입니다.
  eligibility: |-
    한국의 대상 전문학사 과정에 입학 허가를 받은 경우 확인할 수 있습니다.
    이전 학력이 전문학사 과정 입학 단계와 맞아야 합니다.
    학교는 D-2-1에 맞는 표준입학허가서와 비자 서류를 발급해야 합니다.
    재정 입증은 본인 사례의 학교, 공관 또는 출입국 체크리스트를 충족해야 합니다.
  subtypes: ''
  documents: |-
    사증신청 또는 사증발급인정 관련 서류, 여권, 사진, 수수료, 국내 신청 시 외국인등록증
    한국 학교에서 발급한 표준입학허가서
    학교 사업자등록증 또는 고유번호증 사본
    졸업증명서 또는 성적증명서 등 최종학력 입증서류. 필요한 경우 아포스티유 또는 영사확인
    잔고증명서, 장학금 증명서, 보증인 자료와 필요한 경우 가족관계 입증서류
    해당되는 경우 결핵진단서 또는 공관·학교 추가서류
  steps: |-
    과정이 대상 전문학사 과정인지, D-2-1이 맞는지 확인합니다.
    학교에서 표준입학허가서와 학교 서류를 받습니다.
    공관 또는 출입국 체크리스트에 맞춰 최종학력과 재정 서류를 준비합니다.
    대한민국 대사관·영사관 또는 학교가 이용하는 사증발급인정서 경로로 신청합니다.
    90일을 초과해 체류하면 입국 후 90일 이내에 외국인등록을 합니다.
  watchout: |-
    D-2-1은 한국어 어학연수용이 아닙니다. 어학연수는 D-4-1을 확인하세요.
    학교 이름만 보고 판단하지 마세요. 과정과 입학서류가 D-2-1과 맞아야 합니다.
    재정서류 유효기간이 짧을 수 있으므로 은행서류 발급 전 날짜 기준을 확인하세요.
    시간제 취업은 학교 확인과 출입국 허가가 필요합니다.
  notes: |-
    D-2-1은 보통 전문대학 또는 전문학사 과정과 연결됩니다.
    체류기간과 연장은 학사일정과 출입국 심사에 따라 정해집니다.
    신청 전 학교, 재외공관, 하이코리아, 1345 또는 출입국에서 최신 서류를 확인하세요.
my:
  title: D-2-1 Associate Degree ဗီဇာ
  summary: |-
    D-2-1 သည် ကိုရီးယားရှိ junior college သို့မဟုတ် ကိုက်ညီသော ပညာရေးအဖွဲ့အစည်းတွင် associate degree တက်ရန်အတွက် D-2 လမ်းကြောင်းဖြစ်သည်။ တိုတောင်းသင်တန်း သို့မဟုတ် ကိုရီးယားဘာသာသင်တန်းအတွက် မဟုတ်ပါ။
  eligibility: |-
    ကိုရီးယားရှိ ကိုက်ညီသော associate degree Program မှ ဝင်ခွင့်ရထားသူဖြစ်ရမည်။
    ယခင်ပညာရေးသည် associate degree တက်ရန်အဆင့်နှင့် ကိုက်ညီရမည်။
    ကျောင်းက D-2-1 အတွက်မှန်သော Standard Admission Letter နှင့် ဗီဇာစာရွက်များ ထုတ်ပေးရမည်။
    ငွေကြေးအထောက်အထားသည် ကိုယ့်ကိစ္စအတွက် ကျောင်း၊ သံရုံး သို့မဟုတ် လူဝင်မှုရုံး checklist နှင့် ကိုက်ညီရမည်။
  subtypes: ''
  documents: |-
    ဗီဇာလျှောက်လွှာ သို့မဟုတ် ဗီဇာထုတ်ပေးမှုအတည်ပြုစာဆိုင်ရာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်
    ကိုရီးယားကျောင်းမှ Standard Admission Letter
    ကျောင်း၏ Business Registration သို့မဟုတ် Registration Number Certificate မိတ္တူ
    နောက်ဆုံးပညာအရည်အချင်းအထောက်အထား၊ ဥပမာ ဘွဲ့လက်မှတ် သို့မဟုတ် အမှတ်စာရင်း။ လိုအပ်ပါက Apostille သို့မဟုတ် သံရုံးအတည်ပြုချက်
    ဘဏ်လက်ကျန်၊ Scholarship စာ၊ Sponsor စာနှင့် လိုအပ်ပါက မိသားစုဆက်နွယ်မှုစာရွက်
    သက်ဆိုင်ပါက TB test သို့မဟုတ် သံရုံး/ကျောင်းက တောင်းသော အပိုစာရွက်များ
  steps: |-
    Program သည် ကိုက်ညီသော associate degree Program ဖြစ်မဖြစ်နှင့် D-2-1 မှန်မမှန် အတည်ပြုပါ။
    ကျောင်းမှ Standard Admission Letter နှင့် ကျောင်းစာရွက်များ ရယူပါ။
    သံရုံး သို့မဟုတ် လူဝင်မှုရုံး checklist အလိုက် နောက်ဆုံးပညာရေးနှင့် ငွေကြေးစာရွက်များ ပြင်ပါ။
    ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံးတွင် လျှောက်ပါ သို့မဟုတ် ကျောင်းကအသုံးပြုသော Certificate of Visa Issuance လမ်းကြောင်းဖြင့် လျှောက်ပါ။
    ကိုရီးယားတွင် ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ရောက်ပြီး ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
  watchout: |-
    D-2-1 သည် ကိုရီးယားဘာသာသင်တန်းအတွက် မဟုတ်ပါ။ ကိုရီးယားဘာသာသင်တန်းအတွက် D-4-1 ကို စစ်ပါ။
    ကျောင်းအမည်တစ်ခုတည်းကို မယုံပါနှင့်။ Program နှင့် ဝင်ခွင့်စာရွက်သည် D-2-1 နှင့် ကိုက်ရမည်။
    ငွေကြေးစာရွက်များ၏ သက်တမ်းကာလ တိုနိုင်သောကြောင့် ဘဏ်စာရွက်မထုတ်မီ ရက်စွဲစည်းမျဉ်းကို စစ်ပါ။
    အချိန်ပိုင်းအလုပ်လုပ်ရန် ကျောင်းအတည်ပြုချက်နှင့် လူဝင်မှုရုံးခွင့်ပြုချက် လိုသည်။
  notes: |-
    D-2-1 သည် အများအားဖြင့် junior college သို့မဟုတ် associate degree သင်တန်းနှင့် ဆက်စပ်သည်။
    နေထိုင်ကာလနှင့် သက်တမ်းတိုးခြင်းသည် ကျောင်းစာသင်နှစ်အစီအစဉ်နှင့် လူဝင်မှုရုံးစစ်ဆေးချက်အပေါ် မူတည်သည်။
    မလျှောက်မီ ကျောင်း၊ ကိုရီးယားသံရုံး၊ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလောစာရွက်စာတမ်းများကို အတည်ပြုပါ။
