title: TOPIK Exam
category: study
order: 1
lastReviewed: 2026-07-29
en:
  title: TOPIK Exam
  summary: >-
    TOPIK is Korea's official Korean-language proficiency test. Myanmar students
    usually meet it when checking university admission, scholarships, graduation
    rules, Korean-taught majors, or future work and residence plans.
  eligibility: >-
    You are checking whether a Korean school, major, scholarship, or graduation rule asks for Korean proof

    You need to decide between TOPIK I and TOPIK II before registering

    You are applying for a Korean-taught program or a scholarship where Korean ability can make the application stronger

    You want an official score to show your Korean level instead of only saying "I can speak Korean"

    You are planning ahead for study, work, or residence paths where Korean ability may help later
  subtypes: >-
    TOPIK is Korea's official Korean-language proficiency test for non-native Korean speakers and overseas Koreans.

    People use TOPIK scores for university admission, graduation rules, scholarships, Korean-major requirements, jobs, and some future visa or residence plans.

    TOPIK I is the beginner path for Level 1 and Level 2. It checks Listening and Reading.

    TOPIK II is the intermediate to advanced path for Level 3 to Level 6. It checks Listening, Writing, and Reading.

    TOPIK can be offered as PBT or IBT depending on the test center and schedule. Score scales can be different, so check the exact test type before comparing scores.

    The required level is not fixed by this guide. Each school, major, scholarship, employer, or rule can set its own TOPIK requirement.
  documents: >-
    Accepted ID for registration and test day, such as passport, ARC, or the ID type named by the test center

    TOPIK account or registration login information

    Photo or profile image if the registration system asks for it

    Payment method for the test fee

    Admission ticket or test voucher after registration

    TOPIK score report after the result is released

    School, scholarship, or job notice that explains which TOPIK level and score type they accept
  steps: >-
    First choose your real goal: university admission, scholarship, graduation, personal level check, work, or future plan.

    Read the latest notice from the exact school, major, scholarship, or institution.

    If the notice asks for Level 1 or Level 2, check TOPIK I. If it asks for Level 3 or higher, check TOPIK II.

    If the notice does not clearly say TOPIK is required, check whether TOPIK is optional, recommended, or needed later after admission.

    Check the official TOPIK site or local test center for registration period, test type, test center, fee, ID rule, and result date.

    Prepare based on the test you choose: TOPIK I focuses on Listening and Reading, while TOPIK II also needs Writing.

    Before submitting the score, confirm that the institution accepts that score type, level, result date, and validity period.
  watchout: >-
    Do not choose TOPIK I only because it feels easier if your target requires Level 3 or higher

    Do not assume English-track admission means Korean will never be required later

    Do not prepare TOPIK II like TOPIK I because TOPIK II includes Writing

    Do not register before checking whether your result will come out before the application deadline

    Do not rely on old social media posts for dates, fees, test centers, or required levels

    Avoid anyone offering a guaranteed score, proxy test-taking, leaked questions, or unofficial shortcut
  notes: >-
    NIIED official TOPIK page: test purpose, test type, sections, time, total score, and level ranges

    Official TOPIK site or local test center: registration period, test date, fee, ID rule, seat availability, and result release

    School, major, scholarship, or employer notice: required level, accepted test type, result date, and score validity

    If the requirement affects admission, visa, scholarship, or graduation, confirm directly with the institution before acting
ko:
  title: TOPIK 시험
  summary: >-
    TOPIK은 한국의 공식 한국어능력시험입니다. 미얀마 학생들은 보통 대학 입학, 장학금, 졸업 요건, 한국어 전공 수업, 향후
    취업이나 체류 계획을 확인할 때 TOPIK을 만나게 됩니다.
  eligibility: >-
    한국 학교, 전공, 장학금, 졸업 요건에서 한국어 증명을 요구하는지 확인할 때

    접수 전에 TOPIK I와 TOPIK II 중 무엇을 봐야 하는지 결정해야 할 때

    한국어로 수업하는 과정이나 한국어 능력이 도움이 되는 장학금에 지원할 때

    "한국어를 할 수 있다"는 말 대신 공식 성적으로 수준을 보여주고 싶을 때

    유학, 취업, 체류 계획에서 한국어 능력이 나중에 도움이 될 수 있어 미리 준비할 때
  subtypes: >-
    TOPIK은 한국어를 모국어로 하지 않는 사람과 재외동포를 위한 한국의 공식 한국어능력시험입니다.

    TOPIK 성적은 대학 입학, 졸업 요건, 장학금, 한국어 전공 요건, 취업, 향후 비자나 체류 계획에 사용될 수 있습니다.

    TOPIK I는 1급과 2급을 위한 초급 과정입니다. 듣기와 읽기를 봅니다.

    TOPIK II는 3급부터 6급까지의 중급~고급 과정입니다. 듣기, 쓰기, 읽기를 봅니다.

    시험장과 일정에 따라 PBT 또는 IBT로 운영될 수 있습니다. 점수 체계가 다를 수 있으므로 시험 종류를 확인한 뒤 비교해야 합니다.

    요구 급수는 이 글에서 정해지는 것이 아닙니다. 학교, 전공, 장학금, 고용주, 제도별로 TOPIK 요건이 다를 수 있습니다.
  documents: >-
    여권, 외국인등록증 등 시험장에서 인정하는 접수 및 시험 당일 신분증

    TOPIK 계정 또는 접수 로그인 정보

    접수 시스템에서 요구하는 경우 사진 또는 프로필 이미지

    응시료 결제 수단

    접수 후 수험표 또는 시험 확인서

    성적 발표 후 TOPIK 성적표

    어떤 TOPIK 급수와 시험 종류를 인정하는지 적힌 학교, 장학금, 취업 공지
  steps: >-
    먼저 목표를 정합니다: 대학 입학, 장학금, 졸업, 개인 실력 확인, 취업, 향후 계획.

    정확한 학교, 전공, 장학금, 기관의 최신 공지를 읽습니다.

    공지에서 1급 또는 2급을 요구하면 TOPIK I를 확인하고, 3급 이상을 요구하면 TOPIK II를 확인합니다.

    TOPIK 필수 여부가 분명하지 않으면 필수인지, 선택인지, 입학 후 나중에 필요한지 확인합니다.

    공식 TOPIK 사이트 또는 현지 시험장에서 접수 기간, 시험 종류, 시험장, 응시료, 신분증 규정, 성적 발표일을 확인합니다.

    선택한 시험에 맞춰 준비합니다. TOPIK I는 듣기와 읽기 중심이고, TOPIK II는 쓰기도 필요합니다.

    성적 제출 전 해당 기관이 그 시험 종류, 급수, 성적 발표일, 유효기간을 인정하는지 확인합니다.
  watchout: >-
    목표가 3급 이상인데 쉽다는 이유만으로 TOPIK I를 선택하면 안 됨

    영어트랙 입학이라고 해서 나중에도 한국어가 전혀 필요 없다고 단정하면 안 됨

    TOPIK II에는 쓰기가 있으므로 TOPIK I처럼만 준비하면 부족함

    성적 발표일이 지원 마감일 전에 나오는지 확인하지 않고 접수하면 안 됨

    날짜, 응시료, 시험장, 요구 급수는 오래된 SNS 글에 의존하면 안 됨

    점수 보장, 대리시험, 유출 문제, 비공식 shortcut은 피해야 함
  notes: >-
    NIIED 공식 TOPIK 페이지: 시험 목적, 시험 종류, 영역, 시간, 총점, 등급 범위 확인

    공식 TOPIK 사이트 또는 현지 시험장: 접수 기간, 시험일, 응시료, 신분증 규정, 좌석, 성적 발표 확인

    학교, 전공, 장학금, 고용주 공지: 요구 급수, 인정 시험 종류, 성적 발표일, 유효기간 확인

    입학, 비자, 장학금, 졸업에 영향을 주는 요건은 행동하기 전 해당 기관에 직접 확인
my:
  title: TOPIK စာမေးပွဲ
  summary: >-
    TOPIK သည် ကိုရီးယားစာစွမ်းရည်ကို တိုင်းတာသည့် တရားဝင်စာမေးပွဲဖြစ်ပါသည်။
    မြန်မာကျောင်းသားများအတွက် တက္ကသိုလ်ဝင်ခွင့်၊ Scholarship၊ ဘွဲ့ရရန်လိုအပ်ချက်၊
    ကိုရီးယားဘာသာဖြင့် သင်ကြားသော Major၊ နောင်အလုပ်အကိုင် သို့မဟုတ်
    နေထိုင်ရေးအစီအစဉ်များတွင် အသုံးဝင်နိုင်ပါသည်။
  eligibility: >-
    ကိုရီးယားကျောင်း၊ Major၊ Scholarship သို့မဟုတ် ဘွဲ့ရရန်လိုအပ်ချက်တွင် ကိုရီးယားစာအထောက်အထား တောင်းမတောင်း စစ်ချင်သောအခါ

    စာရင်းမသွင်းမီ TOPIK I ဖြေရမလား၊ TOPIK II ဖြေရမလား ဆုံးဖြတ်ရန်လိုသောအခါ

    ကိုရီးယားဘာသာဖြင့် သင်ကြားသော Program သို့မဟုတ် ကိုရီးယားစာစွမ်းရည်ရှိခြင်းက အထောက်အကူဖြစ်နိုင်သော Scholarship ကို လျှောက်ချင်သောအခါ

    "ကိုရီးယားစာ ပြောတတ်တယ်" ဟု ပြောရုံမဟုတ်ဘဲ တရားဝင် score ဖြင့် ကိုယ့်အဆင့်ကို ပြချင်သောအခါ

    ပညာသင်၊ အလုပ် သို့မဟုတ် နေထိုင်ရေးလမ်းကြောင်းများအတွက် နောင်တွင် ကိုရီးယားစာစွမ်းရည် လိုလာနိုင်သောကြောင့် ကြိုတင်ပြင်ဆင်ချင်သောအခါ
  subtypes: >-
    TOPIK သည် ကိုရီးယားစာကို မိခင်ဘာသာအဖြစ် မသုံးသူများနှင့် နိုင်ငံရပ်ခြားနေ ကိုရီးယားနွယ်ဖွားများအတွက် ကိုရီးယားအစိုးရဘက်မှ အသိအမှတ်ပြုထားသော ကိုရီးယားစာစွမ်းရည် စာမေးပွဲဖြစ်ပါသည်။

    တက္ကသိုလ်ဝင်ခွင့်၊ ဘွဲ့ရရန်လိုအပ်ချက်၊ Scholarship၊ ကိုရီးယားဘာသာ Major၊ အလုပ်နှင့် နောင် visa/နေထိုင်ရေးအစီအစဉ်များတွင် TOPIK score ကို အသုံးပြုနိုင်ပါသည်။

    TOPIK I သည် Beginner အဆင့်အတွက်ဖြစ်ပြီး Level 1 နှင့် Level 2 ကို ခွဲပေးပါသည်။ Listening နှင့် Reading ကို စစ်ဆေးပါသည်။

    TOPIK II သည် Intermediate မှ Advanced အထိဖြစ်ပြီး Level 3 မှ Level 6 ကို ခွဲပေးပါသည်။ Listening၊ Writing နှင့် Reading ကို စစ်ဆေးပါသည်။

    Test center နှင့် schedule အလိုက် PBT သို့မဟုတ် IBT ဖြေရနိုင်ပါသည်။ Score scale ကွာနိုင်သောကြောင့် မိမိဖြေမည့် test type ကို အရင်စစ်ပြီးမှ score ကို နှိုင်းယှဉ်ပါ။

    လိုအပ်သော TOPIK level ကို ဒီစာမျက်နှာက မသတ်မှတ်ပါ။ ကျောင်း၊ Major၊ Scholarship၊ အလုပ်ရှင် သို့မဟုတ် စည်းကမ်းအလိုက် requirement ကွာနိုင်ပါသည်။
  documents: >-
    Registration နှင့် exam day အတွက် test center က လက်ခံသော ID၊ ဥပမာ passport၊ ARC သို့မဟုတ် notice ထဲတွင် ရေးထားသော ID

    TOPIK account သို့မဟုတ် registration login information

    Registration system က တောင်းပါက ဓာတ်ပုံ သို့မဟုတ် profile image

    Exam fee ပေးရန် payment method

    Registration ပြီးနောက် admission ticket သို့မဟုတ် test voucher

    Result ထွက်ပြီးနောက် TOPIK score report

    မိမိလျှောက်မည့် ကျောင်း၊ Scholarship သို့မဟုတ် အလုပ် notice ထဲက ဘယ် TOPIK level နှင့် score type ကို လက်ခံသလဲဆိုသော အချက်
  steps: >-
    အရင်ဆုံး ကိုယ့်ရည်မှန်းချက်ကို သတ်မှတ်ပါ: တက္ကသိုလ်ဝင်ခွင့်၊ Scholarship၊ ဘွဲ့ရရန်လိုအပ်ချက်၊ ကိုယ်ပိုင် level စစ်ခြင်း၊ အလုပ် သို့မဟုတ် နောင်အစီအစဉ်။

    လျှောက်မည့် ကျောင်း၊ Major၊ Scholarship သို့မဟုတ် institution ၏ နောက်ဆုံး notice ကို ဖတ်ပါ။

    Notice တွင် Level 1 သို့မဟုတ် Level 2 တောင်းပါက TOPIK I ကို စစ်ပါ။ Level 3 အထက် တောင်းပါက TOPIK II ကို စစ်ပါ။

    TOPIK လို/မလို မရှင်းလင်းပါက required လား၊ optional လား၊ admission ပြီးနောက်မှ လိုမလား စစ်ပါ။

    Official TOPIK site သို့မဟုတ် local test center တွင် registration period၊ test type၊ test center၊ fee၊ ID rule နှင့် result date ကို စစ်ပါ။

    ရွေးထားသော test အလိုက် ပြင်ဆင်ပါ။ TOPIK I သည် Listening နှင့် Reading အဓိကဖြစ်ပြီး TOPIK II တွင် Writing ပါ လိုအပ်ပါသည်။

    Score မတင်မီ ထို institution က score type၊ level၊ result date နှင့် validity period ကို လက်ခံမလား ပြန်စစ်ပါ။
  watchout: >-
    မိမိရည်မှန်းချက်က Level 3 အထက်လိုနေသော်လည်း TOPIK I က ပိုလွယ်သည်ဆိုပြီး TOPIK I ကို မရွေးပါနှင့်

    English-track admission ဖြစ်သောကြောင့် နောက်ပိုင်း ကိုရီးယားစာ ဘယ်တော့မှ မလိုတော့ဟု မယူဆပါနှင့်

    TOPIK II တွင် Writing ပါသောကြောင့် TOPIK I လို Listening/Reading သာ ပြင်ဆင်လျှင် မလုံလောက်ပါ

    Result ထွက်မည့်ရက်သည် application deadline မတိုင်မီ ဖြစ်မဖြစ် မစစ်ဘဲ registration မလုပ်ပါနှင့်

    Date၊ fee၊ test center နှင့် required level များကို social media post အဟောင်းများပေါ်တွင် မမှီခိုပါနှင့်

    Score အာမခံပေးမည်ဟု ပြောခြင်း၊ ကိုယ်စားဝင်ဖြေခိုင်းခြင်း၊ မေးခွန်းပေါက်ကြားမှုကို ဝယ်ယူခြင်း သို့မဟုတ် တရားမဝင် shortcut များကို လုံးဝရှောင်ပါ
  notes: >-
    NIIED official TOPIK page: စာမေးပွဲရည်ရွယ်ချက်၊ test type၊ section၊ time၊ total score နှင့် level range စစ်ရန်

    Official TOPIK site သို့မဟုတ် local test center: registration period၊ test date၊ fee၊ ID rule၊ seat availability နှင့် result release စစ်ရန်

    School၊ Major၊ Scholarship သို့မဟုတ် employer notice: required level၊ accepted test type၊ result date နှင့် score validity စစ်ရန်

    Admission၊ visa၊ scholarship သို့မဟုတ် ဘွဲ့ရခြင်းကို ထိခိုက်နိုင်သော requirement များကို လုပ်ဆောင်မီ သက်ဆိုင်ရာ institution တွင် တိုက်ရိုက်အတည်ပြုပါ
