title: D-2-4 Doctoral Degree Visa
category: visa
order: 17
lastReviewed: 2026-07-31
en:
  title: D-2-4 Doctoral Degree Visa
  summary: |-
    D-2-4 is the D-2 route for doctoral or PhD degree study at an eligible Korean graduate school. It is for regular doctoral degree study and should be separated from master's, research-only, or language-training routes.
  eligibility: |-
    You have admission to an eligible doctoral or PhD degree program in Korea.
    Your master's degree or accepted equivalent academic background must support doctoral entry.
    The Standard Admission Letter, department, advisor, study period, and funding documents should match D-2-4 review.
    The school, embassy, or immigration office may request additional research, funding, or academic documents depending on the program.
  subtypes: ''
  documents: |-
    Visa application or visa issuance documents, passport, photo, fee, and residence card if applying in Korea
    Standard Admission Letter from the graduate school
    School business registration or registration-number certificate copy
    Master's degree certificate, transcript, research record, or other academic proof, verified if required
    Financial proof, scholarship certificate, research funding, assistantship, sponsor proof, or accepted support documents
    Advisor confirmation, research plan, department documents, or other doctoral-program evidence if requested
  steps: |-
    Confirm that your admission is for a doctoral or PhD degree program and D-2-4 is correct.
    Receive the Standard Admission Letter and graduate-school documents.
    Prepare verified academic records and funding documents.
    Confirm whether advisor, research plan, scholarship, or department documents are required for your embassy or immigration route.
    Apply through the Korean embassy/consulate or Certificate of Visa Issuance route if used by the school.
    After arrival, complete foreigner registration within 90 days if staying more than 90 days.
  watchout: |-
    D-2-4 is not the same as D-2-5 research. If the program is not a doctoral degree, confirm the correct route.
    Funding and research documents should be consistent with the admission letter.
    Doctoral study can take longer, but stay periods and extensions are still reviewed by immigration.
    Changing advisor, department, school, address, passport, or enrollment status can create reporting duties.
  notes: |-
    D-2-4 extension review may consider enrollment, research progress, funding, tuition, academic schedule, and stay history.
    Part-time work or paid research outside the approved scope may require confirmation and immigration permission.
    Confirm current requirements with your graduate school, Korean embassy, HiKorea, 1345, or immigration office before applying.
ko:
  title: D-2-4 박사 유학 비자
  summary: |-
    D-2-4는 한국 대학원의 박사 또는 PhD 학위과정을 위한 D-2 경로입니다. 정규 박사 학위과정용이며 석사, 연구전용, 어학연수 경로와 구분해야 합니다.
  eligibility: |-
    한국의 대상 박사 또는 PhD 학위과정에 입학 허가를 받은 경우 확인할 수 있습니다.
    석사 학위 또는 인정되는 이에 준하는 학문적 배경이 박사 입학 단계와 맞아야 합니다.
    표준입학허가서, 학과, 지도교수, 수학기간, 재정지원 서류가 D-2-4 심사와 맞아야 합니다.
    과정에 따라 학교, 공관 또는 출입국이 연구, 재정지원, 학업 관련 추가서류를 요청할 수 있습니다.
  subtypes: ''
  documents: |-
    사증신청 또는 사증발급인정 관련 서류, 여권, 사진, 수수료, 국내 신청 시 외국인등록증
    대학원에서 발급한 표준입학허가서
    학교 사업자등록증 또는 고유번호증 사본
    석사 학위증명서, 성적증명서, 연구실적 또는 기타 학업 증빙. 필요한 경우 확인
    재정 입증, 장학금 증명서, 연구비, 조교 지원, 보증인 자료 또는 인정되는 지원 서류
    요구되는 경우 지도교수 확인, 연구계획서, 학과 서류 또는 기타 박사과정 증빙
  steps: |-
    입학이 박사 또는 PhD 학위과정인지, D-2-4가 맞는지 확인합니다.
    표준입학허가서와 대학원 서류를 받습니다.
    확인된 학업 기록과 재정지원 서류를 준비합니다.
    공관 또는 출입국 경로에서 지도교수, 연구계획, 장학금, 학과 서류가 필요한지 확인합니다.
    대한민국 대사관·영사관 또는 학교가 이용하는 사증발급인정서 경로로 신청합니다.
    입국 후 90일을 초과해 체류하면 90일 이내에 외국인등록을 합니다.
  watchout: |-
    D-2-4는 D-2-5 연구과정과 다릅니다. 박사 학위과정이 아니라면 맞는 경로를 확인하세요.
    재정지원과 연구 관련 서류는 입학허가서와 내용이 일치해야 합니다.
    박사과정은 오래 걸릴 수 있지만 체류기간과 연장은 여전히 출입국 심사를 받습니다.
    지도교수, 학과, 학교, 주소, 여권, 재학상태 변경은 신고의무와 연결될 수 있습니다.
  notes: |-
    D-2-4 연장 심사는 재학, 연구 진행, 재정지원, 등록금, 학사일정, 체류이력을 볼 수 있습니다.
    허가 범위를 벗어난 시간제 취업이나 유급 연구는 학교 확인과 출입국 허가가 필요할 수 있습니다.
    신청 전 대학원, 재외공관, 하이코리아, 1345 또는 출입국에서 현재 요건을 확인하세요.
my:
  title: D-2-4 Doctoral Degree ဗီဇာ
  summary: |-
    D-2-4 သည် ကိုရီးယားဘွဲ့လွန်ကျောင်းတွင် doctoral သို့မဟုတ် PhD degree တက်ရန်အတွက် D-2 လမ်းကြောင်းဖြစ်သည်။ တရားဝင် doctoral degree သင်တန်းအတွက်ဖြစ်ပြီး master၊ research-only၊ ကိုရီးယားဘာသာသင်တန်းလမ်းကြောင်းများနှင့် ခွဲစစ်ရမည်။
  eligibility: |-
    ကိုရီးယားရှိ ကိုက်ညီသော doctoral သို့မဟုတ် PhD degree Program မှ ဝင်ခွင့်ရထားသူဖြစ်ရမည်။
    Master degree သို့မဟုတ် လက်ခံထားသော ကိုက်ညီသည့်ပညာရေးနောက်ခံသည် doctoral ဝင်ခွင့်အဆင့်နှင့် ကိုက်ညီရမည်။
    Standard Admission Letter၊ department၊ supervisor၊ ပညာသင်ကာလနှင့် funding စာရွက်များသည် D-2-4 စစ်ဆေးမှုနှင့် ကိုက်ညီရမည်။
    Program အလိုက် ကျောင်း၊ သံရုံး သို့မဟုတ် လူဝင်မှုရုံးက သုတေသန၊ funding သို့မဟုတ် ပညာရေးဆိုင်ရာ အပိုစာရွက်များ တောင်းနိုင်သည်။
  subtypes: ''
  documents: |-
    ဗီဇာလျှောက်လွှာ သို့မဟုတ် ဗီဇာထုတ်ပေးမှုအတည်ပြုစာဆိုင်ရာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်
    ဘွဲ့လွန်ကျောင်းမှ Standard Admission Letter
    ကျောင်း၏ Business Registration သို့မဟုတ် Registration Number Certificate မိတ္တူ
    Master ဘွဲ့လက်မှတ်၊ အမှတ်စာရင်း၊ research record သို့မဟုတ် အခြားပညာရေးအထောက်အထား။ လိုအပ်ပါက အတည်ပြုချက်
    ငွေကြေးအထောက်အထား၊ Scholarship စာ၊ research funding၊ assistantship၊ Sponsor စာ သို့မဟုတ် လက်ခံသော ထောက်ပံ့မှုစာရွက်များ
    တောင်းပါက supervisor confirmation၊ research plan၊ department စာရွက်များ သို့မဟုတ် doctoral Program ဆိုင်ရာ အခြားအထောက်အထားများ
  steps: |-
    ဝင်ခွင့်သည် doctoral သို့မဟုတ် PhD degree Program ဖြစ်မဖြစ်နှင့် D-2-4 မှန်မမှန် အတည်ပြုပါ။
    Standard Admission Letter နှင့် ဘွဲ့လွန်ကျောင်းစာရွက်များ ရယူပါ။
    အတည်ပြုထားသော ပညာရေးမှတ်တမ်းနှင့် funding စာရွက်များ ပြင်ပါ။
    သံရုံး သို့မဟုတ် လူဝင်မှုရုံးလမ်းကြောင်းအတွက် supervisor၊ research plan၊ Scholarship သို့မဟုတ် department စာရွက်များ လိုမလို စစ်ပါ။
    ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံးတွင် လျှောက်ပါ သို့မဟုတ် ကျောင်းကအသုံးပြုသော Certificate of Visa Issuance လမ်းကြောင်းဖြင့် လျှောက်ပါ။
    ကိုရီးယားတွင် ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ရောက်ပြီး ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
  watchout: |-
    D-2-4 သည် D-2-5 research နှင့် မတူပါ။ Program သည် doctoral degree မဟုတ်ပါက မှန်သောလမ်းကြောင်းကို စစ်ပါ။
    Funding နှင့် research စာရွက်များသည် Admission Letter နှင့် ကိုက်ညီရမည်။
    Doctoral study သည် ကြာနိုင်သော်လည်း နေထိုင်ကာလနှင့် သက်တမ်းတိုးခြင်းကို လူဝင်မှုရုံးက ဆက်စစ်သည်။
    Supervisor၊ department၊ ကျောင်း၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ် သို့မဟုတ် ကျောင်းတက်နေမှုအခြေအနေပြောင်းခြင်းသည် တင်ပြရမည့်တာဝန်နှင့် ဆက်နိုင်သည်။
  notes: |-
    D-2-4 သက်တမ်းတိုးချိန်တွင် ကျောင်းတက်နေမှု၊ research progress၊ funding၊ ကျောင်းလခ၊ academic schedule နှင့် နေထိုင်သမိုင်းကို စစ်နိုင်သည်။
    ခွင့်ပြုထားသောအတိုင်းအတာအပြင် အချိန်ပိုင်းအလုပ် သို့မဟုတ် paid research လုပ်ရန် ကျောင်းအတည်ပြုချက်နှင့် လူဝင်မှုရုံးခွင့်ပြုချက် လိုနိုင်သည်။
    မလျှောက်မီ ဘွဲ့လွန်ကျောင်း၊ ကိုရီးယားသံရုံး၊ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
