title: E-7-1 Professional Worker Visa
category: visa
order: 12
lastReviewed: 2026-07-31
en:
  title: E-7-1 Professional Worker Visa
  summary: |-
    E-7-1 is a professional-worker route inside the E-7 Specific Activity status. It is usually checked when a Korean employer wants to hire a foreigner for a designated professional occupation. The exact occupation code is the most important starting point.
  eligibility: |-
    E-7-1 is for designated professional or specialist occupations accepted by Korean immigration.
    The job must match an accepted occupation code. A job offer alone is not enough.
    The applicant normally needs education, experience, license, portfolio, language ability, or other evidence required by that occupation code.
    The employer must also be able to prove the business, workplace, hiring reason, salary, tax or employment records, and any required recommendation.
    A D-10 job seeker may check E-7-1 after receiving an offer, but the offer must still match an eligible E-7-1 occupation and the applicant's qualifications.
  subtypes: ''
  documents: |-
    Application or visa documents, passport, photo, residence card if applying in Korea, fee, and proof of address if required
    Employment contract showing employer, workplace, job title, duties, salary, employment period, and working conditions
    Degree certificate, graduation certificate, career certificate, license, portfolio, or other evidence required by the occupation code
    Employer documents such as business registration, tax records, employment records, financial documents, and explanation of why the foreign professional is needed
    Occupation-specific recommendation, approval, or additional documents if the current rule requires them
    Foreign-issued documents may need translation, Apostille, consular confirmation, or original verification
  steps: |-
    Find the exact E-7-1 occupation code first.
    Check whether your degree, major, work experience, license, salary, and employer documents match that code.
    Ask the employer to prepare company documents and the job explanation, because E-7-1 is reviewed from both applicant and employer sides.
    Confirm the filing route through the Korean embassy, HiKorea, 1345, or the immigration office. Overseas cases may use a Certificate of Visa Issuance process.
    Apply only through the confirmed route and do not start the E-7-1 work before the visa or status permission is granted.
    After approval, report or get permission for workplace, contract, duty, address, passport, or registration changes when required.
  watchout: |-
    Do not choose E-7-1 only because the job sounds professional. The occupation code must exist and match the actual work.
    Education and experience rules can differ by occupation. Some jobs may need a related major, related work experience, license, portfolio, or recommendation.
    Salary and employer conditions can be reviewed. A weak contract or unclear company documents can become a problem.
    Work only in the approved workplace and approved duties. Changing company or job duties may need permission or reporting.
    Rules, occupation lists, salary standards, and document lists can change. Confirm current requirements before applying.
  notes: |-
    E-7-1 is commonly connected to people moving from D-10 to professional employment, but D-10 does not guarantee E-7-1 approval.
    E-7-1 is different from E-7-4. E-7-4 is a skilled-worker points route mainly connected to eligible E-9, E-10, or H-2 workers.
    This page is a cautious overview. Confirm the exact occupation code and document list with HiKorea, 1345, the immigration office, or the Korean embassy before acting.
ko:
  title: E-7-1 전문인력 비자
  summary: |-
    E-7-1은 E-7 특정활동 체류자격 안의 전문인력 경로입니다. 한국 고용기관이 지정된 전문 직종으로 외국인을 채용하려는 경우 주로 확인합니다. 가장 먼저 확인해야 할 것은 정확한 직종코드입니다.
  eligibility: |-
    E-7-1은 한국 출입국이 인정하는 지정 전문직 또는 특수 직종을 위한 경로입니다.
    직무가 허용된 직종코드와 맞아야 합니다. 취업 제안만으로는 부족합니다.
    신청자는 보통 해당 직종코드에서 요구하는 학력, 경력, 자격, 포트폴리오, 언어 능력 또는 기타 증빙이 필요합니다.
    고용기관도 사업장, 고용 필요성, 임금, 세금·고용 기록, 필요한 추천서 등을 입증할 수 있어야 합니다.
    D-10 구직자가 취업 제안을 받은 뒤 E-7-1을 확인할 수 있지만, 그 제안도 허용 직종과 신청인 자격에 맞아야 합니다.
  subtypes: ''
  documents: |-
    신청서 또는 사증 서류, 여권, 사진, 국내 신청 시 외국인등록증, 수수료, 필요한 경우 체류지 입증서류
    고용기관, 근무지, 직책, 담당업무, 임금, 고용기간과 근로조건이 표시된 고용계약서
    직종코드에서 요구하는 학위증, 졸업증명서, 경력증명서, 자격증, 포트폴리오 또는 기타 증빙
    사업자등록, 납세자료, 고용현황, 재무자료, 외국 전문인력이 필요한 이유를 설명하는 고용기관 서류
    현재 규정상 필요한 직종별 추천서, 승인서 또는 추가 서류
    해외 발급 서류는 번역, 아포스티유, 영사확인 또는 원본 확인이 필요할 수 있습니다
  steps: |-
    먼저 정확한 E-7-1 직종코드를 찾습니다.
    학위, 전공, 경력, 자격, 임금, 고용기관 서류가 그 코드의 기준과 맞는지 확인합니다.
    E-7-1은 신청인과 고용기관을 함께 보기 때문에 회사 서류와 직무 설명을 고용기관과 함께 준비합니다.
    재외공관, 하이코리아, 1345 또는 출입국에서 신청 경로를 확인합니다. 해외 사례는 사증발급인정서 절차를 이용할 수 있습니다.
    확인된 경로로 신청하고, 비자나 체류자격 허가를 받기 전에는 E-7-1 업무를 시작하지 마세요.
    허가 후 근무처, 계약, 업무, 체류지, 여권, 등록사항 변경은 필요한 경우 허가 또는 신고를 합니다.
  watchout: |-
    일이 전문적으로 보인다는 이유만으로 E-7-1을 선택하지 마세요. 실제 업무와 맞는 직종코드가 있어야 합니다.
    학력과 경력 기준은 직종마다 다를 수 있습니다. 관련 전공, 관련 경력, 자격증, 포트폴리오 또는 추천서가 필요할 수 있습니다.
    임금과 고용기관 조건도 심사될 수 있습니다. 계약서가 약하거나 회사 자료가 불명확하면 문제가 될 수 있습니다.
    허가된 근무처와 허가된 업무 범위 안에서만 일해야 합니다. 회사나 업무 변경은 허가 또는 신고가 필요할 수 있습니다.
    규정, 직종 목록, 임금 기준, 서류 목록은 바뀔 수 있습니다. 신청 전 최신 요건을 확인하세요.
  notes: |-
    E-7-1은 D-10에서 전문직 취업으로 전환하려는 사람과 자주 연결되지만, D-10이 E-7-1 허가를 보장하지는 않습니다.
    E-7-1은 E-7-4와 다릅니다. E-7-4는 주로 E-9, E-10, H-2 경력자와 연결되는 숙련기능인력 점수제 경로입니다.
    이 페이지는 조심스럽게 정리한 개요입니다. 실제 진행 전 하이코리아, 1345, 출입국 또는 재외공관에서 정확한 직종코드와 서류 목록을 확인하세요.
my:
  title: E-7-1 ပညာရှင်လုပ်သား ဗီဇာ
  summary: |-
    E-7-1 သည် E-7 အထူးလုပ်ငန်းဗီဇာအတွင်းရှိ ပညာရှင်လုပ်သားလမ်းကြောင်းဖြစ်သည်။ ကိုရီးယားအလုပ်ရှင်က သတ်မှတ်ထားသော ပညာရှင်အလုပ်အတွက် နိုင်ငံခြားသားကို ခန့်ချင်သည့်အခါ စစ်ဆေးလေ့ရှိသည်။ အရင်ဆုံး စစ်ရမည့်အရာမှာ အတိအကျ အလုပ်ကုဒ်ဖြစ်သည်။
  eligibility: |-
    E-7-1 သည် ကိုရီးယားလူဝင်မှုရုံးက လက်ခံထားသော ပညာရှင် သို့မဟုတ် အထူးကျွမ်းကျင်အလုပ်များအတွက် ဖြစ်သည်။
    အလုပ်တာဝန်သည် ခွင့်ပြုထားသော အလုပ်ကုဒ်နှင့် ကိုက်ညီရမည်။ အလုပ်ကမ်းလှမ်းချက်ရှိရုံဖြင့် မလုံလောက်ပါ။
    လျှောက်ထားသူတွင် ထိုအလုပ်ကုဒ်က တောင်းသော ပညာရေး၊ အတွေ့အကြုံ၊ လိုင်စင်၊ portfolio၊ ဘာသာစကားအရည်အချင်း သို့မဟုတ် အခြားအထောက်အထားများ လိုနိုင်သည်။
    အလုပ်ရှင်ဘက်တွင်လည်း ကုမ္ပဏီအခြေအနေ၊ အလုပ်နေရာ၊ ခန့်ထားရခြင်းအကြောင်း၊ လစာ၊ အခွန်/အလုပ်ခန့်ထားမှုမှတ်တမ်းနှင့် လိုအပ်သည့်ထောက်ခံစာများကို ပြနိုင်ရမည်။
    D-10 ဖြင့် အလုပ်ရှာနေသူသည် အလုပ်ရပြီးနောက် E-7-1 ကို စစ်နိုင်သော်လည်း ထိုအလုပ်သည် ခွင့်ပြုထားသော E-7-1 အလုပ်ဖြစ်ပြီး ကိုယ့်အရည်အချင်းနှင့် ကိုက်ညီရမည်။
  subtypes: ''
  documents: |-
    လျှောက်လွှာ သို့မဟုတ် ဗီဇာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ လိုအပ်ပါက နေရပ်အထောက်အထား
    အလုပ်ရှင်၊ အလုပ်နေရာ၊ ရာထူး၊ လုပ်ငန်းတာဝန်၊ လစာ၊ အလုပ်ကာလနှင့် အလုပ်စည်းကမ်းများ ပါသော အလုပ်စာချုပ်
    အလုပ်ကုဒ်အလိုက် လိုအပ်သော ဘွဲ့လက်မှတ်၊ ဘွဲ့ရစာရွက်၊ အတွေ့အကြုံလက်မှတ်၊ လိုင်စင်၊ portfolio သို့မဟုတ် အခြားအထောက်အထား
    ကုမ္ပဏီမှတ်ပုံတင်၊ အခွန်စာရွက်၊ အလုပ်ခန့်ထားမှုမှတ်တမ်း၊ ငွေကြေးစာရွက်နှင့် နိုင်ငံခြားပညာရှင်ကို ခန့်ရန်လိုအပ်ကြောင်း ရှင်းပြသော အလုပ်ရှင်စာရွက်များ
    လက်ရှိစည်းမျဉ်းအရ အလုပ်အမျိုးအစားအလိုက် လိုအပ်သော ထောက်ခံစာ၊ ခွင့်ပြုစာ သို့မဟုတ် အပိုစာရွက်များ
    နိုင်ငံခြားမှထုတ်ထားသောစာရွက်များသည် ဘာသာပြန်၊ Apostille၊ ကောင်စစ်အတည်ပြုခြင်း သို့မဟုတ် မူရင်းစစ်ဆေးခြင်း လိုနိုင်သည်
  steps: |-
    ပထမဦးစွာ အတိအကျ E-7-1 အလုပ်ကုဒ်ကို ရှာပါ။
    ကိုယ့်ဘွဲ့၊ major၊ အတွေ့အကြုံ၊ လိုင်စင်၊ လစာနှင့် အလုပ်ရှင်စာရွက်များသည် ထိုကုဒ်စံနှုန်းနှင့် ကိုက်မကိုက် စစ်ပါ။
    E-7-1 သည် လျှောက်ထားသူနှင့် အလုပ်ရှင်ကို အတူစစ်သောကြောင့် ကုမ္ပဏီစာရွက်နှင့် အလုပ်တာဝန်ရှင်းလင်းချက်ကို အလုပ်ရှင်နှင့်အတူ ပြင်ပါ။
    ကိုရီးယားသံရုံး၊ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးမှ လျှောက်လမ်းကို အတည်ပြုပါ။ ပြည်ပမှလျှောက်ပါက ဗီဇာထုတ်ပေးမှုအတည်ပြုစာ လုပ်ငန်းစဉ်ကို အသုံးပြုရနိုင်သည်။
    အတည်ပြုထားသောလမ်းကြောင်းဖြင့်သာ လျှောက်ပြီး ဗီဇာ သို့မဟုတ် နေထိုင်ခွင့်မရမီ E-7-1 အလုပ်ကို မစပါနှင့်။
    ခွင့်ပြုပြီးနောက် အလုပ်နေရာ၊ စာချုပ်၊ လုပ်ငန်းတာဝန်၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ်၊ မှတ်ပုံတင်အချက်အလက် ပြောင်းလဲပါက လိုအပ်သလို ခွင့်ပြုချက်ယူခြင်း သို့မဟုတ် တင်ပြခြင်း လုပ်ပါ။
  watchout: |-
    အလုပ်က ပညာရှင်အလုပ်လိုထင်ရုံဖြင့် E-7-1 ဖြစ်မည်ဟု မယူဆပါနှင့်။ လက်တွေ့လုပ်ငန်းတာဝန်နှင့် ကိုက်ညီသော အလုပ်ကုဒ် ရှိရမည်။
    ပညာရေးနှင့် အတွေ့အကြုံစံနှုန်းသည် အလုပ်အလိုက် ကွာနိုင်သည်။ သက်ဆိုင်ရာ major၊ သက်ဆိုင်ရာအတွေ့အကြုံ၊ လိုင်စင်၊ portfolio သို့မဟုတ် ထောက်ခံစာ လိုနိုင်သည်။
    လစာနှင့် အလုပ်ရှင်အခြေအနေကိုလည်း စစ်နိုင်သည်။ စာချုပ်မရှင်းလင်းခြင်း သို့မဟုတ် ကုမ္ပဏီစာရွက်အားနည်းခြင်းသည် ပြဿနာဖြစ်နိုင်သည်။
    ခွင့်ပြုထားသော အလုပ်နေရာနှင့် လုပ်ငန်းတာဝန်အတွင်းသာ အလုပ်လုပ်ရမည်။ ကုမ္ပဏီပြောင်းခြင်း သို့မဟုတ် တာဝန်ပြောင်းခြင်းတွင် ခွင့်ပြုချက် သို့မဟုတ် တင်ပြချက် လိုနိုင်သည်။
    စည်းမျဉ်း၊ အလုပ်ကုဒ်စာရင်း၊ လစာစံနှုန်းနှင့် စာရွက်စာတမ်းစာရင်းများ ပြောင်းနိုင်သည်။ မလျှောက်မီ လတ်တလောလိုအပ်ချက်ကို စစ်ပါ။
  notes: |-
    E-7-1 သည် D-10 မှ ပညာရှင်အလုပ်သို့ ပြောင်းလိုသူများနှင့် မကြာခဏ ဆက်စပ်သော်လည်း D-10 ရှိရုံဖြင့် E-7-1 ခွင့်ပြုမည်ဟု မဆိုလိုပါ။
    E-7-1 သည် E-7-4 နှင့် မတူပါ။ E-7-4 သည် အများအားဖြင့် E-9၊ E-10 သို့မဟုတ် H-2 အတွေ့အကြုံရှိသူများအတွက် ကျွမ်းကျင်လုပ်သား အမှတ်စနစ်လမ်းကြောင်းဖြစ်သည်။
    ဤစာမျက်နှာသည် သတိထားရေးထားသော အကျဉ်းချုပ်ဖြစ်သည်။ မလုပ်မီ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကိုရီးယားသံရုံးတွင် အတိအကျ အလုပ်ကုဒ်နှင့် စာရွက်စာတမ်းစာရင်းကို အတည်ပြုပါ။
