title: TOPIK I
category: study
order: 2
lastReviewed: 2026-07-29
en:
  title: TOPIK I
  summary: >-
    TOPIK I is the beginner Korean test for Level 1 and Level 2. It is useful
    when a beginner-level score is enough, or when you want to check your basic
    Korean before preparing for TOPIK II.
  eligibility: >-
    You are still building basic Korean and want an official beginner score

    Your school, language program, scholarship, or personal goal asks for Level 1 or Level 2

    Your Korean-taught major does not require Level 3 or higher yet

    You want to test basic daily Korean before spending time on TOPIK II writing

    You checked the target notice and it clearly says TOPIK I or Level 1-2 is accepted
  subtypes: >-
    TOPIK I is the beginner TOPIK test. It is for people who need Level 1 or Level 2, or who want to check basic Korean before moving to TOPIK II.

    PBT TOPIK I checks Listening and Reading only. There is no Writing section.

    PBT TOPIK I total score is 200. Level 1 is 80 to 139 points, and Level 2 is 140 to 200 points.

    Level 1 is for very basic daily Korean such as greetings, self-introduction, shopping, ordering food, time, numbers, and familiar topics.

    Level 2 is stronger beginner Korean for simple daily tasks, short notices, simple messages, and common life situations.

    IBT TOPIK I uses 400 total points and different score ranges, so check the official IBT notice if your test center uses IBT.
  documents: >-
    Accepted ID for registration and test day

    TOPIK account or registration login

    Photo or profile image if the registration system asks for it

    Payment method for the test fee

    Admission ticket after registration

    TOPIK I score report after results are released

    School, language program, or scholarship notice that says Level 1 or Level 2 is accepted
  steps: >-
    Build the foundation first: Hangul, pronunciation, numbers, dates, time, locations, particles, basic verbs, and daily expressions.

    Practice listening to short daily conversations, announcements, classroom phrases, shopping, ordering food, and transportation situations.

    Practice reading short signs, notices, messages, schedules, menus, simple forms, and short paragraphs.

    Learn question patterns with past-style questions, then practice under time limits.

    Before registering, check the official test date, test center, ID rule, fee, and result release date.

    After receiving your score, check whether Level 1 or Level 2 is accepted for the exact application you want to use it for.
  watchout: >-
    TOPIK I cannot give Level 3 or higher

    TOPIK I does not include Writing, so it does not prepare you fully for TOPIK II

    Many Korean-taught university majors, competitive scholarships, or graduation rules may expect TOPIK II instead

    Do not assume Level 2 is enough unless the official notice says so

    Do not register too late because seats can close early

    Avoid paid shortcuts, leaked-question claims, proxy testing, or guaranteed-score offers
  notes: >-
    NIIED official TOPIK page: TOPIK I section, time, total score, and level range

    Official TOPIK site or local test center: registration method, test date, seat, fee, ID rule, and result release

    School or scholarship notice: whether Level 1 or Level 2 is accepted and whether the result date fits the application period
ko:
  title: TOPIK I
  summary: >-
    TOPIK I는 1급과 2급에 해당하는 초급 한국어 시험입니다. 초급 성적이면 충분한 경우나 TOPIK II를 준비하기 전 기본
    한국어 실력을 확인하고 싶을 때 유용합니다.
  eligibility: >-
    기본 한국어를 배우는 중이고 공식 초급 성적이 필요할 때

    학교, 어학 과정, 장학금, 개인 목표에서 1급 또는 2급을 요구할 때

    한국어 전공 수업에서 아직 3급 이상을 요구하지 않을 때

    TOPIK II 쓰기를 준비하기 전에 기본 생활 한국어를 먼저 확인하고 싶을 때

    목표 공지에서 TOPIK I 또는 1~2급을 인정한다고 분명히 적혀 있을 때
  subtypes: >-
    TOPIK I는 초급 TOPIK 시험입니다. 1급 또는 2급이 필요한 사람이나 TOPIK II로 가기 전 기본 한국어를 확인하고 싶은 사람에게 맞습니다.

    PBT TOPIK I는 듣기와 읽기만 봅니다. 쓰기는 없습니다.

    PBT TOPIK I 총점은 200점입니다. 1급은 80~139점, 2급은 140~200점입니다.

    1급은 인사, 자기소개, 쇼핑, 음식 주문, 시간, 숫자, 익숙한 주제 같은 아주 기본적인 생활 한국어 수준입니다.

    2급은 간단한 생활 과제, 짧은 공지, 쉬운 메시지, 자주 만나는 생활 상황을 이해하는 조금 더 높은 초급 수준입니다.

    IBT TOPIK I는 총점 400점과 다른 등급 범위를 사용하므로 IBT를 보는 경우 공식 IBT 공지를 확인해야 합니다.
  documents: >-
    접수 및 시험 당일 인정되는 신분증

    TOPIK 계정 또는 접수 로그인 정보

    접수 시스템에서 요구하는 경우 사진 또는 프로필 이미지

    응시료 결제 수단

    접수 후 수험표

    성적 발표 후 TOPIK I 성적표

    1급 또는 2급을 인정한다고 적힌 학교, 어학 과정, 장학금 공지
  steps: >-
    한글, 발음, 숫자, 날짜, 시간, 장소, 조사, 기본 동사, 생활 표현부터 다집니다.

    짧은 일상 대화, 안내 방송, 교실 표현, 쇼핑, 음식 주문, 교통 상황 듣기를 연습합니다.

    짧은 표지판, 공지, 메시지, 일정표, 메뉴, 간단한 양식, 짧은 문단 읽기를 연습합니다.

    기출 유형 문제로 문제 패턴을 익힌 뒤 제한 시간을 두고 연습합니다.

    접수 전 공식 시험일, 시험장, 신분증 규정, 응시료, 성적 발표일을 확인합니다.

    성적을 받은 뒤 원하는 지원에 1급 또는 2급이 인정되는지 다시 확인합니다.
  watchout: >-
    TOPIK I로는 3급 이상을 받을 수 없음

    TOPIK I에는 쓰기가 없으므로 TOPIK II 준비를 완전히 대신하지 못함

    한국어 전공 수업, 경쟁이 있는 장학금, 졸업 요건은 TOPIK II를 기대할 수 있음

    공식 공지에 적혀 있지 않으면 2급이면 충분하다고 단정하면 안 됨

    좌석이 빨리 마감될 수 있으므로 접수를 너무 늦게 하면 안 됨

    유료 shortcut, 유출 문제 주장, 대리시험, 점수 보장 제안은 피해야 함
  notes: >-
    NIIED 공식 TOPIK 페이지: TOPIK I 영역, 시간, 총점, 등급 범위 확인

    공식 TOPIK 사이트 또는 현지 시험장: 접수 방법, 시험일, 좌석, 응시료, 신분증 규정, 성적 발표 확인

    학교 또는 장학금 공지: 1급 또는 2급 인정 여부와 성적 발표일이 지원 기간에 맞는지 확인
my:
  title: TOPIK I
  summary: >-
    TOPIK I သည် Level 1 နှင့် Level 2 အတွက် Beginner ကိုရီးယားစာ
    စာမေးပွဲဖြစ်ပါသည်။ Beginner score လုံလောက်သောအခါ၊ သို့မဟုတ် TOPIK II
    မသွားမီ ကိုယ့်အခြေခံကိုရီးယားစာကို စစ်ချင်သောအခါ အသုံးဝင်ပါသည်။
  eligibility: >-
    အခြေခံကိုရီးယားစာကို လေ့လာနေပြီး တရားဝင် beginner score လိုသောအခါ

    ကျောင်း၊ Language program၊ Scholarship သို့မဟုတ် ကိုယ်ပိုင်ရည်မှန်းချက်အတွက် Level 1 သို့မဟုတ် Level 2 လိုသောအခါ

    ကိုရီးယားဘာသာဖြင့် သင်ကြားသော Major က Level 3 အထက် မတောင်းသေးသောအခါ

    TOPIK II Writing မပြင်ဆင်မီ အခြေခံနေ့စဉ်ကိုရီးယားစာကို အရင်စစ်ချင်သောအခါ

    လျှောက်မည့် notice တွင် TOPIK I သို့မဟုတ် Level 1-2 လက်ခံသည်ဟု ရှင်းရှင်းလင်းလင်း ရေးထားသောအခါ
  subtypes: >-
    TOPIK I သည် Beginner အဆင့် TOPIK စာမေးပွဲဖြစ်ပါသည်။ Level 1 သို့မဟုတ် Level 2 လိုသူများ၊ သို့မဟုတ် TOPIK II မသွားမီ အခြေခံကိုရီးယားစာကို စစ်ချင်သူများအတွက် သင့်တော်ပါသည်။

    PBT TOPIK I တွင် Listening နှင့် Reading သာ ပါသည်။ Writing မပါပါ။

    PBT TOPIK I သည် စုစုပေါင်း 200 မှတ်ဖြစ်ပါသည်။ Level 1 သည် 80 မှ 139 မှတ်၊ Level 2 သည် 140 မှ 200 မှတ်ဖြစ်ပါသည်။

    Level 1 သည် နှုတ်ဆက်ခြင်း၊ ကိုယ့်ကိုယ်ကို မိတ်ဆက်ခြင်း၊ ဈေးဝယ်ခြင်း၊ အစားအစာမှာခြင်း၊ အချိန်၊ နံပါတ် စသည့် အလွန်အခြေခံနေ့စဉ်ကိုရီးယားစာအဆင့်ဖြစ်ပါသည်။

    Level 2 သည် daily task လွယ်လွယ်များ၊ notice တိုများ၊ message တိုများနှင့် နေ့စဉ်ဘဝတွင် မကြာခဏတွေ့ရသော အခြေအနေများကို ပိုနားလည်နိုင်သော beginner level ဖြစ်ပါသည်။

    IBT TOPIK I တွင် total score 400 ဖြစ်ပြီး score range ကွာသောကြောင့် IBT ဖြေမည်ဆိုပါက official IBT notice ကို စစ်ပါ။
  documents: >-
    Registration နှင့် exam day အတွက် လက်ခံသော ID

    TOPIK account သို့မဟုတ် registration login information

    Registration system က တောင်းပါက ဓာတ်ပုံ သို့မဟုတ် profile image

    Exam fee ပေးရန် payment method

    Registration ပြီးနောက် admission ticket

    Result ထွက်ပြီးနောက် TOPIK I score report

    Level 1 သို့မဟုတ် Level 2 ကို လက်ခံသည်ဟု ရေးထားသော ကျောင်း၊ Language program သို့မဟုတ် Scholarship notice
  steps: >-
    Hangul၊ အသံထွက်၊ နံပါတ်၊ ရက်စွဲ၊ အချိန်၊ နေရာ၊ particle၊ အခြေခံ verb နှင့် နေ့စဉ်အသုံးအနှုန်းများကို အရင်တည်ဆောက်ပါ။

    နေ့စဉ်စကားပြောတိုများ၊ announcement၊ class ထဲတွင် သုံးသောစကားများ၊ ဈေးဝယ်ခြင်း၊ အစားအစာမှာခြင်းနှင့် သွားလာရေးအခြေအနေများကို Listening လေ့ကျင့်ပါ။

    Sign တိုများ၊ notice၊ message၊ schedule၊ menu၊ simple form နှင့် paragraph တိုများကို Reading လေ့ကျင့်ပါ။

    Past-style question များဖြင့် မေးခွန်းပုံစံကို နားလည်အောင် လေ့လာပြီးနောက် time limit ဖြင့် လေ့ကျင့်ပါ။

    Registration မလုပ်မီ official test date၊ test center၊ ID rule၊ fee နှင့် result release date ကို စစ်ပါ။

    Score ရပြီးနောက် သင်အသုံးပြုချင်သော application အတွက် Level 1 သို့မဟုတ် Level 2 ကို လက်ခံမလား ပြန်စစ်ပါ။
  watchout: >-
    TOPIK I ဖြင့် Level 3 အထက် မရနိုင်ပါ

    TOPIK I တွင် Writing မပါသောကြောင့် TOPIK II ပြင်ဆင်မှုကို အပြည့်အဝ မအစားထိုးနိုင်ပါ

    ကိုရီးယားဘာသာဖြင့် သင်ကြားသော Major၊ competitive scholarship သို့မဟုတ် ဘွဲ့ရရန်လိုအပ်ချက်များတွင် TOPIK II ကို မျှော်လင့်နိုင်ပါသည်

    Official notice တွင် မရေးထားပါက Level 2 လုံလောက်သည်ဟု မယူဆပါနှင့်

    Seat များ မြန်မြန်ပြည့်နိုင်သောကြောင့် registration ကို အလွန်နောက်ကျမလုပ်သင့်ပါ

    Paid shortcut၊ မေးခွန်းပေါက်ကြားသည်ဟု ပြောခြင်း၊ ကိုယ်စားဝင်ဖြေခြင်း သို့မဟုတ် score အာမခံပေးမည်ဟု ပြောသော offer များကို လုံးဝရှောင်ပါ
  notes: >-
    NIIED official TOPIK page: TOPIK I section၊ time၊ total score နှင့် level range စစ်ရန်

    Official TOPIK site သို့မဟုတ် local test center: registration method၊ test date၊ seat၊ fee၊ ID rule နှင့် result release စစ်ရန်

    School သို့မဟုတ် Scholarship notice: Level 1 သို့မဟုတ် Level 2 လက်ခံမလား၊ result date က application period နှင့် ကိုက်မကိုက် စစ်ရန်
