title: How to Choose Korean University
category: study
order: 7
lastReviewed: 2026-07-30
en:
  title: How to choose a Korean university
  summary: >-
    Choosing a Korean university is not only about school name. Myanmar students
    should compare major fit, language track, tuition, scholarship, location,
    housing, admission documents, graduation rules, and future plans before
    applying.
  eligibility: >-
    You want to study in Korea but do not know which university to choose

    You are comparing several schools, majors, scholarships, or cities

    You are not sure whether to choose a Korean-taught program or English-taught program

    You want to avoid choosing only because of school name, social media posts, or agent advertisements

    You need a simple checklist before preparing documents or paying application fees
  subtypes: >-
    Major fit comes first. A famous school is not useful if the major, curriculum, or graduation rule does not match your goal.

    Language track matters. Korean-taught programs may need TOPIK, while English-taught programs may need English scores or still recommend Korean ability for daily life.

    Total cost matters more than tuition alone. Compare tuition, admission fee, dormitory, housing deposit, food, transport, insurance, and first-month setup cost.

    Scholarship rules can be different by school, major, semester, GPA, language score, and available budget. Do not assume the same scholarship continues every semester.

    Location changes your daily life. Seoul, nearby cities, and regional areas can have different rent, part-time options, transport, and living style.

    Future plan matters. If you want work, graduate school, long-term stay, or return to Myanmar, check how the major and school support that path.
  documents: >-
    University admission guideline for the exact semester you want to apply

    Major curriculum, language of instruction, graduation rule, and TOPIK or English requirement

    Tuition, admission fee, scholarship rule, dormitory fee, and refund policy

    Required documents such as passport, transcript, graduation certificate, family or nationality documents, bank statement, study plan, and recommendation letter

    Application deadline, document submission method, interview date, result date, and tuition payment deadline

    D-2 student visa information from the school, Korean embassy, visa center, or HiKorea

    Real living-cost information for the city or area where the university is located
  steps: >-
    First decide your study goal: bachelor, master, PhD, exchange, language course, scholarship, career change, or long-term Korea plan.

    Choose the major before choosing the school name. Read the curriculum and check whether the classes match what you want to study.

    Check the language track. If the program is Korean-taught, confirm TOPIK or Korean requirement. If it is English-taught, confirm accepted English proof and whether Korean is still needed later.

    Calculate the full budget for at least the first semester, including tuition, dormitory or rent, deposit, food, transport, insurance, phone, and emergency money.

    Read the scholarship rule carefully. Check whether it applies only to the first semester, whether GPA is needed to keep it, and whether language score can improve your chance.

    Compare location and daily life. Check housing, transport, part-time possibility, Myanmar community, and whether you can realistically live there.

    Make a shortlist of three to five schools and compare them side by side before paying application fees.

    Before submitting documents, confirm the latest requirements with the university international office or official admission notice.
  watchout: >-
    Do not choose a university only because the name sounds famous

    Do not choose only because someone on social media said it is easy to enter

    Do not trust scholarship promises unless they are written in the official school notice

    Do not ignore graduation rules, GPA rules, language requirements, or major-change limits

    Do not apply without checking whether your documents can be prepared before the deadline

    Avoid fake admission, fake bank statement, fake documents, guaranteed visa, or any shortcut that can create immigration problems
  notes: >-
    Study in Korea official site: useful starting point for Korean university and scholarship information

    University official admission page: final source for deadline, documents, tuition, scholarship, major, and language requirement

    University international office: confirm unclear admission, dormitory, payment, and document questions

    Korean embassy, visa center, HiKorea, or 1345: confirm D-2 visa and residence questions before acting
ko:
  title: 한국 대학 선택 방법
  summary: >-
    한국 대학 선택은 학교 이름만 보고 결정할 일이 아닙니다. 미얀마 학생은 지원 전
    전공 적합성, 수업 언어, 등록금, 장학금, 지역, 숙소, 입학 서류, 졸업 요건과
    향후 계획을 함께 비교해야 합니다.
  eligibility: >-
    한국에서 공부하고 싶지만 어떤 대학을 선택해야 할지 모를 때

    여러 학교, 전공, 장학금 또는 지역을 비교하고 있을 때

    한국어 과정과 영어 과정 중 무엇을 선택해야 할지 헷갈릴 때

    학교 이름, SNS 글 또는 유학원 광고만 보고 선택하는 실수를 피하고 싶을 때

    서류 준비나 전형료 납부 전에 간단한 체크리스트가 필요할 때
  subtypes: >-
    전공 적합성이 먼저입니다. 유명한 학교라도 전공, 커리큘럼 또는 졸업 요건이 본인 목표와 맞지 않으면 좋은 선택이 아닐 수 있습니다.

    수업 언어가 중요합니다. 한국어 과정은 TOPIK이 필요할 수 있고, 영어 과정은 영어 성적이 필요하거나 일상생활을 위해 한국어가 여전히 도움이 될 수 있습니다.

    등록금만 보지 말고 전체 비용을 봐야 합니다. 등록금, 전형료, 기숙사, 보증금, 식비, 교통비, 보험료와 초기 정착비를 함께 비교합니다.

    장학금 규정은 학교, 전공, 학기, GPA, 어학 성적과 예산에 따라 다를 수 있습니다. 같은 장학금이 매 학기 계속된다고 단정하면 안 됩니다.

    지역은 일상생활을 바꿉니다. 서울, 수도권, 지방은 월세, 아르바이트 기회, 교통과 생활 방식이 다를 수 있습니다.

    향후 계획도 중요합니다. 취업, 대학원, 장기 체류 또는 미얀마 귀국을 생각한다면 전공과 학교가 그 길에 도움이 되는지 확인합니다.
  documents: >-
    지원하려는 정확한 학기의 대학 입학 모집요강

    전공 커리큘럼, 수업 언어, 졸업 요건, TOPIK 또는 영어 요건

    등록금, 전형료, 장학금 규정, 기숙사비와 환불 규정

    여권, 성적증명서, 졸업증명서, 가족 또는 국적 관련 서류, 은행잔고증명, 학업계획서, 추천서 등 요구 서류

    지원 마감일, 서류 제출 방법, 면접일, 합격 발표일과 등록금 납부 마감일

    학교, 한국 대사관, 비자센터 또는 하이코리아의 D-2 유학비자 정보

    대학이 있는 도시 또는 지역의 실제 생활비 정보
  steps: >-
    먼저 학업 목표를 정합니다: 학사, 석사, 박사, 교환학생, 어학연수, 장학금, 진로 전환 또는 장기 한국 계획.

    학교 이름보다 전공을 먼저 선택합니다. 커리큘럼을 읽고 배우고 싶은 내용과 맞는지 확인합니다.

    수업 언어를 확인합니다. 한국어 과정이면 TOPIK 또는 한국어 요건을 확인하고, 영어 과정이면 인정되는 영어 증빙과 나중에 한국어가 필요한지 확인합니다.

    첫 학기 전체 예산을 계산합니다. 등록금, 기숙사 또는 월세, 보증금, 식비, 교통비, 보험, 휴대폰과 비상금을 포함합니다.

    장학금 규정을 자세히 읽습니다. 첫 학기만 적용되는지, 유지하려면 GPA가 필요한지, 어학 성적이 유리한지 확인합니다.

    지역과 일상생활을 비교합니다. 주거, 교통, 아르바이트 가능성, 미얀마 커뮤니티와 실제 생활 가능성을 봅니다.

    세 곳에서 다섯 곳 정도의 후보 학교를 만들고 전형료를 내기 전에 나란히 비교합니다.

    서류 제출 전 최신 요건을 대학 국제처 또는 공식 입학 공지에서 확인합니다.
  watchout: >-
    학교 이름이 유명하다는 이유만으로 선택하면 안 됨

    SNS에서 입학이 쉽다고 들었다는 이유만으로 선택하면 안 됨

    공식 학교 공지에 적혀 있지 않은 장학금 약속을 믿으면 안 됨

    졸업 요건, GPA 규정, 어학 요건 또는 전과 제한을 무시하면 안 됨

    마감일 전에 서류 준비가 가능한지 확인하지 않고 지원하면 안 됨

    허위 입학, 허위 은행잔고증명, 허위 서류, 비자 보장 또는 출입국 문제를 만들 수 있는 shortcut은 피해야 함
  notes: >-
    Study in Korea 공식 사이트: 한국 대학과 장학금 정보를 찾는 시작점

    대학 공식 입학 페이지: 마감일, 서류, 등록금, 장학금, 전공과 어학 요건의 최종 기준

    대학 국제처: 불명확한 입학, 기숙사, 납부와 서류 질문 확인

    한국 대사관, 비자센터, 하이코리아 또는 1345: D-2 비자와 체류 관련 질문 확인
my:
  title: ကိုရီးယားတက္ကသိုလ် ဘယ်လိုရွေးမလဲ
  summary: >-
    ကိုရီးယားတက္ကသိုလ်ရွေးတာက ကျောင်းနာမည်ကြီးတာတစ်ခုတည်းနဲ့ မဆုံးဖြတ်သင့်ပါ။
    မြန်မာကျောင်းသားများအနေနဲ့ Major ကိုက်မကိုက်၊ သင်ကြားမည့်ဘာသာစကား၊ ကျောင်းလခ၊
    Scholarship၊ နေရာဒေသ၊ နေထိုင်စရိတ်၊ လျှောက်ထားရန်စာရွက်စာတမ်း၊ ဘွဲ့ရရန်စည်းကမ်း
    နှင့် နောင်အစီအစဉ်ကို အတူတူနှိုင်းယှဉ်ပြီးမှ ရွေးသင့်ပါသည်။
  eligibility: >-
    ကိုရီးယားမှာ ပညာသင်ချင်ပေမယ့် ဘယ်တက္ကသိုလ်ရွေးရမလဲ မသေချာသောအခါ

    ကျောင်း၊ Major၊ Scholarship သို့မဟုတ် မြို့နယ်ဒေသများကို နှိုင်းယှဉ်နေသောအခါ

    ကိုရီးယားဘာသာဖြင့်သင်မလား၊ အင်္ဂလိပ်ဘာသာဖြင့်သင်မလား မသေချာသောအခါ

    ကျောင်းနာမည်၊ social media post သို့မဟုတ် agent advertisement တစ်ခုတည်းကြောင့် မှားရွေးမိခြင်းကို ရှောင်ချင်သောအခါ

    စာရွက်စာတမ်းပြင်ဆင်ခြင်း သို့မဟုတ် application fee ပေးခြင်းမတိုင်မီ checklist တစ်ခုလိုသောအခါ
  subtypes: >-
    Major ကိုက်မကိုက်ကို အရင်စစ်ပါ။ ကျောင်းနာမည်ကြီးပေမယ့် ကိုယ်လေ့လာချင်တဲ့ Major၊ curriculum သို့မဟုတ် ဘွဲ့ရရန်စည်းကမ်း မကိုက်ရင် ကောင်းတဲ့ရွေးချယ်မှု မဖြစ်နိုင်ပါ။

    သင်ကြားမည့်ဘာသာစကားက အရေးကြီးပါသည်။ ကိုရီးယားဘာသာဖြင့်သင်သော program တွင် TOPIK လိုနိုင်ပြီး၊ အင်္ဂလိပ်ဘာသာဖြင့်သင်သော program တွင် English score လိုနိုင်ပါသည်။ English-track ဖြစ်သော်လည်း ကိုရီးယားနေ့စဉ်ဘဝအတွက် ကိုရီးယားစာက အထောက်အကူဖြစ်နိုင်ပါသည်။

    ကျောင်းလခတစ်ခုတည်းမကြည့်ဘဲ စုစုပေါင်းကုန်ကျစရိတ်ကို ကြည့်ပါ။ ကျောင်းလခ၊ application fee၊ dormitory၊ အိမ် deposit၊ စားစရိတ်၊ သွားလာစရိတ်၊ insurance နှင့် စစချင်းအခြေချစရိတ်ကိုပါ နှိုင်းယှဉ်ပါ။

    Scholarship စည်းကမ်းသည် ကျောင်း၊ Major၊ semester၊ GPA၊ ဘာသာစကား score နှင့် budget အလိုက် ကွာနိုင်ပါသည်။ Scholarship တစ်ခုရတာနဲ့ semester တိုင်း ဆက်ရမယ်ဟု မယူဆပါနှင့်။

    နေရာဒေသက နေ့စဉ်ဘဝကို ပြောင်းလဲစေပါသည်။ Seoul၊ Seoul အနီးမြို့များနှင့် နယ်မြို့များတွင် အိမ်လခ၊ part-time အခွင့်အလမ်း၊ transportation နှင့် နေထိုင်မှုပုံစံ ကွာနိုင်ပါသည်။

    နောင်အစီအစဉ်ကိုပါ စဉ်းစားပါ။ အလုပ်ရှာမလား၊ graduate school ဆက်မလား၊ ကိုရီးယားမှာ ကြာကြာနေမလား၊ မြန်မာပြန်မလားဆိုတာအလိုက် Major နှင့် ကျောင်းက အထောက်အကူဖြစ်မဖြစ် စစ်ပါ။
  documents: >-
    ကိုယ်လျှောက်မည့် semester အတွက် တက္ကသိုလ် official admission guideline

    Major curriculum၊ သင်ကြားမည့်ဘာသာစကား၊ ဘွဲ့ရရန်စည်းကမ်း၊ TOPIK သို့မဟုတ် English requirement

    ကျောင်းလခ၊ application fee၊ Scholarship rule၊ dormitory fee နှင့် refund policy

    Passport၊ transcript၊ graduation certificate၊ family သို့မဟုတ် nationality documents၊ bank statement၊ study plan နှင့် recommendation letter စသည့် လိုအပ်သောစာရွက်စာတမ်းများ

    Application deadline၊ document submission method၊ interview date၊ result date နှင့် tuition payment deadline

    ကျောင်း၊ ကိုရီးယားသံရုံး၊ visa center သို့မဟုတ် HiKorea မှ D-2 student visa information

    တက္ကသိုလ်ရှိသော မြို့ သို့မဟုတ် နေရာဒေသ၏ နေထိုင်စရိတ်အချက်အလက်
  steps: >-
    အရင်ဆုံး ကိုယ့်ပညာသင်ရည်မှန်းချက်ကို သတ်မှတ်ပါ: bachelor၊ master၊ PhD၊ exchange၊ language course၊ scholarship၊ career change သို့မဟုတ် ကိုရီးယားမှာ နောင်ကြာကြာနေချင်သလား။

    ကျောင်းနာမည်မတိုင်မီ Major ကို အရင်ရွေးပါ။ Curriculum ကို ဖတ်ပြီး ကိုယ်လေ့လာချင်သောအရာနှင့် ကိုက်မကိုက် စစ်ပါ။

    သင်ကြားမည့်ဘာသာစကားကို စစ်ပါ။ Korean-taught program ဖြစ်ပါက TOPIK သို့မဟုတ် ကိုရီးယားစာ requirement ကို စစ်ပါ။ English-taught program ဖြစ်ပါက လက်ခံသော English proof နှင့် နောက်ပိုင်း ကိုရီးယားစာလိုနိုင်မလို စစ်ပါ။

    ပထမ semester အတွက် စုစုပေါင်း budget ကို တွက်ပါ။ ကျောင်းလခ၊ dormitory သို့မဟုတ် အိမ်လခ၊ deposit၊ စားစရိတ်၊ transportation၊ insurance၊ phone နှင့် emergency money ကို ထည့်တွက်ပါ။

    Scholarship rule ကို သေချာဖတ်ပါ။ ပထမ semester အတွက်ပဲလား၊ ဆက်ရရန် GPA လိုလား၊ language score က အခွင့်အလမ်းတိုးစေလား စစ်ပါ။

    နေရာဒေသနှင့် နေ့စဉ်ဘဝကို နှိုင်းယှဉ်ပါ။ Housing၊ transportation၊ part-time အခွင့်အလမ်း၊ Myanmar community နှင့် ကိုယ်တကယ်နေနိုင်မနိုင်ကို စစ်ပါ။

    ကျောင်း ၃ ခုမှ ၅ ခုအထိ shortlist လုပ်ပြီး application fee မပေးခင် တစ်ခုချင်း နှိုင်းယှဉ်ပါ။

    စာရွက်စာတမ်းမတင်မီ နောက်ဆုံးလိုအပ်ချက်များကို university international office သို့မဟုတ် official admission notice မှာ ပြန်အတည်ပြုပါ။
  watchout: >-
    ကျောင်းနာမည်ကြီးတာတစ်ခုတည်းကြောင့် မရွေးပါနှင့်

    Social media မှာ ဝင်ရလွယ်တယ်ဟု ကြားတာတစ်ခုတည်းကြောင့် မရွေးပါနှင့်

    Official school notice ထဲမှာ မရေးထားသော Scholarship ကတိများကို မယုံပါနှင့်

    Graduation rule၊ GPA rule၊ language requirement သို့မဟုတ် major change limit ကို မလျစ်လျူရှုပါနှင့်

    Deadline မတိုင်မီ စာရွက်စာတမ်းပြင်နိုင်မနိုင် မစစ်ဘဲ မလျှောက်ပါနှင့်

    Fake admission၊ fake bank statement၊ fake documents၊ guaranteed visa သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးပြဿနာဖြစ်နိုင်သော shortcut များကို ရှောင်ပါ
  notes: >-
    Study in Korea official site: ကိုရီးယားတက္ကသိုလ်နှင့် Scholarship အချက်အလက်ရှာရန် စတင်စစ်နိုင်သောနေရာ

    University official admission page: deadline၊ documents၊ tuition၊ scholarship၊ major နှင့် language requirement အတွက် အဓိကအတည်ပြုရမည့်နေရာ

    University international office: မရှင်းလင်းသော admission၊ dormitory၊ payment နှင့် document question များကို စစ်ရန်

    ကိုရီးယားသံရုံး၊ visa center၊ HiKorea သို့မဟုတ် 1345: D-2 visa နှင့် နေထိုင်ခွင့်ဆိုင်ရာ မေးခွန်းများကို လုပ်ဆောင်မီ စစ်ရန်
