title: F-2-7 Points-Based Resident Visa
category: visa
order: 9
lastReviewed: 2026-07-31
en:
  title: F-2-7 Points-Based Resident Visa
  summary: |-
    F-2-7 is one route inside the F-2 residence category. It is for eligible talent groups who can prove the current applicant type, score, income, Korean ability, lawful activity, conduct, and other required documents. Check the applicant group first, then calculate points.
  eligibility: |-
    F-2-7 is not open to every long-term resident. You must first fit a current applicant group and then meet the current points and review requirements.
    Possible applicant groups may include listed-company employees, promising-industry employees, professional employees, student talent, and potential talent, depending on the current Ministry of Justice rules.
    In every route, the current score, good conduct, lawful employment or activity, income, Korean-language or social-integration evidence, and public-health or other review requirements may also apply.
  subtypes: |-
    Listed-company employee — a person employed by a company listed on KOSPI or KOSDAQ, if the current route conditions are met
    Promising-industry employee — a person working in a designated promising industry, such as IT, technology management, bio, new materials, environment, energy, or another currently recognized field
    Professional employee — a person who has stayed in an eligible professional status for the required period; some statuses and activities may be excluded
    Student talent — a person with an eligible Korean master's degree or higher, or another recognized study-talent route
    Potential talent or F-2-7S — a special science-and-technology talent route for eligible graduates or expected graduates of designated institutions
  documents: |-
    Common: integrated application form, passport, photo, residence card, fee, and proof of address
    A points calculation sheet using the current table, with official evidence for every claimed point
    Employment certificate, employment contract, income records, tax records, and documents proving your applicant group
    Degree, graduation, career, license, company-listing, promising-industry, recommendation, or science-and-technology institution evidence when applicable
    TOPIK, KIIP, or other accepted Korean-language and social-integration evidence
    Documents for bonus points, deductions, conduct, criminal record, health, or other items if requested for your case
  steps: |-
    Confirm that you are checking F-2-7, not another F-2 route such as family, investment, F-2-99, or regional talent.
    Identify which F-2-7 applicant group you fit. Do not calculate points before confirming this first gate.
    Confirm the current points table and applicant-group rules through HiKorea, 1345, or the immigration office.
    Calculate your score conservatively and attach official evidence for every education, income, Korean-language, age, work-history, bonus, and deduction item.
    While legally staying in Korea, reserve a visit if required and apply for a change of status through the available immigration or HiKorea procedure.
    After approval, keep employment, income, address, passport, and registration information current for future extensions.
  watchout: |-
    The applicant group and the points test are separate. A high score does not help if you do not fit a current applicant group.
    Time spent on D-2 or D-10 may not count for some professional-employee requirements. Check the current route carefully.
    The score table, income thresholds, eligible industries, applicant groups, and required stay period can change.
    A change of employer, occupation, income, or address may affect an extension or reporting duty.
    Do not rely on old online calculators or screenshots. Immigration reviews the current official table and your documents.
  notes: |-
    Points commonly review age, education, Korean ability, income, work history, contribution or integration factors, with bonus and deduction items.
    A points-based F-2 holder may be able to invite some family members only if the current family and income rules are met.
    F-2-7 may later connect to permanent residence review for some people, but F-5 has separate requirements.
    This is a summary. Confirm your applicant group, current score table, and evidence list with HiKorea, 1345, or the immigration office before applying.
ko:
  title: F-2-7 점수제 거주 비자
  summary: |-
    F-2-7은 F-2 거주 체류자격 안에 있는 한 가지 경로입니다. 현재 신청 대상 유형, 점수, 소득, 한국어 능력, 적법한 활동, 품행과 필요한 서류를 입증해야 하는 우수인재 대상 경로입니다. 먼저 신청 대상 유형을 확인한 뒤 점수를 계산하세요.
  eligibility: |-
    F-2-7은 모든 장기체류자가 신청할 수 있는 자격이 아닙니다. 먼저 현재 지침의 신청 대상 유형 중 하나에 해당하고, 점수와 추가 심사요건을 충족해야 합니다.
    신청 대상 유형은 현재 법무부 기준에 따라 상장법인 종사자, 유망산업 종사자, 전문직 종사자, 유학인재, 잠재적 우수인재 등이 될 수 있습니다.
    모든 경로에서 최신 점수, 품행단정, 적법한 취업 또는 활동, 소득, 한국어 또는 사회통합 입증, 공중보건 등 추가 심사요건이 함께 적용될 수 있습니다.
  subtypes: |-
    상장법인 종사자 — 현재 요건을 충족하는 KOSPI 또는 KOSDAQ 상장법인 근무자
    유망산업 종사자 — IT, 기술경영, 바이오, 신소재, 환경, 에너지 등 현재 인정되는 유망산업 분야 종사자
    전문직 종사자 — 허용되는 전문 체류자격으로 필요한 기간 체류한 사람. 일부 체류자격이나 활동은 제외될 수 있습니다.
    유학인재 — 국내 석사 이상 학위 소지자 또는 별도로 인정되는 유학 우수인재 경로에 해당하는 사람
    잠재적 우수인재 또는 F-2-7S — 지정 기관의 졸업자 또는 졸업예정자를 위한 과학기술 인재 특례 경로
  documents: |-
    공통: 통합신청서, 여권, 사진, 외국인등록증, 수수료, 체류지 입증서류
    최신 배점표로 계산한 점수표와 각 점수 항목의 공식 증빙자료
    재직증명서, 고용계약서, 소득자료, 납세자료, 신청 대상 유형을 입증하는 서류
    학위, 졸업, 경력, 자격, 상장법인, 유망산업, 추천, 과학기술기관 관련 증빙자료
    TOPIK, 사회통합프로그램 등 인정되는 한국어와 사회통합 입증자료
    가점, 감점, 품행, 범죄경력, 건강 또는 본인 사례에서 요청되는 기타 자료
  steps: |-
    가족, 투자, F-2-99, 지역 인재 등 다른 F-2가 아니라 F-2-7을 확인하는 것인지 먼저 정합니다.
    본인이 어떤 F-2-7 신청 대상 유형에 해당하는지 확인합니다. 이 첫 조건을 확인하기 전에 점수부터 계산하지 마세요.
    하이코리아, 1345 또는 관할 출입국·외국인관서에서 현재 배점표와 신청 대상 유형별 기준을 확인합니다.
    점수를 보수적으로 계산하고 학력, 소득, 한국어, 나이, 근무경력, 가점과 감점 항목마다 공식 증빙을 준비합니다.
    국내에 적법하게 체류 중인 상태에서 필요한 경우 방문예약을 하고 가능한 출입국 또는 하이코리아 절차로 자격변경을 신청합니다.
    허가 후 고용, 소득, 체류지, 여권과 등록정보를 최신 상태로 유지합니다.
  watchout: |-
    신청 대상 유형과 점수 기준은 별개입니다. 점수가 높아도 현재 신청 대상 유형에 해당하지 않으면 진행하기 어렵습니다.
    D-2 또는 D-10 체류기간은 일부 전문직 종사자 요건에서 인정되지 않을 수 있습니다. 현재 경로를 반드시 확인하세요.
    배점표, 소득기준, 대상 산업, 신청 대상 유형, 요구 체류기간은 바뀔 수 있습니다.
    고용기관, 직종, 소득, 체류지가 바뀌면 연장이나 신고의무에 영향을 줄 수 있습니다.
    오래된 온라인 계산기나 화면 캡처만 믿지 마세요. 출입국은 현재 공식 배점표와 제출서류를 봅니다.
  notes: |-
    점수는 일반적으로 나이, 학력, 한국어 능력, 소득, 근무경력, 사회통합·기여 요소와 가점·감점 항목을 봅니다.
    점수제 F-2 체류자는 현재 가족과 소득 요건을 충족하는 경우에만 일부 가족 초청을 검토할 수 있습니다.
    F-2-7은 일부 사람에게 나중에 영주 심사와 연결될 수 있지만 F-5에는 별도 요건이 있습니다.
    본 정보는 요약입니다. 신청 전 하이코리아, 1345 또는 관할 출입국·외국인관서에서 신청 대상 유형, 최신 배점표와 증빙 목록을 확인하세요.
my:
  title: F-2-7 အမှတ်စနစ် နေထိုင်ခွင့်ဗီဇာ
  summary: |-
    F-2-7 သည် F-2 နေထိုင်ခွင့်အတွင်းရှိ လမ်းကြောင်းတစ်ခုဖြစ်သည်။ လက်ရှိလျှောက်ထားသူအုပ်စု၊ အမှတ်၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ၊ တရားဝင်လုပ်ဆောင်မှု၊ အကျင့်စာရိတ္တနှင့် လိုအပ်စာရွက်များကို သက်သေပြရသော အရည်အချင်းရှိသူများအတွက် လမ်းကြောင်းဖြစ်သည်။ ပထမဦးစွာ လျှောက်ထားသူအုပ်စုကို စစ်ပြီးမှ အမှတ်တွက်ပါ။
  eligibility: |-
    F-2-7 ကို ရေရှည်နေထိုင်သူတိုင်း လျှောက်နိုင်ခြင်းမဟုတ်ပါ။ လက်ရှိသတ်မှတ်ထားသော လျှောက်ထားသူအုပ်စုတစ်ခုနှင့် ကိုက်ညီပြီး အမှတ်နှင့် အပိုစံနှုန်းများ ပြည့်မီရမည်။
    လျှောက်ထားသူအုပ်စုတွင် လက်ရှိ တရားရေးဝန်ကြီးဌာနစံနှုန်းအလိုက် စာရင်းဝင်ကုမ္ပဏီဝန်ထမ်း၊ အလားအလာရှိလုပ်ငန်းဝန်ထမ်း၊ ပညာရှင်ဝန်ထမ်း၊ ပညာသင်ထူးချွန်သူ၊ အလားအလာရှိထူးချွန်သူ စသည်တို့ ပါနိုင်သည်။
    လမ်းကြောင်းတိုင်းတွင် လတ်တလောအမှတ်၊ အကျင့်စာရိတ္တ၊ တရားဝင်အလုပ် သို့မဟုတ် လုပ်ဆောင်မှု၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ သို့မဟုတ် လူမှုရေးပေါင်းစည်းမှုအထောက်အထား၊ ကျန်းမာရေးဆိုင်ရာ စစ်ဆေးချက်များလည်း သက်ရောက်နိုင်သည်။
  subtypes: |-
    စာရင်းဝင်ကုမ္ပဏီဝန်ထမ်း — လက်ရှိစံနှုန်းပြည့်သော KOSPI သို့မဟုတ် KOSDAQ စာရင်းဝင်ကုမ္ပဏီတွင် အလုပ်လုပ်သူ
    အလားအလာရှိလုပ်ငန်းဝန်ထမ်း — IT၊ နည်းပညာစီမံခန့်ခွဲမှု၊ ဇီဝ၊ ပစ္စည်းအသစ်၊ ပတ်ဝန်းကျင်၊ စွမ်းအင် စသည့် လက်ရှိအသိအမှတ်ပြုလုပ်ငန်းနယ်ပယ်တွင် အလုပ်လုပ်သူ
    ပညာရှင်ဝန်ထမ်း — ခွင့်ပြုထားသော ပညာရှင်နေထိုင်ခွင့်ဖြင့် လိုအပ်သောကာလနေထိုင်သူ။ အချို့နေထိုင်ခွင့်နှင့် လုပ်ဆောင်မှုများ မပါဝင်နိုင်ပါ။
    ပညာသင်ထူးချွန်သူ — ကိုရီးယား မဟာဘွဲ့အထက် သို့မဟုတ် သီးခြားအသိအမှတ်ပြုထားသော ပညာသင်လမ်းကြောင်းနှင့် ကိုက်ညီသူ
    အလားအလာရှိထူးချွန်သူ သို့မဟုတ် F-2-7S — သတ်မှတ်ထားသော ဌာနမှ ဘွဲ့ရသူ သို့မဟုတ် ဘွဲ့ရမည့်သူများအတွက် သိပ္ပံနည်းပညာအထူးလမ်းကြောင်း
  documents: |-
    အများသုံး: ပေါင်းစပ်လျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ နေရပ်အထောက်အထား
    လတ်တလောအမှတ်ဇယားဖြင့် တွက်ထားသော အမှတ်စာရွက်နှင့် အမှတ်တိုင်း၏ တရားဝင်အထောက်အထား
    အလုပ်လက်မှတ်၊ အလုပ်စာချုပ်၊ ဝင်ငွေစာရွက်၊ အခွန်စာရွက်နှင့် လျှောက်ထားသူအုပ်စုကို သက်သေပြသောစာရွက်
    ဘွဲ့၊ ဘွဲ့ရစာရွက်၊ အလုပ်အတွေ့အကြုံ၊ လိုင်စင်၊ စာရင်းဝင်ကုမ္ပဏီ၊ အလားအလာရှိလုပ်ငန်း၊ အကြံပြုစာ၊ သိပ္ပံနည်းပညာဌာနဆိုင်ရာ အထောက်အထား
    TOPIK၊ KIIP သို့မဟုတ် လက်ခံသော ကိုရီးယားဘာသာနှင့် လူမှုရေးပေါင်းစည်းမှုအထောက်အထား
    အပိုအမှတ်၊ လျှော့အမှတ်၊ အကျင့်စာရိတ္တ၊ ရာဇဝတ်မှတ်တမ်း၊ ကျန်းမာရေး သို့မဟုတ် မိမိကိစ္စအတွက် တောင်းသော အခြားစာရွက်များ
  steps: |-
    မိသားစု၊ ရင်းနှီးမြှုပ်နှံမှု၊ F-2-99၊ ဒေသအခြေပြုလမ်းကြောင်းမဟုတ်ဘဲ F-2-7 ကို စစ်နေခြင်းဟုတ်မဟုတ် အရင်ခွဲပါ။
    မိမိသည် မည်သည့် F-2-7 လျှောက်ထားသူအုပ်စုနှင့် ကိုက်ညီသည်ကို စစ်ပါ။ ဤအချက်မစစ်မီ အမှတ်မတွက်ပါနှင့်။
    HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးမှ လတ်တလောအမှတ်ဇယားနှင့် လျှောက်ထားသူအုပ်စုစံနှုန်းကို အတည်ပြုပါ။
    အမှတ်ကို သတိထားတွက်ပြီး ပညာရေး၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ၊ အသက်၊ အလုပ်အတွေ့အကြုံ၊ အပိုအမှတ်နှင့် လျှော့အမှတ်တိုင်းအတွက် တရားဝင်အထောက်အထား ပြင်ဆင်ပါ။
    ကိုရီးယားတွင် တရားဝင်နေထိုင်နေစဉ် လိုအပ်ပါက ချိန်းဆိုပြီး လူဝင်မှုရုံး သို့မဟုတ် HiKorea လုပ်ငန်းစဉ်မှ နေထိုင်ခွင့်ပြောင်းရန် လျှောက်ပါ။
    ခွင့်ပြုပြီးနောက် အလုပ်၊ ဝင်ငွေ၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ်နှင့် မှတ်ပုံတင်အချက်အလက်ကို နောက်ဆုံးအခြေအနေအတိုင်း ထိန်းသိမ်းပါ။
  watchout: |-
    လျှောက်ထားသူအုပ်စုနှင့် အမှတ်စနစ်သည် သီးခြားဖြစ်သည်။ အမှတ်မြင့်သော်လည်း လက်ရှိလျှောက်ထားသူအုပ်စုနှင့် မကိုက်ပါက ခက်ခဲနိုင်သည်။
    D-2 သို့မဟုတ် D-10 နေထိုင်ကာလသည် ပညာရှင်ဝန်ထမ်းစံနှုန်းအချို့တွင် မတွက်နိုင်ပါ။ လက်ရှိလမ်းကြောင်းကို သေချာစစ်ပါ။
    အမှတ်ဇယား၊ ဝင်ငွေစံနှုန်း၊ သတ်မှတ်လုပ်ငန်း၊ လျှောက်ထားသူအုပ်စုနှင့် လိုအပ်နေထိုင်ကာလ ပြောင်းနိုင်သည်။
    အလုပ်ရှင်၊ အလုပ်အမျိုးအစား၊ ဝင်ငွေ သို့မဟုတ် နေရပ်ပြောင်းလဲမှုသည် သက်တမ်းတိုးခြင်း သို့မဟုတ် တင်ပြရမည့်တာဝန်ကို သက်ရောက်နိုင်သည်။
    အဟောင်း online calculator သို့မဟုတ် screenshot တစ်ခုတည်းကို မယုံပါနှင့်။ လူဝင်မှုရုံးသည် လတ်တလောတရားဝင်အမှတ်ဇယားနှင့် စာရွက်စာတမ်းများကို စစ်သည်။
  notes: |-
    အမှတ်တွင် ယေဘုယျအားဖြင့် အသက်၊ ပညာရေး၊ ကိုရီးယားဘာသာ၊ ဝင်ငွေ၊ အလုပ်အတွေ့အကြုံ၊ လူမှုရေးပေါင်းစည်းမှု/အကျိုးပြုမှု၊ အပိုအမှတ်နှင့် လျှော့အမှတ်တို့ကို စစ်သည်။
    အမှတ်စနစ် F-2 ကိုင်ဆောင်သူသည် လက်ရှိမိသားစုနှင့် ဝင်ငွေစံနှုန်းပြည့်မှသာ မိသားစုအချို့အတွက် နေထိုင်ခွင့်ကို စဉ်းစားနိုင်သည်။
    F-2-7 သည် လူအချို့အတွက် နောက်ပိုင်း အမြဲတမ်းနေထိုင်ခွင့်စစ်ဆေးမှုနှင့် ဆက်နိုင်သော်လည်း F-5 တွင် သီးခြားစံနှုန်းများ ရှိသည်။
    ဤအချက်အလက်သည် အကျဉ်းချုပ်ဖြစ်သည်။ မလျှောက်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လျှောက်ထားသူအုပ်စု၊ လတ်တလောအမှတ်ဇယားနှင့် စာရွက်စာတမ်းစာရင်းကို အတည်ပြုပါ။
