title: D-2-2 Bachelor's Degree Visa
category: visa
order: 15
lastReviewed: 2026-07-31
en:
  title: D-2-2 Bachelor's Degree Visa
  summary: |-
    D-2-2 is the D-2 route for bachelor's degree study at an eligible Korean university. It is usually checked by students entering a 4-year degree program or an accepted undergraduate transfer route.
  eligibility: |-
    You have admission to an eligible bachelor's degree program in Korea.
    Your previous education must support undergraduate entry or transfer.
    The Standard Admission Letter, program level, tuition, and study period must match D-2-2.
    The financial and education documents must satisfy the current embassy, school, or immigration requirements.
  subtypes: ''
  documents: |-
    Visa application or visa issuance documents, passport, photo, fee, and residence card if applying in Korea
    Standard Admission Letter from the university
    School business registration or registration-number certificate copy
    High school graduation proof, previous college transcript, transfer documents, or other final education proof as required
    Financial proof such as bank balance, scholarship certificate, sponsor proof, and family relationship documents if needed
    TB test or additional documents if required by the embassy, school, or immigration office
  steps: |-
    Confirm that the admission is for a bachelor's degree program and D-2-2 is the correct route.
    Get the Standard Admission Letter and school documents.
    Verify education documents if Apostille or consular confirmation is required.
    Prepare financial documents within the required validity period.
    Apply through the Korean embassy/consulate or Certificate of Visa Issuance route if used by the university.
    After arrival, register as a foreign resident within 90 days if staying more than 90 days.
  watchout: |-
    Bachelor's admission and language-program admission are different. D-2-2 is for degree study.
    Transfer students may need additional previous-school records, so confirm before applying.
    Bank balance and sponsor rules vary by embassy, school, and applicant situation.
    After arrival, school change, leave of absence, dropout, graduation, address change, or passport change can create reporting duties.
  notes: |-
    D-2-2 is commonly used for undergraduate bachelor's degree study.
    Extensions are reviewed with enrollment, grades, attendance, tuition, and stay history.
    Confirm current requirements with the Korean embassy, HiKorea, 1345, your university, or immigration office before applying.
ko:
  title: D-2-2 학사 유학 비자
  summary: |-
    D-2-2는 한국 대학의 학사 학위과정을 위한 D-2 경로입니다. 보통 4년제 학위과정 입학 또는 인정되는 편입 경로에서 확인합니다.
  eligibility: |-
    한국의 대상 학사 학위과정에 입학 허가를 받은 경우 확인할 수 있습니다.
    이전 학력이 학사 입학 또는 편입 단계와 맞아야 합니다.
    표준입학허가서, 과정 단계, 등록금, 수학 기간이 D-2-2와 맞아야 합니다.
    학력과 재정 서류는 현재 공관, 학교 또는 출입국 요건을 충족해야 합니다.
  subtypes: ''
  documents: |-
    사증신청 또는 사증발급인정 관련 서류, 여권, 사진, 수수료, 국내 신청 시 외국인등록증
    대학에서 발급한 표준입학허가서
    학교 사업자등록증 또는 고유번호증 사본
    고등학교 졸업증명, 이전 대학 성적표, 편입 관련 서류 또는 요구되는 최종학력 입증서류
    잔고증명서, 장학금 증명서, 보증인 자료와 필요한 경우 가족관계 입증서류
    공관, 학교 또는 출입국에서 요구하는 경우 결핵진단서 또는 추가서류
  steps: |-
    입학이 학사 학위과정인지, D-2-2가 맞는지 확인합니다.
    표준입학허가서와 학교 서류를 받습니다.
    아포스티유 또는 영사확인이 필요하면 학력서류를 확인받습니다.
    요구되는 유효기간 안의 재정서류를 준비합니다.
    대한민국 대사관·영사관 또는 학교가 이용하는 사증발급인정서 경로로 신청합니다.
    입국 후 90일을 초과해 체류하면 90일 이내에 외국인등록을 합니다.
  watchout: |-
    학사 입학과 어학연수 입학은 다릅니다. D-2-2는 학위과정용입니다.
    편입생은 이전 학교 기록이 추가로 필요할 수 있으므로 신청 전에 확인하세요.
    잔고증명과 보증인 기준은 공관, 학교, 신청인 상황에 따라 달라집니다.
    입국 후 학교 변경, 휴학, 자퇴, 졸업, 주소 변경, 여권 변경은 신고의무와 연결될 수 있습니다.
  notes: |-
    D-2-2는 보통 학부 학사과정에 사용됩니다.
    연장은 재학, 성적, 출석, 등록금, 체류이력을 함께 보고 심사됩니다.
    신청 전 재외공관, 하이코리아, 1345, 대학 또는 출입국에서 현재 요건을 확인하세요.
my:
  title: D-2-2 Bachelor Degree ဗီဇာ
  summary: |-
    D-2-2 သည် ကိုရီးယားတက္ကသိုလ်တွင် bachelor degree တက်ရန်အတွက် D-2 လမ်းကြောင်းဖြစ်သည်။ ၄ နှစ်တက္ကသိုလ်ဘွဲ့သင်တန်း သို့မဟုတ် ခွင့်ပြုထားသော transfer လမ်းကြောင်းဝင်မည့်သူများက စစ်ဆေးလေ့ရှိသည်။
  eligibility: |-
    ကိုရီးယားရှိ ကိုက်ညီသော bachelor degree Program မှ ဝင်ခွင့်ရထားသူဖြစ်ရမည်။
    ယခင်ပညာရေးသည် undergraduate ဝင်ခွင့် သို့မဟုတ် transfer အဆင့်နှင့် ကိုက်ညီရမည်။
    Standard Admission Letter၊ Program အဆင့်၊ ကျောင်းလခနှင့် ပညာသင်ကာလသည် D-2-2 နှင့် ကိုက်ရမည်။
    ပညာရေးနှင့် ငွေကြေးစာရွက်များသည် လတ်တလော သံရုံး၊ ကျောင်း သို့မဟုတ် လူဝင်မှုရုံးလိုအပ်ချက်နှင့် ကိုက်ညီရမည်။
  subtypes: ''
  documents: |-
    ဗီဇာလျှောက်လွှာ သို့မဟုတ် ဗီဇာထုတ်ပေးမှုအတည်ပြုစာဆိုင်ရာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်
    တက္ကသိုလ်မှ Standard Admission Letter
    ကျောင်း၏ Business Registration သို့မဟုတ် Registration Number Certificate မိတ္တူ
    အထက်တန်းပြီးကြောင်းစာရွက်၊ ယခင်တက္ကသိုလ်အမှတ်စာရင်း၊ transfer စာရွက် သို့မဟုတ် တောင်းသော နောက်ဆုံးပညာအရည်အချင်းအထောက်အထား
    ဘဏ်လက်ကျန်၊ Scholarship စာ၊ Sponsor စာနှင့် လိုအပ်ပါက မိသားစုဆက်နွယ်မှုစာရွက်
    သံရုံး၊ ကျောင်း သို့မဟုတ် လူဝင်မှုရုံးက တောင်းပါက TB test သို့မဟုတ် အပိုစာရွက်များ
  steps: |-
    ဝင်ခွင့်သည် bachelor degree Program ဖြစ်မဖြစ်နှင့် D-2-2 မှန်မမှန် အတည်ပြုပါ။
    Standard Admission Letter နှင့် ကျောင်းစာရွက်များ ရယူပါ။
    Apostille သို့မဟုတ် သံရုံးအတည်ပြုချက်လိုပါက ပညာရေးစာရွက်များကို အတည်ပြုပါ။
    လိုအပ်သည့်သက်တမ်းကာလအတွင်းရှိ ငွေကြေးစာရွက်များကို ပြင်ပါ။
    ကိုရီးယားသံရုံး/ကောင်စစ်ဝန်ရုံးတွင် လျှောက်ပါ သို့မဟုတ် တက္ကသိုလ်က အသုံးပြုသော Certificate of Visa Issuance လမ်းကြောင်းဖြင့် လျှောက်ပါ။
    ကိုရီးယားတွင် ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ရောက်ပြီး ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
  watchout: |-
    Bachelor ဝင်ခွင့်နှင့် ဘာသာစကားသင်တန်းဝင်ခွင့် မတူပါ။ D-2-2 သည် ဘွဲ့သင်တန်းအတွက် ဖြစ်သည်။
    Transfer ကျောင်းသားများသည် ယခင်ကျောင်းမှတ်တမ်းများ ပိုလိုနိုင်သောကြောင့် မလျှောက်မီ စစ်ပါ။
    ဘဏ်လက်ကျန်နှင့် Sponsor စံနှုန်းများသည် သံရုံး၊ ကျောင်း၊ လျှောက်ထားသူအခြေအနေအလိုက် ကွာနိုင်သည်။
    ရောက်ပြီးနောက် ကျောင်းပြောင်းခြင်း၊ ကျောင်းနားခြင်း၊ ကျောင်းထွက်ခြင်း၊ ဘွဲ့ရခြင်း၊ နေရပ်ပြောင်းခြင်း၊ နိုင်ငံကူးလက်မှတ်ပြောင်းခြင်းတို့သည် တင်ပြရမည့်တာဝန်နှင့် ဆက်နိုင်သည်။
  notes: |-
    D-2-2 သည် အများအားဖြင့် undergraduate bachelor degree သင်တန်းအတွက် အသုံးပြုသည်။
    သက်တမ်းတိုးချိန်တွင် ကျောင်းတက်နေမှု၊ အမှတ်၊ ကျောင်းခေါ်ချိန်၊ ကျောင်းလခနှင့် နေထိုင်သမိုင်းကို စစ်နိုင်သည်။
    မလျှောက်မီ ကိုရီးယားသံရုံး၊ HiKorea၊ 1345၊ တက္ကသိုလ် သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
