title: E-7-M School and Major Planning
category: study
order: 8
lastReviewed: 2026-07-31
en:
  title: E-7-M school, program, and major planning
  summary: |-
    If you want to come from Myanmar and later check the E-7-M route, do not choose a school only by name. Start by confirming the designated college department, manufacturing-related major, Korean-language requirement, job connection, salary condition, and current immigration notice.
  eligibility: |-
    You are still in Myanmar and want to know which Korea study path can connect to E-7-M later.
    You are comparing Korean vocational colleges, departments, technical programs, or manufacturing-related majors.
    You heard about E-7-M or K-CORE and want to avoid choosing the wrong school or major.
    You want to understand what to check before paying an agent, application fee, tuition deposit, or document fee.
  subtypes: |-
    E-7-M is not usually a direct visa from Myanmar. The practical path is: choose a designated Korean college department, study legally, graduate, find a related manufacturing job, then confirm whether E-7-M is possible under the current rule.
    The school name alone is not enough. You need the exact department or program name, because the E-7-M/K-CORE route is connected to selected departments.
    The major should connect to manufacturing or technical work. Automotive, machinery, electric vehicle, electrical engineering, CAD/CAM, special construction machinery, renewable energy, textile/fashion manufacturing, smart agri-food, and future mobility are examples from the announced list.
    Korean ability matters. Public 2026 information mentioned TOPIK Level 3 for entering the designated study path and TOPIK Level 5 or KIIP Stage 4 for the work-stage E-7-M check after graduation. Confirm the latest level before planning.
    Graduation does not equal visa approval. After graduation, the job, employer, salary, documents, immigration history, and current notice still matter.
  documents: |-
    Official school admission notice for the exact year and semester
    Exact department or program name, not only the college name
    Confirmation from the school that the department is currently connected to the E-7-M/K-CORE route
    Curriculum showing the major is manufacturing-related or technical
    Korean-language requirement for admission, study, graduation, and later employment planning
    Tuition, dormitory, living cost, refund rule, scholarship rule, and payment deadline
    School support for internship, employment matching, employer connection, or career counseling
    Official immigration or school notice showing the current E-7-M conditions
  steps: |-
    First write your goal clearly: study in Korea first, then check E-7-M after graduation if you meet the conditions.
    Make a school list only from official school pages, government announcements, or direct school confirmation.
    Check the exact department name and whether it is still included in the E-7-M or K-CORE route.
    Compare the major with real manufacturing jobs. Do not choose a major only because the agent says it is easy.
    Check Korean-language requirements early. If the later work stage needs a high level, plan study time and exam schedule before coming.
    Calculate total cost for the first year, including tuition, dormitory or rent, food, insurance, phone, transport, and emergency money.
    Ask the school how employment matching works after graduation. A school being on a list does not mean every student will get a job.
    Before paying money, confirm the latest rule with the school, HiKorea, 1345, immigration office, or Korean embassy.
  watchout: |-
    Do not trust "E-7-M guaranteed after school" advertisements.
    Do not rely on an old screenshot of the school list. The pilot school, department, quota, and condition can change.
    Do not choose only by city or school name. The department and job connection matter more for this path.
    Do not ignore Korean language. E-7-M planning can fail if the Korean level is not realistic.
    Do not assume every manufacturing job qualifies. The job should match the current E-7-M rule and your major or training.
    Avoid fake admission, fake documents, fake bank statements, illegal work, or any shortcut that can create visa problems.
  notes: |-
    Before checking the school list, confirm the basic school application requirements for the exact department and semester.
    Passport should be valid long enough for school admission, visa preparation, and arrival planning.
    Prepare your highest education certificate, transcript, graduation certificate or expected-graduation proof, and any required translations or notarization.
    Check the Korean-language requirement directly with the school. Some E-7-M/K-CORE-related study paths may mention TOPIK Level 3, but the exact admission rule can differ by school and year.
    Confirm whether the school accepts international students for that exact department, not only whether the school name appears on a list.
    Check tuition, dormitory, refund rule, scholarship rule, application fee, document deadline, and first-year living cost before paying money.
    Ask whether the school only provides admission or also provides internship, job matching, employer connection, or career support after graduation.
    School admission is not E-7-M approval. After graduation, the job, employer, salary, Korean level, documents, and immigration review are still checked separately.
    These schools and departments were shown in 2026 public E-7-M/K-CORE information. Use this as a starting list only, then confirm directly with the school and immigration before applying.
    School list | Gyeonggi University of Science and Technology | Future Electric Vehicles
    School list | Daelim University | Future Automotive Engineering
    School list | Bucheon University | Textile Fashion Business
    School list | Seojeong University | Global Textile Fashion Business
    School list | Osan University | Electrical Engineering
    School list | Yong-in Arts & Science University | Automotive Machinery
    School list | Yeungjin University | Smart CAD/CAM
    School list | Gumi University | Special Construction Machinery Engineering
    School list | Kyungnam College of Information & Technology | Mechanical Engineering
    School list | Dong-Eui Institute of Technology | Mechanical Engineering
    School list | Busan Institute of Science and Technology | Automotive Engineering
    School list | Geoje University | Mechanical Engineering
    School list | Ulsan College | Mechanical Engineering
    School list | Kunjang University | Smart Agri-Food
    School list | Vision College of Jeonju | Future Mobility
    School list | Mokpo Science University | Renewable Energy Electricity
    E-7-M visa detail — after choosing the school and major path, read the E-7-M visa guide to understand the work-stage visa check.
    Final confirmation should come from the school, HiKorea, 1345, the immigration office, or the Korean embassy. Treat this page as a planning checklist, not a promise of admission, job, or visa approval.
ko:
  title: E-7-M을 위한 학교, 학과, 전공 선택
  summary: |-
    미얀마에서 한국으로 온 뒤 E-7-M 경로를 나중에 확인하고 싶다면 학교 이름만 보고 선택하면 안 됩니다. 지정 전문대 학과, 제조업 관련 전공, 한국어 요건, 취업 연결, 임금 조건과 최신 출입국 공고를 함께 확인해야 합니다.
  eligibility: |-
    아직 미얀마에 있고 한국 유학 후 E-7-M으로 이어질 수 있는 경로를 알고 싶을 때
    한국 전문대, 학과, 기술교육과정 또는 제조업 관련 전공을 비교하고 있을 때
    E-7-M 또는 K-CORE 이야기를 들었고 잘못된 학교나 전공 선택을 피하고 싶을 때
    유학원 비용, 전형료, 등록금 예치금 또는 서류 비용을 내기 전에 무엇을 확인해야 하는지 알고 싶을 때
  subtypes: |-
    E-7-M은 보통 미얀마에서 바로 신청해 한국에 가는 비자가 아닙니다. 현실적인 흐름은 지정된 한국 전문대 학과 선택, 합법적인 유학, 졸업, 전공 관련 제조업 취업, 그리고 현행 기준에 따른 E-7-M 확인입니다.
    학교 이름만으로는 부족합니다. E-7-M/K-CORE 경로는 지정 학과와 연결되므로 정확한 학과명 또는 교육과정명을 확인해야 합니다.
    전공은 제조업 또는 기술 직무와 연결되어야 합니다. 발표 명단에는 미래전기자동차, 자동차공학, 기계, 전기, CAD/CAM, 특수건설기계, 신재생에너지, 섬유패션 제조, 스마트농식품, 미래모빌리티 등이 포함되어 있습니다.
    한국어 능력이 중요합니다. 2026년 공개자료에는 지정 학과 유학 단계 TOPIK 3급, 졸업 후 E-7-M 취업 단계 TOPIK 5급 또는 사회통합프로그램 4단계가 언급되었습니다. 계획 전 최신 기준을 확인하세요.
    졸업이 곧 비자 허가는 아닙니다. 졸업 후에도 직무, 고용기관, 임금, 서류, 출입국 이력과 최신 공고가 중요합니다.
  documents: |-
    지원하려는 정확한 연도와 학기의 학교 공식 입학 공지
    학교 이름이 아니라 정확한 학과 또는 교육과정명
    해당 학과가 현재 E-7-M/K-CORE 경로와 연결되어 있다는 학교 확인
    전공이 제조업 또는 기술 직무와 연결된다는 커리큘럼
    입학, 학업, 졸업, 이후 취업 계획에 필요한 한국어 요건
    등록금, 기숙사, 생활비, 환불 규정, 장학금 규정과 납부 마감일
    인턴십, 취업 매칭, 고용기관 연결 또는 진로 상담 지원 여부
    현재 E-7-M 조건을 보여주는 출입국 또는 학교 공식 공지
  steps: |-
    먼저 목표를 분명히 적습니다: 한국에서 먼저 공부하고, 졸업 후 조건이 맞으면 E-7-M을 확인한다.
    학교 목록은 학교 공식 페이지, 정부 발표 또는 학교 직접 확인을 기준으로 만듭니다.
    정확한 학과명을 확인하고 현재도 E-7-M 또는 K-CORE 경로에 포함되는지 확인합니다.
    전공이 실제 제조업 직무와 연결되는지 비교합니다. 유학원이 쉽다고 말한다는 이유만으로 전공을 고르지 마세요.
    한국어 요건을 일찍 확인합니다. 이후 취업 단계에서 높은 급수가 필요하다면 오기 전부터 공부 시간과 시험 일정을 계획해야 합니다.
    첫 1년 총비용을 계산합니다. 등록금, 기숙사 또는 월세, 식비, 보험, 휴대폰, 교통비와 비상금을 포함합니다.
    졸업 후 취업 매칭이 어떻게 진행되는지 학교에 확인합니다. 학교가 명단에 있다는 이유만으로 모든 학생에게 취업이 보장되지는 않습니다.
    돈을 내기 전 학교, 하이코리아, 1345, 출입국 또는 재외공관에서 최신 기준을 확인합니다.
  watchout: |-
    "학교만 가면 E-7-M 보장"이라는 광고를 믿지 마세요.
    오래된 학교 명단 캡처만 믿지 마세요. 시범사업 학교, 학과, 모집 인원과 조건은 바뀔 수 있습니다.
    도시나 학교 이름만 보고 선택하지 마세요. 이 경로에서는 학과와 취업 연결성이 더 중요합니다.
    한국어를 가볍게 보면 안 됩니다. 한국어 수준이 현실적이지 않으면 E-7-M 계획이 어려워질 수 있습니다.
    모든 제조업 일자리가 해당된다고 생각하지 마세요. 직무가 현행 E-7-M 기준과 본인 전공 또는 교육과 연결되어야 합니다.
    허위 입학, 허위 서류, 허위 은행잔고증명, 불법취업 또는 비자 문제를 만들 수 있는 shortcut은 피하세요.
  notes: |-
    학교 목록을 보기 전에 정확한 학과와 학기의 기본 지원 요건을 먼저 확인하세요.
    여권은 입학, 비자 준비와 입국 계획에 충분한 유효기간이 있어야 합니다.
    최종학력 증명서, 성적증명서, 졸업증명서 또는 졸업예정 증명, 필요한 번역과 공증을 준비할 수 있는지 확인합니다.
    한국어 요건은 학교에 직접 확인하세요. 일부 E-7-M/K-CORE 관련 유학 경로에서는 TOPIK 3급이 언급되지만, 실제 입학 기준은 학교와 연도에 따라 다를 수 있습니다.
    학교 이름만 확인하지 말고 정확한 학과가 외국인 학생을 받는지 확인하세요.
    돈을 내기 전에 등록금, 기숙사, 환불 규정, 장학금 규정, 전형료, 서류 마감일과 첫 1년 생활비를 확인하세요.
    학교가 입학만 제공하는지, 졸업 후 인턴십, 취업 매칭, 고용기관 연결 또는 진로 지원도 제공하는지 물어보세요.
    학교 입학이 E-7-M 허가를 의미하지는 않습니다. 졸업 후에도 직무, 고용기관, 임금, 한국어 수준, 서류와 출입국 심사는 따로 확인됩니다.
    아래 학교와 학과는 2026년 공개된 E-7-M/K-CORE 정보에서 확인된 목록입니다. 출발점으로만 보고 지원 전 학교와 출입국에서 직접 확인하세요.
    School list | 경기과학기술대학교 | 미래전기자동차과
    School list | 대림대학교 | 미래자동차공학부
    School list | 부천대학교 | 섬유패션비즈니스학과
    School list | 서정대학교 | 글로벌섬유패션비즈니스과
    School list | 오산대학교 | 전기공학과
    School list | 용인예술과학대학교 | 자동차기계과
    School list | 경남정보대학교 | 기계과
    School list | 동의과학대학교 | 기계공학과
    School list | 부산과학기술대학교 | 자동차과
    School list | 영진전문대학교 | 스마트CAD/CAM과
    School list | 구미대학교 | 특수건설기계공학부
    School list | 거제대학교 | 기계공학과
    School list | 울산과학대학교 | 기계공학부
    School list | 군장대학교 | 스마트농식품과
    School list | 전주비전대학교 | 미래모빌리티학과
    School list | 목포과학대학교 | 신재생에너지전기과
    E-7-M visa detail — 학교와 전공 경로를 확인한 뒤 E-7-M 비자 가이드에서 취업 단계의 비자 확인사항을 읽어보세요.
    최종 확인은 학교, 하이코리아, 1345, 출입국 또는 재외공관에서 받아야 합니다. 이 페이지는 입학, 취업 또는 비자 허가 약속이 아니라 계획용 체크리스트입니다.
my:
  title: E-7-M အတွက် ကျောင်း၊ program၊ major ဘယ်လိုရွေးမလဲ
  summary: |-
    မြန်မာနိုင်ငံကနေ ကိုရီးယားလာပြီး နောက်ပိုင်း E-7-M လမ်းကြောင်းကို စစ်ချင်သူများအတွက် ကျောင်းနာမည်တစ်ခုတည်းနဲ့ မရွေးသင့်ပါ။ သတ်မှတ်ထားသော နည်းပညာကောလိပ်ဌာန၊ ထုတ်လုပ်ရေးဆိုင်ရာ major၊ ကိုရီးယားဘာသာလိုအပ်ချက်၊ အလုပ်ဆက်စပ်မှု၊ လစာစံနှုန်းနှင့် လတ်တလောလူဝင်မှုကြေညာချက်ကို အတူစစ်ရပါမည်။
  eligibility: |-
    မြန်မာနိုင်ငံမှာရှိနေပြီး ကိုရီးယားမှာ ပညာသင်ပြီးနောက် E-7-M နဲ့ ဆက်စပ်နိုင်သောလမ်းကြောင်းကို သိချင်သောအခါ
    ကိုရီးယားနည်းပညာကောလိပ်၊ ဌာန၊ technical program သို့မဟုတ် ထုတ်လုပ်ရေးဆိုင်ရာ major များကို နှိုင်းယှဉ်နေသောအခါ
    E-7-M သို့မဟုတ် K-CORE အကြောင်းကြားထားပြီး ကျောင်း/major မှားရွေးမိခြင်းကို ရှောင်ချင်သောအခါ
    agent fee၊ application fee၊ ကျောင်းလခ deposit သို့မဟုတ် စာရွက်စာတမ်းကြေး မပေးခင် ဘာတွေစစ်ရမလဲ သိချင်သောအခါ
  subtypes: |-
    E-7-M သည် အများအားဖြင့် မြန်မာနိုင်ငံကနေ တိုက်ရိုက်လျှောက်ပြီး ကိုရီးယားသွားမည့်ဗီဇာမဟုတ်ပါ။ လက်တွေ့လမ်းကြောင်းက သတ်မှတ်ထားသော ကိုရီးယားနည်းပညာကောလိပ်ဌာနရွေးခြင်း၊ တရားဝင်ကျောင်းတက်ခြင်း၊ ဘွဲ့ရခြင်း၊ major ဆက်စပ်ထုတ်လုပ်ရေးအလုပ်ရခြင်း၊ ထို့နောက် လတ်တလောစည်းမျဉ်းအရ E-7-M ကို စစ်ခြင်းဖြစ်သည်။
    ကျောင်းနာမည်တစ်ခုတည်းနဲ့ မလုံလောက်ပါ။ E-7-M/K-CORE လမ်းကြောင်းသည် သတ်မှတ်ဌာနနှင့် ဆက်စပ်နေသောကြောင့် အတိအကျဌာနနာမည် သို့မဟုတ် program နာမည်ကို စစ်ရပါမည်။
    Major သည် ထုတ်လုပ်ရေး သို့မဟုတ် နည်းပညာအလုပ်နှင့် ဆက်စပ်သင့်ပါသည်။ ထုတ်ပြန်စာရင်းတွင် electric vehicle၊ automotive engineering၊ machinery၊ electrical engineering၊ CAD/CAM၊ special construction machinery၊ renewable energy၊ textile/fashion manufacturing၊ smart agri-food၊ future mobility စသည့်နယ်ပယ်များ ပါဝင်သည်။
    ကိုရီးယားဘာသာအဆင့် အရေးကြီးပါသည်။ ၂၀၂၆ ခုနှစ် အချက်အလက်များတွင် သတ်မှတ်ဌာနဝင်ချိန် TOPIK Level 3၊ ဘွဲ့ရပြီး E-7-M အလုပ်အဆင့်တွင် TOPIK Level 5 သို့မဟုတ် KIIP Level 4 ကို ဖော်ပြထားသည်။ အစီအစဉ်မဆွဲမီ လတ်တလောစံနှုန်းကို စစ်ပါ။
    ဘွဲ့ရခြင်းသည် ဗီဇာအတည်ပြုခြင်းမဟုတ်ပါ။ ဘွဲ့ရပြီးနောက် အလုပ်တာဝန်၊ အလုပ်ရှင်၊ လစာ၊ စာရွက်စာတမ်း၊ လူဝင်မှုသမိုင်းနှင့် လတ်တလောကြေညာချက်တို့ ဆက်လက်အရေးကြီးပါသည်။
  documents: |-
    ကိုယ်လျှောက်မည့်နှစ်/semester အတွက် ကျောင်း official admission notice
    ကျောင်းနာမည်မဟုတ်ဘဲ အတိအကျဌာန သို့မဟုတ် program နာမည်
    ထိုဌာနသည် လက်ရှိ E-7-M/K-CORE လမ်းကြောင်းနှင့် ဆက်စပ်နေကြောင်း ကျောင်းဘက်မှ အတည်ပြုချက်
    Major သည် ထုတ်လုပ်ရေး သို့မဟုတ် နည်းပညာအလုပ်နှင့် ဆက်စပ်ကြောင်း ပြနိုင်သော curriculum
    ကျောင်းဝင်ရန်၊ ကျောင်းတက်ရန်၊ ဘွဲ့ရရန်နှင့် နောက်ပိုင်းအလုပ်အစီအစဉ်အတွက် လိုအပ်သော ကိုရီးယားဘာသာစံနှုန်း
    ကျောင်းလခ၊ dormitory၊ နေထိုင်စရိတ်၊ refund rule၊ scholarship rule နှင့် payment deadline
    Internship၊ employment matching၊ အလုပ်ရှင်ချိတ်ဆက်မှု သို့မဟုတ် career counseling support ရှိမရှိ
    လက်ရှိ E-7-M စံနှုန်းကို ပြသော လူဝင်မှု သို့မဟုတ် ကျောင်း official notice
  steps: |-
    ပထမဦးစွာ ကိုယ့်ရည်မှန်းချက်ကို ရှင်းရှင်းလင်းလင်းရေးပါ: ကိုရီးယားမှာ အရင်ပညာသင်မည်၊ ဘွဲ့ရပြီးနောက် စံနှုန်းကိုက်ပါက E-7-M ကို စစ်မည်။
    ကျောင်းစာရင်းကို official school page၊ အစိုးရထုတ်ပြန်ချက် သို့မဟုတ် ကျောင်းကို တိုက်ရိုက်မေးထားသောအတည်ပြုချက်အပေါ် မူတည်ပြီး ပြုစုပါ။
    အတိအကျဌာနနာမည်ကို စစ်ပြီး လက်ရှိ E-7-M သို့မဟုတ် K-CORE လမ်းကြောင်းထဲမှာ ပါနေသေးမသေး စစ်ပါ။
    Major သည် လက်တွေ့ထုတ်လုပ်ရေးအလုပ်များနှင့် ဆက်စပ်မဆက်စပ် နှိုင်းယှဉ်ပါ။ Agent က လွယ်တယ်ပြောတာတစ်ခုတည်းကြောင့် major မရွေးပါနှင့်။
    ကိုရီးယားဘာသာလိုအပ်ချက်ကို အစောကြီးစစ်ပါ။ နောက်ပိုင်းအလုပ်အဆင့်တွင် အဆင့်မြင့်လိုပါက မလာခင်ကတည်းက စာလေ့လာချိန်နှင့် စာမေးပွဲအချိန်ဇယားကို စီစဉ်ထားရပါမည်။
    ပထမ ၁ နှစ်အတွက် စုစုပေါင်းကုန်ကျစရိတ်ကို တွက်ပါ။ ကျောင်းလခ၊ dormitory သို့မဟုတ် အိမ်လခ၊ စားစရိတ်၊ insurance၊ phone၊ transportation နှင့် emergency money ကို ထည့်တွက်ပါ။
    ဘွဲ့ရပြီးနောက် employment matching ဘယ်လိုလုပ်ပေးသလဲကို ကျောင်းကိုမေးပါ။ ကျောင်းစာရင်းထဲပါရုံနဲ့ ကျောင်းသားတိုင်းအလုပ်ရမယ်လို့ မဆိုလိုပါ။
    ငွေမပေးခင် ကျောင်း၊ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကိုရီးယားသံရုံးတွင် လတ်တလောစံနှုန်းကို အတည်ပြုပါ။
  watchout: |-
    "ကျောင်းတက်ပြီးရင် E-7-M သေချာရမယ်" ဆိုသော ကြော်ငြာကို မယုံပါနှင့်။
    ကျောင်းစာရင်း screenshot အဟောင်းကို မယုံပါနှင့်။ Pilot ကျောင်း၊ ဌာန၊ quota နှင့် စံနှုန်းများ ပြောင်းနိုင်ပါသည်။
    မြို့ သို့မဟုတ် ကျောင်းနာမည်တစ်ခုတည်းနဲ့ မရွေးပါနှင့်။ ဤလမ်းကြောင်းတွင် ဌာနနှင့် အလုပ်ချိတ်ဆက်မှုက ပိုအရေးကြီးပါသည်။
    ကိုရီးယားဘာသာကို ပေါ့ပေါ့မယူပါနှင့်။ ကိုရီးယားဘာသာအဆင့် မလက်တွေ့နိုင်ပါက E-7-M အစီအစဉ် ခက်ခဲနိုင်သည်။
    ထုတ်လုပ်ရေးအလုပ်တိုင်း ကိုက်ညီမည်ဟု မယူဆပါနှင့်။ အလုပ်သည် လတ်တလော E-7-M စည်းမျဉ်းနှင့် ကိုယ့် major သို့မဟုတ် သင်တန်းနဲ့ ဆက်စပ်ရပါမည်။
    Fake admission၊ fake document၊ fake bank statement၊ တရားမဝင်အလုပ်လုပ်ခြင်း သို့မဟုတ် ဗီဇာပြဿနာဖြစ်နိုင်သော shortcut များကို ရှောင်ပါ။
  notes: |-
    ကျောင်းစာရင်းကို မကြည့်ခင် ကိုယ်လျှောက်မည့် ဌာနနှင့် semester အတွက် ကျောင်းလျှောက်ခွင့်အခြေခံလိုအပ်ချက်များကို အရင်စစ်ပါ။
    Passport သည် ကျောင်းဝင်ခွင့်၊ ဗီဇာပြင်ဆင်မှုနှင့် ကိုရီးယားဝင်ရောက်ရန်အစီအစဉ်အတွက် လုံလောက်သည့် သက်တမ်းကျန်ရှိရပါမည်။
    နောက်ဆုံးပညာအရည်အချင်းစာရွက်၊ အမှတ်စာရင်း၊ ဘွဲ့ရလက်မှတ် သို့မဟုတ် ဘွဲ့ရမည့်အထောက်အထား၊ လိုအပ်ပါက ဘာသာပြန်နှင့် notarization ပြင်ဆင်နိုင်မနိုင် စစ်ပါ။
    ကိုရီးယားဘာသာလိုအပ်ချက်ကို ကျောင်းတွင် တိုက်ရိုက်စစ်ပါ။ E-7-M/K-CORE နှင့် ဆက်စပ်သော ပညာသင်လမ်းကြောင်းအချို့တွင် TOPIK Level 3 ကို ဖော်ပြနိုင်သော်လည်း တကယ့်ဝင်ခွင့်စံနှုန်းသည် ကျောင်းနှင့် နှစ်အလိုက် ကွာနိုင်ပါသည်။
    ကျောင်းနာမည်စာရင်းထဲ ပါမပါသာမက ကိုယ်လျှောက်မည့် အတိအကျဌာနသည် နိုင်ငံခြားသားကျောင်းသား လက်ခံမလက်ခံ စစ်ပါ။
    ငွေမပေးခင် ကျောင်းလခ၊ dormitory၊ refund rule၊ scholarship rule၊ application fee၊ စာရွက်စာတမ်း deadline နှင့် ပထမ ၁ နှစ်နေထိုင်စရိတ်ကို စစ်ပါ။
    ကျောင်းက admission ပဲပေးတာလား၊ ဘွဲ့ရပြီးနောက် internship၊ employment matching၊ employer connection သို့မဟုတ် career support ပေးမပေး မေးပါ။
    ကျောင်းဝင်ခွင့်ရခြင်းသည် E-7-M ခွင့်ပြုချက်ရခြင်းမဟုတ်ပါ။ ဘွဲ့ရပြီးနောက် အလုပ်တာဝန်၊ အလုပ်ရှင်၊ လစာ၊ ကိုရီးယားဘာသာအဆင့်၊ စာရွက်စာတမ်းနှင့် လူဝင်မှုစစ်ဆေးမှုကို သီးခြားစစ်ဆေးရပါမည်။
    အောက်ပါကျောင်း/ဌာနများသည် ၂၀၂၆ ခုနှစ် E-7-M/K-CORE အချက်အလက်များတွင် ဖော်ပြထားသောစာရင်းဖြစ်သည်။ စတင်စစ်ဆေးရန်စာရင်းအဖြစ်သာသုံးပြီး မလျှောက်မီ ကျောင်းနှင့် လူဝင်မှုရုံးတွင် တိုက်ရိုက်အတည်ပြုပါ။
