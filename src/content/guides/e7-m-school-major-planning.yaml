    နောက်ဆုံးအတည်ပြုချက်ကို ကျောင်း၊ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကိုရီးယားသံရုံးမှ ရယူရပါမည်။ ဤစာမျက်နှာသည် admission၊ အလုပ် သို့မဟုတ် ဗီဇာခွင့်ပြုချက်အတွက် ကတိမဟုတ်ဘဲ အစီအစဉ်ဆွဲရန် checklist ဖြစ်ပါသည်။
