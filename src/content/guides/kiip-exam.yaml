title: KIIP Exam
category: study
order: 4
lastReviewed: 2026-07-30
en:
  title: KIIP exam and Social Integration Program
  summary: >-
    KIIP is Korea's Social Integration Program for foreigners. It includes
    Korean language, Korean culture, Korean society classes, level placement,
    and evaluations that may matter for long-term residence, permanent
    residency, or naturalization plans.
  eligibility: >-
    You are living in Korea and want to understand what KIIP is before applying

    You heard that KIIP can help with permanent residence, nationality, or some long-term visa plans

    You need to decide whether to take the level test or start from the beginner stage

    You want to understand the difference between TOPIK and KIIP before choosing what to prepare

    You are checking official class registration, test registration, score, or completion rules
  subtypes: >-
    KIIP means Korea Immigration & Integration Program, called 사회통합프로그램 in Korean.

    It is not just one exam. It is a program with Korean-language courses, Korean society courses, placement, completion rules, and evaluations.

    Pre-evaluation, called 사전평가, is usually used before starting KIIP to check your current Korean level and assign a suitable class level.

    Mid-level evaluation, called 중간평가, is related to the Korean language and culture stage. It can matter when moving from the Korean language part to the next KIIP stage.

    Comprehensive evaluation, called 종합평가, is the later KIIP evaluation. It can be connected with permanent residence or naturalization plans, depending on your route and official rules.

    The Korean language and culture part is usually organized from Level 0 to Level 4.

    Level placement can be decided by a pre-evaluation, by starting from Level 0, or by other officially accepted placement routes.

    After the Korean-language part, people may take Korean society courses and evaluations depending on their goal, such as permanent residency or naturalization.

    TOPIK and KIIP are different. TOPIK is a Korean-language proficiency test, while KIIP is an immigration social-integration program with classes and evaluations.
  documents: >-
    Alien Registration Card or residence-related ID accepted by the official site

    Socinet account information

    KIIPTEST account or test registration information if you take an evaluation

    Passport or accepted ID for test day if required by the test notice

    Payment method if the evaluation has a test fee

    Test admission ticket or registration confirmation

    Class assignment, attendance, completion, or evaluation-result records after applying
  steps: >-
    First decide your goal: Korean study, long-term residence preparation, permanent residency, naturalization, or general life in Korea.

    Register and check current information on Socinet, because class application periods, regions, seats, and rules can change.

    Choose a placement route: start from Level 0, apply for pre-evaluation, or use another official placement route if you qualify.

    If you take the pre-evaluation, check the KIIPTEST site for application period, PBT or CBT test type, fee, test center, ID rule, and result date.

    After level assignment, apply for an available class that matches your level, region, and schedule.

    Keep attendance and completion records because KIIP is not only about one score.

    Before using KIIP for visa, permanent residence, or nationality plans, confirm directly with Socinet, HiKorea, 1345, or the institution handling your case.
  watchout: >-
    Do not think KIIP and TOPIK are the same thing

    Do not assume KIIP benefit automatically applies to every visa or every person

    Do not rely on old social media posts for class schedule, test fee, seat availability, or completion rules

    Do not miss class attendance rules, because KIIP is a course-based program

    Do not register for the wrong evaluation type without checking your goal

    Avoid anyone selling guaranteed passing, proxy test-taking, leaked questions, or shortcut completion
  notes: >-
    Immigration official KIIP page: program purpose, participation target, course structure, and benefits

    Socinet: official class registration, level assignment, course application, and schedule notices

    KIIPTEST: official pre-evaluation, mid-level evaluation, comprehensive evaluation, registration, test type, result, and notice information

    HiKorea or Immigration Contact Center 1345: case-specific visa, residence, permanent-residence, and nationality questions
ko:
  title: KIIP 시험과 사회통합프로그램
  summary: >-
    KIIP는 외국인을 위한 한국의 사회통합프로그램입니다. 한국어, 한국문화,
    한국사회 이해 수업, 단계배정, 평가가 포함되며 장기 체류, 영주, 국적
    계획과 관련될 수 있습니다.
  eligibility: >-
    한국에 거주하면서 KIIP가 무엇인지 먼저 이해하고 싶을 때

    KIIP가 영주, 국적 또는 장기 체류 계획에 도움이 될 수 있다는 말을 들었을 때

    사전평가를 볼지, 0단계부터 시작할지 결정해야 할 때

    TOPIK과 KIIP의 차이를 알고 무엇을 준비할지 정하고 싶을 때

    공식 과정신청, 평가 접수, 성적 또는 이수 규정을 확인할 때
  subtypes: >-
    KIIP는 Korea Immigration & Integration Program의 약자이며 한국어로 사회통합프로그램이라고 합니다.

    KIIP는 하나의 시험만 의미하지 않습니다. 한국어 과정, 한국사회 과정, 단계배정, 이수 규정과 평가가 함께 있는 프로그램입니다.

    사전평가는 KIIP를 시작하기 전에 현재 한국어 수준을 확인하고 본인에게 맞는 교육단계를 배정받기 위한 평가입니다.

    중간평가는 한국어와 한국문화 단계와 관련된 평가입니다. 한국어 과정 이후 다음 단계로 넘어갈 때 중요할 수 있습니다.

    종합평가는 KIIP 후반부에 보는 평가입니다. 본인의 경로와 공식 규정에 따라 영주 또는 국적 준비와 연결될 수 있습니다.

    한국어와 한국문화 과정은 보통 0단계부터 4단계까지 구성됩니다.

    단계배정은 사전평가, 0단계부터 시작, 또는 공식적으로 인정되는 다른 연계 방법을 통해 정해질 수 있습니다.

    한국어 과정 이후에는 목표에 따라 한국사회 이해 과정과 평가가 이어질 수 있습니다. 예를 들어 영주나 국적 준비와 관련될 수 있습니다.

    TOPIK과 KIIP는 다릅니다. TOPIK은 한국어능력시험이고, KIIP는 수업과 평가가 포함된 출입국 사회통합 프로그램입니다.
  documents: >-
    공식 사이트에서 인정하는 외국인등록증 또는 체류 관련 신분증

    사회통합정보망 계정 정보

    평가를 보는 경우 KIIPTEST 계정 또는 평가 접수 정보

    시험 공지에서 요구하는 경우 여권 또는 시험 당일 인정 신분증

    평가 수수료가 있는 경우 결제 수단

    수험표 또는 접수 확인서

    신청 후 단계배정, 출석, 이수 또는 평가 결과 기록
  steps: >-
    먼저 목표를 정합니다: 한국어 학습, 장기 체류 준비, 영주, 국적 또는 한국 생활 적응.

    과정 신청 기간, 지역, 정원과 규정은 바뀔 수 있으므로 사회통합정보망에서 현재 정보를 확인합니다.

    단계배정 방법을 선택합니다: 0단계부터 시작, 사전평가 신청, 또는 자격이 되는 경우 다른 공식 연계 방법.

    사전평가를 보는 경우 KIIPTEST에서 접수 기간, PBT 또는 CBT, 수수료, 시험장, 신분증 규정과 결과발표일을 확인합니다.

    단계가 배정되면 본인 단계, 지역과 일정에 맞는 과정에 신청합니다.

    KIIP는 점수 하나만의 문제가 아니므로 출석과 이수 기록을 보관합니다.

    KIIP를 비자, 영주 또는 국적 계획에 사용하기 전 사회통합정보망, 하이코리아, 1345 또는 담당 기관에서 직접 확인합니다.
  watchout: >-
    KIIP와 TOPIK을 같은 것으로 생각하면 안 됨

    KIIP 혜택이 모든 비자나 모든 사람에게 자동으로 적용된다고 단정하면 안 됨

    수업 일정, 평가 수수료, 좌석, 이수 규정은 오래된 SNS 글에 의존하면 안 됨

    KIIP는 과정형 프로그램이므로 출석 규정을 놓치면 안 됨

    본인 목표를 확인하지 않고 잘못된 평가에 접수하면 안 됨

    합격 보장, 대리시험, 유출 문제, shortcut 이수 제안은 피해야 함
  notes: >-
    출입국 공식 KIIP 페이지: 프로그램 목적, 참여 대상, 과정 구성과 혜택 확인

    사회통합정보망: 공식 과정신청, 단계배정, 수업 신청과 일정 공지 확인

    KIIPTEST: 사전평가, 중간평가, 종합평가, 접수, 시험 방식, 결과와 공지 확인

    하이코리아 또는 외국인종합안내센터 1345: 비자, 체류, 영주, 국적 관련 개인 사례 확인
my:
  title: KIIP စာမေးပွဲနှင့် လူမှုရေးပေါင်းစည်းရေးအစီအစဉ်
  summary: >-
    KIIP သည် ကိုရီးယားတွင် နေထိုင်သော နိုင်ငံခြားသားများအတွက် လူမှုရေးပေါင်းစည်းရေး
    အစီအစဉ်ဖြစ်ပါသည်။ ကိုရီးယားဘာသာ၊ ကိုရီးယားယဉ်ကျေးမှု၊ ကိုရီးယားလူမှုရေး
    အကြောင်းအရာ၊ Level ခွဲခြားခြင်းနှင့် စစ်ဆေးမှုများ ပါဝင်ပြီး နောင်နေထိုင်ခွင့်၊
    အမြဲတမ်းနေထိုင်ခွင့် သို့မဟုတ် နိုင်ငံသားခံယူရေးအစီအစဉ်များနှင့် ဆက်စပ်နိုင်ပါသည်။
  eligibility: >-
    ကိုရီးယားတွင် နေထိုင်နေပြီး KIIP ဆိုတာ ဘာလဲကို အရင်နားလည်ချင်သောအခါ

    KIIP က အမြဲတမ်းနေထိုင်ခွင့်၊ နိုင်ငံသားခံယူရေး သို့မဟုတ် နောင်နေထိုင်ရေးအစီအစဉ်များအတွက် အသုံးဝင်နိုင်တယ်ဟု ကြားထားသောအခါ

    Level test ဖြေရမလား၊ Level 0 မှ စရမလား ဆုံးဖြတ်ရန်လိုသောအခါ

    TOPIK နှင့် KIIP ကွာခြားချက်ကို သိပြီး ဘာကိုပြင်ဆင်ရမလဲ ဆုံးဖြတ်ချင်သောအခါ

    တရားဝင်သင်တန်းလျှောက်ခြင်း၊ စာမေးပွဲစာရင်းသွင်းခြင်း၊ ရလဒ် သို့မဟုတ် ပြီးဆုံးမှုစည်းမျဉ်းကို စစ်ချင်သောအခါ
  subtypes: >-
    KIIP သည် Korea Immigration & Integration Program ၏ အတိုကောက်ဖြစ်ပြီး ကိုရီးယားလို 사회통합프로그램 ဟုခေါ်ပါသည်။

    KIIP သည် စာမေးပွဲတစ်ခုတည်း မဟုတ်ပါ။ ကိုရီးယားဘာသာသင်တန်း၊ ကိုရီးယားလူမှုရေးသင်တန်း၊ Level ခွဲခြားခြင်း၊ ပြီးဆုံးမှုစည်းမျဉ်းနှင့် စစ်ဆေးမှုများ ပါဝင်သော အစီအစဉ်ဖြစ်ပါသည်။

    사전평가 ဟုခေါ်သော Pre-evaluation သည် KIIP မစမီ ကိုယ့်ကိုရီးယားစာအဆင့်ကို စစ်ပြီး သင့်တော်သော Level သို့ ခွဲပေးရန် အသုံးပြုသော စစ်ဆေးမှုဖြစ်ပါသည်။

    중간평가 ဟုခေါ်သော Mid-level evaluation သည် ကိုရီးယားဘာသာနှင့် ကိုရီးယားယဉ်ကျေးမှုအဆင့်နှင့် ဆက်စပ်သော စစ်ဆေးမှုဖြစ်ပါသည်။ ကိုရီးယားဘာသာအပိုင်းပြီးနောက် နောက်အဆင့်သို့ ဆက်သွားရာတွင် အရေးကြီးနိုင်ပါသည်။

    종합평가 ဟုခေါ်သော Comprehensive evaluation သည် KIIP အဆုံးပိုင်းတွင် တွေ့ရတတ်သော စစ်ဆေးမှုဖြစ်ပါသည်။ ကိုယ့်လမ်းကြောင်းနှင့် တရားဝင်စည်းကမ်းအလိုက် အမြဲတမ်းနေထိုင်ခွင့် သို့မဟုတ် နိုင်ငံသားခံယူရေးပြင်ဆင်မှုနှင့် ဆက်စပ်နိုင်ပါသည်။

    ကိုရီးယားဘာသာနှင့် ကိုရီးယားယဉ်ကျေးမှုအပိုင်းသည် များသောအားဖြင့် Level 0 မှ Level 4 အထိ ဖွဲ့စည်းထားပါသည်။

    Level ခွဲခြားမှုကို 사전평가 ဟုခေါ်သော အစောပိုင်းစစ်ဆေးမှုဖြင့်၊ Level 0 မှ စခြင်းဖြင့် သို့မဟုတ် တရားဝင်လက်ခံထားသော အခြားနည်းလမ်းများဖြင့် သတ်မှတ်နိုင်ပါသည်။

    ကိုရီးယားဘာသာအပိုင်းပြီးနောက် ကိုယ့်ရည်မှန်းချက်အလိုက် ကိုရီးယားလူမှုရေးသင်တန်းနှင့် စစ်ဆေးမှုများ ဆက်ရှိနိုင်ပါသည်။ ဥပမာ အမြဲတမ်းနေထိုင်ခွင့် သို့မဟုတ် နိုင်ငံသားခံယူရေးပြင်ဆင်မှုနှင့် ဆက်စပ်နိုင်ပါသည်။

    TOPIK နှင့် KIIP သည် မတူပါ။ TOPIK သည် ကိုရီးယားစာစွမ်းရည်စာမေးပွဲဖြစ်ပြီး KIIP သည် သင်တန်းနှင့် စစ်ဆေးမှုများပါသော လူဝင်မှုကြီးကြပ်ရေးဆိုင်ရာ လူမှုရေးပေါင်းစည်းရေးအစီအစဉ်ဖြစ်ပါသည်။
  documents: >-
    တရားဝင် Website က လက်ခံသော နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် သို့မဟုတ် နေထိုင်ခွင့်ဆိုင်ရာ ID

    Socinet account information

    စစ်ဆေးမှုဖြေမည်ဆိုပါက KIIPTEST account သို့မဟုတ် စာမေးပွဲစာရင်းသွင်းအချက်အလက်

    စာမေးပွဲ Notice က တောင်းပါက Passport သို့မဟုတ် စာမေးပွဲနေ့တွင် လက်ခံသော ID

    စစ်ဆေးမှုကြေးရှိပါက Payment method

    စာမေးပွဲဝင်ခွင့်လက်မှတ် သို့မဟုတ် စာရင်းသွင်းအတည်ပြုချက်

    လျှောက်ပြီးနောက် Level ခွဲခြားမှု၊ တက်ရောက်မှု၊ ပြီးဆုံးမှု သို့မဟုတ် စစ်ဆေးမှုရလဒ်မှတ်တမ်း
  steps: >-
    အရင်ဆုံး ကိုယ့်ရည်မှန်းချက်ကို သတ်မှတ်ပါ: ကိုရီးယားစာလေ့လာခြင်း၊ နောင်နေထိုင်ရေးပြင်ဆင်ခြင်း၊ အမြဲတမ်းနေထိုင်ခွင့်၊ နိုင်ငံသားခံယူရေး သို့မဟုတ် ကိုရီးယားနေ့စဉ်ဘဝအတွက် လေ့လာခြင်း။

    သင်တန်းလျှောက်ကာလ၊ နေရာဒေသ၊ နေရာလွတ်နှင့် စည်းမျဉ်းများ ပြောင်းနိုင်သောကြောင့် Socinet တွင် လက်ရှိအချက်အလက်ကို စစ်ပါ။

    Level ခွဲခြားနည်းကို ရွေးပါ: Level 0 မှ စမလား၊ 사전평가 လျှောက်မလား၊ သို့မဟုတ် ကိုယ်အရည်အချင်းပြည့်မီပါက တရားဝင်လက်ခံသော အခြားနည်းလမ်းကို သုံးမလား စစ်ပါ။

    사전평가 ဖြေမည်ဆိုပါက KIIPTEST တွင် စာရင်းသွင်းကာလ၊ PBT သို့မဟုတ် CBT၊ စစ်ဆေးမှုကြေး၊ စာမေးပွဲနေရာ၊ ID စည်းမျဉ်းနှင့် ရလဒ်ထွက်ရက်ကို စစ်ပါ။

    Level ခွဲခြားပြီးနောက် ကိုယ့် Level၊ နေရာဒေသနှင့် အချိန်ဇယားနှင့်ကိုက်သော သင်တန်းကို လျှောက်ပါ။

    KIIP သည် Score တစ်ခုတည်းမဟုတ်သောကြောင့် တက်ရောက်မှုနှင့် ပြီးဆုံးမှုမှတ်တမ်းများကို သိမ်းထားပါ။

    KIIP ကို ဗီဇာ၊ အမြဲတမ်းနေထိုင်ခွင့် သို့မဟုတ် နိုင်ငံသားခံယူရေးအစီအစဉ်တွင် အသုံးပြုမည်ဆိုပါက Socinet၊ HiKorea၊ 1345 သို့မဟုတ် ကိုယ့် Case ကိုကိုင်တွယ်မည့်ဌာနတွင် တိုက်ရိုက်စစ်ပါ။
  watchout: >-
    KIIP နှင့် TOPIK ကို တူတယ်ဟု မယူဆပါနှင့်

    KIIP အကျိုးခံစားခွင့်သည် ဗီဇာတိုင်း သို့မဟုတ် လူတိုင်းအတွက် အလိုအလျောက်သက်ရောက်မည်ဟု မယူဆပါနှင့်

    သင်တန်းအချိန်ဇယား၊ စစ်ဆေးမှုကြေး၊ နေရာလွတ်နှင့် ပြီးဆုံးမှုစည်းမျဉ်းများကို Social media post အဟောင်းများအပေါ် မမှီခိုပါနှင့်

    KIIP သည် သင်တန်းအခြေခံအစီအစဉ်ဖြစ်သောကြောင့် တက်ရောက်မှုစည်းမျဉ်းကို မလွတ်ပါစေနှင့်

    ကိုယ့်ရည်မှန်းချက်ကို မစစ်ဘဲ မှားသောစစ်ဆေးမှုအမျိုးအစားကို မစာရင်းသွင်းပါနှင့်

    အောင်မြင်မှုအာမခံ၊ ကိုယ်စားဖြေဆိုခြင်း၊ မေးခွန်းပေါက်ကြားမှု သို့မဟုတ် shortcut ဖြင့် ပြီးဆုံးစေမည်ဆိုသောကမ်းလှမ်းချက်များကို ရှောင်ပါ
  notes: >-
    လူဝင်မှုကြီးကြပ်ရေး KIIP တရားဝင်စာမျက်နှာ: အစီအစဉ်ရည်ရွယ်ချက်၊ ပါဝင်နိုင်သူ၊ သင်တန်းဖွဲ့စည်းပုံနှင့် အကျိုးခံစားခွင့်များကို စစ်ပါ

    Socinet: တရားဝင်သင်တန်းလျှောက်ခြင်း၊ Level ခွဲခြားခြင်း၊ သင်တန်းလျှောက်ထားခြင်းနှင့် အချိန်ဇယား Notice များကို စစ်ပါ

    KIIPTEST: 사전평가၊ 중간평가၊ 종합평가၊ စာရင်းသွင်းခြင်း၊ စစ်ဆေးမှုနည်းလမ်း၊ ရလဒ်နှင့် Notice များကို စစ်ပါ

    HiKorea သို့မဟုတ် 1345 လူဝင်မှုကြီးကြပ်ရေးအကူအညီ: ဗီဇာ၊ နေထိုင်ခွင့်၊ အမြဲတမ်းနေထိုင်ခွင့်နှင့် နိုင်ငံသားခံယူရေးဆိုင်ရာ ကိုယ့် Case အတိအကျကို စစ်ပါ
