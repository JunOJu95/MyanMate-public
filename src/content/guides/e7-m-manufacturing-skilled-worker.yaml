title: E-7-M Manufacturing Skilled Worker Visa
category: visa
order: 14
lastReviewed: 2026-07-31
en:
  title: E-7-M Manufacturing Skilled Worker Visa
  summary: |-
    E-7-M, also described publicly as K-CORE, is a newer E-7 route connected to manufacturing-skilled talent. Government reporting describes it as a path for foreign students trained at selected Korean vocational colleges or specialized technical departments to move into manufacturing jobs that need skilled workers.
  eligibility: |-
    E-7-M should be checked by people who studied or trained in Korea through a relevant vocational-college or specialized technical program and want to work in a manufacturing-related skilled job.
    For people still in Myanmar, this is usually not a direct "apply now and go to Korea for E-7-M" route. The practical path is: choose a designated Korean college department, enter and study legally, graduate from that department, then move to a related manufacturing job if the current immigration rule allows it.
    Public government information links the route to graduates whose job is related to their major and who meet Korean-language or social-integration conditions. The exact rule can change by notice.
    Public 2026 information says designated-program students may enter the study phase with TOPIK Level 3, while the E-7-M work stage after graduation mentions TOPIK Level 5 or KIIP Stage 4, related employment, and a starting annual salary of at least 26 million won. Confirm the current rule before planning around these numbers.
    It is not a general job-search visa. The school or training background, major, graduation status, employer, job duties, workplace, salary, and industry conditions may all be reviewed.
    The Korean employer must usually be part of the case. Immigration can review whether the company, job, wage, hiring reason, and documents match the current E-7-M rule.
    Because this route is new and may be operated through detailed notices, users should confirm current eligibility with HiKorea, 1345, immigration, or the school before preparing documents.
  subtypes: ''
  documents: |-
    Application or visa documents, passport, photo, residence card if applying in Korea, fee, and proof of address if required
    Graduation, expected graduation, completion, transcript, or training evidence from the Korean school or program
    Evidence that the major, training, certificate, or skill area is connected to the manufacturing job
    Korean-language or social-integration evidence if required, such as TOPIK or KIIP evidence accepted by the current notice
    Employment contract, job description, workplace, salary, employment period, and employer documents
    Employer business registration, tax or employment records, company explanation, and any recommendation or approval required by the current notice
    Wage, income, residence, recommendation, or other supporting documents if the current rule asks for them
  steps: |-
    First confirm whether your school, department, or training program is included in the E-7-M or K-CORE route.
    If you are still in Myanmar, do not start from an agent promise. Start from the official school name, exact department, admission notice, tuition, dormitory, Korean-language requirement, and whether that department is still inside the E-7-M pilot.
    Check whether the job is a manufacturing-related skilled job accepted under the current E-7-M rule and connected to your major or training.
    Ask the employer and school which documents they can provide, because this route may need evidence from both sides.
    Confirm the latest filing route through HiKorea, 1345, immigration, or the Korean embassy before submitting.
    Check the current wage, Korean-language, employer, and region or industry conditions before applying.
    Apply only through the confirmed route and do not start work until the correct status or permission is granted.
    After approval, keep workplace, contract, address, passport, and registration information updated. Job or workplace changes may require permission or reporting.
  watchout: |-
    Do not assume every manufacturing job is E-7-M eligible. The job and employer still need to match the current rule.
    Do not assume every school graduate can apply. School type, selected department, program, major, graduation status, Korean ability, wage, and recommendation rules may matter.
    Be careful with advertisements saying "guaranteed E-7-M after school." School admission, graduation, Korean level, job matching, employer documents, salary, and immigration review are separate steps.
    A job offer alone is not enough. Immigration may review applicant background, employer condition, salary, documents, and disqualification history.
    E-7-M is different from E-7-1 and E-7-4. Do not copy requirements from another E-7 subtype without confirmation.
    Because notices can change, always confirm the latest rule on the filing date.
  notes: |-
    Public government reporting announced E-7-M/K-CORE as a route to support foreign skilled talent for manufacturing sectors. Detailed operation can depend on immigration notices.
    Government reporting in 2026 mentioned selected vocational colleges, manufacturing-related majors, TOPIK or KIIP conditions, related employment, and a reasonable wage standard. Treat those as points to confirm, not as a guarantee for every applicant.
    Schools and departments to confirm from the 2026 announced list: Gyeonggi University of Science and Technology - Future Electric Vehicle; Daelim University College - Future Automotive Engineering; Bucheon University - Textile and Fashion Business; Seojeong University - Global Textile and Fashion Business; Osan University - Electrical Engineering; Yongin University of Arts and Science - Automotive Machinery.
    Also confirm these listed schools and departments: Kyungnam College of Information and Technology - Mechanical Engineering; Dong-Eui Institute of Technology - Mechanical Engineering; Busan Institute of Science and Technology - Automotive Engineering; Yeungjin University - Smart CAD/CAM; Gumi University - Special Construction Machinery Engineering; Koje College - Mechanical Engineering.
    Also confirm these listed schools and departments: Ulsan College - Mechanical Engineering; Kunjang University College - Smart Agri-food; Jeonju Vision University - Future Mobility; Mokpo Science University - Renewable Energy and Electrical Engineering.
    The school list is useful for planning, but do not rely on an old screenshot or social-media list. Confirm the exact department name, international admission availability, quota, and current E-7-M status directly with the school and immigration.
    School and major planning — if you are still choosing a Korean school or department, read the study planning guide before paying any fee.
    If you are deciding between E-7-1, E-7-4, and E-7-M, start from your background: professional job offer, long E-9/E-10/H-2 work history, or Korea-based manufacturing training.
    This page is an overview. Confirm the current E-7-M notice with HiKorea, 1345, the immigration office, your school, or the Korean embassy before acting.
ko:
  title: E-7-M 제조업 특화 숙련인력 비자
  summary: |-
    E-7-M은 K-CORE로도 설명되는 제조업 숙련인력 관련 E-7 경로입니다. 정부 보도에서는 지정된 국내 전문대 또는 육성형 전문기술학과에서 교육받은 외국인 유학생이 제조업 숙련 일자리로 이어질 수 있는 경로로 설명합니다.
  eligibility: |-
    E-7-M은 관련 전문대 또는 전문기술 교육과정을 통해 한국에서 공부하거나 훈련받은 뒤 제조업 관련 숙련 일자리로 취업하려는 사람이 확인할 수 있습니다.
    아직 미얀마에 있는 사람에게는 보통 "지금 바로 E-7-M으로 한국에 가는" 경로가 아닙니다. 현실적인 흐름은 지정된 한국 전문대 학과 선택, 합법적인 유학, 해당 학과 졸업, 그리고 현행 출입국 기준에 맞는 전공 관련 제조업 취업입니다.
    정부 공개자료는 전공과 관련된 취업, 한국어 또는 사회통합 조건과 연결해 설명합니다. 정확한 기준은 공고에 따라 달라질 수 있습니다.
    2026년 공개자료에는 지정 학과 유학 단계에서 TOPIK 3급, 졸업 후 E-7-M 취업 단계에서 TOPIK 5급 또는 사회통합프로그램 4단계, 전공 관련 고용계약, 초임 연 2,600만 원 이상 기준이 언급됩니다. 이 숫자에 맞춰 계획하기 전 최신 규정을 확인하세요.
    일반 구직비자가 아닙니다. 학교 또는 훈련 배경, 전공, 졸업 여부, 고용기관, 직무, 근무지, 임금, 업종 조건을 함께 볼 수 있습니다.
    한국 고용기관도 보통 신청에 포함됩니다. 출입국은 회사, 직무, 임금, 고용 사유와 서류가 현재 E-7-M 기준에 맞는지 확인할 수 있습니다.
    새로 운영되는 경로이고 세부 공고에 따라 달라질 수 있으므로 서류 준비 전 하이코리아, 1345, 출입국 또는 학교에서 현재 기준을 확인하세요.
  subtypes: ''
  documents: |-
    신청서류, 여권, 사진, 국내 신청 시 외국인등록증, 수수료, 필요한 경우 체류지 입증서류
    한국 학교 또는 교육과정의 졸업, 졸업예정, 수료, 성적 또는 훈련 증빙
    전공, 교육과정, 자격 또는 기술 분야가 제조업 직무와 연결된다는 증빙
    현재 공고에서 인정하는 TOPIK, 사회통합프로그램 등 한국어 또는 사회통합 증빙
    고용계약서, 직무 설명, 근무지, 임금, 고용기간과 고용기관 서류
    사업자등록, 납세 또는 고용 관련 자료, 회사 설명자료, 현재 공고에서 요구하는 추천서 또는 승인서
    현재 규정에서 요구하는 경우 임금, 소득, 체류지, 추천 또는 기타 보조 서류
  steps: |-
    먼저 본인의 학교, 학과 또는 교육과정이 E-7-M 또는 K-CORE 경로에 포함되는지 확인합니다.
    아직 미얀마에 있다면 유학원 약속부터 보지 말고 공식 학교명, 정확한 학과명, 입학 공지, 등록금, 기숙사, 한국어 요건과 그 학과가 현재도 E-7-M 시범사업에 포함되는지를 먼저 확인합니다.
    취업하려는 일이 현재 E-7-M 기준에서 인정되는 제조업 관련 숙련 직무이고 전공 또는 교육과 연결되는지 확인합니다.
    학교와 고용기관에서 제공 가능한 서류를 확인합니다. 이 경로는 양쪽 자료가 모두 필요할 수 있습니다.
    제출 전 하이코리아, 1345, 출입국 또는 재외공관에서 최신 신청 경로를 확인합니다.
    신청 전 현재 임금, 한국어, 고용기관, 지역 또는 업종 조건을 확인합니다.
    확인된 경로로 신청하고, 올바른 체류자격 또는 허가를 받기 전에는 근무를 시작하지 마세요.
    허가 후 근무처, 계약, 체류지, 여권, 등록정보를 최신 상태로 유지합니다. 직무나 근무처 변경은 허가 또는 신고가 필요할 수 있습니다.
  watchout: |-
    모든 제조업 일자리가 E-7-M 대상이라고 생각하면 안 됩니다. 직무와 고용기관이 현재 기준과 맞아야 합니다.
    모든 졸업생이 신청할 수 있다고 보장할 수 없습니다. 학교 유형, 지정 학과, 과정, 전공, 졸업 상태, 한국어, 임금과 추천 기준이 중요할 수 있습니다.
    "학교만 가면 E-7-M 보장"이라는 광고를 조심하세요. 입학, 졸업, 한국어 수준, 직무 매칭, 고용기관 서류, 임금과 출입국 심사는 각각 다른 단계입니다.
    취업 제안만으로는 부족합니다. 신청인 배경, 고용기관 조건, 임금, 서류와 결격 이력을 함께 볼 수 있습니다.
    E-7-M은 E-7-1, E-7-4와 다릅니다. 다른 E-7 세부 유형의 요건을 확인 없이 그대로 적용하지 마세요.
    공고가 바뀔 수 있으므로 신청일 기준의 최신 규정을 반드시 확인하세요.
  notes: |-
    정부 보도에서는 E-7-M/K-CORE를 제조업 분야 외국 숙련인력 확보를 돕는 경로로 발표했습니다. 실제 운영은 출입국 세부 공고에 따라 달라질 수 있습니다.
    2026년 정부 공개자료에는 지정 전문대, 제조업 관련 전공, TOPIK 또는 사회통합 조건, 전공 관련 취업과 적정 임금 기준이 언급되었습니다. 다만 모든 신청자에게 그대로 보장되는 조건이 아니라 확인해야 할 항목으로 보세요.
    2026년 발표 명단에서 확인할 학교와 학과: 경기과학기술대학교 미래전기자동차과, 대림대학교 미래자동차공학부, 부천대학교 섬유패션비즈니스학과, 서정대학교 글로벌섬유패션비즈니스과, 오산대학교 전기공학과, 용인예술과학대학교 자동차기계과.
    추가로 확인할 학교와 학과: 경남정보대학교 기계과, 동의과학대학교 기계공학과, 부산과학기술대학교 자동차과, 영진전문대학교 스마트CAD/CAM과, 구미대학교 특수건설기계공학부, 거제대학교 기계공학과.
    추가로 확인할 학교와 학과: 울산과학대학교 기계공학부, 군장대학교 스마트농식품과, 전주비전대학교 미래모빌리티학과, 목포과학대학교 신재생에너지전기과.
    이 명단은 계획을 세울 때 유용하지만 오래된 캡처나 SNS 글만 믿으면 안 됩니다. 정확한 학과명, 외국인 입학 가능 여부, 모집 인원과 현재 E-7-M 지정 상태를 학교와 출입국에서 직접 확인하세요.
    School and major planning — 아직 한국 학교나 학과를 고르는 단계라면 비용을 내기 전에 유학 계획 가이드를 먼저 읽어보세요.
    E-7-1, E-7-4, E-7-M 중 어느 쪽인지 고민된다면 먼저 본인의 배경을 보세요. 전문직 취업 제안인지, E-9/E-10/H-2 장기 근무이력인지, 한국 내 제조업 교육 이력인지가 출발점입니다.
    이 페이지는 개요입니다. 실제 진행 전 하이코리아, 1345, 출입국, 학교 또는 재외공관에서 현재 E-7-M 공고를 확인하세요.
my:
  title: E-7-M ထုတ်လုပ်ရေးဆိုင်ရာ ကျွမ်းကျင်လုပ်သား ဗီဇာ
  summary: |-
    E-7-M သည် K-CORE ဟုလည်း ဖော်ပြထားသော E-7 အထူးလုပ်ငန်းဗီဇာအတွင်းရှိ ထုတ်လုပ်ရေးဆိုင်ရာ ကျွမ်းကျင်လုပ်သားလမ်းကြောင်းဖြစ်သည်။ အစိုးရသတင်းအချက်အလက်များအရ သတ်မှတ်ထားသော ကိုရီးယားနည်းပညာကောလိပ် သို့မဟုတ် ပညာရှင်နည်းပညာသင်တန်းတွင် သင်ယူထားသော နိုင်ငံခြားသားကျောင်းသားများကို ထုတ်လုပ်ရေးအလုပ်နှင့် ချိတ်ဆက်စစ်ဆေးနိုင်သော လမ်းကြောင်းဖြစ်သည်။
  eligibility: |-
    E-7-M ကို သက်ဆိုင်ရာနည်းပညာကောလိပ် သို့မဟုတ် ပညာရှင်နည်းပညာသင်တန်းမှ ကိုရီးယားတွင် သင်ယူပြီး ထုတ်လုပ်ရေးဆိုင်ရာ ကျွမ်းကျင်အလုပ်သို့ သွားလိုသည့်အခါ စစ်ဆေးနိုင်သည်။
    မြန်မာနိုင်ငံမှာ ရှိနေသေးသူများအတွက် E-7-M သည် အများအားဖြင့် "အခုချက်ချင်း E-7-M နဲ့ ကိုရီးယားသွားမယ်" ဆိုတဲ့ လမ်းကြောင်းမဟုတ်ပါ။ လက်တွေ့လမ်းကြောင်းက သတ်မှတ်ထားသော ကိုရီးယားနည်းပညာကောလိပ်/ဌာနကို ရွေးခြင်း၊ တရားဝင်ကျောင်းတက်ခြင်း၊ ထိုဌာနမှ ဘွဲ့ရခြင်း၊ ပြီးနောက် လတ်တလောစည်းမျဉ်းနှင့် ကိုက်သော major ဆက်စပ်ထုတ်လုပ်ရေးအလုပ်သို့ ချိတ်ဆက်ခြင်းဖြစ်သည်။
    အစိုးရအချက်အလက်များတွင် major နှင့် ဆက်စပ်သောအလုပ်၊ ကိုရီးယားဘာသာ သို့မဟုတ် လူမှုရေးပေါင်းစည်းမှုစံနှုန်းများနှင့် ဆက်စပ်ဖော်ပြထားသည်။ အတိအကျစံနှုန်းသည် ကြေညာချက်အလိုက် ပြောင်းနိုင်သည်။
    ၂၀၂၆ ခုနှစ် အများပြည်သူဆိုင်ရာအချက်အလက်များတွင် သတ်မှတ်ဌာနသို့ ကျောင်းဝင်ချိန် TOPIK Level 3၊ ဘွဲ့ရပြီး E-7-M အလုပ်အဆင့်တွင် TOPIK Level 5 သို့မဟုတ် KIIP Level 4၊ major ဆက်စပ်အလုပ်စာချုပ်နှင့် စတင်နှစ်လစာ ၂၆ သန်းဝမ်အထက် စံနှုန်းများကို ဖော်ပြထားသည်။ ဤအချက်များကို အခြေခံပြီး အစီအစဉ်ဆွဲမီ လတ်တလောစည်းမျဉ်းကို အတည်ပြုပါ။
    ၎င်းသည် သာမန်အလုပ်ရှာဗီဇာမဟုတ်ပါ။ ကျောင်း/သင်တန်းနောက်ခံ၊ major၊ ဘွဲ့ရအခြေအနေ၊ အလုပ်ရှင်၊ အလုပ်တာဝန်၊ အလုပ်နေရာ၊ လစာနှင့် လုပ်ငန်းနယ်ပယ်စံနှုန်းများကို အတူစစ်နိုင်သည်။
    ကိုရီးယားအလုပ်ရှင်လည်း အရေးကြီးသည်။ ကုမ္ပဏီအခြေအနေ၊ အလုပ်တာဝန်၊ လစာ၊ ခန့်ထားရခြင်းအကြောင်းနှင့် စာရွက်စာတမ်းများသည် လတ်တလော E-7-M စံနှုန်းနှင့် ကိုက်မကိုက် လူဝင်မှုရုံးက စစ်နိုင်သည်။
    ဤလမ်းကြောင်းသည် အသစ်ဖြစ်ပြီး အသေးစိတ်ကြေညာချက်အလိုက် ကွာနိုင်သောကြောင့် စာရွက်မပြင်မီ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကျောင်းတွင် လတ်တလောစံနှုန်းကို အတည်ပြုပါ။
  subtypes: ''
  documents: |-
    လျှောက်လွှာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ လိုအပ်ပါက နေရပ်အထောက်အထား
    ကိုရီးယားကျောင်း သို့မဟုတ် သင်တန်းမှ ဘွဲ့ရစာရွက်၊ ဘွဲ့ရရန်မျှော်မှန်းကြောင်းစာရွက်၊ သင်တန်းပြီးကြောင်း၊ အမှတ်စာရင်း သို့မဟုတ် သင်တန်းအထောက်အထား
    major၊ သင်တန်း၊ လက်မှတ် သို့မဟုတ် ကျွမ်းကျင်မှုနယ်ပယ်သည် ထုတ်လုပ်ရေးအလုပ်နှင့် ဆက်စပ်ကြောင်း ပြနိုင်သောစာရွက်
    လတ်တလောကြေညာချက်က လက်ခံသော TOPIK၊ KIIP စသည့် ကိုရီးယားဘာသာ သို့မဟုတ် လူမှုရေးပေါင်းစည်းမှုအထောက်အထား
    အလုပ်စာချုပ်၊ အလုပ်တာဝန်ရှင်းလင်းချက်၊ အလုပ်နေရာ၊ လစာ၊ အလုပ်ကာလနှင့် အလုပ်ရှင်စာရွက်များ
    ကုမ္ပဏီမှတ်ပုံတင်၊ အခွန် သို့မဟုတ် အလုပ်ခန့်ထားမှုစာရွက်၊ ကုမ္ပဏီရှင်းလင်းချက်နှင့် လတ်တလောကြေညာချက်အရ လိုအပ်သော ထောက်ခံစာ သို့မဟုတ် ခွင့်ပြုစာ
    လက်ရှိစည်းမျဉ်းက တောင်းပါက လစာ၊ ဝင်ငွေ၊ နေရပ်၊ ထောက်ခံစာ သို့မဟုတ် အခြားအထောက်အထားများ
  steps: |-
    အရင်ဆုံး ကိုယ့်ကျောင်း၊ ဌာန သို့မဟုတ် သင်တန်းသည် E-7-M သို့မဟုတ် K-CORE လမ်းကြောင်းတွင် ပါမပါ စစ်ပါ။
    မြန်မာနိုင်ငံမှ စတင်စဉ်းစားနေသူများအတွက် agent ကတိစကားကို အရင်မကြည့်ပါနှင့်။ Official ကျောင်းနာမည်၊ အတိအကျဌာနနာမည်၊ admission notice၊ ကျောင်းလခ၊ dormitory၊ ကိုရီးယားဘာသာလိုအပ်ချက်နှင့် ထိုဌာနသည် လက်ရှိ E-7-M pilot ထဲမှာ ပါမပါကို အရင်စစ်ပါ။
    လျှောက်မည့်အလုပ်သည် လတ်တလော E-7-M စည်းမျဉ်းတွင် လက်ခံသော ထုတ်လုပ်ရေးဆိုင်ရာ ကျွမ်းကျင်အလုပ်ဖြစ်ပြီး ကိုယ့် major သို့မဟုတ် သင်တန်းနဲ့ ဆက်စပ်မဆက်စပ် စစ်ပါ။
    ကျောင်းနှင့် အလုပ်ရှင်ဘက်မှ ဘယ်စာရွက်များ ထုတ်ပေးနိုင်မလဲ မေးပါ။ ဤလမ်းကြောင်းတွင် နှစ်ဘက်စာရွက်လုံး လိုနိုင်သည်။
    မတင်မီ HiKorea၊ 1345၊ လူဝင်မှုရုံး သို့မဟုတ် ကိုရီးယားသံရုံးတွင် လတ်တလောလျှောက်လမ်းကို အတည်ပြုပါ။
    မလျှောက်မီ လတ်တလောလစာ၊ ကိုရီးယားဘာသာ၊ အလုပ်ရှင်၊ ဒေသ သို့မဟုတ် လုပ်ငန်းနယ်ပယ်စံနှုန်းကို စစ်ပါ။
    အတည်ပြုထားသောလမ်းကြောင်းဖြင့်သာ လျှောက်ပါ။ မှန်ကန်သောနေထိုင်ခွင့် သို့မဟုတ် ခွင့်ပြုချက်မရမီ အလုပ်မစပါနှင့်။
    ခွင့်ပြုပြီးနောက် အလုပ်နေရာ၊ စာချုပ်၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ်နှင့် မှတ်ပုံတင်အချက်အလက်များကို နောက်ဆုံးအခြေအနေအတိုင်း ထားပါ။ အလုပ်တာဝန် သို့မဟုတ် အလုပ်နေရာပြောင်းပါက ခွင့်ပြုချက် သို့မဟုတ် တင်ပြချက် လိုနိုင်သည်။
  watchout: |-
    ထုတ်လုပ်ရေးအလုပ်တိုင်း E-7-M ရမည်ဟု မယူဆပါနှင့်။ အလုပ်တာဝန်နှင့် အလုပ်ရှင်သည် လတ်တလောစံနှုန်းနှင့် ကိုက်ရမည်။
    ဘွဲ့ရသူတိုင်း လျှောက်နိုင်မည်ဟု မဆိုလိုပါ။ ကျောင်းအမျိုးအစား၊ သတ်မှတ်ဌာန၊ သင်တန်း၊ major၊ ဘွဲ့ရအခြေအနေ၊ ကိုရီးယားဘာသာ၊ လစာနှင့် ထောက်ခံချက်စည်းမျဉ်းများ သက်ရောက်နိုင်သည်။
    "ကျောင်းတက်ပြီးရင် E-7-M သေချာရမယ်" ဆိုသော ကြော်ငြာများကို သတိထားပါ။ ကျောင်းဝင်ခြင်း၊ ဘွဲ့ရခြင်း၊ ကိုရီးယားဘာသာအဆင့်၊ အလုပ်ကိုက်ညီမှု၊ အလုပ်ရှင်စာရွက်၊ လစာနှင့် လူဝင်မှုစစ်ဆေးမှုတို့သည် တစ်ဆင့်ချင်းစီ သီးခြားဖြစ်သည်။
    အလုပ်ကမ်းလှမ်းချက်ရှိရုံဖြင့် မလုံလောက်ပါ။ လျှောက်ထားသူနောက်ခံ၊ အလုပ်ရှင်အခြေအနေ၊ လစာ၊ စာရွက်စာတမ်းနှင့် ပိတ်ပင်ချက်သမိုင်းများကို စစ်နိုင်သည်။
    E-7-M သည် E-7-1 နှင့် E-7-4 မတူပါ။ အခြား E-7 အမျိုးအစားခွဲ၏လိုအပ်ချက်ကို မစစ်ဘဲ မကူးယူပါနှင့်။
    ကြေညာချက်များ ပြောင်းနိုင်သောကြောင့် လျှောက်မည့်နေ့၏ လတ်တလောစည်းမျဉ်းကို အမြဲအတည်ပြုပါ။
  notes: |-
    အစိုးရသတင်းအချက်အလက်များတွင် E-7-M/K-CORE ကို ထုတ်လုပ်ရေးနယ်ပယ်အတွက် နိုင်ငံခြားကျွမ်းကျင်လုပ်သား လိုအပ်ချက်ကို ဖြည့်ရန် ကူညီမည့်လမ်းကြောင်းအဖြစ် ဖော်ပြထားသည်။ လက်တွေ့လုပ်ငန်းစဉ်သည် လူဝင်မှုရုံးအသေးစိတ်ကြေညာချက်အလိုက် ကွာနိုင်သည်။
    ၂၀၂၆ ခုနှစ် အစိုးရထုတ်ပြန်ချက်များတွင် သတ်မှတ်ထားသော နည်းပညာကောလိပ်၊ ထုတ်လုပ်ရေးဆိုင်ရာ major၊ TOPIK သို့မဟုတ် KIIP စံနှုန်း၊ major နှင့် ဆက်စပ်သောအလုပ်၊ သင့်တော်သောလစာစံနှုန်းများကို ဖော်ပြထားသည်။ သို့သော် လျှောက်ထားသူတိုင်းအတွက် အလိုအလျောက်အတည်ဖြစ်သည်ဟု မယူဆဘဲ စစ်ရမည့်အချက်များအဖြစ် သတ်မှတ်ပါ။
    ၂၀၂၆ ခုနှစ် ထုတ်ပြန်စာရင်းအရ စစ်ဆေးနိုင်သည့် ကျောင်း/ဌာနများ: Gyeonggi University of Science and Technology - Future Electric Vehicle, Daelim University College - Future Automotive Engineering, Bucheon University - Textile and Fashion Business, Seojeong University - Global Textile and Fashion Business, Osan University - Electrical Engineering, Yongin University of Arts and Science - Automotive Machinery.
    ဆက်လက်စစ်ဆေးနိုင်သည့် ကျောင်း/ဌာနများ: Kyungnam College of Information and Technology - Mechanical Engineering, Dong-Eui Institute of Technology - Mechanical Engineering, Busan Institute of Science and Technology - Automotive Engineering, Yeungjin University - Smart CAD/CAM, Gumi University - Special Construction Machinery Engineering, Koje College - Mechanical Engineering.
    ဆက်လက်စစ်ဆေးနိုင်သည့် ကျောင်း/ဌာနများ: Ulsan College - Mechanical Engineering, Kunjang University College - Smart Agri-food, Jeonju Vision University - Future Mobility, Mokpo Science University - Renewable Energy and Electrical Engineering.
    ဤစာရင်းသည် အစီအစဉ်ဆွဲရန် အသုံးဝင်သော်လည်း screenshot အဟောင်း သို့မဟုတ် social media post တစ်ခုတည်းကို မယုံပါနှင့်။ အတိအကျဌာနနာမည်၊ နိုင်ငံခြားသားဝင်ခွင့်ရှိမရှိ၊ quota နှင့် လက်ရှိ E-7-M သတ်မှတ်ထားမှုကို ကျောင်းနှင့် လူဝင်မှုရုံးတွင် တိုက်ရိုက်အတည်ပြုပါ။
    School and major planning — ကိုရီးယားကျောင်း သို့မဟုတ် ဌာနကို ရွေးနေဆဲဆိုပါက ငွေမပေးခင် ပညာသင်အစီအစဉ် လမ်းညွှန်ကို အရင်ဖတ်ပါ။
    E-7-1၊ E-7-4 နှင့် E-7-M ထဲမှ ဘာကို စစ်ရမလဲ မသေချာလျှင် ကိုယ့်နောက်ခံကနေ စပါ။ ပညာရှင်အလုပ်ကမ်းလှမ်းချက်လား၊ E-9/E-10/H-2 အလုပ်သမိုင်းရှည်လား၊ ကိုရီးယားတွင် ထုတ်လုပ်ရေးဆိုင်ရာ သင်ယူမှုနောက်ခံလား ဆိုတာက စတင်စစ်ရမည့်နေရာဖြစ်သည်။
    ဤစာမျက်နှာသည် အကျဉ်းချုပ်ဖြစ်သည်။ လက်တွေ့မလုပ်မီ HiKorea၊ 1345၊ လူဝင်မှုရုံး၊ ကျောင်း သို့မဟုတ် ကိုရီးယားသံရုံးတွင် လတ်တလော E-7-M ကြေညာချက်ကို အတည်ပြုပါ။
