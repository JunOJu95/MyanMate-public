title: D-2-3 Master's Degree Visa
category: visa
order: 16
lastReviewed: 2026-07-31
en:
  title: D-2-3 Master's Degree Visa
  summary: |-
    D-2-3 is the D-2 route for master's degree study at an eligible Korean graduate school. It is for regular graduate degree study, not research-only status or language training.
  eligibility: |-
    You have admission to an eligible master's degree program in Korea.
    Your bachelor's degree or equivalent education must support graduate admission.
    The Standard Admission Letter and school documents must identify the graduate program correctly.
    Scholarship, advisor, department, tuition, and financial documents should match the current checklist for your case.
  subtypes: ''
  documents: |-
    Visa application or visa issuance documents, passport, photo, fee, and residence card if applying in Korea
    Standard Admission Letter from the graduate school
    School business registration or registration-number certificate copy
    Bachelor's graduation certificate, transcript, and other academic proof, verified if required
    Financial proof, scholarship certificate, sponsor proof, or graduate funding evidence
    Advisor, department, research plan, or additional graduate-program documents if requested
  steps: |-
    Confirm that your admission is for a master's degree program and D-2-3 is correct.
    Get the Standard Admission Letter, department/school documents, and scholarship or funding documents if applicable.
    Verify final education documents when Apostille or consular confirmation is required.
    Prepare financial evidence according to the embassy, school, or immigration checklist.
    Apply through the confirmed embassy, consulate, or Certificate of Visa Issuance route.
    After arrival, complete foreigner registration within 90 days if staying more than 90 days.
  watchout: |-
    D-2-3 is for master's degree study. A research-only case may need a different D-2 route.
    Funding details should match the admission and scholarship documents.
    Graduate students still need permission for part-time work or activities outside the approved status.
    Advisor or department changes can affect school records and extension review, so confirm reporting requirements.
  notes: |-
    D-2-3 extension review can look at enrollment, grades, research progress, tuition, funding, and stay history.
    If your plan is mainly research after already holding a graduate degree, check whether D-2-5 is more relevant.
    Confirm current requirements with your graduate school, Korean embassy, HiKorea, 1345, or immigration office before applying.
ko:
  title: D-2-3 석사 유학 비자
  summary: |-
    D-2-3은 한국 대학원의 석사 학위과정을 위한 D-2 경로입니다. 연구만을 위한 체류자격이나 어학연수가 아니라 정규 대학원 학위과정입니다.
  eligibility: |-
    한국의 대상 석사 학위과정에 입학 허가를 받은 경우 확인할 수 있습니다.
    학사 학위 또는 이에 준하는 학력이 대학원 입학 단계와 맞아야 합니다.
    표준입학허가서와 학교 서류에 대학원 과정이 정확히 표시되어야 합니다.
    장학금, 지도교수, 학과, 등록금, 재정 서류는 본인 사례의 최신 체크리스트와 맞아야 합니다.
  subtypes: ''
  documents: |-
    사증신청 또는 사증발급인정 관련 서류, 여권, 사진, 수수료, 국내 신청 시 외국인등록증
    대학원에서 발급한 표준입학허가서
    학교 사업자등록증 또는 고유번호증 사본
    학사 졸업증명서, 성적증명서 등 학력 입증서류. 필요한 경우 확인
    재정 입증서류, 장학금 증명서, 보증인 자료 또는 대학원 연구비·지원 증빙
    요구되는 경우 지도교수, 학과, 연구계획 또는 대학원 과정 관련 추가서류
  steps: |-
    입학이 석사 학위과정인지, D-2-3이 맞는지 확인합니다.
    표준입학허가서, 학과/학교 서류, 해당되는 경우 장학금 또는 재정지원 서류를 받습니다.
    아포스티유 또는 영사확인이 필요하면 최종학력 서류를 확인받습니다.
    공관, 학교 또는 출입국 체크리스트에 맞춰 재정 증빙을 준비합니다.
    확인된 재외공관 또는 사증발급인정서 경로로 신청합니다.
    입국 후 90일을 초과해 체류하면 90일 이내에 외국인등록을 합니다.
  watchout: |-
    D-2-3은 석사 학위과정입니다. 연구만 하는 경우 다른 D-2 경로가 맞을 수 있습니다.
    재정지원 내용은 입학서류와 장학금 서류가 서로 맞아야 합니다.
    대학원생도 허가된 체류 범위를 벗어난 시간제 취업이나 활동은 별도 허가가 필요합니다.
    지도교수나 학과 변경은 학교 기록과 연장 심사에 영향을 줄 수 있으므로 신고 필요 여부를 확인하세요.
  notes: |-
    D-2-3 연장 심사는 재학, 성적, 연구 진행, 등록금, 재정지원, 체류이력을 볼 수 있습니다.
    이미 대학원 학위를 가지고 주된 목적이 연구라면 D-2-5가 더 관련 있는지 확인하세요.
    신청 전 대학원, 재외공관, 하이코리아, 1345 또는 출입국에서 현재 요건을 확인하세요.
my:
  title: D-2-3 Master Degree ဗီဇာ
  summary: |-
    D-2-3 သည် ကိုရီးယားဘွဲ့လွန်ကျောင်းတွင် master degree တက်ရန်အတွက် D-2 လမ်းကြောင်းဖြစ်သည်။ သုတေသနတစ်ခုတည်းအတွက် သို့မဟုတ် ကိုရီးယားဘာသာသင်တန်းအတွက် မဟုတ်ဘဲ တရားဝင်ဘွဲ့လွန်သင်တန်းအတွက် ဖြစ်သည်။
  eligibility: |-
    ကိုရီးယားရှိ ကိုက်ညီသော master degree Program မှ ဝင်ခွင့်ရထားသူဖြစ်ရမည်။
    Bachelor degree သို့မဟုတ် ကိုက်ညီသောပညာရေးသည် ဘွဲ့လွန်ဝင်ခွင့်အဆင့်နှင့် ကိုက်ညီရမည်။
    Standard Admission Letter နှင့် ကျောင်းစာရွက်များတွင် ဘွဲ့လွန် Program ကို မှန်ကန်စွာ ဖော်ပြထားရမည်။
    Scholarship၊ supervisor၊ department၊ ကျောင်းလခနှင့် ငွေကြေးစာရွက်များသည် ကိုယ့်ကိစ္စ၏ လတ်တလော checklist နှင့် ကိုက်ညီရမည်။
  subtypes: ''
  documents: |-
    ဗီဇာလျှောက်လွှာ သို့မဟုတ် ဗီဇာထုတ်ပေးမှုအတည်ပြုစာဆိုင်ရာစာရွက်၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ ဗီဇာကြေး၊ ကိုရီးယားတွင်လျှောက်လျှင် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်
    ဘွဲ့လွန်ကျောင်းမှ Standard Admission Letter
    ကျောင်း၏ Business Registration သို့မဟုတ် Registration Number Certificate မိတ္တူ
    Bachelor ဘွဲ့လက်မှတ်၊ အမှတ်စာရင်းနှင့် အခြားပညာရေးအထောက်အထားများ။ လိုအပ်ပါက အတည်ပြုချက်
    ငွေကြေးအထောက်အထား၊ Scholarship စာ၊ Sponsor စာ သို့မဟုတ် ဘွဲ့လွန်ရန်ပုံငွေအထောက်အထား
    တောင်းပါက supervisor၊ department၊ research plan သို့မဟုတ် ဘွဲ့လွန် Program ဆိုင်ရာ အပိုစာရွက်များ
  steps: |-
    ဝင်ခွင့်သည် master degree Program ဖြစ်မဖြစ်နှင့် D-2-3 မှန်မမှန် အတည်ပြုပါ။
    Standard Admission Letter၊ department/ကျောင်းစာရွက်များနှင့် သက်ဆိုင်ပါက Scholarship သို့မဟုတ် funding စာရွက်များ ရယူပါ။
    Apostille သို့မဟုတ် သံရုံးအတည်ပြုချက်လိုပါက နောက်ဆုံးပညာရေးစာရွက်များကို အတည်ပြုပါ။
    သံရုံး၊ ကျောင်း သို့မဟုတ် လူဝင်မှုရုံး checklist အလိုက် ငွေကြေးအထောက်အထား ပြင်ပါ။
    အတည်ပြုထားသော သံရုံး/ကောင်စစ်ဝန်ရုံး သို့မဟုတ် Certificate of Visa Issuance လမ်းကြောင်းဖြင့် လျှောက်ပါ။
    ကိုရီးယားတွင် ၉၀ ရက်ထက်ပိုနေမည်ဆိုပါက ရောက်ပြီး ၉၀ ရက်အတွင်း နိုင်ငံခြားသားမှတ်ပုံတင်ပါ။
  watchout: |-
    D-2-3 သည် master degree သင်တန်းအတွက် ဖြစ်သည်။ သုတေသနတစ်ခုတည်းဖြစ်ပါက အခြား D-2 လမ်းကြောင်းကို စစ်ရနိုင်သည်။
    Funding အချက်အလက်သည် ဝင်ခွင့်စာရွက်နှင့် Scholarship စာရွက်များနှင့် ကိုက်ညီရမည်။
    ဘွဲ့လွန်ကျောင်းသားများလည်း ခွင့်ပြုထားသောနေထိုင်ခွင့်အပြင် အချိန်ပိုင်းအလုပ် သို့မဟုတ် လှုပ်ရှားမှုများလုပ်ရန် သီးခြားခွင့်ပြုချက် လိုနိုင်သည်။
    Supervisor သို့မဟုတ် department ပြောင်းခြင်းသည် ကျောင်းမှတ်တမ်းနှင့် သက်တမ်းတိုးစစ်ဆေးမှုကို သက်ရောက်နိုင်သောကြောင့် တင်ပြရန်လိုမလို စစ်ပါ။
  notes: |-
    D-2-3 သက်တမ်းတိုးချိန်တွင် ကျောင်းတက်နေမှု၊ အမှတ်၊ research progress၊ ကျောင်းလခ၊ funding နှင့် နေထိုင်သမိုင်းကို စစ်နိုင်သည်။
    Graduate degree ရှိပြီး အဓိကရည်ရွယ်ချက်က သုတေသနဖြစ်ပါက D-2-5 ပိုသက်ဆိုင်မဆိုင် စစ်ပါ။
    မလျှောက်မီ ဘွဲ့လွန်ကျောင်း၊ ကိုရီးယားသံရုံး၊ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလောလိုအပ်ချက်ကို အတည်ပြုပါ။
