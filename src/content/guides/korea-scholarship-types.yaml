title: Korea Scholarship Types
category: study
order: 5
lastReviewed: 2026-07-30
en:
  title: Scholarship types in Korea
  summary: >-
    Korea has different scholarship routes for international students, including
    GKS, university scholarships, department or professor-related support,
    foundation or company scholarships, and exchange-student support. The right
    option depends on your level, major, school, grades, language proof, and
    application route.
  eligibility: >-
    You want to study in Korea but need to understand what scholarship options may exist

    You are comparing GKS, university scholarship, professor support, or private foundation scholarship

    You need to know whether a scholarship is for admission, tuition reduction, living allowance, or exchange study

    You want to avoid believing scholarship promises without checking the official notice

    You are preparing school applications and want to choose realistic scholarship targets
  subtypes: >-
    GKS, or Global Korea Scholarship, is a Korean government scholarship route. It can support degree programs and some exchange-related programs, depending on the official notice for that year.

    University admission scholarships are offered by individual universities. They may depend on grades, TOPIK or English score, admission result, major, or school budget.

    Semester or continuing scholarships may apply after admission. These often depend on GPA, credits, attendance, language score, or school rules, so they are not always guaranteed every semester.

    Graduate school, department, lab, or professor-related support may exist for master or PhD students. The process can be different by major, professor, lab, and university.

    Foundation, company, or local-government scholarships can also exist, but eligibility, nationality, major, deadline, and benefit can change by program.

    Exchange-student scholarships are usually for students already enrolled at a partner university. They are different from full degree admission scholarships.
  documents: >-
    Official scholarship notice for the exact year and semester

    University admission guideline and scholarship page

    Passport, transcript, graduation certificate, and nationality or family documents if required

    Study plan, personal statement, recommendation letter, or research plan if required

    TOPIK, English score, GPA, ranking, portfolio, or research record if the scholarship asks for it

    Financial documents if the school or visa process still asks for proof even when scholarship support exists

    Scholarship result, tuition invoice, payment deadline, and refund rule after admission
  steps: >-
    First decide your level: undergraduate, master, PhD, exchange, or language course.

    Check whether you want a government scholarship, school scholarship, professor or lab support, foundation scholarship, or exchange scholarship.

    Read the official notice before preparing documents. Scholarship name, deadline, quota, benefit, and eligible countries can change.

    Check whether the scholarship is automatic with admission or requires a separate application.

    Check what the scholarship covers: tuition only, partial tuition, full tuition, dormitory, living allowance, airfare, language training, or other support.

    Check the renewal rule. Some scholarships apply only for the first semester, and some require GPA or credits to continue.

    Make a shortlist of realistic programs and prepare documents based on the exact notice, not general social media posts.

    Before final decision, confirm the scholarship and visa-related financial proof with the university or official authority.
  watchout: >-
    Do not assume every Korean university gives full scholarship to international students

    Do not assume scholarship means all living costs are covered

    Do not trust verbal promises that are not written in the official notice or admission result

    Do not ignore renewal conditions such as GPA, credits, language score, or conduct rules

    Do not submit fake bank statements, fake certificates, edited transcripts, or false scholarship letters

    Avoid anyone offering guaranteed scholarship, guaranteed admission, guaranteed visa, or document shortcuts
  notes: >-
    Study in Korea official scholarship page: GKS, other scholarships, and official scholarship notices

    University official admission and scholarship pages: exact deadline, benefit, application method, renewal rule, and required documents

    Department, graduate school, or professor page: lab or research-related support for graduate students

    Korean embassy, visa center, HiKorea, or 1345: visa and financial-proof questions when scholarship affects D-2 visa preparation
ko:
  title: 한국 장학금 종류
  summary: >-
    한국 유학 장학금에는 GKS, 대학 장학금, 학과 또는 교수 관련 지원, 재단·기업
    장학금, 교환학생 지원 등 여러 경로가 있습니다. 어떤 장학금이 맞는지는
    과정, 전공, 학교, 성적, 어학 증빙과 지원 방식에 따라 달라집니다.
  eligibility: >-
    한국 유학을 생각하고 있지만 어떤 장학금이 있는지 먼저 알고 싶을 때

    GKS, 대학 장학금, 교수 지원 또는 민간 재단 장학금을 비교하고 있을 때

    장학금이 입학 장학금인지, 등록금 감면인지, 생활비 지원인지, 교환학생 지원인지 구분해야 할 때

    공식 공지 없이 들은 장학금 약속을 그대로 믿는 실수를 피하고 싶을 때

    학교 지원을 준비하면서 현실적인 장학금 목표를 정하고 싶을 때
  subtypes: >-
    GKS, Global Korea Scholarship은 한국 정부 장학금 경로입니다. 해당 연도의 공식 공지에 따라 학위 과정과 일부 교환 관련 프로그램을 지원할 수 있습니다.

    대학 입학 장학금은 개별 대학에서 제공합니다. 성적, TOPIK 또는 영어 성적, 입학 결과, 전공 또는 학교 예산에 따라 달라질 수 있습니다.

    재학 중 장학금 또는 계속 장학금은 입학 후 적용될 수 있습니다. 보통 GPA, 이수 학점, 출석, 어학 성적 또는 학교 규정에 따라 달라지므로 매 학기 자동 보장되는 것은 아닙니다.

    대학원, 학과, 연구실 또는 교수 관련 지원은 석사나 박사 과정에서 있을 수 있습니다. 전공, 교수, 연구실과 대학에 따라 절차가 다를 수 있습니다.

    재단, 기업 또는 지방자치단체 장학금도 있을 수 있지만 자격, 국적, 전공, 마감일과 혜택은 프로그램마다 달라질 수 있습니다.

    교환학생 장학금은 보통 협정 대학에 이미 재학 중인 학생을 위한 지원입니다. 정규 학위 입학 장학금과는 다릅니다.
  documents: >-
    해당 연도와 학기의 공식 장학금 공지

    대학 입학 모집요강과 장학금 페이지

    필요한 경우 여권, 성적증명서, 졸업증명서, 국적 또는 가족 관련 서류

    필요한 경우 학업계획서, 자기소개서, 추천서 또는 연구계획서

    장학금에서 요구하는 경우 TOPIK, 영어 성적, GPA, 석차, 포트폴리오 또는 연구 실적

    장학금이 있어도 학교 또는 비자 절차에서 요구할 수 있는 재정 증빙 서류

    합격 후 장학금 결과, 등록금 고지서, 납부 마감일과 환불 규정
  steps: >-
    먼저 본인의 과정을 정합니다: 학부, 석사, 박사, 교환학생 또는 어학연수.

    정부 장학금, 학교 장학금, 교수 또는 연구실 지원, 재단 장학금, 교환학생 장학금 중 무엇을 찾는지 확인합니다.

    서류를 준비하기 전에 공식 공지를 읽습니다. 장학금 이름, 마감일, 선발 인원, 혜택과 대상 국가는 바뀔 수 있습니다.

    입학과 동시에 자동 심사되는 장학금인지, 별도 신청이 필요한 장학금인지 확인합니다.

    장학금이 무엇을 지원하는지 확인합니다: 등록금 일부, 등록금 전액, 기숙사, 생활비, 항공권, 어학연수 또는 기타 지원.

    계속 조건을 확인합니다. 어떤 장학금은 첫 학기만 적용되고, 어떤 장학금은 GPA나 이수 학점이 필요할 수 있습니다.

    현실적인 프로그램 후보를 정하고 일반 SNS 글이 아니라 정확한 공지에 맞춰 서류를 준비합니다.

    최종 결정 전 장학금과 비자 관련 재정 증빙을 대학 또는 공식 기관에 확인합니다.
  watchout: >-
    모든 한국 대학이 유학생에게 전액 장학금을 준다고 생각하면 안 됨

    장학금이 있다고 해서 모든 생활비까지 포함된다고 단정하면 안 됨

    공식 공지나 합격 결과에 적혀 있지 않은 말로만 들은 약속을 믿으면 안 됨

    GPA, 이수 학점, 어학 성적 또는 생활 규정 같은 계속 조건을 무시하면 안 됨

    허위 은행잔고증명, 허위 증명서, 수정된 성적표 또는 허위 장학금 확인서를 제출하면 안 됨

    장학금 보장, 입학 보장, 비자 보장 또는 서류 shortcut 제안은 피해야 함
  notes: >-
    Study in Korea 공식 장학금 페이지: GKS, 기타 장학금과 공식 장학금 공지 확인

    대학 공식 입학 및 장학금 페이지: 정확한 마감일, 혜택, 신청 방법, 계속 조건과 요구 서류 확인

    학과, 대학원 또는 교수 페이지: 대학원생을 위한 연구실 또는 연구 관련 지원 확인

    한국 대사관, 비자센터, 하이코리아 또는 1345: 장학금이 D-2 비자 준비와 재정 증빙에 영향을 줄 때 확인
my:
  title: Scholarship အမျိုးအစားများ
  summary: >-
    ကိုရီးယားမှာ နိုင်ငံခြားသားကျောင်းသားများအတွက် Scholarship လမ်းကြောင်းများ
    အမျိုးမျိုးရှိပါသည်။ GKS၊ တက္ကသိုလ်မှပေးသော Scholarship၊ Department သို့မဟုတ်
    Professor နှင့်ဆက်စပ်သော support၊ Foundation/Company Scholarship နှင့်
    Exchange student support စသည်တို့ရှိနိုင်ပါသည်။ ဘယ် Scholarship က ကိုယ့်အတွက်
    ကိုက်မလဲဆိုတာက ပညာသင်အဆင့်၊ Major၊ ကျောင်း၊ အမှတ်၊ ဘာသာစကားအထောက်အထားနှင့်
    လျှောက်ထားမည့်လမ်းကြောင်းပေါ် မူတည်ပါသည်။
  eligibility: >-
    ကိုရီးယားမှာ ပညာသင်ချင်ပြီး Scholarship option များကို အရင်နားလည်ချင်သောအခါ

    GKS၊ university scholarship၊ professor support သို့မဟုတ် private foundation scholarship များကို နှိုင်းယှဉ်နေသောအခါ

    Scholarship က admission scholarship လား၊ tuition reduction လား၊ living allowance လား၊ exchange student support လား ခွဲခြားသိချင်သောအခါ

    Official notice မစစ်ဘဲ Scholarship ကတိများကို ယုံမိခြင်းကို ရှောင်ချင်သောအခါ

    School application ပြင်ဆင်နေပြီး realistic scholarship target ရွေးချင်သောအခါ
  subtypes: >-
    GKS သို့မဟုတ် Global Korea Scholarship သည် ကိုရီးယားအစိုးရ Scholarship လမ်းကြောင်းဖြစ်ပါသည်။ ထိုနှစ်၏ official notice အလိုက် degree program နှင့် exchange-related program အချို့ကို support ပေးနိုင်ပါသည်။

    University admission scholarship သည် တက္ကသိုလ်တစ်ခုချင်းက ပေးသော Scholarship ဖြစ်ပါသည်။ အမှတ်၊ TOPIK သို့မဟုတ် English score၊ admission result၊ Major သို့မဟုတ် ကျောင်း budget အလိုက် ကွာနိုင်ပါသည်။

    Semester scholarship သို့မဟုတ် continuing scholarship သည် ကျောင်းဝင်ပြီးနောက် သက်ရောက်နိုင်သော Scholarship ဖြစ်ပါသည်။ များသောအားဖြင့် GPA၊ credit၊ attendance၊ language score သို့မဟုတ် school rule ပေါ်မူတည်သောကြောင့် semester တိုင်း အလိုအလျောက်ရမည်ဟု မယူဆသင့်ပါ။

    Graduate school၊ department၊ lab သို့မဟုတ် professor-related support သည် master/PhD ကျောင်းသားများအတွက် ရှိနိုင်ပါသည်။ Major၊ professor၊ lab နှင့် university အလိုက် process ကွာနိုင်ပါသည်။

    Foundation၊ company သို့မဟုတ် local-government scholarship များလည်း ရှိနိုင်ပါသည်။ Eligibility၊ nationality၊ major၊ deadline နှင့် benefit များသည် program တစ်ခုချင်းအလိုက် ပြောင်းနိုင်ပါသည်။

    Exchange student scholarship သည် များသောအားဖြင့် partner university တွင် လက်ရှိတက်နေသော ကျောင်းသားများအတွက်ဖြစ်ပါသည်။ Full degree admission scholarship နှင့် မတူပါ။
  documents: >-
    ကိုယ်လျှောက်မည့် year နှင့် semester အတွက် official scholarship notice

    University admission guideline နှင့် scholarship page

    လိုအပ်ပါက passport၊ transcript၊ graduation certificate နှင့် nationality/family documents

    လိုအပ်ပါက study plan၊ personal statement၊ recommendation letter သို့မဟုတ် research plan

    Scholarship က တောင်းပါက TOPIK၊ English score၊ GPA၊ ranking၊ portfolio သို့မဟုတ် research record

    Scholarship ရှိသော်လည်း ကျောင်း သို့မဟုတ် visa process က တောင်းနိုင်သော financial documents

    Admission ပြီးနောက် scholarship result၊ tuition invoice၊ payment deadline နှင့် refund rule
  steps: >-
    အရင်ဆုံး ကိုယ့်ပညာသင်အဆင့်ကို သတ်မှတ်ပါ: undergraduate၊ master၊ PhD၊ exchange သို့မဟုတ် language course။

    ကိုယ်ရှာနေတာက government scholarship လား၊ school scholarship လား၊ professor/lab support လား၊ foundation scholarship လား၊ exchange scholarship လား ခွဲခြားပါ။

    စာရွက်စာတမ်းမပြင်ဆင်မီ official notice ကို ဖတ်ပါ။ Scholarship name၊ deadline၊ quota၊ benefit နှင့် eligible countries များ ပြောင်းနိုင်ပါသည်။

    Scholarship က admission နဲ့အတူ automatic စစ်ပေးတာလား၊ သီးခြား application လိုတာလား စစ်ပါ။

    Scholarship က ဘာကို cover လုပ်သလဲ စစ်ပါ: partial tuition၊ full tuition၊ dormitory၊ living allowance၊ airfare၊ language training သို့မဟုတ် other support။

    Renewal rule ကို စစ်ပါ။ တချို့ Scholarship က first semester အတွက်ပဲ ဖြစ်နိုင်ပြီး တချို့က ဆက်ရရန် GPA သို့မဟုတ် credits လိုနိုင်ပါသည်။

    ကိုယ့်အခြေအနေနဲ့ ကိုက်နိုင်သော program များကို shortlist လုပ်ပြီး general social media post မဟုတ်ဘဲ exact official notice အတိုင်း စာရွက်စာတမ်းပြင်ပါ။

    နောက်ဆုံးဆုံးဖြတ်မီ Scholarship နှင့် visa-related financial proof ကို university သို့မဟုတ် official authority မှာ အတည်ပြုပါ။
  watchout: >-
    ကိုရီးယားတက္ကသိုလ်တိုင်းက international student များကို full scholarship ပေးတယ်ဟု မယူဆပါနှင့်

    Scholarship ရှိတာနဲ့ living cost အားလုံးပါ cover ဖြစ်မယ်ဟု မယူဆပါနှင့်

    Official notice သို့မဟုတ် admission result ထဲမှာ မရေးထားသော verbal promise များကို မယုံပါနှင့်

    GPA၊ credits၊ language score သို့မဟုတ် conduct rule စသည့် renewal condition များကို မလျစ်လျူရှုပါနှင့်

    Fake bank statement၊ fake certificate၊ ပြင်ထားသော transcript သို့မဟုတ် false scholarship letter မတင်ပါနှင့်

    Guaranteed scholarship၊ guaranteed admission၊ guaranteed visa သို့မဟုတ် document shortcut များကို ရှောင်ပါ
  notes: >-
    Study in Korea official scholarship page: GKS၊ other scholarships နှင့် official scholarship notices များကို စစ်ရန်

    University official admission and scholarship pages: exact deadline၊ benefit၊ application method၊ renewal rule နှင့် required documents စစ်ရန်

    Department၊ graduate school သို့မဟုတ် professor page: graduate students အတွက် lab/research-related support စစ်ရန်

    ကိုရီးယားသံရုံး၊ visa center၊ HiKorea သို့မဟုတ် 1345: Scholarship က D-2 visa preparation နှင့် financial proof ကို ထိခိုက်နိုင်သောအခါ စစ်ရန်
