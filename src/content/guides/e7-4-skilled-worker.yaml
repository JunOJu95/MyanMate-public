title: E-7-4 Skilled Worker Visa
category: visa
order: 13
lastReviewed: 2026-07-31
en:
  title: E-7-4 Skilled Worker Visa
  summary: |-
    E-7-4 is a skilled-worker route inside the E-7 Specific Activity status. It is mainly checked by experienced workers who are legally staying and working on E-9, E-10, or H-2 and want to change to a long-term skilled-worker status.
  eligibility: |-
    E-7-4 is not a general job visa. It is a change route for eligible E-9, E-10, or H-2 workers who meet the current skilled-worker framework.
    Immigration reviews current stay status, Korean work history, income, employer recommendation, Korean-language or social-integration evidence, age, points, bonuses, deductions, and disqualification items.
    The employer must usually support the case with recommendation and company evidence. Company eligibility, hiring limits, industry, tax, and employment conditions can matter.
    A headline score alone does not guarantee approval. Mandatory conditions and disqualification checks must also be satisfied.
  subtypes: ''
  documents: |-
    Application documents, passport, photo, residence card, fee, and proof of address if required
    Employment contract, employer recommendation, business registration, tax documents, and company employment records
    Evidence of eligible E-9, E-10, or H-2 stay and Korean work history for the required period
    Income records, tax records, wage evidence, and documents proving the current job and employer
    TOPIK, KIIP, or other accepted Korean-language or social-integration evidence
    Points evidence for age, work history, skill, qualification, income, bonus points, and any deduction or disqualification records
  steps: |-
    Confirm that your current status is eligible for E-7-4 review.
    Check the current E-7-4 notice, score table, quota, employer recommendation rule, and company requirements.
    Calculate points conservatively and collect official evidence for every claimed point.
    Ask the employer to prepare recommendation, contract, business, tax, and employment documents.
    Apply through the immigration route confirmed by HiKorea, 1345, or the immigration office while legally staying in Korea.
    After approval, keep employer, workplace, income, address, passport, tax, and registration information current for future extensions.
  watchout: |-
    E-7-4 is different from E-7-1. Do not prepare it like a D-10 to professional-job case.
    Being on E-9, E-10, or H-2 does not automatically qualify. Work history, income, Korean ability, employer support, and other rules still matter.
    Old score tables, old quota notices, and old online summaries can be wrong. Confirm the latest notice before calculating.
    Employer change, workplace change, income change, tax issue, violation history, or illegal work can affect review or extension.
    Do not start a different job or work outside the approved scope before immigration permission.
  notes: |-
    E-7-4 is often attractive because it can be more stable than some non-professional work statuses, but it still has reporting duties and extension review.
    The Ministry of Justice can change annual selection size, salary/income standards, score tables, employer limits, and required documents.
    This page is a cautious overview. Confirm the current E-7-4 notice with HiKorea, 1345, or the immigration office before preparing documents.
ko:
  title: E-7-4 숙련기능인력 비자
  summary: |-
    E-7-4는 E-7 특정활동 체류자격 안의 숙련기능인력 경로입니다. 주로 E-9, E-10, H-2로 합법 체류·근무 중인 경력자가 장기 숙련 취업 체류자격으로 변경하려는 경우 확인합니다.
  eligibility: |-
    E-7-4는 일반 취업비자가 아닙니다. 현재 숙련기능인력 제도에 맞는 E-9, E-10, H-2 근로자를 위한 자격변경 경로입니다.
    출입국은 현재 체류자격, 국내 근무이력, 소득, 기업 추천, 한국어 또는 사회통합 증빙, 나이, 점수, 가점, 감점, 결격사유를 함께 봅니다.
    고용기관은 보통 추천서와 회사 자료로 신청을 지원해야 합니다. 회사 자격, 고용한도, 업종, 세금, 고용조건이 영향을 줄 수 있습니다.
    점수만 높다고 허가가 보장되는 것은 아닙니다. 의무요건과 결격사유도 함께 충족해야 합니다.
  subtypes: ''
  documents: |-
    신청서류, 여권, 사진, 외국인등록증, 수수료, 필요한 경우 체류지 입증서류
    고용계약서, 기업 추천서, 사업자등록, 납세자료, 회사 고용현황 자료
    E-9, E-10, H-2 체류와 필요한 기간의 국내 근무이력을 입증하는 자료
    소득자료, 납세자료, 임금 입증자료, 현재 직무와 고용기관을 보여주는 자료
    TOPIK, 사회통합프로그램 또는 인정되는 한국어·사회통합 증빙
    나이, 근무이력, 기술, 자격, 소득, 가점, 감점과 결격 관련 기록을 입증하는 점수 자료
  steps: |-
    현재 체류자격이 E-7-4 검토 대상인지 먼저 확인합니다.
    최신 E-7-4 공고, 배점표, 선발규모, 기업 추천 기준과 회사 요건을 확인합니다.
    점수를 보수적으로 계산하고 각 점수 항목의 공식 증빙을 모읍니다.
    고용기관에 추천서, 계약서, 사업자등록, 세금, 고용현황 서류를 준비하도록 요청합니다.
    국내에 합법 체류 중인 상태에서 하이코리아, 1345 또는 출입국에서 확인한 경로로 신청합니다.
    허가 후에는 고용기관, 근무지, 소득, 체류지, 여권, 세금, 등록정보를 최신 상태로 유지합니다.
  watchout: |-
    E-7-4는 E-7-1과 다릅니다. D-10에서 전문직으로 가는 방식처럼 준비하면 안 됩니다.
    E-9, E-10, H-2 체류자라고 자동으로 가능한 것은 아닙니다. 근무이력, 소득, 한국어, 기업 지원과 다른 요건이 모두 중요합니다.
    오래된 배점표, 오래된 선발공고, 온라인 요약은 틀릴 수 있습니다. 계산 전 최신 공고를 확인하세요.
    고용기관 변경, 근무지 변경, 소득 변경, 세금 문제, 위반 이력, 불법취업은 심사나 연장에 영향을 줄 수 있습니다.
    출입국 허가 전에는 다른 업무를 시작하거나 허가 범위를 벗어나 일하지 마세요.
  notes: |-
    E-7-4는 일부 비전문취업 체류자격보다 안정적으로 느껴질 수 있지만 신고의무와 연장심사는 계속 있습니다.
    법무부는 연도별 선발규모, 임금·소득 기준, 배점표, 기업 한도와 필요서류를 변경할 수 있습니다.
    이 페이지는 조심스럽게 정리한 개요입니다. 서류 준비 전 하이코리아, 1345 또는 출입국에서 최신 E-7-4 공고를 확인하세요.
my:
  title: E-7-4 ကျွမ်းကျင်လုပ်သား ဗီဇာ
  summary: |-
    E-7-4 သည် E-7 အထူးလုပ်ငန်းဗီဇာအတွင်းရှိ ကျွမ်းကျင်လုပ်သားလမ်းကြောင်းဖြစ်သည်။ အဓိကအားဖြင့် E-9၊ E-10 သို့မဟုတ် H-2 ဖြင့် တရားဝင်နေထိုင်အလုပ်လုပ်နေသော အတွေ့အကြုံရှိသူများက ရေရှည်ကျွမ်းကျင်အလုပ်ဗီဇာသို့ ပြောင်းလိုသည့်အခါ စစ်ဆေးသည်။
  eligibility: |-
    E-7-4 သည် သာမန်အလုပ်ဗီဇာမဟုတ်ပါ။ လက်ရှိကျွမ်းကျင်လုပ်သားစနစ်နှင့် ကိုက်ညီသော E-9၊ E-10 သို့မဟုတ် H-2 လုပ်သားများအတွက် နေထိုင်ခွင့်ပြောင်းလဲမှုလမ်းကြောင်းဖြစ်သည်။
    လူဝင်မှုရုံးသည် လက်ရှိဗီဇာ၊ ကိုရီးယားအလုပ်သမိုင်း၊ ဝင်ငွေ၊ ကုမ္ပဏီထောက်ခံချက်၊ ကိုရီးယားဘာသာ သို့မဟုတ် လူမှုရေးပေါင်းစည်းမှုအထောက်အထား၊ အသက်၊ အမှတ်၊ အပိုအမှတ်၊ လျှော့အမှတ်နှင့် ပိတ်ပင်ချက်များကို အတူစစ်သည်။
    အလုပ်ရှင်သည် အများအားဖြင့် ထောက်ခံစာနှင့် ကုမ္ပဏီစာရွက်များဖြင့် ထောက်ပံ့ရသည်။ ကုမ္ပဏီအရည်အချင်း၊ ခန့်ထားခွင့်အကန့်အသတ်၊ လုပ်ငန်းနယ်ပယ်၊ အခွန်နှင့် အလုပ်ခန့်ထားမှုအခြေအနေများလည်း သက်ရောက်နိုင်သည်။
    အမှတ်မြင့်ရုံဖြင့် ခွင့်ပြုမည်ဟု မဆိုလိုပါ။ မဖြစ်မနေစံနှုန်းများနှင့် ပိတ်ပင်ချက်များကိုလည်း ပြည့်မီရမည်။
  subtypes: ''
  documents: |-
    လျှောက်လွှာစာရွက်များ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အခကြေးငွေ၊ လိုအပ်ပါက နေရပ်အထောက်အထား
    အလုပ်စာချုပ်၊ ကုမ္ပဏီထောက်ခံစာ၊ ကုမ္ပဏီမှတ်ပုံတင်၊ အခွန်စာရွက်နှင့် ကုမ္ပဏီအလုပ်ခန့်ထားမှုမှတ်တမ်း
    E-9၊ E-10 သို့မဟုတ် H-2 နေထိုင်မှုနှင့် လိုအပ်သောကာလ၏ ကိုရီးယားအလုပ်သမိုင်းကို သက်သေပြသောစာရွက်များ
    ဝင်ငွေစာရွက်၊ အခွန်စာရွက်၊ လစာအထောက်အထားနှင့် လက်ရှိအလုပ်တာဝန်/အလုပ်ရှင်ကို ပြသောစာရွက်များ
    TOPIK၊ KIIP သို့မဟုတ် လက်ခံသော ကိုရီးယားဘာသာ/လူမှုရေးပေါင်းစည်းမှုအထောက်အထား
    အသက်၊ အလုပ်သမိုင်း၊ ကျွမ်းကျင်မှု၊ အရည်အချင်း၊ ဝင်ငွေ၊ အပိုအမှတ်၊ လျှော့အမှတ်နှင့် ပိတ်ပင်ချက်ဆိုင်ရာမှတ်တမ်းများအတွက် အမှတ်အထောက်အထား
  steps: |-
    လက်ရှိဗီဇာသည် E-7-4 စစ်ဆေးနိုင်သောဗီဇာဖြစ်မဖြစ် အရင်စစ်ပါ။
    လတ်တလော E-7-4 ကြေညာချက်၊ အမှတ်ဇယား၊ quota၊ ကုမ္ပဏီထောက်ခံချက်စံနှုန်းနှင့် ကုမ္ပဏီလိုအပ်ချက်များကို စစ်ပါ။
    အမှတ်ကို သတိထားတွက်ပြီး အမှတ်တိုင်းအတွက် တရားဝင်အထောက်အထားများကို စုပါ။
    အလုပ်ရှင်ဘက်မှ ထောက်ခံစာ၊ စာချုပ်၊ ကုမ္ပဏီမှတ်ပုံတင်၊ အခွန်နှင့် အလုပ်ခန့်ထားမှုစာရွက်များ ပြင်ဆင်ရန် တောင်းပါ။
    ကိုရီးယားတွင် တရားဝင်နေထိုင်နေစဉ် HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးက အတည်ပြုသော လမ်းကြောင်းဖြင့် လျှောက်ပါ။
    ခွင့်ပြုပြီးနောက် အလုပ်ရှင်၊ အလုပ်နေရာ၊ ဝင်ငွေ၊ နေရပ်၊ နိုင်ငံကူးလက်မှတ်၊ အခွန်နှင့် မှတ်ပုံတင်အချက်အလက်ကို နောက်ဆုံးအခြေအနေအတိုင်း ထိန်းသိမ်းပါ။
  watchout: |-
    E-7-4 သည် E-7-1 နှင့် မတူပါ။ D-10 မှ ပညာရှင်အလုပ်သို့ ပြောင်းသည့်ပုံစံလို မပြင်ပါနှင့်။
    E-9၊ E-10 သို့မဟုတ် H-2 ရှိရုံဖြင့် အလိုအလျောက် မရနိုင်ပါ။ အလုပ်သမိုင်း၊ ဝင်ငွေ၊ ကိုရီးယားဘာသာ၊ ကုမ္ပဏီထောက်ခံမှုနှင့် အခြားစံနှုန်းများအားလုံး အရေးကြီးသည်။
    အဟောင်းအမှတ်ဇယား၊ အဟောင်း quota ကြေညာချက်နှင့် online summary များ မှားနိုင်သည်။ အမှတ်မတွက်မီ လတ်တလောကြေညာချက်ကို စစ်ပါ။
    အလုပ်ရှင်ပြောင်းခြင်း၊ အလုပ်နေရာပြောင်းခြင်း၊ ဝင်ငွေပြောင်းခြင်း၊ အခွန်ပြဿနာ၊ ဥပဒေချိုးဖောက်မှုသမိုင်း သို့မဟုတ် တရားမဝင်အလုပ်လုပ်မှုသည် စစ်ဆေးမှု သို့မဟုတ် သက်တမ်းတိုးချိန်တွင် သက်ရောက်နိုင်သည်။
    လူဝင်မှုရုံးခွင့်ပြုချက်မရမီ အခြားအလုပ်မစပါနှင့်။ ခွင့်ပြုထားသောအလုပ်အတိုင်းသာ လုပ်ပါ။
  notes: |-
    E-7-4 သည် အချို့ non-professional အလုပ်ဗီဇာများထက် ပိုတည်ငြိမ်နိုင်သော်လည်း တင်ပြရမည့်တာဝန်နှင့် သက်တမ်းတိုးစစ်ဆေးမှုများ ဆက်ရှိသည်။
    တရားရေးဝန်ကြီးဌာနသည် နှစ်စဉ်ရွေးချယ်အရေအတွက်၊ လစာ/ဝင်ငွေစံနှုန်း၊ အမှတ်ဇယား၊ ကုမ္ပဏီအကန့်အသတ်နှင့် လိုအပ်စာရွက်များကို ပြောင်းနိုင်သည်။
    ဤစာမျက်နှာသည် သတိထားရေးထားသော အကျဉ်းချုပ်ဖြစ်သည်။ စာရွက်မပြင်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် လတ်တလော E-7-4 ကြေညာချက်ကို အတည်ပြုပါ။
