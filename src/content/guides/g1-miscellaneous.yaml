title: G-1 Miscellaneous Visa
category: visa
order: 8
lastReviewed: 2026-07-31
en:
  title: G-1 Miscellaneous Visa — temporary stay for special reasons
  summary: |-
    G-1 is a broad temporary stay status for people who do not fit the usual visa categories but have a recognized reason to remain in Korea for a limited period. It is often case-specific, so the reason and documents matter more than the visa name itself.
  eligibility: |-
    G-1 may be reviewed for people who need to stay in Korea for a recognized special reason, such as industrial-accident treatment, illness or accident treatment, a lawsuit or legal process, wage-arrears mediation, refugee or humanitarian procedures, pregnancy or childbirth-related humanitarian reasons, medical treatment after entry, serious victim-support situations, or family connection to a humanitarian stay holder.
    It is not a general visa for staying longer after another visa ends. Immigration reviews whether the reason is real, current, unavoidable, and supported by documents.
    The exact G-1 subcategory and permitted stay period depend on the facts of the case. Confirm your route with HiKorea, 1345, or the immigration office before preparing the application.
  subtypes: |-
    Treatment or accident-related stay — industrial accident, illness, accident, or long-term medical treatment cases where evidence from a medical institution or related agency is needed
    Legal or labor-related stay — lawsuit, court process, legal relief process, or wage-arrears mediation that requires the person to remain in Korea
    Refugee or humanitarian stay — refugee applicant, humanitarian stay holder, or eligible family-related humanitarian cases
    Other recognized reasons — other cases where the Ministry of Justice recognizes a temporary stay reason after reviewing the evidence
  documents: |-
    Common: application form, passport, photo, residence card if already registered, fee, and proof of address
    Proof of the reason: medical opinion, diagnosis, treatment plan, industrial-accident document, court document, lawsuit filing document, labor-office document, refugee-application receipt, humanitarian-stay notice, or other official evidence related to the case
    Proof that the stay is still needed: treatment period, litigation schedule, mediation status, official notice, or another document showing why leaving Korea now is difficult
    Financial or support evidence may be requested, especially for treatment, living costs, or family-support situations
    Family or caregiver evidence may be requested when a spouse, child, parent, guardian, caregiver, or humanitarian-stay family member is part of the case
    Immigration can add or reduce documents depending on the case, so check the current list before applying.
  steps: |-
    Identify the real reason for staying and check whether G-1 is the correct route, or whether another visa/status is more appropriate.
    Collect official evidence that proves the reason is current, not just planned or past.
    Check the latest HiKorea residence-status manual or call 1345 to confirm the subcategory, documents, fee, and application channel.
    If you are in Korea, reserve a visit or use the available HiKorea procedure only after confirming that your case can be filed in Korea.
    Submit the application before your current stay expires and keep copies of every document and receipt.
    After approval, check the allowed stay period, whether any activity is restricted, and when the next extension or report is due.
  watchout: |-
    G-1 is not guaranteed. A difficult situation alone may not be enough if the official evidence does not support the reason.
    Do not work just because you hold G-1. Employment normally requires a proper work status, a status change, or separate permission depending on the G-1 subcategory.
    Some G-1 holders have limited routes to change into other statuses. Confirm before planning school, work, business, or long-term residence from G-1.
    Do not submit false medical, court, labor, refugee, or family documents. False information can create immigration and legal problems.
    If the case involves refugee protection, violence, crime damage, family separation, or serious medical issues, get help from an official office or qualified legal/support organization rather than relying only on online information.
  notes: |-
    The common official examples include treatment, lawsuits, wage arrears, refugee or humanitarian procedures, medical patients, victim-support situations, and family of humanitarian stay holders.
    The period granted is case-specific and may be shorter than one year for some routes. Extensions also depend on whether the reason still exists.
    Refugee applicants and humanitarian stay holders may have separate work-permission rules, but permission must be confirmed before working.
    This is a summary. Use HiKorea, the 1345 Foreign Resident Hotline, or the immigration office to confirm the exact G-1 route and latest documents before applying.
ko:
  title: G-1 기타 체류자격 — 특별한 사유가 있을 때의 임시 체류
  summary: |-
    G-1은 일반적인 체류자격에 바로 들어맞지 않지만, 제한된 기간 동안 한국에 머물 필요가 있다고 인정되는 경우 검토되는 넓은 범위의 임시 체류자격입니다. 이름보다 실제 사유와 입증서류가 더 중요합니다.
  eligibility: |-
    G-1은 산업재해 청구와 치료, 질병 또는 사고 치료, 소송이나 권리구제 절차, 임금체불 관련 노동관서 중재, 난민 또는 인도적 체류 절차, 임신·출산 등 인도적 사유, 입국 후 장기치료가 필요한 외국인환자, 범죄 피해 등 인도적 고려가 필요한 경우, 인도적 체류자의 가족 등에서 검토될 수 있습니다.
    다른 비자가 끝났을 때 단순히 더 머물기 위한 일반 연장 비자가 아닙니다. 출입국은 사유가 실제로 존재하는지, 현재 진행 중인지, 출국이 어려운지, 서류로 입증되는지를 봅니다.
    세부 약호와 허가기간은 사실관계에 따라 달라집니다. 신청 준비 전 하이코리아, 1345 또는 관할 출입국·외국인관서에서 본인 경로를 확인하세요.
  subtypes: |-
    치료·사고 관련 체류 — 산업재해, 질병, 사고, 장기치료 등 의료기관 또는 관련 기관의 입증이 필요한 경우
    법률·노동 관련 체류 — 소송, 재판, 권리구제 절차, 임금체불 중재 등 국내 체류가 필요한 절차가 진행 중인 경우
    난민·인도적 체류 — 난민신청자, 인도적 체류허가자 또는 관련 가족 등 인도적 사유가 있는 경우
    기타 인정 사유 — 제출된 자료를 바탕으로 법무부가 임시 체류 필요성을 인정하는 그 밖의 경우
  documents: |-
    공통: 신청서, 여권, 사진, 외국인등록증(등록외국인), 수수료, 체류지 입증서류
    사유 입증서류: 소견서, 진단서, 치료계획서, 산재 관련 서류, 법원 또는 소송 서류, 노동관서 서류, 난민신청 접수증, 인도적 체류 관련 통보서, 그 밖의 공식 입증자료
    체류 필요성 입증: 치료기간, 재판 일정, 중재 진행 상태, 공식 통보, 현재 출국이 어려운 사유를 보여주는 자료
    치료비, 생활비 또는 가족 지원이 쟁점이 되는 경우 재정능력이나 지원 관련 자료를 요구받을 수 있습니다.
    배우자, 자녀, 부모, 보호자, 간병인 또는 인도적 체류자의 가족이 관련된 경우 가족관계 또는 보호자 관계 입증자료가 필요할 수 있습니다.
    첨부서류는 사례에 따라 가감될 수 있으므로 신청 전 최신 목록을 확인하세요.
  steps: |-
    체류가 필요한 실제 사유를 정리하고 G-1이 맞는지, 다른 체류자격이 더 적절한지 먼저 확인합니다.
    과거 사정이나 계획이 아니라 현재 진행 중인 사유를 입증할 공식 자료를 준비합니다.
    하이코리아의 최신 체류자격별 안내 매뉴얼 또는 1345에서 세부 약호, 서류, 수수료, 접수 방법을 확인합니다.
    국내에서 신청하는 경우 본인 사례가 국내 접수 가능한지 확인한 뒤 방문예약 또는 가능한 하이코리아 절차를 이용합니다.
    현재 체류기간이 끝나기 전에 신청하고 제출서류와 접수증 사본을 보관합니다.
    허가 후에는 받은 체류기간, 활동 제한, 다음 연장 또는 신고 기한을 확인합니다.
  watchout: |-
    G-1은 자동으로 허가되는 자격이 아닙니다. 어려운 사정이 있더라도 공식 입증이 부족하면 진행이 어려울 수 있습니다.
    G-1을 가지고 있다고 바로 일할 수 있는 것은 아닙니다. 취업은 세부 유형에 따라 취업 자격, 자격변경 또는 별도 허가가 필요할 수 있습니다.
    일부 G-1 자격자는 다른 체류자격으로의 변경이 제한될 수 있습니다. 유학, 취업, 사업, 장기거주 계획을 세우기 전에 확인하세요.
    허위 진단서, 소송서류, 노동관서 서류, 난민 관련 서류, 가족관계 서류를 제출하지 마세요. 체류와 법적 문제로 이어질 수 있습니다.
    난민보호, 폭력·범죄 피해, 가족 분리, 중대한 의료 문제가 관련된 경우 온라인 정보만으로 판단하지 말고 공식기관 또는 자격 있는 법률·지원기관의 도움을 받으세요.
  notes: |-
    공식 예시에는 치료, 소송, 임금체불, 난민 또는 인도적 절차, 외국인환자, 피해자 보호, 인도적 체류자의 가족 등이 포함됩니다.
    허가기간은 사례별로 다르며 일부 유형은 1년보다 짧을 수 있습니다. 연장도 사유가 계속 존재하는지에 따라 달라집니다.
    난민신청자와 인도적 체류자는 별도의 취업활동 허가 규칙이 적용될 수 있으나, 일하기 전 반드시 허가 여부를 확인해야 합니다.
    본 정보는 요약입니다. 신청 전 하이코리아, 1345 또는 관할 출입국·외국인관서에서 정확한 세부 유형과 최신 서류를 확인하세요.
my:
  title: G-1 အထူးအကြောင်းပြချက်ရှိသော ယာယီနေထိုင်ခွင့်
  summary: |-
    G-1 သည် ပုံမှန်ဗီဇာအမျိုးအစားများထဲသို့ တိတိကျကျ မဝင်သော်လည်း ကိုရီးယားတွင် အချိန်ကန့်သတ်ပြီး ဆက်နေဖို့ လိုအပ်သော အကြောင်းအရာရှိသည်ဟု စစ်ဆေးနိုင်သော ယာယီနေထိုင်ခွင့်ဖြစ်သည်။ ဗီဇာနာမည်ထက် မိမိအကြောင်းပြချက်နှင့် အထောက်အထားက ပိုအရေးကြီးသည်။
  eligibility: |-
    G-1 ကို အလုပ်ခွင်ဒဏ်ရာကုသမှု၊ ရောဂါ သို့မဟုတ် မတော်တဆမှုကြောင့် ကုသမှုလိုခြင်း၊ တရားရုံးကိစ္စ သို့မဟုတ် အခွင့်အရေးကာကွယ်ရေးလုပ်ငန်းစဉ်၊ လစာမပေးသေးသောကိစ္စအတွက် အလုပ်သမားရုံးတွင် ဖြေရှင်းနေခြင်း၊ ဒုက္ခသည် သို့မဟုတ် လူသားချင်းစာနာမှုဆိုင်ရာ လုပ်ငန်းစဉ်၊ ကိုယ်ဝန်/မီးဖွားခြင်းကြောင့် ချက်ချင်းထွက်ခွာရန် ခက်ခဲခြင်း၊ ကိုရီးယားဝင်ပြီးနောက် ရေရှည်ကုသမှုလိုသော လူနာ၊ ပြင်းထန်စွာ ထိခိုက်နစ်နာပြီး အကူအညီလိုသည့်အခြေအနေ၊ လူသားချင်းစာနာမှုနေထိုင်ခွင့်ရသူ၏ မိသားစုကိစ္စ စသည့်အခြေအနေများတွင် စစ်ဆေးနိုင်သည်။
    အခြားဗီဇာပြီးသွားလို့ “နည်းနည်းပိုနေချင်သည်” ဆိုသည့် အထွေထွေသက်တမ်းတိုးဗီဇာ မဟုတ်ပါ။ လူဝင်မှုရုံးသည် အကြောင်းပြချက်ရှိမရှိ၊ လက်ရှိဆက်လက်ဖြစ်နေမနေ၊ ထွက်ခွာရန် ခက်ခဲမခက်ခဲနှင့် စာရွက်ဖြင့် သက်သေပြနိုင်မနိုင်ကို စစ်ဆေးသည်။
    G-1 အမျိုးအစားခွဲနှင့် ခွင့်ပြုကာလသည် မိမိကိစ္စအခြေအနေအလိုက် ကွာသည်။ မပြင်ဆင်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် ကိုယ့်လမ်းကြောင်းကို အတည်ပြုပါ။
  subtypes: |-
    ကုသမှုနှင့် မတော်တဆမှုဆိုင်ရာ နေထိုင်ခွင့် — အလုပ်ခွင်ဒဏ်ရာ၊ ရောဂါ၊ မတော်တဆမှု၊ ရေရှည်ကုသမှု စသည့် ဆေးရုံ သို့မဟုတ် သက်ဆိုင်ရာအဖွဲ့၏ အထောက်အထားလိုသောကိစ္စ
    တရားရေးနှင့် အလုပ်သမားရေးရာကိစ္စ — တရားရုံးကိစ္စ၊ အခွင့်အရေးကာကွယ်ရေးလုပ်ငန်းစဉ်၊ လစာမပေးသေးသောကိစ္စကို အလုပ်သမားရုံးတွင် ဖြေရှင်းနေခြင်း
    ဒုက္ခသည်နှင့် လူသားချင်းစာနာမှုဆိုင်ရာ နေထိုင်ခွင့် — ဒုက္ခသည်လျှောက်ထားသူ၊ လူသားချင်းစာနာမှုနေထိုင်ခွင့်ရသူ သို့မဟုတ် သက်ဆိုင်သော မိသားစုကိစ္စ
    အခြားအသိအမှတ်ပြုနိုင်သော အကြောင်းရင်း — တင်ပြသောအထောက်အထားအပေါ် မူတည်ပြီး တရားရေးဝန်ကြီးဌာနက ယာယီနေထိုင်ရန်လိုသည်ဟု စစ်ဆေးနိုင်သော အခြားကိစ္စများ
  documents: |-
    အများသုံး: လျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်၊ ဓာတ်ပုံ၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် ရှိပါက၊ အခကြေးငွေ၊ နေရပ်အထောက်အထား
    အကြောင်းပြချက်အထောက်အထား: ဆရာဝန်မှတ်ချက်၊ ဆေးစစ်ချက်၊ ကုသမှုအစီအစဉ်၊ အလုပ်ခွင်ဒဏ်ရာစာရွက်၊ တရားရုံး သို့မဟုတ် တရားစွဲဆိုမှုစာရွက်၊ အလုပ်သမားရုံးစာရွက်၊ ဒုက္ခသည်လျှောက်လွှာလက်ခံစာ၊ လူသားချင်းစာနာမှုနေထိုင်ခွင့်ဆိုင်ရာ အသိပေးစာ သို့မဟုတ် မိမိကိစ္စနှင့်ဆက်စပ်သော တရားဝင်အထောက်အထား
    ဆက်နေရန်လိုအပ်ကြောင်းပြသောစာရွက်: ကုသရမည့်ကာလ၊ တရားရုံးရက်ချိန်း၊ ညှိနှိုင်းမှုအခြေအနေ၊ တရားဝင်အသိပေးစာ သို့မဟုတ် ယခုထွက်ခွာရန် ခက်ခဲကြောင်းပြသည့် စာရွက်
    ကုသစရိတ်၊ နေထိုင်စရိတ် သို့မဟုတ် မိသားစုထောက်ပံ့မှုကိစ္စတွင် ငွေကြေးအထောက်အထား သို့မဟုတ် ထောက်ပံ့သူအထောက်အထား တောင်းနိုင်သည်။
    အိမ်ထောင်ဖက်၊ သားသမီး၊ မိဘ၊ စောင့်ရှောက်သူ၊ လူနာစောင့် သို့မဟုတ် လူသားချင်းစာနာမှုနေထိုင်ခွင့်ရသူ၏ မိသားစုနှင့် ဆက်စပ်ပါက မိသားစုဆက်နွယ်မှု သို့မဟုတ် စောင့်ရှောက်မှုအထောက်အထား လိုနိုင်သည်။
    လူဝင်မှုရုံးသည် ကိစ္စအလိုက် စာရွက်စာတမ်းကို ထပ်တိုး သို့မဟုတ် လျှော့နိုင်သောကြောင့် မလျှောက်မီ လတ်တလောစာရင်းကို စစ်ပါ။
  steps: |-
    ကိုရီးယားတွင် ဆက်နေရန်လိုသော အကြောင်းပြချက်ကို ရှင်းရှင်းလင်းလင်းခွဲပြီး G-1 သင့်တော်မတော်၊ အခြားနေထိုင်ခွင့်က ပိုမှန်မမှန် အရင်စစ်ပါ။
    အတိတ်ကိစ္စ သို့မဟုတ် မဖြစ်သေးသောအစီအစဉ်မဟုတ်ဘဲ လက်ရှိဆက်လက်ဖြစ်နေသော အကြောင်းပြချက်ကို သက်သေပြနိုင်သော တရားဝင်စာရွက်များ စုပါ။
    HiKorea ၏ လတ်တလောနေထိုင်ခွင့်အမျိုးအစားစာရင်း သို့မဟုတ် 1345 မှ အမျိုးအစားခွဲ၊ လိုအပ်စာရွက်၊ အခကြေးငွေ၊ တင်ရမည့်နေရာကို အတည်ပြုပါ။
    ကိုရီးယားအတွင်းတွင် လျှောက်မည်ဆိုလျှင် မိမိကိစ္စကို ကိုရီးယားအတွင်းလျှောက်ခွင့်ရှိမရှိ အတည်ပြုပြီးမှ ချိန်းဆိုခြင်း သို့မဟုတ် HiKorea လုပ်ငန်းစဉ်ကို အသုံးပြုပါ။
    လက်ရှိနေထိုင်ခွင့်မကုန်မီ လျှောက်ထားပြီး တင်ထားသောစာရွက်နှင့် လက်ခံစာမိတ္တူများကို သိမ်းထားပါ။
    ခွင့်ပြုပြီးနောက် ရရှိသောနေထိုင်ကာလ၊ လုပ်ဆောင်ခွင့်ကန့်သတ်ချက်၊ နောက်ထပ်သက်တမ်းတိုးရက် သို့မဟုတ် တင်ပြရမည့်တာဝန်ကို စစ်ပါ။
  watchout: |-
    G-1 သည် အလိုအလျောက်ရနိုင်သော နေထိုင်ခွင့်မဟုတ်ပါ။ အခြေအနေခက်ခဲသော်လည်း တရားဝင်အထောက်အထားမလုံလောက်လျှင် ခက်ခဲနိုင်သည်။
    G-1 ရှိရုံဖြင့် အလုပ်လုပ်ခွင့်ရသည်ဟု မယူဆပါနှင့်။ အလုပ်လုပ်ရန် အမျိုးအစားခွဲအလိုက် အလုပ်ဗီဇာ၊ နေထိုင်ခွင့်ပြောင်းခြင်း သို့မဟုတ် သီးခြားခွင့်ပြုချက် လိုနိုင်သည်။
    G-1 အချို့သည် အခြားနေထိုင်ခွင့်သို့ ပြောင်းရန် ကန့်သတ်ချက်ရှိနိုင်သည်။ ကျောင်းတက်ခြင်း၊ အလုပ်လုပ်ခြင်း၊ စီးပွားရေးလုပ်ခြင်း သို့မဟုတ် ရေရှည်နေထိုင်ရန် စီစဉ်မီ အရင်စစ်ပါ။
    ဆေးစာ၊ တရားရုံးစာရွက်၊ အလုပ်သမားရုံးစာရွက်၊ ဒုက္ခသည်ဆိုင်ရာစာရွက်၊ မိသားစုစာရွက်တို့ကို မမှန်မကန် မတင်ပါနှင့်။ နေထိုင်ခွင့်နှင့် ဥပဒေရေးရာပြဿနာ ဖြစ်နိုင်သည်။
    ဒုက္ခသည်ကာကွယ်ရေး၊ အကြမ်းဖက်မှု/ရာဇဝတ်မှုကြောင့် ထိခိုက်နစ်နာမှု၊ မိသားစုခွဲနေရခြင်း၊ အရေးကြီးဆေးကုသမှုကိစ္စများပါဝင်လျှင် အွန်လိုင်းအချက်အလက်တစ်ခုတည်းဖြင့် မဆုံးဖြတ်ဘဲ တရားဝင်ရုံး သို့မဟုတ် ခွင့်ပြုထားသော ဥပဒေ/အကူအညီအဖွဲ့ထံ မေးပါ။
  notes: |-
    တရားဝင်ဥပမာများတွင် ကုသမှု၊ တရားရုံးကိစ္စ၊ လစာမပေးသေးသောကိစ္စ၊ ဒုက္ခသည် သို့မဟုတ် လူသားချင်းစာနာမှုဆိုင်ရာ လုပ်ငန်းစဉ်၊ ကိုရီးယားတွင် ကုသရန်လိုသော လူနာ၊ ထိခိုက်နစ်နာသူအကူအညီ၊ လူသားချင်းစာနာမှုနေထိုင်ခွင့်ရသူ၏ မိသားစု စသည်တို့ ပါဝင်သည်။
    ခွင့်ပြုကာလသည် ကိစ္စအလိုက်ကွာပြီး အချို့လမ်းကြောင်းများတွင် ၁ နှစ်ထက်တိုနိုင်သည်။ သက်တမ်းတိုးခြင်းလည်း အကြောင်းပြချက် ဆက်လက်ရှိမရှိအပေါ် မူတည်သည်။
    ဒုက္ခသည်လျှောက်ထားသူနှင့် လူသားချင်းစာနာမှုနေထိုင်ခွင့်ရသူတို့တွင် အလုပ်လုပ်ခွင့်ဆိုင်ရာ သီးခြားစည်းမျဉ်းများ ရှိနိုင်သော်လည်း အလုပ်မစမီ ခွင့်ပြုချက်ရှိမရှိ အတည်ပြုရမည်။
    ဤအချက်အလက်သည် အကျဉ်းချုပ်ဖြစ်သည်။ မလျှောက်မီ HiKorea၊ 1345 သို့မဟုတ် လူဝင်မှုရုံးတွင် G-1 အမျိုးအစားခွဲနှင့် လတ်တလောစာရွက်စာတမ်းကို အတည်ပြုပါ။
