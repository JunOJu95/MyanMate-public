      - icon: shield
        audience: none
        evidenceLevel: general
        title:
          en: Keep records and protect sensitive documents
          ko: 접수 기록·민감정보 보호
          my: လက်ခံမှတ်တမ်းနှင့် အရေးကြီးအချက်အလက်ကို ကာကွယ်ပါ
        body:
          en: Keep the receipt number, application date, visit reservation, and submitted-material list in your own secure file. Do not send full card or passport images, passwords, or financial details through an unofficial message.
          ko: 접수번호, 신청일, 방문예약과 제출자료 목록은 본인의 안전한 파일에 보관합니다. 외국인등록증·여권 전체 사진, 비밀번호나 금융정보를 출처가 불분명한 메시지로 보내지 마세요.
          my: လက်ခံနံပါတ်၊ လျှောက်ရက်၊ သွားရောက်ရက်ချိန်းနှင့် တင်ပြစာရွက်စာရင်းကို မိမိ၏လုံခြုံသောဖိုင်တွင် သိမ်းပါ။ မှတ်ပုံတင်ကတ် သို့မဟုတ် နိုင်ငံကူးလက်မှတ်ပုံအပြည့်၊ စကားဝှက် သို့မဟုတ် ငွေကြေးအချက်အလက်ကို မသေချာသောမက်ဆေ့ချ်ဖြင့် မပို့ပါနှင့်။

