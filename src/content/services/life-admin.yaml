lastReviewed: 2026-07-29
title:
  en: Everyday administration for foreign residents
  ko: 외국인 생활 행정 정보
  my: နိုင်ငံခြားသားများအတွက် နေ့စဉ်အုပ်ချုပ်ရေး အချက်အလက်
description:
  en: >-
    Manage your residence card, passport, and stay period separately, then check your own duties when your address, passport, school, or workplace changes. The detailed passport-renewal guide includes preparation, steps you complete yourself, completion checks, exceptions, and official places to confirm.
  ko: >-
    외국인등록증·여권·체류기간을 따로 관리하고, 이사나 새 여권 발급, 학교·직장 변경 때 본인에게 적용되는 절차를 확인하는 방법을 정리했습니다. 여권 갱신 상세 가이드에서는 준비할 것, 직접 진행할 순서, 완료 기준, 예외와 공식 확인처까지 제공합니다.
  my: >-
    နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ နိုင်ငံကူးလက်မှတ်နှင့် နေထိုင်ခွင့်ကာလကို သီးခြားစီစီမံပြီး လိပ်စာ၊ နိုင်ငံကူးလက်မှတ်၊ ကျောင်း သို့မဟုတ် အလုပ်ခွင်ပြောင်းချိန်တွင် မိမိလုပ်ရမည့်အဆင့်များကို စစ်ဆေးနည်းအား စုစည်းထားပါသည်။ နိုင်ငံကူးလက်မှတ်အသစ်အတွက် အသေးစိတ်လမ်းညွှန်တွင် ပြင်ဆင်ရန်၊ ကိုယ်တိုင်လုပ်ဆောင်ရန်၊ ပြီးစီးမှုစစ်ဆေးရန်၊ ခြွင်းချက်နှင့် တရားဝင်စစ်ဆေးရန်နေရာများ ပါဝင်ပါသည်။

sections:
  - id: document-dates
    variant: standard
    icon: admin
    title:
      en: Manage important documents and dates
      ko: 중요한 서류와 날짜 관리하기
      my: အရေးကြီးစာရွက်စာတမ်းနှင့် ရက်စွဲများကို စီမံပါ
    intro:
      en: A passport expiry date, authorized stay period, and residence-card information are different records. Check each one regularly and keep sensitive details private.
      ko: 여권 만료일, 허가된 체류기간과 외국인등록증 정보는 서로 다른 기록입니다. 각각 정기적으로 확인하고 민감한 정보는 안전하게 보관하세요.
      my: နိုင်ငံကူးလက်မှတ်သက်တမ်းကုန်ရက်၊ ခွင့်ပြုထားသော နေထိုင်ခွင့်ကာလနှင့် မှတ်ပုံတင်ကတ်အချက်အလက်တို့သည် မတူသောမှတ်တမ်းများဖြစ်သည်။ တစ်ခုစီကို ပုံမှန်စစ်ဆေးပြီး အရေးကြီးအချက်အလက်ကို လုံခြုံစွာထားပါ။
    items:
      - icon: visa
        audience: none
        evidenceLevel: general
        title:
          en: Residence-card details
          ko: 외국인등록증 정보
          my: နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် အချက်အလက်
        body:
          en: Compare the name, nationality, status of stay, stay period, and other displayed details with your passport and official records. For loss, damage, or incorrect information, do not alter the card yourself; check the official replacement or correction process.
          ko: 외국인등록증의 이름, 국적, 체류자격, 체류기간과 표시된 정보를 여권·공식 기록과 비교합니다. 분실·훼손이나 잘못된 정보가 있으면 임의로 고치지 말고 공식 재발급·정정 절차를 확인하세요.
          my: ကတ်ပေါ်ရှိ အမည်၊ နိုင်ငံသား၊ နေထိုင်ခွင့်အမျိုးအစား၊ ကာလနှင့် အခြားအချက်အလက်များကို နိုင်ငံကူးလက်မှတ်နှင့် တရားဝင်မှတ်တမ်းတို့နှင့် နှိုင်းယှဉ်ပါ။ ပျောက်ဆုံးခြင်း၊ ပျက်စီးခြင်း သို့မဟုတ် မှားယွင်းမှုရှိပါက ကိုယ်တိုင်မပြင်ဘဲ တရားဝင်ပြန်လည်ထုတ်ပေးခြင်း သို့မဟုတ် ပြင်ဆင်ခြင်းကို စစ်ဆေးပါ။
      - icon: doc
        audience: none
        evidenceLevel: general
        title:
          en: Passport expiry and registered details
          ko: 여권 만료일과 등록정보
          my: နိုင်ငံကူးလက်မှတ်သက်တမ်းနှင့် မှတ်ပုံတင်အချက်အလက်
        body:
          en: Manage the passport expiry date separately from the authorized stay period. After receiving a new passport, use the detailed guide below to check the number, issue date, expiry date, and any other changed details.
          ko: 여권 만료일은 체류기간 만료일과 별개로 관리합니다. 새 여권을 받으면 아래 상세 가이드에서 여권번호·발급일·유효기간과 그 밖에 달라진 정보를 확인하세요.
          my: နိုင်ငံကူးလက်မှတ်သက်တမ်းကုန်ရက်ကို နေထိုင်ခွင့်ကာလကုန်ရက်နှင့် သီးခြားစီစီမံပါ။ အသစ်ရပြီးနောက် အောက်ပါအသေးစိတ်လမ်းညွှန်တွင် နံပါတ်၊ ထုတ်ပေးရက်၊ သက်တမ်းကုန်ရက်နှင့် အခြားပြောင်းလဲသောအချက်များကို စစ်ဆေးပါ။
      - icon: list
        audience: none
        evidenceLevel: general
        title:
          en: Separate reminders for each date
          ko: 날짜별 알림 만들기
          my: ရက်စွဲတစ်ခုစီအတွက် သတိပေးချက်ထားပါ
        body:
          en: Set early, separate reminders for your stay period, passport, school enrollment, and employment contract when relevant. When a reminder arrives, recheck the current timing and documents for your own status through an official source.
          ko: 체류기간, 여권, 재학기간과 근로계약 등 본인에게 중요한 날짜마다 여유 있게 별도 알림을 설정합니다. 알림 시점에 본인의 체류자격에 맞는 시기와 준비서류를 공식 확인처에서 다시 확인하세요.
          my: နေထိုင်ခွင့်ကာလ၊ နိုင်ငံကူးလက်မှတ်၊ ကျောင်းတက်ကာလနှင့် အလုပ်စာချုပ်ကဲ့သို့ မိမိအတွက်အရေးကြီးသော ရက်စွဲတစ်ခုစီကို ကြိုတင်သတိပေးချက်ထားပါ။ သတိပေးချိန်တွင် မိမိနေထိုင်ခွင့်အတွက် လက်ရှိအချိန်နှင့် လိုအပ်စာရွက်များကို တရားဝင်နေရာတွင် ပြန်စစ်ပါ။

  - id: change-events
    variant: standard
    icon: housing
    title:
      en: Check your duties when circumstances change
      ko: 변경사항이 생겼을 때 확인하기
      my: အပြောင်းအလဲရှိချိန်တွင် မိမိတာဝန်ကို စစ်ဆေးပါ
    intro:
      en: Address, passport, personal, school, or workplace changes can involve a different task depending on your status. Do not assume that updating one record updates every other record.
      ko: 주소, 여권, 인적사항, 학교나 직장 변경은 체류자격에 따라 서로 다른 절차가 관련될 수 있습니다. 한 곳의 기록을 바꿨다고 다른 기록까지 모두 바뀐다고 생각하지 마세요.
      my: လိပ်စာ၊ နိုင်ငံကူးလက်မှတ်၊ ကိုယ်ရေးအချက်အလက်၊ ကျောင်း သို့မဟုတ် အလုပ်ခွင်ပြောင်းခြင်းတွင် နေထိုင်ခွင့်အလိုက် မတူသောလုပ်ငန်းစဉ်များ ပါဝင်နိုင်ပါသည်။ မှတ်တမ်းတစ်ခုကို ပြင်လိုက်ခြင်းဖြင့် အခြားမှတ်တမ်းအားလုံး ပြောင်းသည်ဟု မယူဆပါနှင့်။
    items:
      - icon: housing
        audience: none
        evidenceLevel: general
        title:
          en: Moving and place-of-stay records
          ko: 이사와 체류지 변경
          my: အိမ်ပြောင်းခြင်းနှင့် နေထိုင်ရာမှတ်တမ်း
        body:
          en: Moving does not necessarily update Immigration records automatically. Check whether a change-of-place-of-stay task applies to you, its current timing and accepted locations, and which proof of residence is required.
          ko: 이사했다고 출입국의 주소 기록이 자동으로 바뀌는 것은 아닙니다. 체류지 변경 업무가 본인에게 적용되는지, 현재 기한·접수처와 필요한 주소 증빙을 공식 안내에서 확인하세요.
          my: အိမ်ပြောင်းလိုက်သည်နှင့် လူဝင်မှုကြီးကြပ်ရေးလိပ်စာမှတ်တမ်း အလိုအလျောက်ပြောင်းမည်မဟုတ်ပါ။ နေထိုင်ရာပြောင်းလဲမှုလုပ်ငန်း မိမိနှင့်သက်ဆိုင်မသက်ဆိုင်၊ လက်ရှိအချိန်၊ လက်ခံရာနေရာနှင့် လိုအပ်သောလိပ်စာအထောက်အထားကို တရားဝင်လမ်းညွှန်တွင် စစ်ဆေးပါ။
      - icon: doc
        audience: none
        evidenceLevel: general
        title:
          en: New passport or personal-detail changes
          ko: 새 여권·인적사항 변경
          my: နိုင်ငံကူးလက်မှတ်အသစ် သို့မဟုတ် ကိုယ်ရေးအချက်အလက်ပြောင်းခြင်း
        body:
          en: A passport-number update and a change to name, nationality, date of birth, or sex are not the same task. Use the situation map and exception section below before proceeding.
          ko: 여권번호 갱신과 성명·국적·생년월일·성별 변경은 같은 업무가 아닙니다. 진행 전에 아래 상황 지도와 예외 구간을 확인하세요.
          my: နိုင်ငံကူးလက်မှတ်နံပါတ်ပြင်ခြင်းနှင့် အမည်၊ နိုင်ငံသား၊ မွေးသက္ကရာဇ် သို့မဟုတ် လိင်ပြောင်းခြင်းသည် တူညီသောလုပ်ငန်းမဟုတ်ပါ။ မလုပ်မီ အောက်ပါအခြေအနေမြေပုံနှင့် ခြွင်းချက်အပိုင်းကို စစ်ဆေးပါ။
      - icon: jobs
        audience: none
        evidenceLevel: general
        title:
          en: School or workplace changes
          ko: 학교·직장 정보 변경
          my: ကျောင်း သို့မဟုတ် အလုပ်ခွင်ပြောင်းခြင်း
        body:
          en: Updating a record at the same school or employer differs from changing the institution, enrollment status, employer, workplace, job, or duties. Use the separate routes below and confirm your exact case through HiKorea or 1345.
          ko: 같은 학교·회사의 내부정보 갱신과 소속기관·재학 상태·회사·근무처·직업·업무 자체 변경은 다릅니다. 아래의 구분된 경로를 이용하고 정확한 사례는 하이코리아 또는 1345에서 확인하세요.
          my: ယခင်ကျောင်း သို့မဟုတ် အလုပ်ရှင်၏ အတွင်းမှတ်တမ်းပြင်ခြင်းနှင့် အဖွဲ့အစည်း၊ ကျောင်းတက်အခြေအနေ၊ အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ် သို့မဟုတ် တာဝန်ကိုယ်တိုင် ပြောင်းခြင်းသည် မတူပါ။ အောက်ပါသီးခြားလမ်းကြောင်းကို အသုံးပြုပြီး တိကျသောကိစ္စကို HiKorea သို့မဟုတ် 1345 တွင် စစ်ဆေးပါ။

  - id: situation-map
    variant: overview
    icon: search
    title:
      en: Find the route that matches your situation
      ko: 내 상황에 맞는 경로부터 찾으세요
      my: မိမိအခြေအနေနှင့်ကိုက်ညီသော လမ်းကြောင်းကို ဦးစွာရွေးပါ
    intro:
      en: >-
        An Immigration report, an update inside a school or company, and an actual change of school or workplace are different tasks. Updating one place does not automatically update the others. If you have not completed foreigner registration or use a different residence-status document, the same steps may not apply; confirm with 1345 first.
      ko: >-
        출입국 신고, 학교·회사 내부정보 갱신, 학교·직장 자체 변경은 서로 다른 업무입니다. 한 곳의 정보를 바꿨다고 다른 기록까지 자동으로 바뀌지 않습니다. 외국인등록을 하지 않았거나 다른 체류 신분증을 사용한다면 같은 절차가 적용되지 않을 수 있으므로 1345에서 먼저 확인하세요.
      my: >-
        လူဝင်မှုကြီးကြပ်ရေးတင်ပြမှု၊ ကျောင်း သို့မဟုတ် ကုမ္ပဏီအတွင်း အချက်အလက်ပြင်ဆင်မှုနှင့် ကျောင်း သို့မဟုတ် အလုပ်ခွင်ကို အမှန်တကယ်ပြောင်းခြင်းတို့သည် မတူညီသောလုပ်ငန်းများဖြစ်ပါသည်။ နေရာတစ်ခုကို ပြင်လိုက်ခြင်းဖြင့် အခြားမှတ်တမ်းများ အလိုအလျောက်မပြောင်းပါ။ နိုင်ငံခြားသားမှတ်ပုံတင်ခြင်း မပြီးသေးပါက သို့မဟုတ် အခြားနေထိုင်ခွင့်အထောက်အထားကို အသုံးပြုပါက တူညီသောအဆင့်များ မသက်ဆိုင်နိုင်သဖြင့် 1345 ထံ ဦးစွာမေးမြန်းပါ။
    items:
      - icon: visa
        audience: general
        evidenceLevel: general
        title:
          en: I received a new passport
          ko: 새 여권을 받았어요
          my: နိုင်ငံကူးလက်မှတ်အသစ် ရရှိပါပြီ
        body:
          en: >-
            Start by checking the Immigration passport-information report. Do this even if only the passport number, issue date, or expiry date changed.
          ko: >-
            여권번호·발급일·유효기간만 바뀌었더라도 출입국 여권정보 변경 신고부터 확인하세요.
          my: >-
            နိုင်ငံကူးလက်မှတ်နံပါတ်၊ ထုတ်ပေးသည့်ရက် သို့မဟုတ် သက်တမ်းကုန်ရက်သာ ပြောင်းလဲသော်လည်း လူဝင်မှုကြီးကြပ်ရေး နိုင်ငံကူးလက်မှတ်အချက်အလက် ပြောင်းလဲမှုတင်ပြခြင်းကို ဦးစွာစစ်ဆေးပါ။
        jumpTo: passport-report
      - icon: users
        audience: student
        evidenceLevel: general
        title:
          en: I am staying at the same school
          ko: 같은 학교에 계속 다녀요
          my: ယခင်ကျောင်းတွင်ပင် ဆက်လက်တက်နေပါသည်
        body:
          en: >-
            After the Immigration check, ask the international or academic office whether the student record needs the new passport details.
          ko: >-
            출입국 신고를 확인한 뒤 국제처·유학생 담당 부서 또는 학사 담당 부서에 학적정보 갱신 필요 여부를 물어보세요.
          my: >-
            လူဝင်မှုကြီးကြပ်ရေးတင်ပြမှုကို စစ်ဆေးပြီးနောက် နိုင်ငံတကာရေးရာဌာန၊ နိုင်ငံခြားကျောင်းသားဌာန သို့မဟုတ် ကျောင်းရေးရာဌာနထံ ကျောင်းသားမှတ်တမ်း ပြင်ဆင်ရန်လိုမလို မေးပါ။
        jumpTo: school-record
      - icon: jobs
        audience: worker
        evidenceLevel: general
        title:
          en: I am staying at the same workplace
          ko: 같은 직장에서 계속 일해요
          my: ယခင်အလုပ်ခွင်တွင်ပင် ဆက်လက်လုပ်ကိုင်ပါသည်
        body:
          en: >-
            After the Immigration check, ask HR or personnel whether the company record and connected payroll or benefits systems need an update.
          ko: >-
            출입국 신고를 확인한 뒤 인사·총무 담당자에게 회사 기록과 급여·복리후생 시스템의 갱신 필요 여부를 물어보세요.
          my: >-
            လူဝင်မှုကြီးကြပ်ရေးတင်ပြမှုကို စစ်ဆေးပြီးနောက် HR သို့မဟုတ် ဝန်ထမ်းရေးရာဌာနထံ ကုမ္ပဏီမှတ်တမ်း၊ လစာနှင့် ဝန်ထမ်းအကျိုးခံစားခွင့်စနစ်များ ပြင်ဆင်ရန်လိုမလို မေးပါ။
        jumpTo: workplace-record
      - icon: help
        audience: warning
        evidenceLevel: general
        title:
          en: Something else also changed, or the deadline may have passed
          ko: 이름·학교·직장도 바뀌거나 기한이 지난 것 같아요
          my: အမည်၊ ကျောင်း၊ အလုပ်ခွင်ပါ ပြောင်းလဲခြင်း သို့မဟုတ် နောက်ဆုံးရက်ကျော်နိုင်ပါသည်
        body:
          en: >-
            Do not treat this as a simple passport-number update. Check the exception section before changing school, starting work, or guessing a deadline.
          ko: >-
            단순한 여권번호 갱신으로 보면 안 됩니다. 학교 변경이나 근무 시작 전에, 또는 기한을 임의로 계산하기 전에 예외 구간을 확인하세요.
          my: >-
            ရိုးရိုး နိုင်ငံကူးလက်မှတ်နံပါတ် ပြင်ဆင်မှုအဖြစ် မယူဆပါနှင့်။ ကျောင်းပြောင်းခြင်း၊ အလုပ်စတင်ခြင်း သို့မဟုတ် နောက်ဆုံးရက်ကို ကိုယ်တိုင်ခန့်မှန်းခြင်းမပြုမီ ခြွင်းချက်အပိုင်းကို စစ်ဆေးပါ။
        jumpTo: exceptions

  - id: passport-report
    variant: timeline
    icon: visa
    title:
      en: Immigration passport-information report
      ko: 출입국 여권정보 변경 신고
      my: လူဝင်မှုကြီးကြပ်ရေး နိုင်ငံကူးလက်မှတ်အချက်အလက် ပြောင်းလဲမှုတင်ပြခြင်း
    intro:
      en: >-
        This is the first time-sensitive task for a person who completed foreigner registration under Article 31 of the Immigration Control Act and whose passport number, issue date, or expiry date changed. Start as soon as you receive the new passport. If you use another residence or identity document, including a domestic residence report card for F-4 status, do not assume the same task name or deadline applies; confirm the separate procedure with 1345.
      ko: >-
        출입국관리법 제31조에 따라 외국인등록을 한 사람의 여권번호·발급일·유효기간이 바뀌었다면 가장 먼저 확인할 기한 있는 업무입니다. 새 여권을 받으면 기다리지 말고 바로 시작하세요. 국내거소신고증(F-4) 등 다른 체류·신분 증명서를 사용한다면 같은 업무명과 기한이 적용된다고 단정하지 말고 1345에서 별도 절차를 확인하세요.
      my: >-
        လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၁ အရ နိုင်ငံခြားသားမှတ်ပုံတင်ထားသူ၏ နိုင်ငံကူးလက်မှတ်နံပါတ်၊ ထုတ်ပေးသည့်ရက် သို့မဟုတ် သက်တမ်းကုန်ရက် ပြောင်းလဲပါက ဦးစွာစစ်ဆေးရမည့် အချိန်ကန့်သတ်ချက်ရှိသော လုပ်ငန်းဖြစ်ပါသည်။ နိုင်ငံကူးလက်မှတ်အသစ်ရသည်နှင့် စတင်ပါ။ F-4 အတွက် ပြည်တွင်းနေထိုင်မှုတင်ပြကတ်ကဲ့သို့ အခြားနေထိုင်ခွင့် သို့မဟုတ် ကိုယ်ရေးအထောက်အထားကို အသုံးပြုပါက တူညီသောလုပ်ငန်းအမည်နှင့် နောက်ဆုံးရက်သက်ဆိုင်သည်ဟု မယူဆဘဲ 1345 ထံ သီးခြားလုပ်ငန်းစဉ်ကို မေးပါ။
    items:
      - icon: doc
        audience: general
        evidenceLevel: general
        title:
          en: Compare the new passport with your existing records
          ko: 새 여권과 기존 기록을 먼저 비교하세요
          my: နိုင်ငံကူးလက်မှတ်အသစ်ကို ရှိပြီးသားမှတ်တမ်းနှင့် ဦးစွာနှိုင်းယှဉ်ပါ
        body:
          en: >-
            Know exactly what changed before reporting or sending a copy anywhere. This prevents the new passport number from hiding a separate change to your name, nationality, date of birth, or sex.
          ko: >-
            신고하거나 사본을 보내기 전에 무엇이 달라졌는지 정확히 확인하세요. 새 여권번호만 보고 영문 이름·국적·생년월일·성별의 별도 변경을 놓치지 않기 위한 단계입니다.
          my: >-
            တင်ပြခြင်း သို့မဟုတ် မိတ္တူပို့ခြင်းမပြုမီ ဘာပြောင်းလဲသွားသည်ကို တိတိကျကျစစ်ဆေးပါ။ နိုင်ငံကူးလက်မှတ်နံပါတ်အသစ်ကိုသာကြည့်၍ အမည်၊ နိုင်ငံသား၊ မွေးသက္ကရာဇ် သို့မဟုတ် လိင် ပြောင်းလဲမှုကို မလွတ်စေရန်ဖြစ်ပါသည်။
        prepare:
          - en: New passport and previous passport, if available
            ko: 신여권과 가지고 있다면 구여권
            my: နိုင်ငံကူးလက်မှတ်အသစ်နှင့် ရှိပါက ယခင်နိုင်ငံကူးလက်မှတ်
          - en: Residence card or the document showing your current registered details
            ko: 외국인등록증 또는 현재 등록정보를 확인할 수 있는 자료
            my: နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် သို့မဟုတ် လက်ရှိမှတ်ပုံတင်အချက်ကို ပြသသောစာရွက်
          - en: Passport issue date and the date you actually received it
            ko: 여권 발급일과 실제 수령일
            my: နိုင်ငံကူးလက်မှတ် ထုတ်ပေးသည့်ရက်နှင့် အမှန်တကယ်လက်ခံသည့်ရက်
          - en: Official proof of the receipt date if you received it much later
            ko: 발급일보다 늦게 받았다면 수령일을 확인할 수 있는 공식 자료
            my: ထုတ်ပေးသည့်ရက်ထက် များစွာနောက်ကျရရှိပါက လက်ခံရက်ကိုပြသသော တရားဝင်အထောက်အထား
        steps:
          - en: Compare the English spelling and order of your name.
            ko: 영문 성명의 철자와 순서를 비교합니다.
            my: အင်္ဂလိပ်အမည် စာလုံးပေါင်းနှင့် အစီအစဉ်ကို နှိုင်းယှဉ်ပါ။
          - en: Compare nationality, date of birth, and sex.
            ko: 국적·생년월일·성별을 비교합니다.
            my: နိုင်ငံသား၊ မွေးသက္ကရာဇ်နှင့် လိင်ကို နှိုင်းယှဉ်ပါ။
          - en: Record the new passport number, issue date, and expiry date in a private note.
            ko: 새 여권번호·발급일·유효기간을 개인 메모에 기록합니다.
            my: နိုင်ငံကူးလက်မှတ်နံပါတ်အသစ်၊ ထုတ်ပေးသည့်ရက်နှင့် သက်တမ်းကုန်ရက်ကို ကိုယ်ပိုင်မှတ်စုတွင် မှတ်ပါ။
          - en: Record the actual receipt date separately from the issue date.
            ko: 실제 수령일을 발급일과 구분해 기록합니다.
            my: အမှန်တကယ်လက်ခံရသည့်ရက်ကို ထုတ်ပေးသည့်ရက်နှင့် သီးခြားမှတ်ပါ။
        checklist:
          - en: I identified every field that changed.
            ko: 달라진 항목을 모두 확인했어요.
            my: ပြောင်းလဲသည့်အချက်အားလုံးကို စစ်ဆေးပြီးပါပြီ။
          - en: I recorded both the issue date and the actual receipt date.
            ko: 발급일과 실제 수령일을 모두 기록했어요.
            my: ထုတ်ပေးသည့်ရက်နှင့် အမှန်တကယ်လက်ခံရက်ကို မှတ်ပြီးပါပြီ။
          - en: I did not enter a passport or residence-card number on this page.
            ko: 이 페이지에는 여권번호나 등록번호를 입력하지 않았어요.
            my: ဤစာမျက်နှာတွင် နိုင်ငံကူးလက်မှတ် သို့မဟုတ် မှတ်ပုံတင်နံပါတ် မထည့်ထားပါ။
        doneWhen:
          en: >-
            You have a private list of the changed fields, issue date, receipt date, and expiry date. If identity details also changed, you have stopped and moved to the exception section.
          ko: >-
            변경된 항목, 발급일, 실제 수령일과 유효기간을 개인적으로 정리했습니다. 신원정보도 달라졌다면 여기서 단순 신고를 진행하지 않고 예외 구간을 확인합니다.
          my: >-
            ပြောင်းလဲသည့်အချက်များ၊ ထုတ်ပေးသည့်ရက်၊ လက်ခံသည့်ရက်နှင့် သက်တမ်းကုန်ရက်ကို ကိုယ်ပိုင်စာရင်းအဖြစ် စုစည်းပြီးပါပြီ။ ကိုယ်ရေးအချက်အလက်ပါ ပြောင်းလဲပါက ရိုးရိုးလုပ်ငန်းအဖြစ် မဆက်ဘဲ ခြွင်းချက်အပိုင်းကို စစ်ဆေးပါ။
        details:
          title:
            en: Protect the passport copy
            ko: 여권 사본은 이렇게 다루세요
            my: နိုင်ငံကူးလက်မှတ်မိတ္တူကို လုံခြုံစွာ ကိုင်တွယ်ပါ
          body:
            en: >-
              Do not send a full passport image through an unofficial chat or a person whose identity you have not verified. Use only the submission channel shown by Immigration, your school, employer, or service provider, and provide only what that institution currently requests.
            ko: >-
              비공식 메신저나 신원을 확인하지 못한 사람에게 여권 전체 사진을 보내지 마세요. 출입국·학교·회사·서비스 기관이 안내한 공식 제출 경로에서 현재 요구하는 자료만 제출하세요.
            my: >-
              တရားဝင်မဟုတ်သော chat သို့မဟုတ် အထောက်အထားမစစ်ရသေးသောသူထံ နိုင်ငံကူးလက်မှတ်ပုံအပြည့် မပို့ပါနှင့်။ လူဝင်မှုကြီးကြပ်ရေး၊ ကျောင်း၊ အလုပ်ရှင် သို့မဟုတ် ဝန်ဆောင်မှုအဖွဲ့အစည်းက ပြသထားသော တရားဝင်လမ်းကြောင်းမှ လက်ရှိတောင်းဆိုသည့်အရာကိုသာ ပို့ပါ။

      - icon: shield
        audience: general
        evidenceLevel: official
        title:
          en: Check the reporting rule without guessing your own deadline
          ko: 기한을 임의로 계산하지 말고 기준을 확인하세요
          my: နောက်ဆုံးရက်ကို ကိုယ်တိုင်မခန့်မှန်းဘဲ စံနှုန်းကို စစ်ဆေးပါ
        body:
          en: >-
            The law states 15 days after a registered detail changes. The Ministry of Justice Visa Navigator (Ver 2022.12) describes 45 days from the new passport issue date as the usual passport-change period. Only when that 45-day period has passed and official evidence establishes the actual receipt date does the guide describe counting 15 days from receipt. Start immediately after receiving the passport.
          ko: >-
            법령은 등록사항 변경 후 15일 이내 신고를 정합니다. 법무부 「비자 내비게이터(Ver 2022.12)」는 여권 변경의 경우 신여권 발급일부터 45일 이내를 원칙으로 안내합니다. 그 45일을 넘겼지만 공적인 자료로 실제 수령일이 확인되는 경우에만 수령일부터 15일을 계산한다고 설명합니다. 새 여권을 받으면 바로 시작하세요.
          my: >-
            ဥပဒေတွင် မှတ်ပုံတင်အချက်ပြောင်းပြီး ၁၅ ရက်အတွင်း တင်ပြရန် သတ်မှတ်ထားပါသည်။ တရားရေးဝန်ကြီးဌာန 「Visa Navigator (Ver 2022.12)」 တွင် နိုင်ငံကူးလက်မှတ်ပြောင်းလဲမှုကို နိုင်ငံကူးလက်မှတ်အသစ် ထုတ်ပေးသည့်ရက်မှ ၄၅ ရက်အတွင်း တင်ပြရန် ပုံမှန်စံအဖြစ် ဖော်ပြထားပါသည်။ ထို ၄၅ ရက်ကျော်ပြီး အမှန်တကယ်လက်ခံသည့်ရက်ကို တရားဝင်အထောက်အထားဖြင့် အတည်ပြုနိုင်မှသာ လက်ခံရက်မှ ၁၅ ရက်တွက်ရန် ရှင်းလင်းထားပါသည်။ နိုင်ငံကူးလက်မှတ်ရသည်နှင့် ချက်ချင်းစတင်ပါ။
        prepare:
          - en: Whether you have completed foreigner registration
            ko: 외국인등록을 한 상태인지
            my: နိုင်ငံခြားသားမှတ်ပုံတင်ပြီးသား ဟုတ်မဟုတ်
          - en: New-passport issue date and actual receipt date
            ko: 신여권 발급일과 실제 수령일
            my: နိုင်ငံကူးလက်မှတ်အသစ် ထုတ်ပေးသည့်ရက်နှင့် အမှန်တကယ်လက်ခံရက်
          - en: Proof of late receipt, if applicable
            ko: 늦게 수령했다면 수령일 증빙
            my: နောက်ကျလက်ခံရပါက လက်ခံရက်အထောက်အထား
        steps:
          - en: Start the report immediately instead of waiting for the longest period mentioned in a guide.
            ko: 안내에 보이는 가장 긴 기간까지 기다리지 말고 바로 신고를 시작합니다.
            my: လမ်းညွှန်တွင်ပါသော အရှည်ဆုံးကာလအထိ မစောင့်ဘဲ တင်ပြမှုကို ချက်ချင်းစတင်ပါ။
          - en: If the issue and receipt dates are far apart, keep the official receipt proof.
            ko: 발급일과 수령일 차이가 크다면 공식 수령 증빙을 보관합니다.
            my: ထုတ်ပေးသည့်ရက်နှင့် လက်ခံရက် အလွန်ကွာပါက တရားဝင်လက်ခံအထောက်အထားကို သိမ်းထားပါ။
          - en: If any deadline may have passed, ask 1345 or the responsible Immigration office before assuming the answer yourself.
            ko: 기한이 지났을 가능성이 있다면 스스로 결론 내리지 말고 1345 또는 관할 출입국·외국인관서에 확인합니다.
            my: နောက်ဆုံးရက်ကျော်နိုင်ပါက ကိုယ်တိုင်ဆုံးဖြတ်မထားဘဲ 1345 သို့မဟုတ် တာဝန်ရှိ လူဝင်မှုကြီးကြပ်ရေးရုံးထံ စစ်ဆေးပါ။
        checklist:
          - en: I started without waiting.
            ko: 미루지 않고 바로 시작했어요.
            my: မနှောင့်နှေးဘဲ ချက်ချင်းစတင်ပြီးပါပြီ။
          - en: I contacted an official source if my dates were unclear or late.
            ko: 날짜가 불분명하거나 늦었다면 공식 기관에 확인했어요.
            my: ရက်များမရှင်းလင်းခြင်း သို့မဟုတ် နောက်ကျပါက တရားဝင်အဖွဲ့အစည်းထံ စစ်ဆေးပြီးပါပြီ။
        doneWhen:
          en: >-
            You know which official instruction applies to your dates and have not relied on MyanMate to calculate a personal deadline.
          ko: >-
            내 날짜에 적용되는 기준을 공식 확인처에서 확인했고, MyanMate의 설명만으로 개인 기한을 계산하지 않았습니다.
          my: >-
            မိမိရက်များနှင့်သက်ဆိုင်သော စံကို တရားဝင်နေရာတွင် အတည်ပြုပြီး MyanMate ရှင်းလင်းချက်တစ်ခုတည်းဖြင့် ကိုယ်ပိုင်နောက်ဆုံးရက် မတွက်ထားပါ။
        details:
          title:
            en: Why do 15 days and 45 days appear together?
            ko: 왜 15일과 45일 안내가 함께 나오나요?
            my: ၁၅ ရက်နှင့် ၄၅ ရက်ကို ဘာကြောင့်အတူတကွ ပြသပါသနည်း
          body:
            en: >-
              Article 35 of the Immigration Control Act sets a 15-day reporting duty after a registered detail changes. The Ministry of Justice Visa Navigator (Ver 2022.12) describes passport changes as normally reported within 45 days of the new passport's issue date. Only when those 45 days have passed and the actual receipt date is established by official evidence does it describe counting 15 days from receipt. Do not wait for either limit: start as soon as you receive the new passport. If the dates are unclear or time has passed, ask 1345. Failure to report may lead to an administrative fine of up to KRW 1 million.
            ko: >-
              출입국관리법 제35조는 등록사항이 변경된 때부터 15일 이내 신고하도록 정합니다. 법무부 「비자 내비게이터(Ver 2022.12)」는 여권 변경의 경우 신여권 발급일부터 45일 이내를 원칙으로 안내하고, 그 45일을 넘겼지만 공적인 자료로 실제 수령일이 확인되는 경우에는 수령일부터 15일을 계산한다고 설명합니다. 두 기준을 보고 기다리지 말고 새 여권을 받으면 바로 시작하세요. 날짜가 불명확하거나 이미 지났다면 1345에 확인하세요. 미신고 시 100만원 이하의 과태료가 부과될 수 있습니다.
            my: >-
              လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၅ သည် မှတ်ပုံတင်အချက်ပြောင်းသည့်အချိန်မှ ၁၅ ရက်အတွင်း တင်ပြရန် သတ်မှတ်ပါသည်။ တရားရေးဝန်ကြီးဌာန 「Visa Navigator (Ver 2022.12)」 တွင် နိုင်ငံကူးလက်မှတ်ပြောင်းလဲမှုကို နိုင်ငံကူးလက်မှတ်အသစ် ထုတ်ပေးသည့်ရက်မှ ၄၅ ရက်အတွင်းတင်ပြရန် ပုံမှန်စံအဖြစ် ဖော်ပြပြီး၊ ထို ၄၅ ရက်ကျော်သော်လည်း အမှန်တကယ်လက်ခံရက်ကို တရားဝင်အထောက်အထားဖြင့် အတည်ပြုနိုင်မှသာ လက်ခံရက်မှ ၁၅ ရက်တွက်ရန် ရှင်းလင်းထားပါသည်။ မစောင့်ဘဲ နိုင်ငံကူးလက်မှတ်ရသည်နှင့် စတင်ပါ။ ရက်မရှင်းလင်းခြင်း သို့မဟုတ် ကျော်လွန်ခြင်းရှိပါက 1345 ထံ မေးပါ။ မတင်ပြပါက ဝမ် ၁ သန်းအထိ အုပ်ချုပ်ရေးဒဏ်ငွေ ချမှတ်နိုင်ပါသည်။
        sources:
          - label:
              en: Immigration Control Act · Article 35
              ko: 출입국관리법 제35조
              my: လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၅
            href: https://www.law.go.kr/법령/출입국관리법/제35조
          - label:
              en: Immigration Control Act · Article 100
              ko: 출입국관리법 제100조
              my: လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၁၀၀
            href: https://www.law.go.kr/법령/출입국관리법/제100조
          - label:
              en: Ministry of Justice · Visa Navigator (Ver 2022.12)
              ko: 법무부 · 비자 내비게이터(Ver 2022.12)
              my: တရားရေးဝန်ကြီးဌာန · Visa Navigator (Ver 2022.12)
            href: https://www.corrections.go.kr/bbs/immigration_eng/230/454086/download.do

      - icon: visa
        audience: general
        evidenceLevel: official
        title:
          en: Recheck the current documents and submit through HiKorea
          ko: 최신 제출자료를 확인하고 하이코리아에서 직접 신고하세요
          my: လက်ရှိလိုအပ်သောစာရွက်များကို စစ်ဆေးပြီး HiKorea မှ ကိုယ်တိုင်တင်ပြပါ
        body:
          en: >-
            Under HiKorea's notice, electronic-fax receipt of passport-change reports stopped on June 1, 2026. Fax submissions are rejected and redirected to e-application. Menu names and requested attachments can change, so check the live screen immediately before submitting.
          ko: >-
            하이코리아 공지에 따라 2026년 6월 1일부터 여권변경 신고의 팩스 접수가 중단되었습니다. 팩스로 보내면 반려되고 전자민원으로 안내됩니다. 메뉴명과 제출자료는 바뀔 수 있으므로 접수 직전 실제 화면에서 다시 확인하세요.
          my: >-
            HiKorea အသိပေးချက်အရ ၂၀၂၆ ဇွန် ၁ ရက်မှစ၍ နိုင်ငံကူးလက်မှတ်ပြောင်းလဲမှုကို electronic fax ဖြင့် လက်ခံခြင်း ရပ်ဆိုင်းထားပါသည်။ Fax ဖြင့်ပို့ပါက ငြင်းပယ်ပြီး e-application သို့ လမ်းညွှန်ပါမည်။ မီနူးအမည်နှင့် ပူးတွဲစာရွက်များ ပြောင်းနိုင်သဖြင့် မတင်ပြမီ လက်ရှိမျက်နှာပြင်တွင် ပြန်စစ်ပါ။
        prepare:
          - en: HiKorea sign-in method
            ko: 하이코리아 로그인 수단
            my: HiKorea ဝင်ရောက်ရန် နည်းလမ်း
          - en: "Basic materials in the Ministry of Justice's 2022.12 guide: integrated application form, new and old passports, residence card, and official proof such as a receipt when relevant"
            ko: "법무부 2022.12 길잡이의 기본자료: 통합신청서, 신여권, 구여권, 외국인등록증, 해당 시 수령증 등 공적인 증빙"
            my: "တရားရေးဝန်ကြီးဌာန 2022.12 လမ်းညွှန်ရှိ အခြေခံစာရွက်များ: ပေါင်းစည်းလျှောက်လွှာ၊ နိုင်ငံကူးလက်မှတ်အသစ်နှင့် အဟောင်း၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်နှင့် သက်ဆိုင်ပါက လက်ခံပြေစာကဲ့သို့ တရားဝင်အထောက်အထား"
          - en: Current input fields and attachment instructions shown on the live e-application screen, which take priority
            ko: 실제 전자민원 화면에 표시되는 현재 입력항목과 첨부자료 안내를 우선 확인
            my: လက်ရှိ e-application မျက်နှာပြင်တွင် ပြထားသော ဖြည့်ရန်အချက်နှင့် ပူးတွဲစာရွက်လမ်းညွှန်ကို ဦးစားပေးစစ်ဆေးရန်
        steps:
          - en: Sign in to HiKorea and open the current e-application list.
            ko: 하이코리아에 로그인해 현재 전자민원 목록을 엽니다.
            my: HiKorea သို့ဝင်ပြီး လက်ရှိ e-application စာရင်းကို ဖွင့်ပါ။
          - en: Find the passport-information change report and confirm that its covered fields match your change.
            ko: 여권정보 변경 신고를 찾아 내 변경 항목과 맞는 업무인지 확인합니다.
            my: နိုင်ငံကူးလက်မှတ်အချက်အလက် ပြောင်းလဲမှုတင်ပြခြင်းကို ရှာပြီး မိမိပြောင်းလဲမှုနှင့်ကိုက်ညီကြောင်း စစ်ဆေးပါ။
          - en: Read the current eligibility, deadline, fields, and attachment instructions on that screen.
            ko: 화면의 대상·기한·입력항목·첨부자료 안내를 다시 읽습니다.
            my: မျက်နှာပြင်ရှိ သက်ဆိုင်သူ၊ နောက်ဆုံးရက်၊ ဖြည့်ရန်အချက်နှင့် ပူးတွဲစာရွက် လမ်းညွှန်ကို ပြန်ဖတ်ပါ။
          - en: Enter the information and upload the requested material yourself through the official site.
            ko: 공식 사이트에서 본인이 직접 정보를 입력하고 요구된 자료를 첨부합니다.
            my: တရားဝင်ဆိုက်တွင် မိမိကိုယ်တိုင် အချက်အလက်ဖြည့်ပြီး တောင်းဆိုသည့်စာရွက်ကို ပူးတွဲပါ။
          - en: Submit and save the submission date, receipt number, and a copy of the confirmation.
            ko: 제출한 뒤 접수일·접수번호와 확인 화면을 보관합니다.
            my: တင်ပြပြီးနောက် တင်သွင်းသည့်ရက်၊ လက်ခံနံပါတ်နှင့် အတည်ပြုမျက်နှာပြင်ကို သိမ်းပါ။
        checklist:
          - en: I used the current HiKorea e-application instead of electronic fax.
            ko: 전자팩스가 아니라 현재 하이코리아 전자민원을 이용했어요.
            my: electronic fax မဟုတ်ဘဲ လက်ရှိ HiKorea e-application ကို အသုံးပြုပြီးပါပြီ။
          - en: I checked the live attachment instructions before uploading.
            ko: 첨부 전에 실제 화면의 최신 제출자료를 확인했어요.
            my: ပူးတွဲမတင်မီ လက်ရှိမျက်နှာပြင်ရှိ လိုအပ်စာရွက်များကို စစ်ဆေးပြီးပါပြီ။
          - en: I submitted the report myself and saved the receipt information.
            ko: 본인이 직접 신고하고 접수정보를 보관했어요.
            my: ကိုယ်တိုင်တင်ပြပြီး လက်ခံအချက်အလက်ကို သိမ်းထားပြီးပါပြီ။
        doneWhen:
          en: >-
            You can identify the exact official task you used and show the submission date and receipt number. This means the report was received, not necessarily that processing is finished.
          ko: >-
            이용한 공식 업무명, 접수일과 접수번호를 확인할 수 있습니다. 이 상태는 접수 확인이며 처리 완료와는 다릅니다.
          my: >-
            အသုံးပြုခဲ့သော တရားဝင်လုပ်ငန်းအမည်၊ တင်သွင်းသည့်ရက်နှင့် လက်ခံနံပါတ်ကို စစ်ဆေးနိုင်ပါသည်။ ဤအခြေအနေသည် လက်ခံရရှိကြောင်းသာဖြစ်ပြီး ဆောင်ရွက်မှုပြီးစီးခြင်းနှင့် မတူပါ။
        details:
          title:
            en: If the online route does not work
            ko: 전자민원을 이용하기 어려운 경우
            my: အွန်လိုင်းလမ်းကြောင်း အသုံးပြုမရပါက
          body:
            en: >-
              Since June 1, 2026, do not switch to electronic fax when e-application is difficult. Save the error message and ask 1345 or the responsible Immigration office which current procedure is available. If the deadline has definitely passed, do not submit again online or by fax: the Ministry of Justice guide says to report in person at the responsible Immigration office for review of whether a violation occurred.
            ko: >-
              2026년 6월 1일부터는 전자민원이 어렵다고 팩스로 돌리지 마세요. 오류 문구를 보관하고 1345 또는 관할 출입국·외국인관서에 현재 이용 가능한 절차를 확인하세요. 기한을 넘긴 것이 확실하다면 전자민원이나 팩스로 다시 접수하지 마세요. 법무부 「비자 내비게이터(Ver 2022.12)」는 관할 출입국·외국인관서 방문 신고와 위반 여부 심사가 필요하다고 안내합니다.
            my: >-
              ၂၀၂၆ ဇွန် ၁ ရက်မှစ၍ e-application အသုံးပြုရခက်သည်ဟု electronic fax သို့ မပြောင်းပါနှင့်။ အမှားစာသားကိုသိမ်းပြီး 1345 သို့မဟုတ် တာဝန်ရှိ လူဝင်မှုကြီးကြပ်ရေးရုံးထံ လက်ရှိရနိုင်သောလုပ်ငန်းစဉ်ကို မေးပါ။ နောက်ဆုံးရက်ကျော်လွန်ကြောင်း သေချာပါက အွန်လိုင်း သို့မဟုတ် fax ဖြင့် ထပ်မံမတင်ပြပါနှင့်။ တရားရေးဝန်ကြီးဌာနလမ်းညွှန်အရ တာဝန်ရှိရုံးသို့ ကိုယ်တိုင်သွားတင်ပြပြီး ချိုးဖောက်မှုရှိမရှိ စစ်ဆေးခံရန်လိုပါသည်။
        sources:
          - label:
              en: HiKorea · Passport-change reporting information
              ko: 하이코리아 · 외국인등록사항 변경 신고 안내
              my: HiKorea · မှတ်ပုံတင်အချက် ပြောင်းလဲမှုတင်ပြခြင်း
            href: https://www.hikorea.go.kr/info/InfoDatail.pt?CAT_SEQ=196&PARENT_ID=146
          - label:
              en: HiKorea · Fax change effective June 1, 2026
              ko: 하이코리아 · 2026년 6월 1일 시행 팩스 변경 공지
              my: HiKorea · ၂၀၂၆ ဇွန် ၁ ရက် စတင်သည့် fax ပြောင်းလဲမှု
            href: https://www.hikorea.go.kr/board/BoardNtcDetailR.pt?BBS_GB_CD=BS10&BBS_SEQ=1&BBS_SEQ_GB_CD=&NTCCTT_SEQ=1949&page=1
          - label:
              en: HiKorea · E-application list
              ko: 하이코리아 · 전자민원 목록
              my: HiKorea · e-application စာရင်း
            href: https://www.hikorea.go.kr/cvlappl/CvlapplStep1.pt

      - icon: check
        audience: general
        evidenceLevel: official
        title:
          en: Confirm the processing result and keep evidence
          ko: 처리 결과까지 확인하고 기록을 보관하세요
          my: ဆောင်ရွက်မှုရလဒ်အထိ စစ်ဆေးပြီး မှတ်တမ်းသိမ်းပါ
        body:
          en: >-
            Submission and completion are different. Check the HiKorea application result, respond to any request for more information, and keep the final result with the receipt.
          ko: >-
            접수와 완료는 다릅니다. 하이코리아 민원신청 결과에서 처리 상태를 확인하고, 보완 요청이 있다면 대응한 뒤 최종 결과를 접수정보와 함께 보관하세요.
          my: >-
            တင်သွင်းခြင်းနှင့် ပြီးစီးခြင်း မတူပါ။ HiKorea လျှောက်ထားမှုရလဒ်တွင် အခြေအနေကို စစ်ဆေးပြီး အပိုစာရွက်တောင်းပါက ဖြည့်ဆည်းကာ နောက်ဆုံးရလဒ်ကို လက်ခံအချက်အလက်နှင့်အတူ သိမ်းပါ။
        prepare:
          - en: Submission date and receipt number
            ko: 접수일과 접수번호
            my: တင်သွင်းသည့်ရက်နှင့် လက်ခံနံပါတ်
          - en: Copies of the material you submitted
            ko: 제출한 자료의 사본
            my: တင်သွင်းခဲ့သောစာရွက် မိတ္တူ
          - en: Any supplement or rejection message
            ko: 보완 또는 반려 안내 문구
            my: အပိုတောင်းဆိုမှု သို့မဟုတ် ငြင်းပယ်စာသား
        steps:
          - en: Open HiKorea's e-application result page.
            ko: 하이코리아의 전자민원 신청결과 화면을 엽니다.
            my: HiKorea e-application ရလဒ်စာမျက်နှာကို ဖွင့်ပါ။
          - en: Check the current processing status shown on HiKorea and look for any request for more information or rejection notice.
            ko: 하이코리아 화면에 표시된 현재 처리 상태를 확인하고, 보완 요청이나 반려 안내가 있는지 살펴봅니다.
            my: HiKorea မျက်နှာပြင်တွင် ပြထားသော လက်ရှိဆောင်ရွက်မှုအခြေအနေကို စစ်ဆေးပြီး အပိုစာရွက်တောင်းဆိုမှု သို့မဟုတ် ငြင်းပယ်အသိပေးချက် ရှိမရှိ ကြည့်ပါ။
          - en: If more information is requested, save the reason and compare it with what you submitted.
            ko: 보완이 필요하다면 사유를 저장하고 기존 제출자료와 비교합니다.
            my: အပိုလိုပါက အကြောင်းပြချက်ကို သိမ်းပြီး ယခင်တင်သွင်းမှုနှင့် နှိုင်းယှဉ်ပါ။
          - en: After any new submission, save the new receipt information and check again.
            ko: 다시 제출했다면 새 접수정보를 보관하고 결과를 다시 확인합니다.
            my: ထပ်မံတင်သွင်းပါက လက်ခံအချက်အလက်အသစ်ကို သိမ်းပြီး ရလဒ်ကို ပြန်စစ်ပါ။
        checklist:
          - en: I confirmed the final processing status.
            ko: 최종 처리 상태를 확인했어요.
            my: နောက်ဆုံးဆောင်ရွက်မှုအခြေအနေကို စစ်ဆေးပြီးပါပြီ။
          - en: I saved the receipt and final result in a secure place.
            ko: 접수정보와 최종 결과를 안전한 곳에 보관했어요.
            my: လက်ခံအချက်အလက်နှင့် နောက်ဆုံးရလဒ်ကို လုံခြုံသောနေရာတွင် သိမ်းထားပြီးပါပြီ။
        doneWhen:
          en: >-
            HiKorea shows a completed result or the responsible office has confirmed completion, and you have kept that result. A checked box on MyanMate is not the completion record.
          ko: >-
            하이코리아에서 처리 완료를 확인했거나 담당 기관이 완료를 확인했고, 그 결과를 보관했습니다. MyanMate의 체크 표시는 완료 기록이 아닙니다.
          my: >-
            HiKorea တွင် ပြီးစီးကြောင်းပြသခြင်း သို့မဟုတ် တာဝန်ရှိရုံးက အတည်ပြုပြီး ထိုရလဒ်ကို သိမ်းထားပါသည်။ MyanMate ရှိ အမှန်ခြစ်သည် ပြီးစီးမှတ်တမ်း မဟုတ်ပါ။
        messageTemplate:
          en: >-
            Hello. I completed the passport-information change e-application, but I cannot confirm the final result. My status of stay is [status code], the submission date is [date], and the screen currently says [status or message]. Please tell me what the status means, whether I need to provide anything else, and how I can confirm completion. I will provide sensitive identifiers only through the official channel you instruct.
          ko: >-
            안녕하세요. 여권정보 변경 전자민원을 접수했지만 최종 처리 결과를 확인하기 어렵습니다. 제 체류자격은 [체류자격 코드], 접수일은 [날짜]이고 현재 화면에는 [상태 또는 안내 문구]라고 표시됩니다. 현재 상태의 의미, 추가로 필요한 자료와 완료 확인 방법을 알려주세요. 민감한 식별정보는 안내받은 공식 경로에서만 제공하겠습니다.
          my: >-
            မင်္ဂလာပါ။ နိုင်ငံကူးလက်မှတ်အချက်အလက် ပြောင်းလဲမှု e-application ကို တင်သွင်းခဲ့သော်လည်း နောက်ဆုံးရလဒ်ကို အတည်ပြုမရပါ။ ကျွန်ုပ်၏ နေထိုင်ခွင့်မှာ [code]၊ တင်သွင်းသည့်ရက်မှာ [ရက်] ဖြစ်ပြီး မျက်နှာပြင်တွင် [အခြေအနေ သို့မဟုတ် စာသား] ဟု ပြထားပါသည်။ ယင်းအခြေအနေ၏အဓိပ္ပာယ်၊ ထပ်မံလိုအပ်သောစာရွက်နှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို ပြောပြပါ။ အရေးကြီးသည့်နံပါတ်များကို ညွှန်ကြားသော တရားဝင်လမ်းကြောင်းမှသာ ပေးပါမည်။
        sources:
          - label:
              en: HiKorea · E-application result
              ko: 하이코리아 · 전자민원 신청결과
              my: HiKorea · e-application ရလဒ်
            href: https://www.hikorea.go.kr/Main.pt
          - label:
              en: Immigration Contact Center 1345
              ko: 외국인종합안내센터 1345
              my: လူဝင်မှုကြီးကြပ်ရေး အချက်အလက်စင်တာ 1345
            href: https://www.immigration.go.kr/immigration/1530/subview.do

  - id: school-record
    variant: timeline
    icon: users
    title:
      en: Update the record at your current school
      ko: 현재 학교의 학적정보 갱신
      my: လက်ရှိကျောင်းရှိ ကျောင်းသားမှတ်တမ်း ပြင်ဆင်ခြင်း
    intro:
      en: >-
        This part is for someone who stays at the same school and only needs to ask whether its internal record should reflect the new passport. It is not the procedure for transferring, taking leave, withdrawing, or ending a course.
      ko: >-
        같은 학교에 계속 다니면서 새 여권정보를 학교 내부 기록에 반영해야 하는지 확인하는 구간입니다. 전학·휴학·자퇴·과정 종료 절차가 아닙니다.
      my: >-
        ယခင်ကျောင်းတွင် ဆက်လက်တက်နေပြီး နိုင်ငံကူးလက်မှတ်အသစ်အချက်ကို ကျောင်းအတွင်းမှတ်တမ်းတွင် ထည့်ရန်လိုမလို စစ်ဆေးသူများအတွက်ဖြစ်ပါသည်။ ကျောင်းပြောင်း၊ ခေတ္တရပ်၊ ကျောင်းထွက် သို့မဟုတ် သင်တန်းပြီးဆုံးခြင်းအတွက် လုပ်ငန်းမဟုတ်ပါ။
    items:
      - icon: users
        audience: student
        evidenceLevel: general
        title:
          en: Ask the responsible school office, then verify the updated record
          ko: 학교 담당 부서에 문의하고 반영 결과까지 확인하세요
          my: ကျောင်းတာဝန်ရှိဌာနကို မေးပြီး ပြင်ဆင်ရလဒ်အထိ စစ်ဆေးပါ
        body:
          en: >-
            School procedures are not uniform. Start with the international office, international-student support office, registrar, academic office, or language-institute administration shown on your school's official site.
          ko: >-
            학교마다 절차가 다릅니다. 학교 공식 홈페이지에 표시된 국제처, 유학생지원 부서, 학사 담당 부서 또는 어학당 행정실부터 확인하세요.
          my: >-
            ကျောင်းတိုင်းလုပ်ငန်းစဉ် မတူပါ။ ကျောင်း၏တရားဝင်ဆိုက်တွင် ဖော်ပြထားသော နိုင်ငံတကာရေးရာဌာန၊ နိုင်ငံခြားကျောင်းသားဌာန၊ ကျောင်းရေးရာဌာန သို့မဟုတ် ဘာသာစကားသင်တန်း ရုံးကို ဦးစွာစစ်ဆေးပါ။
        prepare:
          - en: Student number and your name as currently registered
            ko: 학번과 현재 학교에 등록된 이름
            my: ကျောင်းသားနံပါတ်နှင့် လက်ရှိကျောင်းတွင် မှတ်ပုံတင်ထားသောအမည်
          - en: List of changed passport fields, without sending the numbers in the first inquiry
            ko: 최초 문의에는 번호를 보내지 않고 정리한 변경 항목 목록
            my: ပထမမေးမြန်းမှုတွင် နံပါတ်မပို့ဘဲ စုစည်းထားသော ပြောင်းလဲသည့်အချက်စာရင်း
          - en: Official school portal, email, telephone number, or counter
            ko: 학교의 공식 포털·이메일·전화번호 또는 창구
            my: ကျောင်း၏တရားဝင် portal၊ email၊ ဖုန်း သို့မဟုတ် counter
        steps:
          - en: Find which office manages passport details in the student record.
            ko: 학적의 여권정보를 관리하는 담당 부서를 찾습니다.
            my: ကျောင်းသားမှတ်တမ်းရှိ နိုင်ငံကူးလက်မှတ်အချက်ကို စီမံသောဌာနကို ရှာပါ။
          - en: Ask whether an update is needed and which fields the school keeps.
            ko: 갱신 필요 여부와 학교가 보유하는 항목을 물어봅니다.
            my: ပြင်ဆင်ရန်လိုမလိုနှင့် ကျောင်းက ဘယ်အချက်များကို သိမ်းထားသလဲ မေးပါ။
          - en: Ask which documents are required and which official submission channel to use.
            ko: 필요한 자료와 공식 제출 경로를 확인합니다.
            my: လိုအပ်သည့်စာရွက်နှင့် တရားဝင်တင်ပြလမ်းကြောင်းကို စစ်ဆေးပါ။
          - en: Submit only the requested material through that verified channel.
            ko: 확인된 경로로 학교가 요구한 자료만 제출합니다.
            my: အတည်ပြုထားသောလမ်းကြောင်းမှ ကျောင်းတောင်းသည့်စာရွက်ကိုသာ ပို့ပါ။
          - en: Ask when the update should appear and how completion is confirmed.
            ko: 반영 시점과 완료 확인 방법을 물어봅니다.
            my: ပြင်ဆင်ပြီး ပေါ်လာမည့်အချိန်နှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို မေးပါ။
          - en: Recheck the portal and frequently used English certificates.
            ko: 학교 포털과 자주 쓰는 영문 증명서의 정보를 다시 확인합니다.
            my: ကျောင်း portal နှင့် မကြာခဏသုံးသော အင်္ဂလိပ်စာရွက်များရှိ အချက်ကို ပြန်စစ်ပါ။
        checklist:
          - en: I used the school's official contact channel.
            ko: 학교의 공식 문의 채널을 이용했어요.
            my: ကျောင်း၏တရားဝင်ဆက်သွယ်ရေးလမ်းကြောင်းကို အသုံးပြုပြီးပါပြီ။
          - en: I confirmed the required material before sending a passport copy.
            ko: 여권 사본을 보내기 전에 필요한 자료를 확인했어요.
            my: နိုင်ငံကူးလက်မှတ်မိတ္တူမပို့မီ လိုအပ်သောစာရွက်ကို စစ်ဆေးပြီးပါပြီ။
          - en: I checked the portal, English name, passport details, and relevant certificates.
            ko: 포털의 영문 이름·여권정보와 관련 증명서를 확인했어요.
            my: portal ရှိ အင်္ဂလိပ်အမည်၊ နိုင်ငံကူးလက်မှတ်အချက်နှင့် သက်ဆိုင်ရာစာရွက်များကို စစ်ဆေးပြီးပါပြီ။
          - en: I separately completed or checked the Immigration report.
            ko: 출입국 여권정보 변경 신고는 별도로 확인했어요.
            my: လူဝင်မှုကြီးကြပ်ရေး နိုင်ငံကူးလက်မှတ်ပြောင်းလဲမှုကို သီးခြားစစ်ဆေးပြီးပါပြီ။
        doneWhen:
          en: >-
            The school portal or responsible office confirms the new information is reflected, and you have kept the completion reply. The school update does not replace the Immigration report.
          ko: >-
            학교 포털 또는 담당 부서에서 새 정보가 반영됐음을 확인했고 완료 답변을 보관했습니다. 학교 내부 갱신은 출입국 신고를 대체하지 않습니다.
          my: >-
            ကျောင်း portal သို့မဟုတ် တာဝန်ရှိဌာနက အချက်အသစ်ပြင်ပြီးကြောင်း အတည်ပြုပြီး ပြီးစီးစာကို သိမ်းထားပါသည်။ ကျောင်းအတွင်းပြင်ဆင်မှုသည် လူဝင်မှုကြီးကြပ်ရေးတင်ပြမှုကို အစားမထိုးပါ။
        details:
          title:
            en: This is different from changing school or enrollment status
            ko: 학교·재학 상태 자체 변경과는 다릅니다
            my: ကျောင်း သို့မဟုတ် ကျောင်းတက်အခြေအနေပြောင်းခြင်းနှင့် မတူပါ
          body:
            en: >-
              If you are transferring, taking leave, withdrawing, finishing a course, or changing the institution connected to your stay, stop here and use the exception section. The required timing and procedure can depend on your status of stay.
            ko: >-
              전학·휴학·자퇴·과정 종료 또는 체류와 연결된 소속기관 변경이라면 여기서 멈추고 예외 구간을 확인하세요. 필요한 시점과 절차는 체류자격에 따라 달라질 수 있습니다.
            my: >-
              ကျောင်းပြောင်း၊ ခေတ္တရပ်၊ ကျောင်းထွက်၊ သင်တန်းပြီးဆုံး သို့မဟုတ် နေထိုင်ခွင့်နှင့်ဆက်စပ်သောအဖွဲ့အစည်းပြောင်းပါက ဤနေရာတွင်ရပ်ပြီး ခြွင်းချက်အပိုင်းကို သုံးပါ။ လိုအပ်သည့်အချိန်နှင့် လုပ်ငန်းစဉ်သည် နေထိုင်ခွင့်အလိုက် ကွာနိုင်ပါသည်။
        messageTemplate:
          en: >-
            Hello. I am [name], student number [student number]. I received a new passport and would like to ask whether the passport number, validity period, issue date, or English name in my student record needs to be updated. Please tell me the responsible office, required material, official submission channel, and how I can confirm the update. I will send any passport copy only through the official channel you specify.
          ko: >-
            안녕하세요. 저는 [학번] [이름]입니다. 새 여권을 발급받아 학적정보의 여권번호·유효기간·발급일 또는 영문 이름 갱신이 필요한지 문의드립니다. 담당 부서, 필요한 자료, 공식 제출 경로와 반영 완료 확인 방법을 알려주세요. 여권 사본은 안내받은 공식 경로로만 제출하겠습니다.
          my: >-
            မင်္ဂလာပါ။ ကျွန်ုပ်သည် ကျောင်းသားနံပါတ် [နံပါတ်]၊ အမည် [အမည်] ဖြစ်ပါသည်။ နိုင်ငံကူးလက်မှတ်အသစ်ရရှိသဖြင့် ကျောင်းသားမှတ်တမ်းရှိ နိုင်ငံကူးလက်မှတ်နံပါတ်၊ သက်တမ်း၊ ထုတ်ပေးသည့်ရက် သို့မဟုတ် အင်္ဂလိပ်အမည် ပြင်ရန်လိုမလို မေးလိုပါသည်။ တာဝန်ရှိဌာန၊ လိုအပ်သောစာရွက်၊ တရားဝင်တင်ပြလမ်းကြောင်းနှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို ပြောပြပါ။ နိုင်ငံကူးလက်မှတ်မိတ္တူကို ညွှန်ကြားသော တရားဝင်လမ်းကြောင်းမှသာ ပို့ပါမည်။
  - id: workplace-record
    variant: timeline
    icon: jobs
    title:
      en: Update the record at your current workplace
      ko: 현재 직장의 인사정보 갱신
      my: လက်ရှိအလုပ်ခွင်ရှိ ဝန်ထမ်းအချက်အလက် ပြင်ဆင်ခြင်း
    intro:
      en: >-
        This part is for someone who stays with the same employer and only needs to check the company's internal records. A new employer, additional workplace, or changed job or income can require a separate Immigration check.
      ko: >-
        같은 회사에서 계속 일하면서 회사 내부 기록의 갱신 필요 여부를 확인하는 구간입니다. 새 회사, 근무처 추가, 직업·업무·소득 변경은 별도의 출입국 확인이 필요할 수 있습니다.
      my: >-
        ယခင်အလုပ်ရှင်နှင့် ဆက်လက်လုပ်ကိုင်ပြီး ကုမ္ပဏီအတွင်းမှတ်တမ်း ပြင်ရန်လိုမလို စစ်ဆေးသူများအတွက်ဖြစ်ပါသည်။ အလုပ်ရှင်အသစ်၊ အလုပ်ခွင်ထပ်တိုးခြင်း၊ အလုပ် သို့မဟုတ် ဝင်ငွေပြောင်းခြင်းသည် သီးခြား လူဝင်မှုကြီးကြပ်ရေး စစ်ဆေးမှုလိုနိုင်ပါသည်။
    items:
      - icon: jobs
        audience: worker
        evidenceLevel: general
        title:
          en: Ask HR or personnel, then check connected systems
          ko: 인사·총무 담당자에게 문의하고 연결된 시스템도 확인하세요
          my: HR သို့မဟုတ် ဝန်ထမ်းရေးရာဌာနကို မေးပြီး ချိတ်ဆက်ထားသောစနစ်များကိုလည်း စစ်ဆေးပါ
        body:
          en: >-
            Companies keep different records. Ask whether the employee profile, payroll, benefits, identity verification, or foreign-worker support record uses passport information and needs an update.
          ko: >-
            회사마다 보유 기록이 다릅니다. 인사기록, 급여, 복리후생, 본인확인 또는 외국인 근로자 지원 기록에 여권정보가 사용되는지와 갱신 필요 여부를 물어보세요.
          my: >-
            ကုမ္ပဏီတိုင်း မှတ်တမ်းမတူပါ။ ဝန်ထမ်းမှတ်တမ်း၊ လစာ၊ အကျိုးခံစားခွင့်၊ ကိုယ်ရေးအတည်ပြုမှု သို့မဟုတ် နိုင်ငံခြားသားဝန်ထမ်းထောက်ပံ့ရေးမှတ်တမ်းတွင် နိုင်ငံကူးလက်မှတ်အချက် အသုံးပြုထားသလားနှင့် ပြင်ရန်လိုမလို မေးပါ။
        prepare:
          - en: Name and employee number used by the company
            ko: 회사에 등록된 이름과 사번
            my: ကုမ္ပဏီတွင်မှတ်ပုံတင်ထားသောအမည်နှင့် ဝန်ထမ်းနံပါတ်
          - en: List of changed fields, without sending sensitive numbers in the first inquiry
            ko: 최초 문의에는 민감한 번호를 보내지 않고 정리한 변경 항목
            my: ပထမမေးမြန်းမှုတွင် အရေးကြီးနံပါတ်မပို့ဘဲ စုစည်းထားသော ပြောင်းလဲသည့်အချက်များ
          - en: Official HR system, company email, telephone, or office
            ko: 회사의 공식 인사시스템·이메일·전화 또는 담당 창구
            my: ကုမ္ပဏီ၏တရားဝင် HR စနစ်၊ email၊ ဖုန်း သို့မဟုတ် ရုံး
        steps:
          - en: Ask which team manages passport and identity information.
            ko: 여권·신원정보를 관리하는 담당 부서를 확인합니다.
            my: နိုင်ငံကူးလက်မှတ်နှင့် ကိုယ်ရေးအချက်ကို စီမံသောဌာနကို မေးပါ။
          - en: Ask whether an update is needed and which fields or documents are required.
            ko: 갱신 필요 여부와 필요한 항목·자료를 물어봅니다.
            my: ပြင်ရန်လိုမလိုနှင့် လိုအပ်သည့်အချက် သို့မဟုတ် စာရွက်ကို မေးပါ။
          - en: Ask for the official and secure submission channel.
            ko: 공식적이고 안전한 제출 경로를 확인합니다.
            my: တရားဝင်လုံခြုံသော တင်ပြလမ်းကြောင်းကို စစ်ဆေးပါ။
          - en: Ask whether payroll, benefits, insurance, or another connected system keeps the old information.
            ko: 급여·복리후생·보험 또는 연결된 다른 시스템에 기존 정보가 남는지 확인합니다.
            my: လစာ၊ အကျိုးခံစားခွင့်၊ အာမခံ သို့မဟုတ် ချိတ်ဆက်စနစ်တွင် အချက်ဟောင်းကျန်မကျန် မေးပါ။
          - en: Submit only what is requested and ask how completion is shown.
            ko: 요구된 자료만 제출하고 완료 확인 방법을 물어봅니다.
            my: တောင်းဆိုသည့်စာရွက်ကိုသာ ပို့ပြီး ပြီးစီးကြောင်းစစ်ဆေးနည်းကို မေးပါ။
        checklist:
          - en: I confirmed whether the company record needs an update.
            ko: 회사 기록의 갱신 필요 여부를 확인했어요.
            my: ကုမ္ပဏီမှတ်တမ်း ပြင်ရန်လိုမလို စစ်ဆေးပြီးပါပြီ။
          - en: I used the company's verified submission channel.
            ko: 회사의 확인된 제출 경로를 이용했어요.
            my: ကုမ္ပဏီ၏အတည်ပြုထားသော တင်ပြလမ်းကြောင်းကို အသုံးပြုပြီးပါပြီ။
          - en: I checked connected payroll and benefits records where relevant.
            ko: 해당한다면 급여·복리후생 등 연결된 기록도 확인했어요.
            my: သက်ဆိုင်ပါက လစာနှင့် အကျိုးခံစားခွင့် ချိတ်ဆက်မှတ်တမ်းများကို စစ်ဆေးပြီးပါပြီ။
          - en: I separately completed or checked the Immigration report.
            ko: 출입국 여권정보 변경 신고는 별도로 확인했어요.
            my: လူဝင်မှုကြီးကြပ်ရေး နိုင်ငံကူးလက်မှတ်ပြောင်းလဲမှုကို သီးခြားစစ်ဆေးပြီးပါပြီ။
        doneWhen:
          en: >-
            HR or the official employee system confirms the new information is reflected, and you have kept that confirmation. Company records and Immigration records are still separate.
          ko: >-
            인사 담당자 또는 공식 인사시스템에서 새 정보가 반영됐음을 확인하고 완료 답변을 보관했습니다. 회사 기록과 출입국 기록은 여전히 별개입니다.
          my: >-
            HR သို့မဟုတ် တရားဝင်ဝန်ထမ်းစနစ်က အချက်အသစ်ပြင်ပြီးကြောင်း အတည်ပြုပြီး ထိုအတည်ပြုစာကို သိမ်းထားပါသည်။ ကုမ္ပဏီမှတ်တမ်းနှင့် လူဝင်မှုကြီးကြပ်ရေးမှတ်တမ်းသည် သီးခြားဖြစ်ပါသည်။
        details:
          title:
            en: A passport renewal is not the same as an employment change
            ko: 여권 갱신과 고용 변동은 같은 일이 아닙니다
            my: နိုင်ငံကူးလက်မှတ်သက်တမ်းတိုးခြင်းနှင့် အလုပ်အကိုင်ပြောင်းလဲမှု မတူပါ
          body:
            en: >-
              HiKorea's employer-reporting page lists events such as dismissal, resignation, disappearance, and important employment-contract changes. A new passport by itself is not the same event. If your employer, workplace, job, duties, or income also changes, use the exception section and check your exact status of stay before acting.
            ko: >-
              하이코리아의 고용주 신고 안내는 해고·퇴직·소재불명·고용계약의 중요한 내용 변경 등을 별도 사유로 설명합니다. 여권 갱신 자체와 같은 사건은 아닙니다. 회사·근무처·직업·업무·소득도 바뀐다면 예외 구간에서 정확한 체류자격을 기준으로 확인하세요.
            my: >-
              HiKorea အလုပ်ရှင်တင်ပြမှုလမ်းညွှန်တွင် အလုပ်ဖြုတ်ခြင်း၊ အလုပ်ထွက်ခြင်း၊ မတွေ့ရှိနိုင်ခြင်းနှင့် အလုပ်စာချုပ်အရေးကြီးအချက်ပြောင်းခြင်းတို့ကို သီးခြားအကြောင်းအရာအဖြစ် ဖော်ပြထားပါသည်။ နိုင်ငံကူးလက်မှတ်အသစ်ရခြင်းနှင့် တူညီသောဖြစ်ရပ်မဟုတ်ပါ။ အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ်၊ တာဝန် သို့မဟုတ် ဝင်ငွေပါ ပြောင်းပါက ခြွင်းချက်အပိုင်းတွင် မိမိနေထိုင်ခွင့်အလိုက် စစ်ဆေးပါ။
        messageTemplate:
          en: >-
            Hello. I received a new passport and would like to ask whether the passport number, validity period, issue date, or English name in my employee record needs to be updated. Please tell me the responsible team, required material, official submission channel, connected payroll or benefits records to check, and how I can confirm completion. I will check my Immigration report separately.
          ko: >-
            안녕하세요. 새 여권 발급으로 회사 인사정보의 여권번호·유효기간·발급일 또는 영문 이름 갱신이 필요한지 문의드립니다. 담당 부서, 필요한 자료, 공식 제출 경로, 함께 확인할 급여·복리후생 기록과 반영 완료 확인 방법을 알려주세요. 출입국 신고는 별도로 확인하겠습니다.
          my: >-
            မင်္ဂလာပါ။ နိုင်ငံကူးလက်မှတ်အသစ်ရရှိသဖြင့် ကုမ္ပဏီဝန်ထမ်းမှတ်တမ်းရှိ နိုင်ငံကူးလက်မှတ်နံပါတ်၊ သက်တမ်း၊ ထုတ်ပေးသည့်ရက် သို့မဟုတ် အင်္ဂလိပ်အမည် ပြင်ရန်လိုမလို မေးလိုပါသည်။ တာဝန်ရှိဌာန၊ လိုအပ်စာရွက်၊ တရားဝင်တင်ပြလမ်းကြောင်း၊ အတူစစ်ဆေးရမည့် လစာ/အကျိုးခံစားခွင့်မှတ်တမ်းနှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို ပြောပြပါ။ လူဝင်မှုကြီးကြပ်ရေးတင်ပြမှုကို သီးခြားစစ်ဆေးပါမည်။
        sources:
          - label:
              en: For separating employer-report events · HiKorea
              ko: 고용 변동 사유 구분 확인용 · 하이코리아
              my: အလုပ်ရှင်တင်ပြရမည့်ဖြစ်ရပ် ခွဲခြားစစ်ဆေးရန် · HiKorea
            href: https://www.hikorea.go.kr/info/InfoDatail.pt?CAT_SEQ=195&PARENT_ID=146

  - id: everyday-accounts
    variant: optional
    icon: list
    title:
      en: Check only the everyday services that apply to you
      ko: 이용 중인 생활 서비스만 추가 확인
      my: မိမိအသုံးပြုနေသော နေ့စဉ်ဝန်ဆောင်မှုများကိုသာ ထပ်စစ်ပါ
    intro:
      en: >-
        These are not one universal legal checklist. Contact a provider only when it holds your passport details, used your passport for identity verification, or has a booking that must match the new passport.
      ko: >-
        아래 항목은 모두에게 적용되는 하나의 법정 체크리스트가 아닙니다. 내 여권정보를 보유하거나 여권으로 본인확인을 했거나 새 여권과 일치해야 하는 예약이 있는 기관만 확인하세요.
      my: >-
        အောက်ပါအချက်များသည် လူတိုင်းအတွက် တူညီသော ဥပဒေစာရင်းမဟုတ်ပါ။ မိမိနိုင်ငံကူးလက်မှတ်အချက်ကို သိမ်းထားခြင်း၊ နိုင်ငံကူးလက်မှတ်ဖြင့် ကိုယ်ရေးအတည်ပြုထားခြင်း သို့မဟုတ် နိုင်ငံကူးလက်မှတ်အသစ်နှင့် ကိုက်ညီရမည့် booking ရှိသောဝန်ဆောင်မှုကိုသာ မေးပါ။
    items:
      - icon: list
        audience: ifApplicable
        evidenceLevel: general
        title:
          en: Make a short list, then ask each provider whether an update is needed
          ko: 내 이용 내역을 적고 각 기관에 갱신 필요 여부를 물어보세요
          my: မိမိအသုံးပြုမှုစာရင်းရေးပြီး အဖွဲ့အစည်းတစ်ခုစီထံ ပြင်ရန်လိုမလို မေးပါ
        body:
          en: >-
            Do not send passport copies to every service automatically. First identify where the old passport was actually used, then follow only that provider's official instructions.
          ko: >-
            모든 서비스에 여권 사본을 일괄로 보내지 마세요. 구여권이 실제로 사용된 곳을 먼저 찾고 해당 기관의 공식 안내만 따릅니다.
          my: >-
            ဝန်ဆောင်မှုအားလုံးထံ နိုင်ငံကူးလက်မှတ်မိတ္တူကို အလိုအလျောက် မပို့ပါနှင့်။ ယခင်နိုင်ငံကူးလက်မှတ်ကို အမှန်တကယ်သုံးခဲ့သောနေရာကို ဦးစွာရှာပြီး ထိုအဖွဲ့အစည်း၏ တရားဝင်ညွှန်ကြားချက်ကိုသာ လိုက်နာပါ။
        prepare:
          - en: Accounts or contracts created with the previous passport
            ko: 구여권으로 가입하거나 계약한 계정
            my: ယခင်နိုင်ငံကူးလက်မှတ်ဖြင့် ဖွင့်ထားသော account သို့မဟုတ် contract
          - en: Upcoming international flight reservations
            ko: 예정된 국제선 항공권·예약
            my: လာမည့်နိုင်ငံတကာလေယာဉ် booking
          - en: Any service where the English name or nationality also changed
            ko: 영문 이름이나 국적도 달라져 정보가 불일치하는 서비스
            my: အင်္ဂလိပ်အမည် သို့မဟုတ် နိုင်ငံသားပါ ပြောင်းလဲ၍ အချက်မကိုက်သောဝန်ဆောင်မှု
        steps:
          - en: List only the providers that may still hold the previous passport information.
            ko: 구여권 정보를 보유할 가능성이 있는 기관만 적습니다.
            my: ယခင်နိုင်ငံကူးလက်မှတ်အချက်ရှိနိုင်သော အဖွဲ့အစည်းများကိုသာ စာရင်းရေးပါ။
          - en: Ask whether an update is required, which fields are needed, and where to submit them.
            ko: 갱신 필요 여부, 필요한 항목과 공식 제출 경로를 물어봅니다.
            my: ပြင်ရန်လိုမလို၊ လိုအပ်သည့်အချက်နှင့် တရားဝင်တင်ပြလမ်းကြောင်းကို မေးပါ။
          - en: Submit only what that provider requests through its verified app, website, branch, or customer center.
            ko: 확인된 앱·홈페이지·지점 또는 고객센터에서 요구된 자료만 제출합니다.
            my: အတည်ပြုထားသော app၊ website၊ branch သို့မဟုတ် customer center မှ တောင်းသောအရာကိုသာ ပို့ပါ။
          - en: Ask how you can confirm that the customer record or booking was updated.
            ko: 고객정보 또는 예약의 반영 완료 확인 방법을 물어봅니다.
            my: customer record သို့မဟုတ် booking ပြင်ပြီးကြောင်း စစ်ဆေးနည်းကို မေးပါ။
        checklist:
          - en: Bank, card, or remittance service that used my passport
            ko: 여권으로 본인확인한 은행·카드·해외송금 서비스
            my: နိုင်ငံကူးလက်မှတ်ဖြင့် အတည်ပြုထားသော ဘဏ်၊ ကတ် သို့မဟုတ် ငွေလွှဲဝန်ဆောင်မှု
          - en: Mobile or internet service opened with my passport
            ko: 여권으로 가입한 휴대전화·인터넷 서비스
            my: နိုင်ငံကူးလက်မှတ်ဖြင့် ဖွင့်ထားသော ဖုန်း သို့မဟုတ် internet ဝန်ဆောင်မှု
          - en: Health or private insurance record when identity details also changed
            ko: 신원정보도 달라졌다면 건강보험·민간보험 기록
            my: ကိုယ်ရေးအချက်ပါ ပြောင်းပါက ကျန်းမာရေး သို့မဟုတ် ပုဂ္ဂလိကအာမခံမှတ်တမ်း
          - en: International flight booking that still uses the previous passport details
            ko: 구여권 정보가 들어간 국제선 항공권·예약
            my: ယခင်နိုင်ငံကူးလက်မှတ်အချက်ပါသော နိုင်ငံတကာလေယာဉ် booking
          - en: Another account where the passport is the identity document
            ko: 여권을 신분증으로 등록한 다른 계정
            my: နိုင်ငံကူးလက်မှတ်ကို အထောက်အထားအဖြစ် မှတ်ပုံတင်ထားသော အခြား account
        doneWhen:
          en: >-
            You checked only the relevant providers and can see the updated customer record or booking, or received an official confirmation that no update is needed.
          ko: >-
            관련 기관만 확인했고 고객정보·예약의 반영 결과를 확인했거나 갱신이 필요 없다는 공식 답변을 받았습니다.
          my: >-
            သက်ဆိုင်သောအဖွဲ့အစည်းများကိုသာ စစ်ဆေးပြီး customer record သို့မဟုတ် booking ပြင်ပြီးကြောင်း မြင်နိုင်ခြင်း သို့မဟုတ် ပြင်ရန်မလိုကြောင်း တရားဝင်အတည်ပြုချက် ရရှိပါသည်။
        details:
          title:
            en: What is typical for each service?
            ko: 기관별로 무엇을 확인하면 되나요?
            my: အဖွဲ့အစည်းအလိုက် ဘာကိုစစ်ဆေးရမည်နည်း
          body:
            en: >-
              Banks set their own customer-verification process. Mobile carriers may treat a passport-opened or prepaid line differently from a line opened with a residence card. There is no confirmed nationwide rule that every person must report a passport-number-only change to health insurance. For an international flight, check that the booking and new passport name match and ask the airline or seller how to update any old passport details before departure.
            ko: >-
              은행은 각자의 고객확인 절차를 운영합니다. 통신사는 여권으로 가입한 회선·선불 회선과 외국인등록증으로 가입한 회선의 기준이 다를 수 있습니다. 여권번호만 바뀐 모든 사람이 건강보험에 반드시 신고해야 한다는 전국 공통 기준은 확인되지 않았습니다. 국제선은 예약 이름과 신여권 이름이 일치하는지 확인하고, 구여권 정보 수정 방법을 출발 전에 항공사 또는 구매처에 물어보세요.
            my: >-
              ဘဏ်တိုင်း customer verification လုပ်ငန်းစဉ် မတူပါ။ ဖုန်းကုမ္ပဏီသည် နိုင်ငံကူးလက်မှတ်ဖြင့်ဖွင့်ထားသော line သို့မဟုတ် prepaid line ကို နိုင်ငံခြားသားကတ်ဖြင့်ဖွင့်သော line နှင့် မတူစွာ ကိုင်တွယ်နိုင်ပါသည်။ နိုင်ငံကူးလက်မှတ်နံပါတ်သာ ပြောင်းသူအားလုံး ကျန်းမာရေးအာမခံထံ မဖြစ်မနေတင်ပြရမည့် တစ်နိုင်ငံလုံးစံကို မတွေ့ရှိပါ။ နိုင်ငံတကာလေယာဉ်အတွက် booking အမည်နှင့် နိုင်ငံကူးလက်မှတ်အသစ်အမည် ကိုက်ညီကြောင်းစစ်ပြီး ယခင်အချက်ပြင်နည်းကို မထွက်ခွာမီ လေကြောင်းလိုင်း သို့မဟုတ် ရောင်းသူထံ မေးပါ။
        messageTemplate:
          en: >-
            Hello. I received a new passport. Does the customer record or booking for my account need to be updated? Please tell me which fields and documents are required, the official submission channel, and how I can confirm completion. I will not send a passport copy until I verify the channel.
          ko: >-
            안녕하세요. 새 여권을 발급받았습니다. 제 계정의 고객정보 또는 예약정보 갱신이 필요한가요? 필요한 항목과 자료, 공식 제출 경로와 완료 확인 방법을 알려주세요. 제출 경로를 확인하기 전에는 여권 사본을 보내지 않겠습니다.
          my: >-
            မင်္ဂလာပါ။ နိုင်ငံကူးလက်မှတ်အသစ် ရရှိပါပြီ။ ကျွန်ုပ် account ၏ customer record သို့မဟုတ် booking ကို ပြင်ရန်လိုပါသလား။ လိုအပ်သည့်အချက်နှင့် စာရွက်၊ တရားဝင်တင်ပြလမ်းကြောင်းနှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို ပြောပြပါ။ လမ်းကြောင်းကို မစစ်မီ နိုင်ငံကူးလက်မှတ်မိတ္တူ မပို့ပါ။
        sources:
          - label:
              en: Example for KB customers · Customer due diligence
              ko: KB 이용자 확인 예시 · 고객확인제도
              my: KB သုံးစွဲသူအတွက် ဥပမာ · customer verification
            href: https://obank.kbstar.com/quics?page=C029250
          - label:
              en: Health-insurance contact · Foreign resident service center
              ko: 건강보험 문의처 · 외국인민원센터
              my: ကျန်းမာရေးအာမခံ မေးမြန်းရန် · နိုင်ငံခြားသားဝန်ဆောင်မှုစင်တာ
            href: https://www.nhis.or.kr/static/html/map/map_more_nhis_01.html
          - label:
              en: Example for Asiana passengers · Online check-in information
              ko: 아시아나 이용자 확인 예시 · 온라인 체크인 안내
              my: Asiana ခရီးသည်အတွက် ဥပမာ · online check-in လမ်းညွှန်
            href: https://flyasiana.com/C/JP/EN/contents/online-check-in

  - id: exceptions
    variant: warning
    icon: help
    title:
      en: Stop and confirm first in these situations
      ko: 이런 경우에는 진행 전에 먼저 확인하세요
      my: ဤအခြေအနေများတွင် မလုပ်မီ ဦးစွာအတည်ပြုပါ
    intro:
      en: >-
        The checklist above assumes a straightforward passport renewal. The following cases can involve a different document, timing rule, permission, or report depending on your exact status.
      ko: >-
        위 체크리스트는 단순한 여권 갱신을 전제로 합니다. 아래 상황은 정확한 체류자격에 따라 다른 서류·기한·허가 또는 신고가 관련될 수 있습니다.
      my: >-
        အထက်ပါစာရင်းသည် ရိုးရိုး နိုင်ငံကူးလက်မှတ်သက်တမ်းတိုးမှုကို အခြေခံထားပါသည်။ အောက်ပါအခြေအနေများတွင် မိမိနေထိုင်ခွင့်အလိုက် အခြားစာရွက်၊ နောက်ဆုံးရက်၊ ခွင့်ပြုချက် သို့မဟုတ် တင်ပြမှု ပါဝင်နိုင်ပါသည်။
    items:
      - icon: help
        audience: warning
        evidenceLevel: official
        title:
          en: The deadline may have passed, or receipt was much later than issue
          ko: 기한이 지났거나 발급일보다 훨씬 늦게 받았어요
          my: နောက်ဆုံးရက်ကျော်နိုင်ခြင်း သို့မဟုတ် ထုတ်ပေးသည့်ရက်ထက် များစွာနောက်ကျရရှိပါသည်
        body:
          en: >-
            If the deadline has definitely passed, do not submit again through e-application or fax. The Ministry of Justice Visa Navigator (Ver 2022.12) says to report in person at the responsible Immigration office for review of whether a violation occurred. If the deadline is unclear, prepare the issue date, actual receipt date, and official receipt evidence and ask 1345 immediately.
          ko: >-
            기한을 넘긴 것이 확실하다면 전자민원이나 팩스로 다시 접수하지 마세요. 법무부 「비자 내비게이터(Ver 2022.12)」는 기한 경과 시 관할 출입국·외국인관서 방문 신고와 위반 여부 심사가 필요하다고 안내합니다. 기한이 불분명하면 발급일·실제 수령일과 공적인 수령 증빙을 준비해 1345에 즉시 확인하세요.
          my: >-
            နောက်ဆုံးရက်ကျော်လွန်ကြောင်း သေချာပါက e-application သို့မဟုတ် fax ဖြင့် ထပ်မံမတင်ပြပါနှင့်။ တရားရေးဝန်ကြီးဌာန 「Visa Navigator (Ver 2022.12)」 အရ တာဝန်ရှိ လူဝင်မှုကြီးကြပ်ရေးရုံးသို့ ကိုယ်တိုင်သွားတင်ပြပြီး ချိုးဖောက်မှုရှိမရှိ စစ်ဆေးခံရန်လိုပါသည်။ နောက်ဆုံးရက်မရှင်းလင်းပါက ထုတ်ပေးသည့်ရက်၊ အမှန်တကယ်လက်ခံရက်နှင့် တရားဝင်လက်ခံအထောက်အထားကို ပြင်ဆင်ပြီး 1345 ထံ ချက်ချင်းမေးပါ။
        steps:
          - en: Write down the issue date, receipt date, and today's date.
            ko: 발급일·실제 수령일·오늘 날짜를 적습니다.
            my: ထုတ်ပေးသည့်ရက်၊ လက်ခံရက်နှင့် ယနေ့ရက်ကို မှတ်ပါ။
          - en: Keep official proof of receipt, such as a receipt issued by the issuing authority, and ask 1345 or the responsible office whether it can be accepted.
            ko: 발급기관 등이 발급한 수령증 등 공적인 수령일 증빙을 보관하고, 인정 가능한 자료인지 1345 또는 관할청에 확인합니다.
            my: ထုတ်ပေးသည့်အဖွဲ့အစည်းက ထုတ်ပေးသောလက်ခံပြေစာကဲ့သို့ တရားဝင်လက်ခံရက်အထောက်အထားကို သိမ်းပြီး 1345 သို့မဟုတ် တာဝန်ရှိရုံးထံ လက်ခံနိုင်သည့်အထောက်အထား ဟုတ်မဟုတ် မေးပါ။
          - en: If the deadline has passed, confirm the in-person reporting procedure before visiting the responsible Immigration office.
            ko: 기한이 지났다면 관할 출입국·외국인관서 방문 신고 절차를 확인합니다.
            my: နောက်ဆုံးရက်ကျော်ပါက တာဝန်ရှိ လူဝင်မှုကြီးကြပ်ရေးရုံးသို့ ကိုယ်တိုင်သွားတင်ပြမည့်လုပ်ငန်းစဉ်ကို မေးပါ။
        messageTemplate:
          en: >-
            My status of stay is [status code]. My new passport was issued on [issue date] and I actually received it on [receipt date]. I have [type of receipt proof]. Please tell me which reporting period applies, the current official submission route, required material, and how I should confirm completion.
          ko: >-
            제 체류자격은 [체류자격 코드]입니다. 신여권 발급일은 [발급일], 실제 수령일은 [수령일]이고 [수령 증빙 종류]를 가지고 있습니다. 적용되는 신고기한, 현재 공식 접수 경로, 필요한 자료와 완료 확인 방법을 알려주세요.
          my: >-
            ကျွန်ုပ်၏ နေထိုင်ခွင့်မှာ [code] ဖြစ်ပါသည်။ နိုင်ငံကူးလက်မှတ်အသစ် ထုတ်ပေးသည့်ရက်မှာ [ရက်]၊ အမှန်တကယ်လက်ခံရက်မှာ [ရက်] ဖြစ်ပြီး [လက်ခံအထောက်အထား] ရှိပါသည်။ သက်ဆိုင်သည့်နောက်ဆုံးရက်၊ လက်ရှိတရားဝင်တင်ပြလမ်းကြောင်း၊ လိုအပ်စာရွက်နှင့် ပြီးစီးကြောင်းစစ်ဆေးနည်းကို ပြောပြပါ။
        sources:
          - label:
              en: Ministry of Justice · Visa Navigator (Ver 2022.12)
              ko: 법무부 · 비자 내비게이터(Ver 2022.12)
              my: တရားရေးဝန်ကြီးဌာန · Visa Navigator (Ver 2022.12)
            href: https://www.corrections.go.kr/bbs/immigration_eng/230/454086/download.do
          - label:
              en: Immigration Contact Center 1345
              ko: 외국인종합안내센터 1345
              my: လူဝင်မှုကြီးကြပ်ရေး အချက်အလက်စင်တာ 1345
            href: https://www.immigration.go.kr/immigration/1530/subview.do

      - icon: shield
        audience: warning
        evidenceLevel: official
        title:
          en: Name, nationality, date of birth, or sex also changed
          ko: 성명·국적·생년월일·성별도 달라졌어요
          my: အမည်၊ နိုင်ငံသား၊ မွေးသက္ကရာဇ် သို့မဟုတ် လိင်ပါ ပြောင်းလဲပါသည်
        body:
          en: >-
            A change to name, sex, date of birth, or nationality is a separate registered-detail report. Under Article 44(2) of the Enforcement Decree of the Immigration Control Act, it also requires residence-card reissuance. Do not stop after a passport-number e-application; confirm the required proof and card-reissuance procedure with 1345 or the responsible office.
          ko: >-
            성명·성별·생년월일·국적 변경은 별도의 외국인등록사항 변경 신고 대상이며, 출입국관리법 시행령 제44조제2항에 따라 외국인등록증 재발급 대상입니다. 여권번호 변경 전자민원만으로 끝내지 말고 1345 또는 관할청에서 필요한 증빙과 등록증 재발급 절차를 확인하세요.
          my: >-
            အမည်၊ လိင်၊ မွေးသက္ကရာဇ် သို့မဟုတ် နိုင်ငံသားပြောင်းလဲမှုသည် သီးခြားမှတ်ပုံတင်အချက် ပြောင်းလဲမှုတင်ပြရမည့်အရာဖြစ်ပြီး လူဝင်မှုကြီးကြပ်ရေးဥပဒေ အကောင်အထည်ဖော်အမိန့် ပုဒ်မ ၄၄(၂) အရ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် အသစ်ပြန်ထုတ်ရန်လည်း လိုအပ်ပါသည်။ နိုင်ငံကူးလက်မှတ်နံပါတ် e-application ဖြင့်သာ မပြီးဘဲ လိုအပ်သည့်အထောက်အထားနှင့် ကတ်အသစ်ပြန်ထုတ်ခြင်းကို 1345 သို့မဟုတ် တာဝန်ရှိရုံးထံ မေးပါ။
        steps:
          - en: Mark every identity field that differs from the current Immigration record.
            ko: 현재 출입국 기록과 다른 신원정보를 모두 표시합니다.
            my: လက်ရှိ လူဝင်မှုကြီးကြပ်ရေးမှတ်တမ်းနှင့် မတူသော ကိုယ်ရေးအချက်အားလုံးကို မှတ်ပါ။
          - en: Ask 1345 or the responsible office what proof and card procedure apply.
            ko: 필요한 증빙과 등록증 절차를 1345 또는 담당 기관에 확인합니다.
            my: လိုအပ်သည့်အထောက်အထားနှင့် ကတ်လုပ်ငန်းကို 1345 သို့မဟုတ် တာဝန်ရှိရုံးထံ မေးပါ။
          - en: After Immigration is checked, ask each relevant school, workplace, bank, or booking service how its record should match.
            ko: 출입국 확인 후 관련 학교·직장·은행·예약 서비스에 기록 일치 방법을 물어봅니다.
            my: လူဝင်မှုကြီးကြပ်ရေးစစ်ဆေးပြီးနောက် သက်ဆိုင်ရာကျောင်း၊ အလုပ်ခွင်၊ ဘဏ် သို့မဟုတ် booking ဝန်ဆောင်မှုထံ မှတ်တမ်းကိုက်ညီနည်းကို မေးပါ။
        doneWhen:
          en: >-
            You reported every changed identity field, submitted the required proof, and confirmed both receipt and completion of the residence-card reissuance procedure.
          ko: >-
            달라진 신원정보를 신고하고 필요한 증빙을 제출했으며, 외국인등록증 재발급 절차의 접수·완료 여부까지 확인했습니다.
          my: >-
            ပြောင်းလဲသည့် ကိုယ်ရေးအချက်အားလုံးကို တင်ပြပြီး လိုအပ်သည့်အထောက်အထားကို ပေးပို့ကာ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် အသစ်ပြန်ထုတ်ခြင်းကို လက်ခံရရှိခြင်းနှင့် ပြီးစီးခြင်းအထိ အတည်ပြုပြီးပါပြီ။
        sources:
          - label:
              en: Immigration Control Act · Article 35
              ko: 출입국관리법 제35조
              my: လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၅
            href: https://www.law.go.kr/법령/출입국관리법/제35조
          - label:
              en: Enforcement Decree · Article 44
              ko: 출입국관리법 시행령 제44조
              my: လူဝင်မှုကြီးကြပ်ရေးဥပဒေ အကောင်အထည်ဖော်အမိန့် ပုဒ်မ ၄၄
            href: https://www.law.go.kr/법령/출입국관리법시행령/제44조

      - icon: users
        audience: warning
        evidenceLevel: official
        title:
          en: The school or enrollment status itself is changing
          ko: 학교나 재학 상태 자체가 바뀌어요
          my: ကျောင်း သို့မဟုတ် ကျောင်းတက်အခြေအနေကိုယ်တိုင် ပြောင်းလဲပါသည်
        body:
          en: >-
            A transfer, leave, withdrawal, course completion, or institution change is different from updating a passport number at the same school. The required report and timing depend on the status of stay and change.
          ko: >-
            전학·휴학·자퇴·과정 종료·소속기관 변경은 같은 학교의 여권번호 갱신과 다른 일입니다. 필요한 신고와 시점은 체류자격과 변경 내용에 따라 달라집니다.
          my: >-
            ကျောင်းပြောင်း၊ ခေတ္တရပ်၊ ကျောင်းထွက်၊ သင်တန်းပြီးဆုံး သို့မဟုတ် အဖွဲ့အစည်းပြောင်းခြင်းသည် ယခင်ကျောင်းရှိ နိုင်ငံကူးလက်မှတ်နံပါတ်ပြင်ခြင်းနှင့် မတူပါ။ လိုအပ်သောတင်ပြမှုနှင့် အချိန်သည် နေထိုင်ခွင့်နှင့် ပြောင်းလဲမှုအလိုက် ကွာပါသည်။
        prepare:
          - en: Exact status-of-stay code
            ko: 정확한 체류자격 코드
            my: တိကျသော နေထိုင်ခွင့် code
          - en: Planned date and type of enrollment change
            ko: 변경 예정일과 재학 상태 변경 내용
            my: ပြောင်းမည့်ရက်နှင့် ကျောင်းတက်အခြေအနေ ပြောင်းလဲမှု
          - en: Current and new institution information
            ko: 현재 학교와 새 학교 또는 변경될 기관 정보
            my: လက်ရှိနှင့် အသစ် အဖွဲ့အစည်းအချက်အလက်
        steps:
          - en: Ask whether this requires action before or after the change.
            ko: 변경 전 또는 변경 후 어느 시점에 절차가 필요한지 묻습니다.
            my: မပြောင်းမီ သို့မဟုတ် ပြောင်းပြီးနောက် ဘယ်အချိန်တွင်လုပ်ရမည်ကို မေးပါ။
          - en: Ask for the exact official task name, deadline, documents, and completion method.
            ko: 정확한 공식 업무명·기한·서류·완료 확인 방법을 확인합니다.
            my: တိကျသော တရားဝင်လုပ်ငန်းအမည်၊ နောက်ဆုံးရက်၊ စာရွက်နှင့် ပြီးစီးနည်းကို မေးပါ။
          - en: Confirm through HiKorea or 1345 before relying only on the school's answer.
            ko: 학교 답변에만 의존하지 말고 하이코리아 또는 1345에서 확인합니다.
            my: ကျောင်းအဖြေတစ်ခုတည်းကို မယုံဘဲ HiKorea သို့မဟုတ် 1345 တွင် စစ်ဆေးပါ။
        messageTemplate:
          en: >-
            I currently hold [status-of-stay code]. On [planned date], I expect to [transfer, take leave, withdraw, finish a course, or change institution]. Please tell me whether this requires prior action or a later report, the exact official task name, deadline, required documents, and how I can confirm completion.
          ko: >-
            저는 현재 [체류자격 코드]로 체류 중입니다. [예정일]에 [전학·휴학·자퇴·과정 종료·소속기관 변경]이 예정되어 있습니다. 사전 절차인지 변경 후 신고인지, 정확한 공식 업무명·기한·필요서류와 완료 확인 방법을 알려주세요.
          my: >-
            ကျွန်ုပ်သည် လက်ရှိ [နေထိုင်ခွင့် code] ဖြင့် နေထိုင်နေပါသည်။ [ရက်] တွင် [ကျောင်းပြောင်း၊ ခေတ္တရပ်၊ ကျောင်းထွက်၊ သင်တန်းပြီးဆုံး သို့မဟုတ် အဖွဲ့အစည်းပြောင်း] ရန်ရှိပါသည်။ ကြိုတင်လုပ်ရမည် သို့မဟုတ် ပြောင်းပြီးနောက်တင်ပြရမည်ကိုလည်းကောင်း၊ တိကျသောလုပ်ငန်းအမည်၊ နောက်ဆုံးရက်၊ လိုအပ်စာရွက်နှင့် ပြီးစီးနည်းကိုလည်းကောင်း ပြောပြပါ။
        sources:
          - label:
              en: Easy Law · Foreign-student registration changes
              ko: 찾기쉬운 생활법령 · 외국인유학생 변경 신고
              my: Easy Law · နိုင်ငံခြားကျောင်းသား မှတ်ပုံတင်ပြောင်းလဲမှု
            href: https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&cciNo=3&cnpClsNo=1&csmSeq=2853&popMenu=ov
          - label:
              en: HiKorea · Registered-detail reporting duties
              ko: 하이코리아 · 외국인등록사항 변경 신고의무
              my: HiKorea · မှတ်ပုံတင်အချက် ပြောင်းလဲမှုတင်ပြရန်တာဝန်
            href: https://www.hikorea.go.kr/info/InfoDatail.pt?CAT_SEQ=196&PARENT_ID=146
          - label:
              en: HiKorea · Integrated status-of-stay manual (posted July 9, 2026)
              ko: 하이코리아 · 체류자격별 통합 안내 매뉴얼(2026.7.9 게시본)
              my: HiKorea · နေထိုင်ခွင့်အလိုက် ပေါင်းစည်းလမ်းညွှန် (၂၀၂၆.၇.၉ တင်ထားသည်)
            href: https://www.hikorea.go.kr/board/BoardNtcDetailR.pt?BBS_GB_CD=BS10&BBS_SEQ=1&NTCCTT_SEQ=1062&page=1

      - icon: jobs
        audience: warning
        evidenceLevel: official
        title:
          en: The employer, workplace, job, duties, or annual income is changing
          ko: 회사·근무처·직업·업무 또는 연간소득도 바뀌어요
          my: အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ်၊ တာဝန် သို့မဟုတ် နှစ်စဉ်ဝင်ငွေပါ ပြောင်းလဲပါသည်
        body:
          en: >-
            This is not an internal passport-record update. If the employer, workplace, job, or duties will change, confirm before starting the new work. Even when only annual income changes, some statuses of stay may require a separate change report, so confirm the applicable post-change deadline and exact task name. Whether prior permission or a later report is required depends on the status of stay and the change.
          ko: >-
            회사 내부 여권정보 갱신이 아닙니다. 회사·근무처·직업·업무가 바뀌면 새 근무를 시작하기 전에 확인하세요. 연간소득만 달라지는 경우에도 일부 체류자격은 별도 변경 신고 대상일 수 있으므로 변경 후 적용 기한과 업무명을 확인해야 합니다. 사전허가·사후신고 여부는 체류자격과 변경 내용에 따라 달라집니다.
          my: >-
            ကုမ္ပဏီအတွင်း နိုင်ငံကူးလက်မှတ်အချက် ပြင်ခြင်းမဟုတ်ပါ။ အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ် သို့မဟုတ် တာဝန်ပြောင်းပါက အလုပ်အသစ်မစတင်မီ စစ်ဆေးပါ။ နှစ်စဉ်ဝင်ငွေသာ ပြောင်းသော်လည်း အချို့နေထိုင်ခွင့်များတွင် သီးခြားပြောင်းလဲမှုတင်ပြရန် လိုနိုင်သဖြင့် ပြောင်းပြီးနောက်သက်ဆိုင်မည့် နောက်ဆုံးရက်နှင့် လုပ်ငန်းအမည်ကို မေးပါ။ ကြိုတင်ခွင့်ပြုချက် သို့မဟုတ် နောက်မှတင်ပြရန်လိုမလိုသည် နေထိုင်ခွင့်နှင့် ပြောင်းလဲမှုအလိုက် ကွာပါသည်။
        prepare:
          - en: Exact status-of-stay code and current expiry date
            ko: 정확한 체류자격 코드와 현재 체류기간 만료일
            my: တိကျသော နေထိုင်ခွင့် code နှင့် လက်ရှိသက်တမ်းကုန်ရက်
          - en: Planned work start or change date
            ko: 근무 시작 또는 변경 예정일
            my: အလုပ်စတင် သို့မဟုတ် ပြောင်းမည့်ရက်
          - en: Current and new employer, workplace, job, duties, and income information
            ko: 현재·새 회사, 근무처, 직업, 업무와 소득 변경 내용
            my: လက်ရှိနှင့် အသစ် အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ်၊ တာဝန်နှင့် ဝင်ငွေပြောင်းလဲမှု
        steps:
          - en: Ask whether action is required before the work begins or after the change.
            ko: 근무 시작 전인지 변경 후인지 필요한 시점을 묻습니다.
            my: အလုပ်မစမီ သို့မဟုတ် ပြောင်းပြီးနောက် ဘယ်အချိန်တွင်လုပ်ရမည်ကို မေးပါ။
          - en: Ask for the exact task name, deadline, documents, and responsible office.
            ko: 정확한 업무명·기한·필요서류와 담당 기관을 확인합니다.
            my: တိကျသော လုပ်ငန်းအမည်၊ နောက်ဆုံးရက်၊ လိုအပ်စာရွက်နှင့် တာဝန်ရှိရုံးကို မေးပါ။
          - en: Confirm through current HiKorea guidance or 1345 instead of relying only on the employer.
            ko: 회사 답변에만 의존하지 말고 최신 하이코리아 안내 또는 1345에서 확인합니다.
            my: အလုပ်ရှင်အဖြေတစ်ခုတည်းကို မယုံဘဲ လက်ရှိ HiKorea လမ်းညွှန် သို့မဟုတ် 1345 တွင် စစ်ဆေးပါ။
        messageTemplate:
          en: >-
            I currently hold [status-of-stay code]. From [planned date], my [employer, workplace, job, duties, or income] will change as follows: [short description]. Before I start, please tell me whether this requires prior permission, a later report, or another procedure, and give me the exact official task name, deadline, required documents, and completion method.
          ko: >-
            저는 현재 [체류자격 코드]로 체류 중입니다. [예정일]부터 [회사·근무처·직업·업무·소득]이 [간단한 변경 내용]으로 바뀔 예정입니다. 시작하기 전에 사전허가, 사후신고 또는 다른 절차 중 무엇에 해당하는지와 정확한 공식 업무명·기한·필요서류·완료 확인 방법을 알려주세요.
          my: >-
            ကျွန်ုပ်သည် လက်ရှိ [နေထိုင်ခွင့် code] ဖြင့် နေထိုင်နေပါသည်။ [ရက်] မှစ၍ [အလုပ်ရှင်၊ အလုပ်ခွင်၊ အလုပ်၊ တာဝန် သို့မဟုတ် ဝင်ငွေ] သည် [တိုတောင်းသောရှင်းလင်းချက်] အတိုင်း ပြောင်းမည်ဖြစ်ပါသည်။ အလုပ်မစတင်မီ ကြိုတင်ခွင့်ပြုချက်၊ နောက်မှတင်ပြခြင်း သို့မဟုတ် အခြားလုပ်ငန်းလား၊ တိကျသောလုပ်ငန်းအမည်၊ နောက်ဆုံးရက်၊ လိုအပ်စာရွက်နှင့် ပြီးစီးနည်းကို ပြောပြပါ။
        sources:
          - label:
              en: HiKorea · Integrated status-of-stay manual (posted July 9, 2026)
              ko: 하이코리아 · 체류자격별 통합 안내 매뉴얼(2026.7.9 게시본)
              my: HiKorea · နေထိုင်ခွင့်အလိုက် ပေါင်းစည်းလမ်းညွှန် (၂၀၂၆.၇.၉ တင်ထားသည်)
            href: https://www.hikorea.go.kr/board/BoardNtcDetailR.pt?BBS_GB_CD=BS10&BBS_SEQ=1&NTCCTT_SEQ=1062&page=1
          - label:
              en: Immigration Contact Center 1345
              ko: 외국인종합안내센터 1345
              my: လူဝင်မှုကြီးကြပ်ရေး အချက်အလက်စင်တာ 1345
            href: https://www.immigration.go.kr/immigration/1530/subview.do

      - icon: help
        audience: warning
        evidenceLevel: official
        title:
          en: The e-application was supplemented, rejected, or cannot be found
          ko: 전자민원이 보완·반려됐거나 업무를 찾을 수 없어요
          my: e-application တွင် အပိုတောင်း၊ ငြင်းပယ် သို့မဟုတ် လုပ်ငန်းမတွေ့ပါ
        body:
          en: >-
            Save the exact message instead of repeatedly submitting the same material. Compare the requested item with your earlier submission and ask an official source when the instruction is unclear.
          ko: >-
            같은 자료를 반복 제출하지 말고 화면의 정확한 안내 문구를 보관하세요. 요구된 항목을 기존 제출자료와 비교하고 이해되지 않으면 공식 확인처에 문의합니다.
          my: >-
            တူညီသောစာရွက်ကို ထပ်ခါထပ်ခါ မတင်ဘဲ မျက်နှာပြင်ရှိ တိကျသောစာသားကို သိမ်းပါ။ တောင်းဆိုသည့်အချက်ကို ယခင်တင်သွင်းမှုနှင့် နှိုင်းယှဉ်ပြီး မရှင်းလင်းပါက တရားဝင်နေရာတွင် မေးပါ။
        steps:
          - en: Save the status, message, date, and receipt number.
            ko: 상태·안내 문구·날짜·접수번호를 보관합니다.
            my: အခြေအနေ၊ စာသား၊ ရက်နှင့် လက်ခံနံပါတ်ကို သိမ်းပါ။
          - en: Compare the requested material with the files already submitted.
            ko: 요구된 자료를 기존 제출 파일과 비교합니다.
            my: တောင်းဆိုသည့်စာရွက်ကို ယခင်ဖိုင်များနှင့် နှိုင်းယှဉ်ပါ။
          - en: Ask 1345 or the responsible office for the exact next action if the reason is unclear.
            ko: 사유가 불분명하면 1345 또는 담당 기관에 정확한 다음 행동을 확인합니다.
            my: အကြောင်းပြချက်မရှင်းလင်းပါက 1345 သို့မဟုတ် တာဝန်ရှိရုံးထံ နောက်တစ်ဆင့်ကို မေးပါ။
          - en: If you submit again, save the new receipt and check the result again.
            ko: 다시 제출했다면 새 접수정보를 보관하고 결과를 재확인합니다.
            my: ထပ်မံတင်သွင်းပါက လက်ခံအချက်အသစ်ကို သိမ်းပြီး ရလဒ်ကို ပြန်စစ်ပါ။
        doneWhen:
          en: >-
            You understand the official reason, completed the requested next action, and confirmed the new processing result.
          ko: >-
            공식 사유를 이해하고 요구된 다음 행동을 진행한 뒤 새 처리 결과를 확인했습니다.
          my: >-
            တရားဝင်အကြောင်းပြချက်ကို နားလည်ပြီး တောင်းဆိုသည့်နောက်တစ်ဆင့်ကို လုပ်ကာ ရလဒ်အသစ်ကို အတည်ပြုပြီးပါပြီ။
        sources:
          - label:
              en: HiKorea · E-application result
              ko: 하이코리아 · 전자민원 신청결과
              my: HiKorea · e-application ရလဒ်
            href: https://www.hikorea.go.kr/Main.pt
          - label:
              en: Immigration Contact Center 1345
              ko: 외국인종합안내센터 1345
              my: လူဝင်မှုကြီးကြပ်ရေး အချက်အလက်စင်တာ 1345
            href: https://www.immigration.go.kr/immigration/1530/subview.do

  - id: official-safety
    variant: standard
    icon: external
    title:
      en: Use official services safely
      ko: 공식 서비스를 안전하게 이용하기
      my: တရားဝင်ဝန်ဆောင်မှုကို လုံခြုံစွာအသုံးပြုပါ
    intro:
      en: Start with the exact name of the task you need, read its latest detail page, and keep your own application or visit record.
      ko: 필요한 업무의 정확한 명칭부터 찾고 최신 상세 화면을 읽으세요. 신청이나 방문 기록은 본인이 보관합니다.
      my: လိုအပ်သောလုပ်ငန်း၏ အတိအကျအမည်ကို အရင်ရှာပြီး နောက်ဆုံးဝန်ဆောင်မှုအသေးစိတ်ကို ဖတ်ပါ။ လျှောက်ထားမှု သို့မဟုတ် သွားရောက်မှုမှတ်တမ်းကို မိမိသိမ်းထားပါ။
    items:
      - icon: external
        audience: none
        evidenceLevel: general
        title:
          en: Find the exact task on HiKorea
          ko: 하이코리아에서 업무명 확인
          my: HiKorea တွင် လုပ်ငန်းအမည်ကို စစ်ဆေးပါ
        body:
          en: Check the exact e-application name, whether it is available online, the responsible office, visit reservation, documents, and current notices. Prefer the task's official detail page over a general summary.
          ko: 필요한 전자민원의 정확한 이름, 온라인 가능 여부, 관할 기관, 방문예약, 준비서류와 최신 공지를 확인합니다. 일반 요약보다 해당 민원의 공식 상세 화면을 우선하세요.
          my: လိုအပ်သော အွန်လိုင်းဝန်ဆောင်မှုအမည်၊ အွန်လိုင်းလုပ်နိုင်မှု၊ တာဝန်ရှိရုံး၊ သွားရောက်ရက်ချိန်း၊ စာရွက်များနှင့် နောက်ဆုံးကြေညာချက်ကို စစ်ဆေးပါ။ အထွေထွေအကျဉ်းထက် သက်ဆိုင်ရာတရားဝင်အသေးစိတ်စာမျက်နှာကို ဦးစားပေးပါ။
        sources:
          - label:
              en: HiKorea
              ko: 하이코리아
              my: HiKorea
