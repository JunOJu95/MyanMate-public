        body:
          en: The Immigration Contact Center supports Myanmar among its languages. Check the current multilingual hours, then ask using your exact status of stay and specific change.
          ko: 외국인종합안내센터 1345는 지원 언어 중 미얀마어 상담도 제공합니다. 최신 다국어 상담시간을 확인한 뒤 본인의 체류자격과 구체적인 변경 상황을 기준으로 문의하세요.
          my: နိုင်ငံခြားသားအထွေထွေလမ်းညွှန်စင်တာ 1345 သည် မြန်မာဘာသာကိုလည်း ထောက်ပံ့ပါသည်။ လက်ရှိဘာသာစုံဝန်ဆောင်မှုအချိန်ကို စစ်ဆေးပြီး မိမိနေထိုင်ခွင့်နှင့် တိကျသောပြောင်းလဲမှုအကြောင်း မေးပါ။
