entryTitle: ARC passport and life admin
category: daily
order: 70
lastReviewed: 2026-07-30
title:
  en: ARC, passport, and stay-period checks
  ko: 외국인등록증·여권·체류기간 확인
  my: ARC၊ Passport နှင့် နေထိုင်ခွင့် စစ်ဆေးရန်အချက်များ
description:
  en: "Simple checks for foreign residents in Korea: keep your ARC, passport, address, school, work, and stay-period information correct, and confirm changes through official channels."
  ko: 한국에 거주하는 외국인이 외국인등록증, 여권, 주소, 학교, 직장, 체류기간 정보를 올바르게 관리하고 변경사항을 공식 경로에서 확인할 수 있도록 정리했습니다.
  my: ကိုရီးယားမှာ နေထိုင်နေသူအတွက် ARC၊ Passport၊ လိပ်စာ၊ ကျောင်း၊ အလုပ်နှင့် နေထိုင်ခွင့်ကာလတွေကို မှန်မှန်ကန်ကန် ထိန်းထားဖို့ စစ်ဆေးရမည့်အချက်များကို ရိုးရိုးရှင်းရှင်း စုထားပါသည်။
sections:
  - icon: admin
    title:
      en: What this page is about
      ko: 이 페이지에서 확인할 내용
      my: ဒီစာမျက်နှာမှာ ဘာကိုစစ်မလဲ
    intro:
      en: Your ARC, passport, and allowed stay period are separate things. Do not wait until the last moment to check them.
      ko: 외국인등록증, 여권, 체류기간은 서로 다른 항목입니다. 마지막 순간까지 기다리지 말고 미리 확인하세요.
      my: ARC၊ Passport နှင့် နေထိုင်ခွင့်ကာလသည် တစ်ခုတည်းမဟုတ်ပါ။ နောက်ဆုံးအချိန်ကျမှ မစစ်ဘဲ ကြိုတင်စစ်ထားသင့်ပါသည်။
    items:
      - icon: visa
        title:
          en: ARC information
          ko: 외국인등록증 정보
          my: ARC အချက်အလက်
        body:
          en: Check that the name, nationality, visa/status type, and stay-period information on your card are correct. If the card is lost, damaged, or wrong, use the official correction or reissue process.
          ko: 카드에 적힌 이름, 국적, 체류자격, 체류기간 정보가 맞는지 확인합니다. 분실, 훼손, 오류가 있으면 공식 정정 또는 재발급 절차를 이용하세요.
          my: ကတ်ပေါ်က အမည်၊ နိုင်ငံသား၊ Visa/status အမျိုးအစားနှင့် နေထိုင်ခွင့်ကာလ မှန်မမှန် စစ်ပါ။ ကတ်ပျောက်ခြင်း၊ ပျက်စီးခြင်း သို့မဟုတ် မှားနေခြင်းရှိပါက တရားဝင် ပြင်ဆင်/ပြန်ထုတ် လုပ်ငန်းစဉ်ကို စစ်ပါ။
        href: ""
      - icon: doc
        title:
          en: Passport information
          ko: 여권 정보
          my: Passport အချက်အလက်
        body:
          en: Your passport expiry date and your allowed stay period are not the same. If you get a new passport, check whether the new passport information must be reported.
          ko: 여권 만료일과 체류기간 만료일은 같지 않습니다. 새 여권을 받으면 새 여권 정보를 신고해야 하는지 확인하세요.
          my: Passport သက်တမ်းကုန်ရက်နှင့် နေထိုင်ခွင့်ကုန်ရက် မတူနိုင်ပါ။ Passport အသစ်ရပါက passport အသစ်အချက်အလက်ကို တင်ပြရန်လိုမလို စစ်ပါ။
        href: ""
      - icon: list
        title:
          en: Important dates
          ko: 중요한 날짜
          my: အရေးကြီးရက်စွဲများ
        body:
          en: Keep reminders for your stay period, passport expiry date, school period, and work contract when relevant. Checking early gives you time to prepare documents.
          ko: 체류기간, 여권 만료일, 재학기간, 근로계약 기간을 각각 알림으로 관리하세요. 미리 확인하면 서류를 준비할 시간이 생깁니다.
          my: နေထိုင်ခွင့်ကာလ၊ Passport သက်တမ်းကုန်ရက်၊ ကျောင်းတက်ကာလနှင့် အလုပ်စာချုပ်ကာလတို့ကို သီးခြား reminder ထားပါ။ ကြိုစစ်ထားရင် စာရွက်စာတမ်းပြင်ဆင်ရန် အချိန်ရပါသည်။
        href: ""
  - icon: housing
    title:
      en: When you should check again
      ko: 다시 확인해야 하는 상황
      my: ဘယ်အချိန်တွေမှာ ပြန်စစ်ရမလဲ
    intro:
      en: When your address, passport, school, or workplace changes, your immigration record may also need attention.
      ko: 주소, 여권, 학교, 직장이 바뀌면 출입국 기록도 확인해야 할 수 있습니다.
      my: လိပ်စာ၊ Passport၊ ကျောင်း သို့မဟုတ် အလုပ်ပြောင်းသည့်အခါ လူဝင်မှုကြီးကြပ်ရေးမှတ်တမ်းကိုပါ ပြန်စစ်ရန်လိုနိုင်ပါသည်။
    items:
      - icon: housing
        title:
          en: You moved to a new place
          ko: 이사했을 때
          my: အိမ်ပြောင်းသည့်အခါ
        body:
          en: Moving house does not always update immigration records automatically. Check whether you need to report your new address and what proof of address is accepted.
          ko: 이사했다고 출입국 주소 기록이 자동으로 바뀌는 것은 아닙니다. 새 주소 신고가 필요한지, 어떤 주소 증빙이 인정되는지 확인하세요.
          my: အိမ်ပြောင်းလိုက်ရုံနဲ့ immigration record ထဲက လိပ်စာ အလိုအလျောက် မပြောင်းနိုင်ပါ။ လိပ်စာအသစ် တင်ပြရန်လိုမလိုနှင့် ဘယ် address proof လက်ခံမလဲ စစ်ပါ။
        href: ""
      - icon: doc
        title:
          en: Your passport or personal details changed
          ko: 여권이나 인적사항이 바뀌었을 때
          my: Passport သို့မဟုတ် ကိုယ်ရေးအချက်အလက် ပြောင်းသည့်အခါ
        body:
          en: If your passport number, issue date, expiry date, name, or nationality changes, check whether the change must be reported.
          ko: 여권번호, 발급일, 만료일, 이름, 국적이 바뀌면 신고가 필요한지 확인하세요.
          my: Passport နံပါတ်၊ ထုတ်ပေးရက်၊ သက်တမ်းကုန်ရက်၊ အမည် သို့မဟုတ် နိုင်ငံသား ပြောင်းပါက တင်ပြရန်လိုမလို စစ်ပါ။
        href: ""
      - icon: jobs
        title:
          en: Your school or workplace changed
          ko: 학교나 직장이 바뀌었을 때
          my: ကျောင်း သို့မဟုတ် အလုပ်ပြောင်းသည့်အခါ
        body:
          en: A school or employer may help, but you should still confirm your own duty. Some changes may need a report or permission depending on your visa/status type.
          ko: 학교나 회사가 도와준다고 해도 본인의 의무는 직접 확인해야 합니다. 체류자격에 따라 신고나 허가가 필요할 수 있습니다.
          my: ကျောင်း သို့မဟုတ် ကုမ္ပဏီက ကူညီမယ်ဆိုရင်တောင် မိမိတာဝန်ကို ကိုယ်တိုင်ပြန်စစ်သင့်ပါသည်။ Visa/status အလိုက် တင်ပြမှု သို့မဟုတ် ခွင့်ပြုချက်လိုနိုင်ပါသည်။
        href: ""
  - icon: external
    title:
      en: Where to confirm officially
      ko: 공식적으로 확인할 곳
      my: တရားဝင် ဘယ်မှာပြန်စစ်မလဲ
    intro:
      en: Use official channels before taking action. Keep your own record after you apply, ask, or visit.
      ko: 행동하기 전 공식 경로에서 확인하세요. 신청, 문의, 방문 후에는 본인 기록을 보관합니다.
      my: လုပ်ဆောင်မီ တရားဝင်နေရာမှာ ပြန်စစ်ပါ။ လျှောက်ထားခြင်း၊ မေးမြန်းခြင်း သို့မဟုတ် ရုံးသွားခြင်းပြီးနောက် မှတ်တမ်းကို မိမိသိမ်းထားပါ။
    items:
      - icon: external
        title:
          en: HiKorea
          ko: 하이코리아
          my: HiKorea
        body:
          en: Use HiKorea to check official immigration services, online application availability, visit reservation, required documents, and notices.
          ko: 하이코리아에서 출입국 민원, 온라인 신청 가능 여부, 방문예약, 준비서류와 공지사항을 확인하세요.
          my: HiKorea တွင် immigration service၊ online လုပ်နိုင်မလုပ်နိုင်၊ ရုံးသွားရက်ချိန်း၊ လိုအပ်စာရွက်များနှင့် notice များကို စစ်နိုင်ပါသည်။
        href: https://www.hikorea.go.kr/Main.pt
      - icon: help
        title:
          en: 1345 Immigration Contact Center
          ko: 1345 외국인종합안내센터
          my: 1345 Immigration Contact Center
        body:
          en: Ask 1345 about your own status and the exact change you are dealing with. Check current language support and service hours before calling.
          ko: 본인의 체류자격과 구체적인 변경 상황을 기준으로 1345에 문의하세요. 전화 전 최신 언어 지원과 상담 시간을 확인하세요.
          my: မိမိ Visa/status နှင့် တိကျသောပြောင်းလဲမှုကို အခြေခံပြီး 1345 မှာ မေးနိုင်ပါသည်။ မခေါ်မီ လက်ရှိဘာသာစကားဝန်ဆောင်မှုနှင့် အချိန်ကို စစ်ပါ။
        href: https://www.immigration.go.kr/immigration/1530/subview.do
      - icon: shield
        title:
          en: Keep records safely
          ko: 기록 안전하게 보관하기
          my: မှတ်တမ်းများကို လုံခြုံစွာသိမ်းပါ
        body:
          en: Keep application numbers, appointment details, and submitted document lists. Do not send full ARC/passport photos, passwords, or financial details through unofficial messages.
          ko: 접수번호, 예약 정보, 제출서류 목록을 보관하세요. 외국인등록증·여권 전체 사진, 비밀번호, 금융정보를 비공식 메시지로 보내지 마세요.
          my: လက်ခံနံပါတ်၊ ရက်ချိန်းအချက်အလက်နှင့် တင်ပြခဲ့သောစာရွက်စာတမ်းစာရင်းကို သိမ်းပါ။ ARC/Passport ပုံအပြည့်၊ password သို့မဟုတ် ငွေကြေးအချက်အလက်ကို မသေချာသော message ဖြင့် မပို့ပါနှင့်။
        href: ""
