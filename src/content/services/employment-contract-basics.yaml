entryTitle: Employment contract basics
category: jobs
order: 30
lastReviewed: 2026-07-30
title:
  en: Employment contract basics in Korea
  ko: 근로계약서 기본 확인
  my: အလုပ်စာချုပ် လက်မှတ်မထိုးမီ စစ်ရန်အချက်များ
description:
  en: Check why a written employment contract matters, what should be written in it, what to ask before signing, and what records to keep after starting work.
  ko: 서면 근로계약서가 왜 중요한지, 계약서에 어떤 내용이 적혀야 하는지, 서명 전 무엇을 물어봐야 하는지, 일을 시작한 뒤 어떤 기록을 보관해야 하는지 확인하세요.
  my: စာဖြင့်ရေးထားသော အလုပ်စာချုပ်က ဘာကြောင့်အရေးကြီးလဲ၊ စာချုပ်ထဲမှာ ဘာတွေပါသင့်လဲ၊ လက်မှတ်မထိုးမီ ဘာတွေမေးရမလဲနှင့် အလုပ်စပြီးနောက် ဘာမှတ်တမ်းတွေ သိမ်းထားရမလဲကို စစ်ပါ။
sections:
  - icon: doc
    title:
      en: Why the contract matters
      ko: 근로계약서가 중요한 이유
      my: အလုပ်စာချုပ်က ဘာကြောင့် အရေးကြီးလဲ
    intro:
      en: A written contract protects both the worker and the employer by making the main work conditions clear before work starts.
      ko: 서면 근로계약서는 일을 시작하기 전에 핵심 근로조건을 분명히 해서 근로자와 사업주 모두를 보호합니다.
      my: စာဖြင့်ရေးထားသော အလုပ်စာချုပ်သည် အလုပ်မစမီ အဓိကအလုပ်အခြေအနေများကို ရှင်းလင်းစေပြီး အလုပ်သမားနှင့် အလုပ်ရှင်နှစ်ဖက်လုံးကို ကာကွယ်ပေးပါသည်။
    items:
      - icon: jobs
        title:
          en: It shows the agreed conditions
          ko: 약속한 조건을 보여줌
          my: သဘောတူထားသောအခြေအနေများကို ဖော်ပြပေးပါသည်
        body:
          en: The contract should show the workplace, duties, wage, work hours, holidays, leave, contract period, and other core terms. If there is a later dispute, written terms are easier to compare than memory.
          ko: 계약서에는 근무지, 업무, 임금, 근로시간, 휴일, 휴가, 계약기간과 핵심 조건이 적혀 있어야 합니다. 나중에 문제가 생기면 기억보다 서면 조건을 비교하는 것이 훨씬 분명합니다.
          my: စာချုပ်ထဲတွင် အလုပ်နေရာ၊ အလုပ်တာဝန်၊ လစာ၊ အလုပ်ချိန်၊ နားရက်၊ ခွင့်ရက်၊ စာချုပ်ကာလနှင့် အဓိကအခြေအနေများ ပါသင့်ပါသည်။ နောက်ပိုင်းပြဿနာဖြစ်ပါက မှတ်မိတာထက် စာဖြင့်ရေးထားသောအချက်များကို နှိုင်းယှဉ်ရတာ ပိုရှင်းပါသည်။
        href: ""
      - icon: shield
        title:
          en: Verbal promises are risky
          ko: 말로만 한 약속은 위험함
          my: နှုတ်ဖြင့်ကတိပေးခြင်းသည် အန္တရာယ်ရှိနိုင်ပါသည်
        body:
          en: If wage, schedule, or duties are only explained by voice, ask to write them in a message or contract before you start.
          ko: 임금, 일정이나 업무를 말로만 설명했다면 일을 시작하기 전에 메시지나 계약서에 적어 달라고 요청하세요.
          my: လစာ၊ အချိန်ဇယား သို့မဟုတ် အလုပ်တာဝန်ကို နှုတ်ဖြင့်သာရှင်းပြထားပါက အလုပ်မစမီ Message သို့မဟုတ် စာချုပ်ထဲတွင် ရေးပေးရန် တောင်းပါ။
        href: ""
      - icon: check
        title:
          en: Do not wait until payday
          ko: 급여일까지 기다리지 않기
          my: လစာရက်အထိ မစောင့်ပါနှင့်
        body:
          en: If the basic conditions are unclear, fix them before the first shift. It is harder to solve after you already worked several days.
          ko: 기본 조건이 불분명하면 첫 근무 전에 정리하세요. 며칠 일한 뒤에는 해결하기가 더 어려워질 수 있습니다.
          my: အခြေခံအခြေအနေများ မရှင်းလင်းပါက ပထမအလုပ်နေ့မတိုင်မီ ပြန်ရှင်းပါ။ ရက်အနည်းငယ်အလုပ်လုပ်ပြီးမှ ဖြေရှင်းရန် ပိုခက်နိုင်ပါသည်။
        href: ""
  - icon: search
    title:
      en: Check before signing
      ko: 서명 전 확인할 것
      my: လက်မှတ်မထိုးမီ စစ်ရန်
    intro:
      en: Read the full contract slowly. If you cannot understand a part, ask before signing.
      ko: 계약서 전체를 천천히 읽으세요. 이해되지 않는 부분은 서명하기 전에 물어보세요.
      my: စာချုပ်တစ်ခုလုံးကို ဖြည်းဖြည်းဖတ်ပါ။ နားမလည်သောအပိုင်းရှိပါက လက်မှတ်မထိုးမီ မေးပါ။
    items:
      - icon: doc
        title:
          en: Names and workplace
          ko: 이름과 근무지
          my: အမည်နှင့် အလုပ်နေရာ
        body:
          en: Check your name, employer or company name, workplace address, branch name, and manager contact. If the workplace can change, ask how that will be handled.
          ko: 본인 이름, 고용주 또는 회사명, 근무지 주소, 지점명과 담당자 연락처를 확인하세요. 근무지가 바뀔 수 있다면 어떻게 처리되는지도 물어보세요.
          my: ကိုယ့်အမည်၊ အလုပ်ရှင် သို့မဟုတ် ကုမ္ပဏီအမည်၊ အလုပ်နေရာလိပ်စာ၊ ဆိုင်ခွဲနာမည်နှင့် တာဝန်ခံဆက်သွယ်ရန်ကို စစ်ပါ။ အလုပ်နေရာပြောင်းနိုင်ပါက ဘယ်လိုဆောင်ရွက်မလဲ မေးပါ။
        href: ""
      - icon: jobs
        title:
          en: Duties and position
          ko: 업무와 직무
          my: အလုပ်တာဝန်နှင့် ရာထူး
        body:
          en: The contract or attached work details should match what you were told. Be careful if the real work is different from the job post.
          ko: 계약서나 첨부된 근무 내용은 앞서 들은 설명과 같아야 합니다. 실제 업무가 공고와 다르면 조심하세요.
          my: စာချုပ် သို့မဟုတ် တွဲထားသောအလုပ်အသေးစိတ်သည် အရင်ပြောထားသည့်အချက်များနှင့် ကိုက်ညီသင့်ပါသည်။ တကယ်လုပ်ရမည့်အလုပ်က ကြော်ငြာနှင့်ကွာပါက သတိထားပါ။
        href: ""
      - icon: daily
        title:
          en: Work days, hours, and breaks
          ko: 근무일·시간·휴게
          my: အလုပ်ရက်၊ အလုပ်ချိန်နှင့် နားချိန်
        body:
          en: Check work days, start and finish time, break time, shift changes, weekend work, and extra work. Ask how changes will be announced and recorded.
          ko: 근무 요일, 시작·종료 시간, 휴게시간, 교대 변경, 주말근무와 추가근무를 확인하세요. 변경 사항을 어떻게 안내하고 기록하는지도 물어보세요.
          my: အလုပ်ရက်၊ စတင်/ပြီးဆုံးချိန်၊ နားချိန်၊ Shift ပြောင်းလဲမှု၊ ပိတ်ရက်အလုပ်နှင့် အပိုအလုပ်ကို စစ်ပါ။ ပြောင်းလဲမှုကို ဘယ်လိုအသိပေးမလဲ၊ ဘယ်လိုမှတ်တမ်းတင်မလဲ မေးပါ။
        href: ""
      - icon: check
        title:
          en: Wage and payday
          ko: 임금과 지급일
          my: လစာနှင့် လစာပေးရက်
        body:
          en: Check hourly or monthly wage, payday, payment method, allowances, deductions, and whether the amount is before or after deductions.
          ko: 시급 또는 월급, 지급일, 지급 방법, 수당, 공제와 금액이 공제 전인지 후인지 확인하세요.
          my: နာရီလစာ သို့မဟုတ် လစဉ်လစာ၊ လစာပေးရက်၊ ပေးချေနည်း၊ ထောက်ပံ့ကြေး၊ ဖြတ်တောက်မှုနှင့် ပမာဏသည် ဖြတ်တောက်မှုမတိုင်မီလား၊ ပြီးနောက်လား စစ်ပါ။
        href: ""
  - icon: doc
    title:
      en: What should be written
      ko: 계약서에 적혀야 할 내용
      my: စာချုပ်ထဲတွင် ပါသင့်သောအချက်များ
    intro:
      en: The contract should not be only a title and signature. It should make the main work conditions clear.
      ko: 계약서는 제목과 서명만 있는 문서가 아니어야 합니다. 핵심 근로조건이 분명히 적혀 있어야 합니다.
      my: စာချုပ်သည် ခေါင်းစဉ်နှင့် လက်မှတ်သာပါသောစာရွက် မဖြစ်သင့်ပါ။ အဓိကအလုပ်အခြေအနေများ ရှင်းရှင်းလင်းလင်း ပါသင့်ပါသည်။
    items:
      - icon: list
        title:
          en: Core labor conditions
          ko: 핵심 근로조건
          my: အဓိကအလုပ်အခြေအနေများ
        body:
          en: MOEL explains that employment contracts should specify key items such as wage, working hours, holidays, annual leave, and paid leave.
          ko: 고용노동부는 근로계약서에 임금, 근로시간, 휴일, 연차, 유급휴가 등 핵심 내용을 명시해야 한다고 안내합니다.
          my: အလုပ်သမားဝန်ကြီးဌာနအရ အလုပ်စာချုပ်တွင် လစာ၊ အလုပ်ချိန်၊ နားရက်၊ နှစ်ပတ်လည်ခွင့်နှင့် လစာရခွင့် စသည့်အဓိကအချက်များကို ဖော်ပြထားသင့်ပါသည်။
        href: ""
      - icon: jobs
        title:
          en: Contract period and probation
          ko: 계약기간과 수습기간
          my: စာချုပ်ကာလနှင့် စမ်းသပ်ကာလ
        body:
          en: If there is a fixed contract period or probation period, check start date, end date, wage during probation, duties, and how the period can end.
          ko: 계약기간이나 수습기간이 있다면 시작일, 종료일, 수습기간 임금, 업무와 종료 방식까지 확인하세요.
          my: စာချုပ်ကာလ သို့မဟုတ် စမ်းသပ်ကာလရှိပါက စတင်ရက်၊ ပြီးဆုံးရက်၊ စမ်းသပ်ကာလလစာ၊ အလုပ်တာဝန်နှင့် ပြီးဆုံးပုံကို စစ်ပါ။
        href: ""
      - icon: shield
        title:
          en: Rules that affect pay
          ko: 임금에 영향을 주는 규정
          my: လစာကိုသက်ရောက်နိုင်သော စည်းမျဉ်းများ
        body:
          en: Check rules about lateness, absence, meal cost, uniform cost, dormitory, transportation, damage claims, and deductions. Ask for unclear items before signing.
          ko: 지각, 결근, 식대, 유니폼 비용, 기숙사, 교통비, 손해배상과 공제 규정을 확인하세요. 불분명한 항목은 서명 전에 물어보세요.
          my: နောက်ကျခြင်း၊ မလာခြင်း၊ အစားအသောက်စရိတ်၊ Uniform စရိတ်၊ အဆောင်၊ ယာဉ်စရိတ်၊ ပျက်စီးမှုတောင်းခံခြင်းနှင့် ဖြတ်တောက်မှုစည်းမျဉ်းများကို စစ်ပါ။ မရှင်းသောအချက်များကို လက်မှတ်မထိုးမီ မေးပါ။
        href: ""
      - icon: help
        title:
          en: Language you understand
          ko: 이해할 수 있는 언어
          my: ကိုယ်နားလည်သောဘာသာဖြင့် စစ်ပါ
        body:
          en: If the contract is only in Korean and you do not understand it, ask for an explanation, translation help, or time to review it before signing.
          ko: 계약서가 한국어로만 되어 있고 이해하기 어렵다면 서명 전에 설명, 통역 도움 또는 검토할 시간을 요청하세요.
          my: စာချုပ်က ကိုရီးယားဘာသာဖြင့်သာရှိပြီး နားမလည်ပါက လက်မှတ်မထိုးမီ ရှင်းပြပေးရန်၊ ဘာသာပြန်အကူအညီ သို့မဟုတ် ပြန်လည်စစ်ရန်အချိန် တောင်းပါ။
        href: ""
  - icon: shield
    title:
      en: Do not sign this way
      ko: 이렇게 서명하지 않기
      my: ဤပုံစံဖြင့် လက်မှတ်မထိုးပါနှင့်
    intro:
      en: Some contract problems start because the worker signs too quickly. Slow down when the document is incomplete or different from what you heard.
      ko: 계약 문제는 너무 빨리 서명하면서 시작되는 경우가 많습니다. 문서가 비어 있거나 들은 내용과 다르면 멈추고 확인하세요.
      my: စာချုပ်ပြဿနာများသည် လက်မှတ်ကို အလျင်အမြန်ထိုးမိခြင်းမှ စတင်တတ်ပါသည်။ စာရွက်မပြည့်စုံခြင်း သို့မဟုတ် ပြောထားသည့်အချက်နှင့် ကွာပါက ခဏရပ်ပြီးစစ်ပါ။
    items:
      - icon: shield
        title:
          en: Blank or unfinished contract
          ko: 빈칸이 있는 계약서
          my: ကွက်လပ်ပါသော စာချုပ်
        body:
          en: Do not sign a contract with blank wage, hours, workplace, or contract period. Ask the employer to complete it first.
          ko: 임금, 시간, 근무지, 계약기간이 비어 있는 계약서에는 서명하지 마세요. 먼저 작성해 달라고 요청하세요.
          my: လစာ၊ အလုပ်ချိန်၊ အလုပ်နေရာ သို့မဟုတ် စာချုပ်ကာလ ကွက်လပ်ဖြစ်နေသောစာချုပ်တွင် လက်မှတ်မထိုးပါနှင့်။ အရင်ဖြည့်ပေးရန် တောင်းပါ။
        href: ""
      - icon: help
        title:
          en: “Sign first, explain later”
          ko: “먼저 서명하고 나중에 설명”
          my: “အရင်လက်မှတ်ထိုး၊ နောက်မှရှင်းပြမယ်” ဟုပြောခြင်း
        body:
          en: If someone pressures you to sign before reading, ask for time. A normal contract should allow you to read the conditions.
          ko: 읽기 전에 서명하라고 압박하면 시간을 달라고 하세요. 정상적인 계약서는 조건을 읽을 수 있어야 합니다.
          my: မဖတ်မီ လက်မှတ်ထိုးရန် ဖိအားပေးပါက အချိန်တောင်းပါ။ ပုံမှန်စာချုပ်တစ်ခုသည် အခြေအနေများကို ဖတ်နိုင်ခွင့်ပေးသင့်ပါသည်။
        href: ""
      - icon: jobs
        title:
          en: Different from the job post
          ko: 공고와 다른 조건
          my: အလုပ်ကြော်ငြာနှင့် ကွာသောအခြေအနေ
        body:
          en: If wage, duties, hours, or workplace are different from the post or interview, ask which condition is final and keep the answer in writing.
          ko: 임금, 업무, 시간이나 근무지가 공고나 면접 내용과 다르면 어떤 조건이 최종인지 묻고 답변을 서면으로 보관하세요.
          my: လစာ၊ တာဝန်၊ အချိန် သို့မဟုတ် အလုပ်နေရာသည် ကြော်ငြာ သို့မဟုတ် Interview တွင်ပြောထားသည့်အချက်နှင့် ကွာပါက ဘယ်အချက်က နောက်ဆုံးအတည်လဲ မေးပြီး အဖြေကို စာဖြင့်သိမ်းပါ။
        href: ""
      - icon: doc
        title:
          en: No copy for you
          ko: 본인용 사본이 없음
          my: ကိုယ့်မိတ္တူ မပေးခြင်း
        body:
          en: After signing, ask for your own copy or a clear photo/PDF of the completed contract. Do not rely only on the employer keeping it.
          ko: 서명 후에는 작성이 끝난 계약서의 본인용 사본이나 선명한 사진/PDF를 요청하세요. 사업주가 보관한다는 말에만 의존하지 마세요.
          my: လက်မှတ်ထိုးပြီးနောက် ပြည့်စုံသောစာချုပ်၏ ကိုယ့်မိတ္တူ သို့မဟုတ် ရှင်းသောဓာတ်ပုံ/PDF ကို တောင်းပါ။ အလုပ်ရှင်ဘက်က သိမ်းထားမယ်ဆိုတာတစ်ခုတည်းကို မမှီခိုပါနှင့်။
        href: ""
  - icon: list
    title:
      en: After signing
      ko: 서명한 뒤 할 일
      my: လက်မှတ်ထိုးပြီးနောက် လုပ်ရန်
    intro:
      en: A contract is useful only if you can compare it with actual work and pay later.
      ko: 계약서는 나중에 실제 근무와 급여를 비교할 수 있을 때 의미가 있습니다.
      my: စာချုပ်သည် နောက်ပိုင်း တကယ်လုပ်ခဲ့သောအလုပ်နှင့် လစာကို နှိုင်းယှဉ်စစ်နိုင်မှ အကျိုးရှိပါသည်။
    items:
      - icon: doc
        title:
          en: Keep the completed contract
          ko: 완성된 계약서 보관
          my: ပြည့်စုံသောစာချုပ်ကို သိမ်းထားပါ
        body:
          en: Keep the signed contract, job post, chat messages, schedule, and employer contact together. These records help if conditions change.
          ko: 서명한 계약서, 채용공고, 대화 메시지, 근무표와 고용주 연락처를 함께 보관하세요. 조건이 바뀔 때 도움이 됩니다.
          my: လက်မှတ်ထိုးထားသောစာချုပ်၊ အလုပ်ကြော်ငြာ၊ Chat message၊ အလုပ်ချိန်ဇယားနှင့် အလုပ်ရှင်ဆက်သွယ်ရန်ကို အတူသိမ်းထားပါ။ အခြေအနေပြောင်းလဲချိန်တွင် အထောက်အကူဖြစ်ပါသည်။
        href: ""
      - icon: list
        title:
          en: Track work hours
          ko: 근무시간 기록
          my: အလုပ်ချိန်မှတ်ထားပါ
        body:
          en: Write your own record of dates, start and finish time, breaks, extra shifts, and changes. Compare it with the pay statement later.
          ko: 근무일, 시작·종료 시간, 휴게시간, 추가근무와 변경 사항을 직접 기록하세요. 나중에 급여명세서와 비교합니다.
          my: အလုပ်ရက်၊ စတင်/ပြီးဆုံးချိန်၊ နားချိန်၊ အပိုအလုပ်နှင့် ပြောင်းလဲမှုများကို ကိုယ်တိုင်မှတ်ပါ။ နောက်ပိုင်း လစာရှင်းတမ်းနှင့် နှိုင်းယှဉ်စစ်ပါ။
        href: ""
      - icon: check
        title:
          en: Compare contract and pay statement
          ko: 계약서와 급여명세서 비교
          my: စာချုပ်နှင့် လစာရှင်းတမ်းကို နှိုင်းယှဉ်ပါ
        body:
          en: After payday, compare promised wage, work hours, allowances, deductions, and final deposit amount. Ask for the calculation basis if something is unclear.
          ko: 급여일 후 약속된 임금, 근무시간, 수당, 공제와 실제 입금액을 비교하세요. 불분명한 항목은 계산 근거를 요청하세요.
          my: လစာရပြီးနောက် ကတိပေးထားသောလစာ၊ အလုပ်ချိန်၊ ထောက်ပံ့ကြေး၊ ဖြတ်တောက်မှုနှင့် တကယ်ဝင်လာသောပမာဏကို နှိုင်းယှဉ်ပါ။ မရှင်းသောအချက်ရှိပါက တွက်ချက်မှုအခြေခံကို တောင်းပါ။
        href: ""
  - icon: visa
    title:
      en: Extra checks for foreign students
      ko: 유학생이 추가로 확인할 것
      my: နိုင်ငံခြားကျောင်းသားများအတွက် ထပ်စစ်ရန်
    intro:
      en: A labor contract does not replace immigration permission. Students should check both labor conditions and visa rules.
      ko: 근로계약서가 출입국 허가를 대신하지 않습니다. 유학생은 근로조건과 비자 기준을 함께 확인해야 합니다.
      my: အလုပ်စာချုပ်သည် လူဝင်မှုကြီးကြပ်ရေးခွင့်ပြုချက်ကို အစားမထိုးပါ။ ကျောင်းသားများသည် အလုပ်အခြေအနေများနှင့် ဗီဇာစည်းမျဉ်းနှစ်ခုလုံးကို စစ်ရပါမည်။
    items:
      - icon: visa
        title:
          en: Check permission before working
          ko: 근무 전 허가 확인
          my: အလုပ်မစမီ ခွင့်ပြုချက်စစ်ပါ
        body:
          en: D-2 and D-4 students usually need part-time work permission before starting. Check with your school, HiKorea, or 1345.
          ko: D-2와 D-4 유학생은 일을 시작하기 전에 보통 시간제취업 허가가 필요합니다. 학교, 하이코리아 또는 1345에서 확인하세요.
          my: D-2 နှင့် D-4 ကျောင်းသားများသည် အလုပ်မစမီ များသောအားဖြင့် Part-time အလုပ်ခွင့်ပြုချက်လိုပါသည်။ ကျောင်း၊ HiKorea သို့မဟုတ် 1345 တွင် စစ်ပါ။
        href: ""
      - icon: jobs
        title:
          en: Contract details must match permission
          ko: 계약 내용과 허가 내용 일치
          my: စာချုပ်အချက်များနှင့် ခွင့်ပြုချက်ကိုက်ညီရန်
        body:
          en: Workplace, duties, and working hours in the contract should match what you report or receive permission for. If they change, check again before continuing.
          ko: 계약서의 근무지, 업무와 근무시간은 신고하거나 허가받은 내용과 맞아야 합니다. 변경되면 계속 일하기 전에 다시 확인하세요.
          my: စာချုပ်ထဲရှိ အလုပ်နေရာ၊ တာဝန်နှင့် အလုပ်ချိန်သည် တင်ပြထားသော သို့မဟုတ် ခွင့်ပြုချက်ရထားသောအချက်များနှင့် ကိုက်ညီသင့်ပါသည်။ ပြောင်းလဲပါက ဆက်မလုပ်မီ ပြန်စစ်ပါ။
        href: ""
      - icon: shield
        title:
          en: Do not start trial work early
          ko: 시험근무도 먼저 시작하지 않기
          my: Trial work ကိုလည်း အရင်မစပါနှင့်
        body:
          en: Training, trial shifts, and paid work can still matter for immigration rules. Check permission before doing any work for the employer.
          ko: 교육, 시험근무와 유급근무도 출입국 기준에 영향을 줄 수 있습니다. 고용주를 위해 일을 하기 전 허가를 확인하세요.
          my: Training၊ Trial shift နှင့် လစာရသောအလုပ်များသည်လည်း လူဝင်မှုကြီးကြပ်ရေးစည်းမျဉ်းနှင့် ဆက်စပ်နိုင်ပါသည်။ အလုပ်ရှင်အတွက် အလုပ်တစ်ခုခုမလုပ်မီ ခွင့်ပြုချက်ကို စစ်ပါ။
        href: ""
  - icon: external
    title:
      en: Where to confirm officially
      ko: 공식적으로 확인할 곳
      my: တရားဝင်စစ်ဆေးနိုင်သောနေရာ
    intro:
      en: Use official sources when the question is about legal labor rights, contract form, wage, or immigration permission.
      ko: 노동권, 계약서 양식, 임금 또는 출입국 허가와 관련된 질문은 공식 자료에서 확인하세요.
      my: အလုပ်သမားအခွင့်အရေး၊ စာချုပ် Form၊ လစာ သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးခွင့်ပြုချက်ဆိုင်ရာမေးခွန်းများကို တရားဝင်ရင်းမြစ်များတွင် စစ်ပါ။
    items:
      - icon: external
        title:
          en: MOEL employment contract guide
          ko: 고용노동부 근로계약서 안내
          my: အလုပ်သမားဝန်ကြီးဌာန အလုပ်စာချုပ်လမ်းညွှန်
        body:
          en: Official MOEL guide explaining why a written contract is needed and what should be included.
          ko: 서면 근로계약서가 왜 필요한지와 어떤 내용이 들어가야 하는지 설명하는 고용노동부 공식 안내입니다.
          my: စာဖြင့်ရေးထားသော အလုပ်စာချုပ် ဘာကြောင့်လိုအပ်လဲနှင့် ဘာတွေပါသင့်လဲကို ရှင်းပြထားသော အလုပ်သမားဝန်ကြီးဌာန တရားဝင်လမ်းညွှန်ဖြစ်ပါသည်။
        href: https://www.moel.go.kr/mainpop2.do
      - icon: external
        title:
          en: MOEL labor standards
          ko: 고용노동부 노동기준
          my: အလုပ်သမားဝန်ကြီးဌာန Labor standards
        body:
          en: English MOEL page explaining Korea's labor standards, including wages, working hours, holidays, and leave.
          ko: 임금, 근로시간, 휴일과 휴가 등 한국의 노동기준을 설명하는 고용노동부 영문 페이지입니다.
          my: လစာ၊ အလုပ်ချိန်၊ နားရက်နှင့် ခွင့်ရက်များအပါအဝင် ကိုရီးယားအလုပ်သမားစံနှုန်းများကို ရှင်းပြထားသော အလုပ်သမားဝန်ကြီးဌာန English စာမျက်နှာဖြစ်ပါသည်။
        href: https://www.moel.go.kr/english/policy/laborStandards.do
      - icon: external
        title:
          en: Labor Portal wage issue guide
          ko: 노동포털 임금체불 안내
          my: Labor Portal လစာမရခြင်း လမ်းညွှန်
        body:
          en: Use the official Labor Portal when you need to understand wage-issue procedures or prepare a wage-related inquiry.
          ko: 임금 문제 절차를 확인하거나 임금 관련 문의를 준비할 때 공식 노동포털을 이용하세요.
          my: လစာပြဿနာဆိုင်ရာလုပ်ထုံးလုပ်နည်းကို နားလည်ရန် သို့မဟုတ် လစာဆိုင်ရာမေးမြန်းမှု ပြင်ရန် တရားဝင် Labor Portal ကို သုံးပါ။
        href: https://labor.moel.go.kr/minwonSysInfo/wagesolway.do
      - icon: external
        title:
          en: HiKorea and 1345 for student permission
          ko: 유학생 허가는 하이코리아와 1345
          my: ကျောင်းသားအလုပ်ခွင့်အတွက် HiKorea နှင့် 1345
        body:
          en: If you are a student or foreign resident, confirm visa and part-time permission questions through HiKorea or Immigration Contact Center 1345.
          ko: 유학생이나 외국인 거주자는 비자와 시간제취업 허가 문제를 하이코리아 또는 외국인종합안내센터 1345에서 확인하세요.
          my: ကျောင်းသား သို့မဟုတ် နိုင်ငံခြားသားနေထိုင်သူဖြစ်ပါက ဗီဇာနှင့် Part-time အလုပ်ခွင့်မေးခွန်းများကို HiKorea သို့မဟုတ် 1345 လူဝင်မှုကြီးကြပ်ရေးအကူအညီတွင် စစ်ပါ။
        href: https://www.hikorea.go.kr/
