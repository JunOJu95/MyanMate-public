entryTitle: How to find part-time jobs safely
category: jobs
order: 20
lastReviewed: 2026-07-30
title:
  en: How to find part-time jobs safely in Korea
  ko: 한국에서 아르바이트 안전하게 찾기
  my: ကိုရီးယားမှာ Part-time အလုပ်ကို လုံခြုံစွာ ရှာနည်း
description:
  en: A practical guide for checking job posts, employers, work conditions, visa permission, and warning signs before applying for part-time work in Korea.
  ko: 한국에서 아르바이트에 지원하기 전 채용공고, 고용주, 근무조건, 비자 허가와 위험 신호를 확인하는 실전 안내입니다.
  my: ကိုရီးယားတွင် Part-time အလုပ်လျှောက်မီ အလုပ်ကြော်ငြာ၊ အလုပ်ရှင်၊ အလုပ်အခြေအနေ၊ ဗီဇာခွင့်ပြုချက်နှင့် သတိထားရမည့်အချက်များကို စစ်နိုင်ရန် ပြင်ဆင်ထားသော လမ်းညွှန်ချက်ဖြစ်ပါသည်။
sections:
  - icon: check
    title:
      en: What to decide first
      ko: 먼저 판단할 것
      my: အရင်ဆုံး စဉ်းစားရမည့်အချက်များ
    intro:
      en: A job that looks easy can still create visa, wage, or safety problems. Check the basic fit before you message the employer.
      ko: 쉬워 보이는 아르바이트도 비자, 임금, 안전 문제가 생길 수 있습니다. 고용주에게 연락하기 전에 기본 조건부터 확인하세요.
      my: လွယ်တယ်လို့ထင်ရသော Part-time အလုပ်တစ်ခုက ဗီဇာ၊ လစာ သို့မဟုတ် လုံခြုံရေးပြဿနာ ဖြစ်စေနိုင်ပါသည်။ အလုပ်ရှင်ကို မဆက်သွယ်မီ အခြေခံအချက်များကို အရင်စစ်ပါ။
    items:
      - icon: visa
        title:
          en: Can your visa do this job?
          ko: 내 비자로 가능한 일인지
          my: ကိုယ့်ဗီဇာနဲ့ ဒီအလုပ်လုပ်လို့ရမလား
        body:
          en: If you are a D-2 or D-4 student, do not treat a job post as permission. Check student part-time work permission with your school, HiKorea, or 1345 before starting.
          ko: D-2 또는 D-4 유학생이라면 채용공고를 허가로 생각하지 마세요. 일을 시작하기 전에 학교, 하이코리아 또는 1345에서 시간제취업 허가를 확인하세요.
          my: D-2 သို့မဟုတ် D-4 ကျောင်းသားဖြစ်ပါက အလုပ်ကြော်ငြာတွေ့ရုံဖြင့် ခွင့်ပြုချက်ရပြီဟု မယူဆပါနှင့်။ အလုပ်မစမီ ကျောင်း၊ HiKorea သို့မဟုတ် 1345 တွင် Part-time အလုပ်ခွင့်ကို စစ်ပါ။
        href: ""
      - icon: jobs
        title:
          en: Is the work clear?
          ko: 업무가 분명한지
          my: အလုပ်တာဝန် ရှင်းလင်းလား
        body:
          en: The post should make clear what you will do, where you will work, when you will work, how much you will be paid, and who the employer is.
          ko: 어떤 일을 하는지, 어디서 일하는지, 언제 일하는지, 얼마를 받는지, 고용주가 누구인지 공고에서 확인할 수 있어야 합니다.
          my: ဘာလုပ်ရမလဲ၊ ဘယ်မှာလုပ်ရမလဲ၊ ဘယ်အချိန်လုပ်ရမလဲ၊ ဘယ်လောက်ရမလဲ၊ အလုပ်ရှင်က ဘယ်သူလဲဆိုတာ အလုပ်ကြော်ငြာထဲမှာ ရှင်းနေသင့်ပါသည်။
        href: ""
      - icon: shield
        title:
          en: Does it feel safe to visit?
          ko: 방문해도 안전한지
          my: သွားတွေ့ရန် လုံခြုံသလား
        body:
          en: Before visiting, check the address, business name, meeting time, and whether the place looks like a real workplace. Tell someone where you are going.
          ko: 방문 전 주소, 사업장 이름, 만나는 시간과 실제 근무지처럼 보이는지 확인하세요. 어디에 가는지 주변 사람에게 알려두세요.
          my: သွားမတွေ့မီ လိပ်စာ၊ လုပ်ငန်းနာမည်၊ တွေ့မည့်အချိန်နှင့် တကယ်ရှိသော အလုပ်နေရာဟုတ်မဟုတ် စစ်ပါ။ ကိုယ်ဘယ်ကိုသွားမလဲကို မိတ်ဆွေတစ်ယောက်ကို အသိပေးထားပါ။
        href: ""
  - icon: search
    title:
      en: Where to look for jobs
      ko: 어디에서 찾을지
      my: အလုပ်ကို ဘယ်နေရာမှာ ရှာမလဲ
    intro:
      en: There is no single perfect place. Use more than one channel, then compare the same job information across posts, messages, and the actual interview.
      ko: 완벽한 한 곳은 없습니다. 여러 경로를 함께 보고, 공고·메시지·면접에서 들은 조건이 서로 같은지 비교하세요.
      my: အလုပ်ရှာရန် အကောင်းဆုံးနေရာတစ်ခုတည်းရှိတာ မဟုတ်ပါ။ နေရာအမျိုးမျိုးတွင်ကြည့်ပြီး အလုပ်ကြော်ငြာ၊ မက်ဆေ့ချ်နှင့် Interview တွင်ပြောသောအခြေအနေများ ကိုက်ညီမညီ နှိုင်းယှဉ်ပါ။
    items:
      - icon: admin
        title:
          en: School or international office
          ko: 학교·국제처
          my: ကျောင်း သို့မဟုတ် International office
        body:
          en: For students, the school is often the safest first check. Ask whether the job type is allowed, whether the employer documents look acceptable, and whether school confirmation is needed.
          ko: 유학생은 학교가 가장 먼저 확인하기 좋은 곳입니다. 해당 업무가 가능한지, 고용주 서류가 적절한지, 학교 확인이 필요한지 물어보세요.
          my: ကျောင်းသားများအတွက် ကျောင်းဘက်က အရင်ဆုံးစစ်ရန် အလုံခြုံဆုံးနေရာတစ်ခုဖြစ်ပါသည်။ ထိုအလုပ်အမျိုးအစားလုပ်လို့ရမလား၊ အလုပ်ရှင်စာရွက်များ သင့်တော်မသင့်နှင့် ကျောင်းအတည်ပြုချက်လိုမလို မေးပါ။
        href: ""
      - icon: search
        title:
          en: Trusted job platforms
          ko: 신뢰할 수 있는 채용 플랫폼
          my: ယုံကြည်ရသော အလုပ်ရှာ Platform များ
        body:
          en: Job platforms can help you compare pay, location, schedule, and employer information. Still check the details yourself, because a post on a platform is not a guarantee that the job fits your visa.
          ko: 채용 플랫폼에서는 임금, 위치, 일정과 고용주 정보를 비교할 수 있습니다. 다만 플랫폼 공고라고 해서 본인 비자에 맞는 일이 보장되는 것은 아니므로 직접 확인해야 합니다.
          my: အလုပ်ရှာ Platform များတွင် လစာ၊ နေရာ၊ အချိန်ဇယားနှင့် အလုပ်ရှင်အချက်အလက်ကို နှိုင်းယှဉ်ကြည့်နိုင်ပါသည်။ သို့သော် Platform ပေါ်တွင်တင်ထားခြင်းကြောင့် ကိုယ့်ဗီဇာနှင့်ကိုက်မည်ဟု အာမခံထားခြင်း မဟုတ်သောကြောင့် ကိုယ်တိုင်စစ်ရပါမည်။
        href: ""
      - icon: users
        title:
          en: Community posts and referrals
          ko: 커뮤니티 공고와 지인 소개
          my: Community post နှင့် အသိမိတ်ဆွေမိတ်ဆက်
        body:
          en: Myanmar community posts can be useful, but do not rely only on comments or screenshots. Ask for the real workplace name, address, duties, pay, schedule, and contract details.
          ko: 미얀마 커뮤니티 공고도 도움이 될 수 있지만 댓글이나 캡처만 믿지는 마세요. 실제 사업장 이름, 주소, 업무, 임금, 일정과 계약 내용을 확인하세요.
          my: Myanmar community post များလည်း အထောက်အကူဖြစ်နိုင်သော်လည်း Comment သို့မဟုတ် Screenshot တစ်ခုတည်းကို မယုံပါနှင့်။ တကယ့်အလုပ်နေရာနာမည်၊ လိပ်စာ၊ အလုပ်တာဝန်၊ လစာ၊ အချိန်ဇယားနှင့် စာချုပ်အချက်များကို မေးပါ။
        href: ""
      - icon: external
        title:
          en: Official public job portal
          ko: 공식 공공 채용 포털
          my: တရားဝင် အလုပ်ရှာ Portal
        body:
          en: Korea’s official Employment24/WorkNet services can be useful for checking public job information and comparing formal job posts.
          ko: 고용24/워크넷 같은 공식 서비스는 공공 일자리 정보와 비교적 공식적인 채용공고를 확인할 때 도움이 될 수 있습니다.
          my: Korea ၏ တရားဝင် Employment24/WorkNet ဝန်ဆောင်မှုများသည် အများပြည်သူဆိုင်ရာအလုပ်အချက်အလက်နှင့် ပိုမိုတရားဝင်သောအလုပ်ကြော်ငြာများကို နှိုင်းယှဉ်ကြည့်ရာတွင် အသုံးဝင်နိုင်ပါသည်။
        href: https://www.work.go.kr/seekWantedMain.do
  - icon: doc
    title:
      en: Check the post before applying
      ko: 지원 전 공고 확인
      my: မလျှောက်မီ အလုပ်ကြော်ငြာကို စစ်ပါ
    intro:
      en: A safe job post should not be vague. If important information is missing, ask before sending personal documents.
      ko: 안전한 공고는 핵심 정보가 모호하지 않습니다. 중요한 정보가 빠져 있다면 개인서류를 보내기 전에 먼저 물어보세요.
      my: လုံခြုံသောအလုပ်ကြော်ငြာသည် အရေးကြီးအချက်များ မဝါးမဝါး ဖြစ်သင့်ပါသည်။ အဓိကအချက်လွဲနေပါက ကိုယ်ရေးစာရွက်စာတမ်းမပို့မီ အရင်မေးပါ။
    items:
      - icon: jobs
        title:
          en: Employer and workplace
          ko: 고용주와 근무지
          my: အလုပ်ရှင်နှင့် အလုပ်နေရာ
        body:
          en: Check the company or store name, workplace address, branch name, manager contact, and whether the meeting location matches the workplace.
          ko: 회사나 가게 이름, 근무지 주소, 지점명, 담당자 연락처와 면접 장소가 실제 근무지와 맞는지 확인하세요.
          my: ကုမ္ပဏီ သို့မဟုတ် ဆိုင်နာမည်၊ အလုပ်နေရာလိပ်စာ၊ ဆိုင်ခွဲနာမည်၊ တာဝန်ခံဆက်သွယ်ရန်နံပါတ်နှင့် တွေ့ဆုံမည့်နေရာသည် တကယ့်အလုပ်နေရာနှင့် ကိုက်ညီမညီ စစ်ပါ။
        href: ""
      - icon: daily
        title:
          en: Pay, schedule, and break time
          ko: 임금·일정·휴게시간
          my: လစာ၊ အချိန်ဇယားနှင့် နားချိန်
        body:
          en: Confirm hourly wage, payday, payment method, work days, start and finish time, break time, and whether extra shifts can happen.
          ko: 시급, 지급일, 지급 방법, 근무 요일, 시작·종료 시간, 휴게시간과 추가근무 가능성을 확인하세요.
          my: နာရီလစာ၊ လစာပေးမည့်ရက်၊ ပေးချေနည်း၊ အလုပ်ရက်၊ စတင်/ပြီးဆုံးချိန်၊ နားချိန်နှင့် အပိုအလုပ်ရှိနိုင်မနိုင်ကို စစ်ပါ။
        href: ""
      - icon: doc
        title:
          en: Contract and records
          ko: 계약서와 기록
          my: စာချုပ်နှင့် မှတ်တမ်း
        body:
          en: Ask whether there will be a written contract and pay statement. Keep the post, chat messages, interview notes, and any promised conditions.
          ko: 서면 근로계약서와 급여명세서가 제공되는지 물어보세요. 공고, 대화 메시지, 면접 메모와 약속받은 조건을 보관하세요.
          my: စာဖြင့်ရေးထားသော အလုပ်စာချုပ်နှင့် လစာရှင်းတမ်းပေးမပေး မေးပါ။ အလုပ်ကြော်ငြာ၊ Chat message၊ Interview မှတ်စုနှင့် ကတိပေးထားသောအခြေအနေများကို သိမ်းထားပါ။
        href: ""
      - icon: visa
        title:
          en: Visa and permission fit
          ko: 비자와 허가 기준
          my: ဗီဇာနှင့် ခွင့်ပြုချက်ကိုက်ညီမှု
        body:
          en: If the employer says “foreigners can work” or “students can work,” still check your own visa status and required permission. General permission is not the same as your personal approval.
          ko: 고용주가 “외국인 가능” 또는 “유학생 가능”이라고 해도 본인 체류자격과 필요한 허가를 확인하세요. 일반적으로 가능하다는 말은 본인 허가와 다릅니다.
          my: အလုပ်ရှင်က “နိုင်ငံခြားသားရတယ်” သို့မဟုတ် “ကျောင်းသားရတယ်” ဟုပြောလည်း ကိုယ့်ဗီဇာအခြေအနေနှင့် လိုအပ်သောခွင့်ပြုချက်ကို စစ်ပါ။ ယေဘုယျအားဖြင့်ရသည်ဆိုတာ ကိုယ့်အတွက်ခွင့်ပြုချက်ရပြီဟု မဆိုလိုပါ။
        href: ""
  - icon: shield
    title:
      en: Warning signs
      ko: 조심해야 할 신호
      my: သတိထားရမည့် အချက်များ
    intro:
      en: If several warning signs appear together, stop and check with your school, 1345, or an official labor channel before going further.
      ko: 위험 신호가 여러 개 함께 보이면 더 진행하기 전에 학교, 1345 또는 공식 노동 상담 창구에서 확인하세요.
      my: သတိထားရမည့်အချက်များ အတူတူများလာပါက ဆက်မလုပ်မီ ကျောင်း၊ 1345 သို့မဟုတ် တရားဝင်အလုပ်သမားအကြံပေးလမ်းကြောင်းတွင် စစ်ပါ။
    items:
      - icon: shield
        title:
          en: “No permit needed” for students
          ko: 유학생에게 “허가 필요 없음”이라고 말함
          my: ကျောင်းသားကို “ခွင့်ပြုချက်မလိုဘူး” ဟုပြောခြင်း
        body:
          en: Be careful if the employer tells you not to ask your school or immigration. Student part-time work can require permission even when the job looks ordinary.
          ko: 학교나 출입국에 묻지 말라고 하면 조심하세요. 평범해 보이는 아르바이트라도 유학생은 허가가 필요할 수 있습니다.
          my: အလုပ်ရှင်က ကျောင်း သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးကို မမေးနဲ့ဟုပြောပါက သတိထားပါ။ ပုံမှန်အလုပ်လိုထင်ရသော်လည်း ကျောင်းသားအတွက် ခွင့်ပြုချက်လိုနိုင်ပါသည်။
        href: ""
      - icon: doc
        title:
          en: No written terms
          ko: 서면 조건이 없음
          my: စာဖြင့်အခြေအနေ မရှိခြင်း
        body:
          en: If pay, schedule, duties, or workplace are only explained by voice and the employer avoids messages or a written contract, it is harder to protect yourself later.
          ko: 임금, 일정, 업무, 근무지를 말로만 설명하고 메시지나 계약서를 피한다면 나중에 본인을 보호하기 어렵습니다.
          my: လစာ၊ အချိန်ဇယား၊ အလုပ်တာဝန်နှင့် အလုပ်နေရာကို နှုတ်ဖြင့်သာရှင်းပြီး Message သို့မဟုတ် စာချုပ်ကို ရှောင်ပါက နောက်ပိုင်း ကိုယ့်ကိုယ်ကို ကာကွယ်ရန်ခက်ပါသည်။
        href: ""
      - icon: phone
        title:
          en: Asking for sensitive documents too early
          ko: 민감한 서류를 너무 일찍 요구
          my: အရေးကြီးစာရွက်စာတမ်းများကို အလျင်အမြန်တောင်းခြင်း
        body:
          en: Be careful before sending passport, ARC, bankbook, or personal-number information. Ask why it is needed, how it will be stored, and whether you can provide it after confirming the employer.
          ko: 여권, 외국인등록증, 통장, 주민등록번호성 정보를 보내기 전에 조심하세요. 왜 필요한지, 어떻게 보관하는지, 고용주 확인 후 제출해도 되는지 물어보세요.
          my: Passport၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ ဘဏ်စာအုပ် သို့မဟုတ် ကိုယ်ရေးအချက်အလက်များ မပို့မီ သတိထားပါ။ ဘာကြောင့်လိုတာလဲ၊ ဘယ်လိုသိမ်းမလဲ၊ အလုပ်ရှင်အတည်ပြုပြီးမှပေးနိုင်မလား မေးပါ။
        href: ""
      - icon: jobs
        title:
          en: Work place or duty keeps changing
          ko: 근무지나 업무가 계속 바뀜
          my: အလုပ်နေရာ သို့မဟုတ် တာဝန် မကြာခဏပြောင်းခြင်း
        body:
          en: If the interview place, workplace, duty, or wage changes many times, pause and confirm again. For students, workplace changes can also affect permission.
          ko: 면접 장소, 근무지, 업무나 임금이 계속 바뀐다면 멈추고 다시 확인하세요. 유학생은 근무지 변경이 허가와도 관련될 수 있습니다.
          my: Interview နေရာ၊ အလုပ်နေရာ၊ တာဝန် သို့မဟုတ် လစာ မကြာခဏပြောင်းနေပါက ခဏရပ်ပြီး ပြန်စစ်ပါ။ ကျောင်းသားများအတွက် အလုပ်နေရာပြောင်းခြင်းသည် ခွင့်ပြုချက်နှင့်လည်း ဆက်စပ်နိုင်ပါသည်။
        href: ""
  - icon: list
    title:
      en: Before the first shift
      ko: 첫 근무 전 확인
      my: ပထမအလုပ်နေ့မတိုင်မီ စစ်ရန်
    intro:
      en: Do not wait until payday to check problems. Confirm the basics before the first shift.
      ko: 문제가 생긴 뒤 급여일까지 기다리지 마세요. 첫 근무 전에 기본 사항을 확인하세요.
      my: ပြဿနာဖြစ်ပြီး လစာရက်အထိ မစောင့်ပါနှင့်။ ပထမအလုပ်နေ့မတိုင်မီ အခြေခံအချက်များကို စစ်ပါ။
    items:
      - icon: check
        title:
          en: Permission and school confirmation
          ko: 허가와 학교 확인
          my: ခွင့်ပြုချက်နှင့် ကျောင်းအတည်ပြုချက်
        body:
          en: If permission is required for your status, keep proof that it was approved. Do not start trial work or training before the required approval.
          ko: 본인 체류자격상 허가가 필요하다면 승인된 기록을 보관하세요. 필요한 허가 전에는 시험근무나 교육도 시작하지 마세요.
          my: ကိုယ့်နေထိုင်ခွင့်အရ ခွင့်ပြုချက်လိုပါက ခွင့်ပြုချက်ရထားသည့်မှတ်တမ်းကို သိမ်းထားပါ။ လိုအပ်သောခွင့်ပြုချက်မရမီ Trial work သို့မဟုတ် Training ကိုလည်း မစပါနှင့်။
        href: ""
      - icon: doc
        title:
          en: Written contract and wage
          ko: 근로계약서와 임금
          my: အလုပ်စာချုပ်နှင့် လစာ
        body:
          en: Make sure the contract, wage, payday, work hours, workplace, and duties match what you were told. Keep your own copy.
          ko: 계약서, 임금, 지급일, 근무시간, 근무지와 업무가 들은 내용과 같은지 확인하고 본인용 사본을 보관하세요.
          my: စာချုပ်၊ လစာ၊ လစာပေးမည့်ရက်၊ အလုပ်ချိန်၊ အလုပ်နေရာနှင့် တာဝန်များသည် ပြောထားသည့်အတိုင်း ဟုတ်မဟုတ်စစ်ပြီး ကိုယ့်မိတ္တူကို သိမ်းထားပါ။
        href: ""
      - icon: list
        title:
          en: Record your working time
          ko: 근무시간 기록
          my: အလုပ်ချိန်မှတ်တမ်းထားပါ
        body:
          en: Keep your own record of work dates, start and finish times, breaks, extra shifts, and pay messages. This helps if pay or schedule problems happen later.
          ko: 근무일, 시작·종료 시간, 휴게시간, 추가근무와 임금 관련 메시지를 직접 기록하세요. 나중에 임금이나 일정 문제가 생길 때 도움이 됩니다.
          my: အလုပ်ရက်၊ စတင်/ပြီးဆုံးချိန်၊ နားချိန်၊ အပိုအလုပ်နှင့် လစာဆိုင်ရာမက်ဆေ့ချ်များကို ကိုယ်တိုင်မှတ်ထားပါ။ နောက်ပိုင်း လစာ သို့မဟုတ် အချိန်ဇယားပြဿနာဖြစ်လျှင် အထောက်အကူဖြစ်ပါသည်။
        href: ""
  - icon: external
    title:
      en: Where to confirm officially
      ko: 공식적으로 확인할 곳
      my: တရားဝင်စစ်ဆေးနိုင်သောနေရာ
    intro:
      en: Use official channels when the issue is about visa permission, labor rights, unpaid wages, or reporting serious workplace problems.
      ko: 비자 허가, 노동권, 임금체불 또는 심각한 직장 문제 신고는 공식 창구를 이용하세요.
      my: ဗီဇာခွင့်ပြုချက်၊ အလုပ်သမားအခွင့်အရေး၊ လစာမရခြင်း သို့မဟုတ် အလုပ်နေရာပြဿနာကြီးများကို တင်ပြရန် တရားဝင်လမ်းကြောင်းများကို သုံးပါ။
    items:
      - icon: external
        title:
          en: HiKorea
          ko: 하이코리아
          my: HiKorea
        body:
          en: Check immigration applications and current student part-time work permission requirements.
          ko: 출입국 전자민원과 유학생 시간제취업 허가의 현재 요건을 확인하세요.
          my: လူဝင်မှုကြီးကြပ်ရေး Online လျှောက်ထားမှုနှင့် ကျောင်းသား Part-time အလုပ်ခွင့် လက်ရှိလိုအပ်ချက်များကို စစ်ပါ။
        href: https://www.hikorea.go.kr/
      - icon: external
        title:
          en: Immigration Contact Center 1345
          ko: 외국인종합안내센터 1345
          my: 1345 လူဝင်မှုကြီးကြပ်ရေး အကူအညီ
        body:
          en: Ask about visa status, part-time work permission, language support, and serious foreign-worker rights issues.
          ko: 체류자격, 시간제취업 허가, 언어 지원과 외국인 근로자 권익 문제를 문의할 수 있습니다.
          my: ဗီဇာအခြေအနေ၊ Part-time အလုပ်ခွင့်၊ ဘာသာစကားအကူအညီနှင့် နိုင်ငံခြားသားအလုပ်သမားအခွင့်အရေးဆိုင်ရာပြဿနာများကို မေးနိုင်ပါသည်။
        href: https://www.immigration.go.kr/immigration_eng/1862/subview.do
      - icon: external
        title:
          en: Ministry of Employment and Labor / 1350
          ko: 고용노동부 / 1350
          my: အလုပ်သမားဝန်ကြီးဌာန / 1350
        body:
          en: Use MOEL or 1350 for labor questions such as employment contracts, working hours, unpaid wages, dismissal, and workplace problems.
          ko: 근로계약, 근로시간, 임금체불, 해고와 직장 문제는 고용노동부 또는 1350에서 확인하세요.
          my: အလုပ်စာချုပ်၊ အလုပ်ချိန်၊ လစာမရခြင်း၊ အလုပ်ဖြုတ်ခြင်းနှင့် အလုပ်နေရာပြဿနာများကို အလုပ်သမားဝန်ကြီးဌာန သို့မဟုတ် 1350 တွင် စစ်ပါ။
        href: https://labor.moel.go.kr/reportCntr/info.do
      - icon: external
        title:
          en: Employment24 job portal
          ko: 고용24 채용정보
          my: Employment24 အလုပ်ရှာ Portal
        body:
          en: Official employment-service portal for checking job information and comparing more formal job posts.
          ko: 채용정보와 비교적 공식적인 공고를 확인할 수 있는 고용서비스 공식 포털입니다.
          my: အလုပ်အချက်အလက်နှင့် ပိုမိုတရားဝင်သောအလုပ်ကြော်ငြာများကို စစ်နိုင်သော တရားဝင်အလုပ်ရှာ Portal ဖြစ်ပါသည်။
        href: https://www.work.go.kr/seekWantedMain.do
