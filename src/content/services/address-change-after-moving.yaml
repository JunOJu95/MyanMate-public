        body:
          en: >-
            Ask 1345 if you are unsure whether the 15-day or 14-day deadline
            applies to your own status, or if your lease is not in your name.
          ko: >-
            본인에게 15일 또는 14일 기준 중 무엇이 적용되는지, 계약자가 본인이 아닐 때 무엇이 필요한지 불확실하면 1345에
            문의하세요.
          my: >-
            မိမိအခြေအနေအတွက် 15 ရက်လား 14 ရက်လား မသေချာပါက၊ သို့မဟုတ်
            အိမ်ငှားစာချုပ်က ကိုယ့်နာမည်မဟုတ်ပါက 1345 တွင် မေးပါ။
