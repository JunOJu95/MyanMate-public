      - icon: list
        audience: none
        title:
          en: Immigration Act Article 36
          ko: 출입국관리법 제36조
          my: လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၆
        body:
          en: >-
            The legal basis for registered foreigners reporting a change of
            place of stay is Article 36 of the Immigration Act. Use official
            service pages for practical document and application details.
          ko: 등록외국인의 체류지 변경 신고 근거는 출입국관리법 제36조입니다. 실제 서류와 신청 방법은 공식 민원 안내에서 확인하세요.
          my: >-
            နိုင်ငံခြားသားမှတ်ပုံတင်ထားသူများ၏ နေထိုင်ရာလိပ်စာပြောင်းတင်ပြရန်
            ဥပဒေအခြေခံသည် လူဝင်မှုကြီးကြပ်ရေးဥပဒေ ပုဒ်မ ၃၆ ဖြစ်ပါသည်။
            လက်တွေ့လိုအပ်သောစာရွက်နှင့် တင်ပြနည်းအသေးစိတ်ကို
            တရားဝင်စာမျက်နှာတွင် ပြန်စစ်ပါ။
