entryTitle: Student part-time work permit
category: jobs
order: 10
lastReviewed: 2026-07-30
title:
  en: Student part-time work permit in Korea
  ko: 유학생 시간제취업 허가
  my: ကျောင်းသား Part-time အလုပ်ခွင့်ပြုချက်
description:
  en: D-2 and D-4 students usually need permission before doing part-time work in Korea. Check who should apply, what may be needed, and what mistakes to avoid before starting a job.
  ko: D-2와 D-4 유학생은 한국에서 아르바이트를 하기 전에 보통 시간제취업 허가가 필요합니다. 일을 시작하기 전 신청 대상, 준비할 수 있는 서류와 자주 생기는 실수를 확인하세요.
  my: D-2 နှင့် D-4 ကျောင်းသားများသည် ကိုရီးယားတွင် Part-time အလုပ်လုပ်မည်ဆိုပါက များသောအားဖြင့် အလုပ်မစမီ 시간제취업 ခွင့်ပြုချက်လိုပါသည်။ ဘယ်သူလျှောက်ရမလဲ၊ ဘာတွေပြင်ထားနိုင်လဲနှင့် မလုပ်သင့်သောအမှားများကို အလုပ်မစမီ စစ်ပါ။
sections:
  - icon: check
    title:
      en: What this permit is
      ko: 이 허가가 무엇인지
      my: ဒီခွင့်ပြုချက်က ဘာလဲ
    intro:
      en: This is permission for eligible international students to do limited part-time work while keeping student status. It is not the same as changing to a work visa.
      ko: 유학생 신분을 유지하면서 제한된 범위의 아르바이트를 하기 위한 허가입니다. 취업비자로 변경하는 것과는 다릅니다.
      my: ဒီခွင့်ပြုချက်သည် ကျောင်းသားအနေဖြင့် နေထိုင်ခွင့်ကို ဆက်ထားပြီး သတ်မှတ်ထားသောအကန့်အသတ်အတွင်း Part-time အလုပ်လုပ်ရန် ခွင့်ပြုချက်ဖြစ်ပါသည်။ အလုပ်ဗီဇာသို့ ပြောင်းခြင်းနှင့် မတူပါ။
    items:
      - icon: topics
        title:
          en: Mainly for D-2 and D-4 students
          ko: 주로 D-2·D-4 유학생 대상
          my: အဓိကအားဖြင့် D-2 နှင့် D-4 ကျောင်းသားများ
        body:
          en: This guide is for students on study-related status such as D-2 or D-4 who want to work part time. The details can differ by visa subtype, school, study period, Korean ability, and immigration rule updates.
          ko: 이 안내는 D-2나 D-4처럼 유학 관련 체류자격으로 한국에 있으면서 아르바이트를 하려는 학생을 위한 내용입니다. 비자 세부유형, 학교, 재학 기간, 한국어 능력과 출입국 규정 변경에 따라 내용이 달라질 수 있습니다.
          my: ဤလမ်းညွှန်ချက်သည် D-2 သို့မဟုတ် D-4 စသည့် ပညာသင်ဆိုင်ရာနေထိုင်ခွင့်ဖြင့် ကိုရီးယားတွင်နေပြီး Part-time အလုပ်လုပ်ချင်သော ကျောင်းသားများအတွက်ဖြစ်ပါသည်။ ဗီဇာအမျိုးအစားခွဲ၊ ကျောင်း၊ ပညာသင်ကာလ၊ ကိုရီးယားဘာသာစွမ်းရည်နှင့် လူဝင်မှုကြီးကြပ်ရေးစည်းမျဉ်းပြောင်းလဲမှုအလိုက် အသေးစိတ်ကွာနိုင်ပါသည်။
        href: ""
      - icon: shield
        title:
          en: Permission should come before work
          ko: 일을 시작하기 전에 허가 확인
          my: အလုပ်မစမီ ခွင့်ပြုချက်စစ်ရန်
        body:
          en: Do not start only because an employer says it is okay. Confirm with your school and immigration, apply if required, and start only after the permission is approved.
          ko: 고용주가 괜찮다고 말해도 바로 시작하지 마세요. 학교와 출입국에서 확인하고 필요한 경우 신청한 뒤 허가가 난 후에 일을 시작하세요.
          my: အလုပ်ရှင်က ရတယ်ဟုပြောရုံဖြင့် ချက်ချင်းမစပါနှင့်။ ကျောင်းနှင့် လူဝင်မှုကြီးကြပ်ရေးဘက်တွင် အရင်စစ်ပြီး လိုအပ်ပါက လျှောက်ထားပါ။ ခွင့်ပြုချက်ရပြီးမှသာ အလုပ်စပါ။
        href: ""
      - icon: jobs
        title:
          en: It is limited work, not every job
          ko: 모든 일이 가능한 것은 아님
          my: အလုပ်တိုင်းလုပ်နိုင်တာ မဟုတ်ပါ
        body:
          en: Part-time permission has limits on work type, workplace, hours, and student eligibility. Some workplaces or duties may not be allowed even if they are hiring.
          ko: 시간제취업 허가에는 업무 종류, 근무지, 근무시간과 학생 요건에 제한이 있습니다. 채용 중인 곳이라도 허용되지 않는 업종이나 업무가 있을 수 있습니다.
          my: Part-time အလုပ်ခွင့်တွင် အလုပ်အမျိုးအစား၊ အလုပ်နေရာ၊ အလုပ်ချိန်နှင့် ကျောင်းသားအခြေအနေဆိုင်ရာ ကန့်သတ်ချက်များရှိပါသည်။ အလုပ်ခေါ်နေသောနေရာဖြစ်သော်လည်း ခွင့်မပြုနိုင်သောလုပ်ငန်း သို့မဟုတ် တာဝန်ရှိနိုင်ပါသည်။
        href: ""
  - icon: search
    title:
      en: Check before applying
      ko: 신청 전에 확인할 것
      my: မလျှောက်မီ စစ်ရန်
    intro:
      en: Before collecting documents, confirm whether you are allowed to apply now and whether the job fits student part-time rules.
      ko: 서류를 모으기 전에 지금 신청할 수 있는지, 그 일이 유학생 시간제취업 기준에 맞는지 확인하세요.
      my: စာရွက်စာတမ်းမစုမီ အခုလျှောက်နိုင်သောအခြေအနေဟုတ်မဟုတ်နှင့် ထိုအလုပ်သည် ကျောင်းသား Part-time စည်းမျဉ်းနှင့် ကိုက်ညီမညီကို အရင်စစ်ပါ။
    items:
      - icon: visa
        title:
          en: Your visa and study period
          ko: 체류자격과 재학 기간
          my: ဗီဇာအခြေအနေနှင့် ပညာသင်ကာလ
        body:
          en: Check your exact visa status, school enrollment, attendance, grades if relevant, and how long you have studied in Korea. Some students may need to wait before they can apply.
          ko: 정확한 체류자격, 재학 상태, 출석, 필요한 경우 성적, 한국에서 공부한 기간을 확인하세요. 일부 학생은 일정 기간이 지나야 신청할 수 있습니다.
          my: ကိုယ့်ဗီဇာအခြေအနေအတိအကျ၊ ကျောင်းတက်နေမှု၊ တက်ရောက်မှု၊ လိုအပ်ပါက အမှတ်နှင့် ကိုရီးယားတွင် ပညာသင်နေခဲ့သည့်ကာလကို စစ်ပါ။ ကျောင်းသားအချို့သည် သတ်မှတ်ကာလကျော်မှသာ လျှောက်နိုင်ပါသည်။
        href: ""
      - icon: korean
        title:
          en: Korean ability may affect hours
          ko: 한국어 능력이 시간에 영향을 줄 수 있음
          my: ကိုရီးယားဘာသာစွမ်းရည်က အလုပ်ချိန်ကို သက်ရောက်နိုင်ပါသည်
        body:
          en: The number of permitted hours can depend on visa type, degree level, academic performance, and Korean language proof such as TOPIK/KIIP. Do not copy another student's limit without checking your own case.
          ko: 허용 시간은 비자 종류, 학위 과정, 학업 성적, TOPIK이나 KIIP 같은 한국어 능력 증빙에 따라 달라질 수 있습니다. 다른 학생의 시간을 그대로 따라 하지 말고 본인 기준을 확인하세요.
          my: ခွင့်ပြုနိုင်သောအလုပ်ချိန်သည် ဗီဇာအမျိုးအစား၊ ပညာသင်အဆင့်၊ ကျောင်းအမှတ်နှင့် TOPIK/KIIP စသည့် ကိုရီးယားဘာသာအထောက်အထားအလိုက် ကွာနိုင်ပါသည်။ အခြားကျောင်းသား၏အလုပ်ချိန်ကို တိုက်ရိုက်မယူဘဲ ကိုယ့်အခြေအနေကို စစ်ပါ။
        href: ""
      - icon: jobs
        title:
          en: The job and workplace
          ko: 업무와 근무지
          my: အလုပ်တာဝန်နှင့် အလုပ်နေရာ
        body:
          en: Check the workplace address, business type, actual duties, hourly wage, weekly schedule, and whether the employer can provide the documents needed for permission.
          ko: 근무지 주소, 업종, 실제 업무, 시급, 주간 근무표와 고용주가 허가에 필요한 서류를 준비할 수 있는지 확인하세요.
          my: အလုပ်နေရာလိပ်စာ၊ လုပ်ငန်းအမျိုးအစား၊ တကယ်လုပ်ရမည့်တာဝန်၊ နာရီလစာ၊ တစ်ပတ်အလုပ်ချိန်ဇယားနှင့် အလုပ်ရှင်က ခွင့်ပြုချက်အတွက်လိုသောစာရွက်များပေးနိုင်မနိုင်ကို စစ်ပါ။
        href: ""
  - icon: doc
    title:
      en: Documents that may be needed
      ko: 필요할 수 있는 서류
      my: လိုအပ်နိုင်သော စာရွက်စာတမ်းများ
    intro:
      en: The exact list can change, so use this as a preparation checklist and confirm with your school or immigration before submitting.
      ko: 정확한 서류 목록은 바뀔 수 있으므로 준비 체크리스트로만 보고 제출 전 학교나 출입국에서 확인하세요.
      my: စာရွက်စာတမ်းစာရင်းအတိအကျသည် ပြောင်းနိုင်သောကြောင့် ဤစာရင်းကို ပြင်ဆင်ရန် Checklist အဖြစ်သာသုံးပြီး မတင်မီ ကျောင်း သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးဘက်တွင် အတည်ပြုပါ။
    items:
      - icon: doc
        title:
          en: Passport and ARC
          ko: 여권과 외국인등록증
          my: Passport နှင့် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်
        body:
          en: Your passport and ARC are usually needed to confirm identity and residence status.
          ko: 본인 확인과 체류자격 확인을 위해 여권과 외국인등록증이 보통 필요합니다.
          my: ကိုယ်ရေးအချက်အလက်နှင့် နေထိုင်ခွင့်အခြေအနေကို အတည်ပြုရန် Passport နှင့် နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် များသောအားဖြင့် လိုပါသည်။
        href: ""
      - icon: doc
        title:
          en: School confirmation
          ko: 학교 확인
          my: ကျောင်းဘက်မှ အတည်ပြုချက်
        body:
          en: Schools often need to confirm enrollment, attendance, academic status, and whether the work fits student rules. Ask the international office before accepting the job.
          ko: 학교는 재학, 출석, 학업 상태와 해당 일이 유학생 기준에 맞는지 확인해야 할 수 있습니다. 일을 수락하기 전에 국제처에 먼저 문의하세요.
          my: ကျောင်းဘက်မှ ကျောင်းတက်နေမှု၊ တက်ရောက်မှု၊ ပညာရေးအခြေအနေနှင့် ထိုအလုပ်က ကျောင်းသားစည်းမျဉ်းနှင့် ကိုက်ညီမညီကို အတည်ပြုရန်လိုနိုင်ပါသည်။ အလုပ်လက်ခံမီ International office ကို အရင်မေးပါ။
        href: ""
      - icon: jobs
        title:
          en: Employment contract or work details
          ko: 근로계약서 또는 근무 내용
          my: အလုပ်စာချုပ် သို့မဟုတ် အလုပ်အသေးစိတ်
        body:
          en: Prepare the employer name, business registration information if requested, workplace address, duties, wage, work days, and weekly hours.
          ko: 고용주 정보, 필요한 경우 사업자등록 정보, 근무지 주소, 업무, 임금, 근무 요일과 주당 근무시간을 준비하세요.
          my: အလုပ်ရှင်အမည်၊ လိုအပ်ပါက လုပ်ငန်းမှတ်ပုံတင်အချက်အလက်၊ အလုပ်နေရာလိပ်စာ၊ အလုပ်တာဝန်၊ လစာ၊ အလုပ်ရက်နှင့် တစ်ပတ်အလုပ်ချိန်တို့ကို ပြင်ထားပါ။
        href: ""
      - icon: korean
        title:
          en: Korean-language proof if relevant
          ko: 필요한 경우 한국어 능력 증빙
          my: လိုအပ်ပါက ကိုရီးယားဘာသာအထောက်အထား
        body:
          en: If your permitted hours depend on Korean ability, you may need proof such as TOPIK or KIIP. Confirm which proof is accepted before submitting.
          ko: 허용 시간이 한국어 능력에 따라 달라지는 경우 TOPIK이나 KIIP 같은 증빙이 필요할 수 있습니다. 어떤 증빙이 인정되는지 제출 전에 확인하세요.
          my: ခွင့်ပြုအလုပ်ချိန်သည် ကိုရီးယားဘာသာစွမ်းရည်အပေါ်မူတည်ပါက TOPIK သို့မဟုတ် KIIP စသည့်အထောက်အထားလိုနိုင်ပါသည်။ မတင်မီ မည်သည့်အထောက်အထားကို လက်ခံမလဲ စစ်ပါ။
        href: ""
  - icon: list
    title:
      en: Basic application flow
      ko: 기본 신청 흐름
      my: အခြေခံလျှောက်ထားပုံ
    intro:
      en: The safest order is school check first, then documents, then immigration application, then start work only after approval.
      ko: 가장 안전한 순서는 학교 확인, 서류 준비, 출입국 신청, 허가 후 근무 시작입니다.
      my: အလုံခြုံဆုံးအစီအစဉ်မှာ ကျောင်းဘက်တွင် အရင်စစ်ခြင်း၊ စာရွက်စာတမ်းပြင်ခြင်း၊ လူဝင်မှုကြီးကြပ်ရေးသို့ လျှောက်ခြင်း၊ ခွင့်ပြုချက်ရပြီးမှ အလုပ်စခြင်း ဖြစ်ပါသည်။
    items:
      - icon: doc
        title:
          en: 1. Ask your school first
          ko: 1. 학교에 먼저 확인
          my: 1. ကျောင်းကို အရင်မေးပါ
        body:
          en: Tell the international office the workplace, job type, weekly schedule, and expected start date. Ask if you are eligible and what forms the school must sign.
          ko: 국제처에 근무지, 업무 종류, 주간 근무표와 시작 예정일을 알려주세요. 신청 가능 여부와 학교가 서명해야 하는 양식을 확인하세요.
          my: International office ကို အလုပ်နေရာ၊ အလုပ်အမျိုးအစား၊ တစ်ပတ်အလုပ်ချိန်ဇယားနှင့် စတင်မည့်ရက်ကို ပြောပါ။ လျှောက်နိုင်မနိုင်နှင့် ကျောင်းဘက်လက်မှတ်ထိုးရမည့် Form ကို မေးပါ။
        href: ""
      - icon: doc
        title:
          en: 2. Collect job and student documents
          ko: 2. 근무·학생 서류 준비
          my: 2. အလုပ်နှင့် ကျောင်းသားစာရွက်များပြင်ပါ
        body:
          en: Collect the contract or work details, school confirmation, student records if needed, passport, ARC, and any language proof that applies to your case.
          ko: 근로계약서나 근무 내용, 학교 확인서, 필요한 경우 학생 기록, 여권, 외국인등록증과 본인에게 해당되는 언어 증빙을 준비하세요.
          my: အလုပ်စာချုပ် သို့မဟုတ် အလုပ်အသေးစိတ်၊ ကျောင်းအတည်ပြုစာ၊ လိုအပ်ပါက ကျောင်းသားမှတ်တမ်း၊ Passport၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်နှင့် ကိုယ့်အခြေအနေနှင့်ဆိုင်သော ဘာသာစကားအထောက်အထားကို ပြင်ပါ။
        href: ""
      - icon: external
        title:
          en: 3. Apply through HiKorea or immigration
          ko: 3. 하이코리아 또는 출입국에 신청
          my: 3. HiKorea သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးတွင် လျှောက်ပါ
        body:
          en: Depending on your case, you may apply online through HiKorea or visit the immigration office. Check the current method before you submit.
          ko: 경우에 따라 하이코리아 온라인 신청 또는 출입국사무소 방문 신청이 가능합니다. 제출 전 현재 가능한 신청 방법을 확인하세요.
          my: ကိုယ့်အခြေအနေပေါ်မူတည်၍ HiKorea မှ Online လျှောက်ခြင်း သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးရုံးသို့ သွားလျှောက်ခြင်း ဖြစ်နိုင်ပါသည်။ မတင်မီ လက်ရှိလျှောက်ထားနိုင်သောနည်းလမ်းကို စစ်ပါ။
        href: https://www.hikorea.go.kr/
      - icon: check
        title:
          en: 4. Start after approval
          ko: 4. 허가 후 근무 시작
          my: 4. ခွင့်ပြုချက်ရပြီးမှ အလုပ်စပါ
        body:
          en: Keep the approval record and work only within the approved workplace, duties, and hours. If the workplace or schedule changes, check whether you must report or apply again.
          ko: 허가 기록을 보관하고 승인된 근무지, 업무와 시간 안에서만 일하세요. 근무지나 일정이 바뀌면 신고나 재신청이 필요한지 확인하세요.
          my: ခွင့်ပြုချက်မှတ်တမ်းကို သိမ်းထားပြီး ခွင့်ပြုထားသောအလုပ်နေရာ၊ တာဝန်နှင့် အချိန်အတွင်းသာ အလုပ်လုပ်ပါ။ အလုပ်နေရာ သို့မဟုတ် အချိန်ဇယားပြောင်းပါက ပြန်တင်ပြရန် သို့မဟုတ် ပြန်လျှောက်ရန်လိုမလို စစ်ပါ။
        href: ""
  - icon: shield
    title:
      en: Common mistakes to avoid
      ko: 자주 생기는 실수
      my: မလုပ်သင့်သော အမှားများ
    intro:
      en: Most problems start before the first workday. Slow down and check permission, contract, and hours before accepting.
      ko: 대부분의 문제는 첫 근무일 전에 시작됩니다. 수락하기 전에 허가, 계약서와 시간을 천천히 확인하세요.
      my: ပြဿနာအများစုသည် ပထမအလုပ်နေ့မတိုင်မီကတည်းက စတင်တတ်ပါသည်။ အလုပ်လက်ခံမီ ခွင့်ပြုချက်၊ စာချုပ်နှင့် အလုပ်ချိန်ကို သေချာစစ်ပါ။
    items:
      - icon: shield
        title:
          en: Working before approval
          ko: 허가 전 근무 시작
          my: ခွင့်ပြုချက်မရခင် အလုပ်စခြင်း
        body:
          en: Even one early shift can create immigration risk. Do not start training, trial work, or paid work before the required permission is approved.
          ko: 하루 먼저 일한 것도 출입국상 문제가 될 수 있습니다. 필요한 허가가 나기 전에는 교육, 시험근무, 유급근무를 시작하지 마세요.
          my: တစ်ရက်အရင်လုပ်မိခြင်းပင် လူဝင်မှုကြီးကြပ်ရေးဆိုင်ရာပြဿနာဖြစ်နိုင်ပါသည်။ လိုအပ်သောခွင့်ပြုချက်မရမီ Training၊ Trial shift သို့မဟုတ် လစာရသောအလုပ်ကို မစပါနှင့်။
        href: ""
      - icon: jobs
        title:
          en: Changing job without checking again
          ko: 다시 확인하지 않고 근무지 변경
          my: ပြန်မစစ်ဘဲ အလုပ်နေရာပြောင်းခြင်း
        body:
          en: Permission is usually connected to specific work details. If the employer, address, duties, or hours change, confirm with your school or immigration before continuing.
          ko: 허가는 보통 특정 근무 내용과 연결됩니다. 고용주, 주소, 업무나 시간이 바뀌면 계속 일하기 전에 학교나 출입국에 확인하세요.
          my: ခွင့်ပြုချက်သည် များသောအားဖြင့် သတ်မှတ်ထားသောအလုပ်အသေးစိတ်နှင့် ဆက်စပ်ပါသည်။ အလုပ်ရှင်၊ လိပ်စာ၊ တာဝန် သို့မဟုတ် အချိန်ပြောင်းပါက ဆက်လုပ်မီ ကျောင်း သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးကို စစ်ပါ။
        href: ""
      - icon: daily
        title:
          en: Assuming weekend or vacation hours are unlimited
          ko: 주말·방학 시간이 무제한이라고 생각
          my: ပိတ်ရက်/အားလပ်ရက်တွင် အချိန်အကန့်အသတ်မရှိဟု ထင်ခြင်း
        body:
          en: Hours can differ between weekdays, weekends, holidays, and vacation periods, but that does not mean every student has unlimited hours. Check your exact permitted limit.
          ko: 평일, 주말, 공휴일, 방학 기간의 기준이 다를 수 있지만 모든 학생에게 무제한이라는 뜻은 아닙니다. 본인에게 적용되는 허용 시간을 확인하세요.
          my: ပုံမှန်ရက်၊ ပိတ်ရက်၊ အားလပ်ရက်နှင့် ကျောင်းပိတ်ကာလအလိုက် စည်းမျဉ်းကွာနိုင်သော်လည်း ကျောင်းသားတိုင်းအချိန်အကန့်အသတ်မရှိဟု မဆိုလိုပါ။ ကိုယ့်အပေါ်သက်ရောက်သောခွင့်ပြုအချိန်ကို အတိအကျစစ်ပါ။
        href: ""
      - icon: doc
        title:
          en: No written contract or unclear pay
          ko: 계약서 없이 일하거나 임금이 불분명
          my: စာချုပ်မရှိဘဲလုပ်ခြင်း သို့မဟုတ် လစာမရှင်းခြင်း
        body:
          en: Immigration permission and labor protection both become harder when work details are unclear. Keep written records for workplace, wage, schedule, and messages.
          ko: 근무 내용이 불분명하면 출입국 허가와 노동 보호 모두 어려워질 수 있습니다. 근무지, 임금, 일정과 메시지를 서면 기록으로 보관하세요.
          my: အလုပ်အသေးစိတ်မရှင်းပါက လူဝင်မှုကြီးကြပ်ရေးခွင့်ပြုချက်နှင့် အလုပ်သမားကာကွယ်မှုနှစ်ခုလုံး ခက်ခဲနိုင်ပါသည်။ အလုပ်နေရာ၊ လစာ၊ အချိန်ဇယားနှင့် မက်ဆေ့ချ်များကို စာဖြင့်မှတ်တမ်းအဖြစ် သိမ်းထားပါ။
        href: ""
  - icon: external
    title:
      en: Where to confirm officially
      ko: 공식적으로 확인할 곳
      my: တရားဝင်စစ်ဆေးနိုင်သောနေရာ
    intro:
      en: Rules can change and individual cases differ. Confirm your own case with your school, HiKorea, or immigration before working.
      ko: 규정은 바뀔 수 있고 개인별 상황도 다릅니다. 일을 시작하기 전에 학교, 하이코리아 또는 출입국에서 본인 사례를 확인하세요.
      my: စည်းမျဉ်းများ ပြောင်းနိုင်ပြီး တစ်ဦးချင်းအခြေအနေလည်း ကွာနိုင်ပါသည်။ အလုပ်မစမီ ကိုယ့်အခြေအနေကို ကျောင်း၊ HiKorea သို့မဟုတ် လူဝင်မှုကြီးကြပ်ရေးတွင် အတည်ပြုပါ။
    items:
      - icon: external
        title:
          en: Study in Korea student work information
          ko: Study in Korea 유학생 시간제취업 안내
          my: Study in Korea ကျောင်းသား Part-time အလုပ်အချက်အလက်
        body:
          en: Official study-abroad information page explaining part-time work eligibility, permission, and hour limits for international students.
          ko: 유학생 시간제취업 대상, 허가와 시간 기준을 안내하는 공식 유학 정보 페이지입니다.
          my: နိုင်ငံခြားကျောင်းသား Part-time အလုပ်လျှောက်ထားနိုင်သူ၊ ခွင့်ပြုချက်နှင့် အလုပ်ချိန်စည်းမျဉ်းများကို ဖော်ပြထားသော တရားဝင်ပညာသင်အချက်အလက်စာမျက်နှာဖြစ်ပါသည်။
        href: https://www.studyinkorea.go.kr/en/main.do
      - icon: external
        title:
          en: HiKorea
          ko: 하이코리아
          my: HiKorea
        body:
          en: Use HiKorea for immigration information, e-applications, reservations, forms, and checking current requirements.
          ko: 출입국 정보, 전자민원, 방문예약, 서식과 현재 요건 확인은 하이코리아에서 확인하세요.
          my: လူဝင်မှုကြီးကြပ်ရေးအချက်အလက်၊ Online လျှောက်ထားခြင်း၊ ရုံးချိန်းယူခြင်း၊ Form များနှင့် လက်ရှိလိုအပ်ချက်များကို HiKorea တွင် စစ်ပါ။
        href: https://www.hikorea.go.kr/
      - icon: external
        title:
          en: Immigration Contact Center 1345
          ko: 외국인종합안내센터 1345
          my: 1345 လူဝင်မှုကြီးကြပ်ရေး အကူအညီ
        body:
          en: Call 1345 for immigration questions and language support. Ask about your visa status, application method, required documents, and allowed hours before working.
          ko: 출입국 문의와 언어 지원은 1345에 문의하세요. 일하기 전에 본인 체류자격, 신청 방법, 필요서류와 허용 시간을 확인하세요.
          my: လူဝင်မှုကြီးကြပ်ရေးမေးမြန်းမှုနှင့် ဘာသာစကားအကူအညီအတွက် 1345 ကို ခေါ်ပါ။ အလုပ်မစမီ ကိုယ့်ဗီဇာအခြေအနေ၊ လျှောက်နည်း၊ လိုအပ်စာရွက်များနှင့် ခွင့်ပြုအလုပ်ချိန်ကို မေးပါ။
        href: https://www.immigration.go.kr/immigration_eng/1862/subview.do
