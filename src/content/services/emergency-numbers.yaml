entryTitle: Emergency numbers
category: daily
order: 50
lastReviewed: 2026-07-30
title:
  en: Emergency numbers in Korea
  ko: 한국에서 긴급할 때 연락할 번호
  my: ကိုရီးယားမှာ အရေးပေါ်ဖြစ်ရင် ခေါ်ရမည့် နံပါတ်များ
description:
  en: Check which number to call for police, fire, ambulance, medical disease questions, travel interpretation, immigration help, and lost items in Korea.
  ko: 한국에서 경찰, 화재, 구급차, 감염병 문의, 여행 통역, 출입국 상담, 분실물 확인이 필요할 때 어떤 번호로 연락해야 하는지 정리했습니다.
  my: ကိုရီးယားမှာ ရဲ၊ မီးသတ်၊ လူနာတင်ကား၊ ကျန်းမာရေးဆိုင်ရာမေးမြန်းမှု၊ ဘာသာပြန်အကူအညီ၊ ဗီဇာ/လူဝင်မှုကြီးကြပ်ရေးကိစ္စနှင့် ပစ္စည်းပျောက်ကိစ္စများအတွက် ဘယ်နံပါတ်ကို ခေါ်ရမလဲကို အလွယ်တကူကြည့်နိုင်အောင် စုထားပါသည်။
sections:
  - icon: phone
    title:
      en: Numbers to save first
      ko: 먼저 저장해둘 번호
      my: အရင်မှတ်ထားသင့်သော နံပါတ်များ
    intro:
      en: If someone is in danger, injured, or needs urgent help, call the emergency number first. Do not wait to find the perfect office.
      ko: 위험하거나 다쳤거나 긴급한 도움이 필요하면 먼저 긴급번호로 연락하세요. 완벽한 담당기관을 찾느라 기다리지 마세요.
      my: လူတစ်ယောက်အန္တရာယ်ရှိနေခြင်း၊ ထိခိုက်ဒဏ်ရာရခြင်း၊ အရေးပေါ်အကူအညီလိုခြင်းဖြစ်ပါက အရင်ဆုံး အရေးပေါ်နံပါတ်ကို ခေါ်ပါ။ ဘယ်ဌာနမှန်လဲကို အချိန်ကြာကြာရှာနေစရာ မလိုပါ။
    items:
      - icon: shield
        title:
          en: 112 - Police
          ko: 112 - 경찰
          my: 112 - ရဲ
        body:
          en: Call 112 for crime, danger, violence, theft, traffic accidents needing police, or when you feel unsafe.
          ko: 범죄, 위험, 폭력, 도난, 경찰 조치가 필요한 교통사고, 신변이 위험하다고 느낄 때 112로 연락하세요.
          my: ရာဇဝတ်မှု၊ အန္တရာယ်၊ အကြမ်းဖက်မှု၊ ခိုးမှု၊ ရဲလိုအပ်သော ယာဉ်မတော်တဆမှု သို့မဟုတ် ကိုယ့်လုံခြုံရေးအတွက် စိုးရိမ်ရချိန်တွင် 112 ကို ခေါ်ပါ။
        href: ""
      - icon: health
        title:
          en: 119 - Fire and ambulance
          ko: 119 - 화재·구급차
          my: 119 - မီးသတ်နှင့် လူနာတင်ကား
        body:
          en: Call 119 for fire, serious injury, sudden illness, ambulance, rescue, or when medical help must come to your location.
          ko: 화재, 큰 부상, 갑작스러운 질병, 구급차, 구조, 의료진이 현장으로 와야 하는 상황이면 119로 연락하세요.
          my: မီးလောင်ခြင်း၊ ပြင်းထန်ဒဏ်ရာ၊ ရုတ်တရက်နာခြင်း၊ လူနာတင်ကားလိုခြင်း၊ ကယ်ဆယ်ရေးလိုခြင်း သို့မဟုတ် ဆေးဘက်ဆိုင်ရာအကူအညီကို ကိုယ့်နေရာသို့ လာစေချင်လျှင် 119 ကို ခေါ်ပါ။
        href: ""
      - icon: help
        title:
          en: 1330 - Travel help and interpretation
          ko: 1330 - 관광 안내·통역
          my: 1330 - ခရီးသွားအကူအညီနှင့် ဘာသာပြန်
        body:
          en: Call 1330 when you need travel information or interpretation help. It can be useful when you do not speak Korean and need help explaining a situation.
          ko: 관광 정보나 통역 도움이 필요할 때 1330으로 연락하세요. 한국어로 설명하기 어려운 상황에서 도움을 받을 수 있습니다.
          my: ခရီးသွားအချက်အလက် သို့မဟုတ် ဘာသာပြန်အကူအညီလိုပါက 1330 ကို ခေါ်ပါ။ ကိုရီးယားလို မရှင်းပြနိုင်သောအခြေအနေများတွင် အထောက်အကူဖြစ်နိုင်ပါသည်။
        href: ""
      - icon: visa
        title:
          en: 1345 - Immigration Contact Center
          ko: 1345 - 외국인종합안내센터
          my: 1345 - လူဝင်မှုကြီးကြပ်ရေး အကူအညီ
        body:
          en: Call 1345 for visa, residence, immigration office, public-office interpretation, and foreigner life-administration questions. It is not the first number for life-threatening emergencies.
          ko: 비자, 체류, 출입국사무소, 공공기관 통역, 외국인 생활 행정 문의는 1345로 연락하세요. 생명에 위험이 있는 긴급상황의 첫 번호는 아닙니다.
          my: ဗီဇာ၊ နေထိုင်ခွင့်၊ လူဝင်မှုကြီးကြပ်ရေးရုံး၊ အစိုးရဌာနတွင် ဘာသာပြန်အကူအညီနှင့် နိုင်ငံခြားသားနေ့စဉ်အုပ်ချုပ်ရေးကိစ္စများအတွက် 1345 ကို ခေါ်ပါ။ အသက်အန္တရာယ်ရှိသော အရေးပေါ်အခြေအနေတွင် ပထမဆုံးခေါ်ရမည့်နံပါတ်တော့ မဟုတ်ပါ။
        href: ""
      - icon: health
        title:
          en: 1339 - Infectious disease questions
          ko: 1339 - 감염병 문의
          my: 1339 - ကူးစက်ရောဂါဆိုင်ရာမေးမြန်းမှု
        body:
          en: Call 1339 for infectious disease and public-health related questions. If a person is seriously sick right now or needs an ambulance, call 119.
          ko: 감염병이나 보건 관련 문의는 1339로 연락하세요. 지금 심하게 아프거나 구급차가 필요하면 119로 연락하세요.
          my: ကူးစက်ရောဂါ သို့မဟုတ် ပြည်သူ့ကျန်းမာရေးဆိုင်ရာ မေးမြန်းမှုများအတွက် 1339 ကို ခေါ်ပါ။ လူတစ်ယောက် အခုချက်ချင်း ပြင်းပြင်းထန်ထန်နာနေခြင်း သို့မဟုတ် လူနာတင်ကားလိုပါက 119 ကို ခေါ်ပါ။
        href: ""
      - icon: search
        title:
          en: 182 - Lost items
          ko: 182 - 분실물
          my: 182 - ပစ္စည်းပျောက်
        body:
          en: Call 182 or check LOST112 when you lost an item. For theft or danger, call 112 instead.
          ko: 물건을 잃어버렸다면 182 또는 LOST112를 확인하세요. 도난이나 위험 상황이면 112로 연락하세요.
          my: ပစ္စည်းပျောက်သွားပါက 182 ကို ခေါ်ခြင်း သို့မဟုတ် LOST112 တွင် စစ်ခြင်း လုပ်နိုင်ပါသည်။ ခိုးယူခံရခြင်း သို့မဟုတ် အန္တရာယ်ရှိပါက 112 ကို ခေါ်ပါ။
        href: ""
  - icon: list
    title:
      en: Which number should you call?
      ko: 어떤 상황에 어떤 번호를 써야 할까?
      my: ဘယ်အခြေအနေမှာ ဘယ်နံပါတ်ကို ခေါ်မလဲ
    intro:
      en: Think from the situation first, then choose the number. If it is urgent and dangerous, use 112 or 119.
      ko: 먼저 상황을 보고 번호를 선택하세요. 긴급하고 위험하면 112 또는 119를 이용하세요.
      my: အရင်ဆုံး အခြေအနေကိုကြည့်ပြီး နံပါတ်ရွေးပါ။ အရေးပေါ်ပြီး အန္တရာယ်ရှိပါက 112 သို့မဟုတ် 119 ကို သုံးပါ။
    items:
      - icon: shield
        title:
          en: Danger, crime, violence, or theft
          ko: 위험·범죄·폭력·도난
          my: အန္တရာယ်၊ ရာဇဝတ်မှု၊ အကြမ်းဖက်မှု၊ ခိုးမှု
        body:
          en: Call 112. Explain where you are, what happened, whether anyone is injured, and whether the person causing danger is still nearby.
          ko: 112로 연락하세요. 현재 위치, 무슨 일이 있었는지, 다친 사람이 있는지, 위험한 사람이 아직 근처에 있는지 말하세요.
          my: 112 ကို ခေါ်ပါ။ ကိုယ့်နေရာ၊ ဖြစ်ခဲ့သည့်အကြောင်း၊ ဒဏ်ရာရသူရှိမရှိ၊ အန္တရာယ်ဖြစ်စေသူ အနီးမှာရှိနေသေးမသေးကို ပြောပါ။
        href: ""
      - icon: health
        title:
          en: Fire, serious injury, sudden illness
          ko: 화재·큰 부상·갑작스러운 질병
          my: မီးလောင်ခြင်း၊ ပြင်းထန်ဒဏ်ရာ၊ ရုတ်တရက်နာခြင်း
        body:
          en: Call 119. Say if you need an ambulance, if the person can breathe, if there is bleeding, and where help should come.
          ko: 119로 연락하세요. 구급차가 필요한지, 숨을 쉬는지, 출혈이 있는지, 어디로 와야 하는지 말하세요.
          my: 119 ကို ခေါ်ပါ။ လူနာတင်ကားလိုမလို၊ အသက်ရှူနိုင်မနိုင်၊ သွေးထွက်နေမနေ၊ ဘယ်နေရာကိုလာရမလဲကို ပြောပါ။
        href: ""
      - icon: help
        title:
          en: You need help explaining in Korean
          ko: 한국어 설명이 어려울 때
          my: ကိုရီးယားလို ရှင်းပြရန်ခက်သောအခါ
        body:
          en: For travel or interpretation support, call 1330. For immigration or public-office interpretation, call 1345 during service hours.
          ko: 여행이나 통역 도움이 필요하면 1330, 출입국이나 공공기관 통역은 상담시간에 1345로 연락하세요.
          my: ခရီးသွားခြင်း သို့မဟုတ် ဘာသာပြန်အကူအညီလိုပါက 1330 ကို ခေါ်ပါ။ လူဝင်မှုကြီးကြပ်ရေး သို့မဟုတ် အစိုးရဌာနဆိုင်ရာ ဘာသာပြန်အကူအညီအတွက် ဝန်ဆောင်ချိန်အတွင်း 1345 ကို ခေါ်ပါ။
        href: ""
      - icon: search
        title:
          en: Lost item, not danger
          ko: 위험이 아닌 분실물
          my: အန္တရာယ်မဟုတ်ဘဲ ပစ္စည်းပျောက်ခြင်း
        body:
          en: Try 182 or LOST112. If your phone, wallet, ARC, or passport is missing, also prepare to contact the related company, bank, immigration office, or embassy.
          ko: 182 또는 LOST112를 확인하세요. 휴대폰, 지갑, 외국인등록증, 여권을 잃어버렸다면 통신사, 은행, 출입국사무소, 대사관 연락도 준비하세요.
          my: 182 သို့မဟုတ် LOST112 တွင် စစ်ပါ။ ဖုန်း၊ ပိုက်ဆံအိတ်၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ် သို့မဟုတ် Passport ပျောက်ပါက သက်ဆိုင်ရာဖုန်းကုမ္ပဏီ၊ ဘဏ်၊ လူဝင်မှုကြီးကြပ်ရေးရုံး သို့မဟုတ် သံရုံးကိုလည်း ဆက်သွယ်ရန်ပြင်ထားပါ။
        href: ""
  - icon: phone
    title:
      en: What to say when calling
      ko: 전화할 때 말할 내용
      my: ဖုန်းခေါ်ချိန် ဘာပြောရမလဲ
    intro:
      en: You do not need perfect Korean. Give short, clear information first.
      ko: 한국어를 완벽하게 하지 않아도 됩니다. 짧고 정확한 정보를 먼저 말하세요.
      my: ကိုရီးယားလို ပြည့်ပြည့်စုံစုံပြောတတ်ရန် မလိုပါ။ တိုတိုရှင်းရှင်း အရေးကြီးသည့်အချက်ကို အရင်ပြောပါ။
    items:
      - icon: search
        title:
          en: Your current location
          ko: 현재 위치
          my: ကိုယ့်လက်ရှိနေရာ
        body:
          en: Say the address, building name, subway exit, store name, or nearby landmark. If you use a map app, read the address from the screen.
          ko: 주소, 건물 이름, 지하철 출구, 가게 이름, 주변 표지물을 말하세요. 지도 앱을 보고 있다면 화면의 주소를 읽어주세요.
          my: လိပ်စာ၊ အဆောက်အအုံနာမည်၊ မြေအောက်ရထားထွက်ပေါက်၊ ဆိုင်နာမည် သို့မဟုတ် အနီးရှိအမှတ်အသားကို ပြောပါ။ Map App ဖွင့်ထားပါက Screen ပေါ်ရှိလိပ်စာကို ဖတ်ပြပါ။
        href: ""
      - icon: list
        title:
          en: What happened
          ko: 무슨 일이 있었는지
          my: ဘာဖြစ်သွားလဲ
        body:
          en: Say simple words such as accident, fire, sick, injured, stolen, lost, fight, or danger. Then answer the operator's questions.
          ko: 사고, 화재, 아픔, 부상, 도난, 분실, 싸움, 위험 같은 단어로 간단히 말하고 상담원의 질문에 답하세요.
          my: Accident၊ fire၊ sick၊ injured၊ stolen၊ lost၊ fight၊ danger စသည့် ရိုးရှင်းသောစကားလုံးများဖြင့် ပြောပြီး Operator မေးသည့်မေးခွန်းများကို ဖြေပါ။
        href: ""
      - icon: users
        title:
          en: Who needs help
          ko: 도움이 필요한 사람
          my: ဘယ်သူအကူအညီလိုလဲ
        body:
          en: Say how many people need help, whether someone is unconscious, bleeding, unable to breathe, or unable to move.
          ko: 도움이 필요한 사람이 몇 명인지, 의식이 없는지, 피가 나는지, 숨쉬기 어려운지, 움직일 수 없는지 말하세요.
          my: အကူအညီလိုသူ ဘယ်နှစ်ယောက်ရှိလဲ၊ သတိလစ်နေမနေ၊ သွေးထွက်နေမနေ၊ အသက်ရှူခက်မခက်၊ မလှုပ်နိုင်ဖြစ်နေမနေကို ပြောပါ။
        href: ""
      - icon: help
        title:
          en: Ask for an interpreter if needed
          ko: 필요하면 통역을 요청하세요
          my: လိုအပ်ပါက ဘာသာပြန်အကူအညီတောင်းပါ
        body:
          en: If Korean is difficult, say “English please” or “Interpreter please.” If you can speak another supported language, say that language clearly.
          ko: 한국어가 어렵다면 “English please” 또는 “Interpreter please”라고 말하세요. 가능한 다른 언어가 있다면 그 언어를 분명히 말하세요.
          my: ကိုရီးယားလို မပြောနိုင်ပါက “English please” သို့မဟုတ် “Interpreter please” ဟု ပြောပါ။ ကိုယ်ပြောနိုင်သော အခြားဘာသာစကားရှိပါက ထိုဘာသာစကားကို ရှင်းရှင်းပြောပါ။
        href: ""
  - icon: check
    title:
      en: Prepare before you need it
      ko: 필요하기 전에 준비할 것
      my: အရေးမဖြစ်ခင် ပြင်ထားသင့်တာများ
    intro:
      en: Small preparation makes a real emergency easier to handle.
      ko: 작은 준비가 실제 긴급상황에서 큰 도움이 됩니다.
      my: အရေးပေါ်အခြေအနေမဖြစ်ခင် အနည်းငယ်ပြင်ထားခြင်းက အမှန်တကယ်လိုအပ်ချိန်တွင် အများကြီးကူညီနိုင်ပါသည်။
    items:
      - icon: phone
        title:
          en: Save the numbers in your phone
          ko: 휴대폰에 번호 저장
          my: ဖုန်းထဲတွင် နံပါတ်များသိမ်းထားပါ
        body:
          en: Save 112, 119, 1330, 1345, 1339, and 182 with clear names. Also save your embassy or family emergency contact.
          ko: 112, 119, 1330, 1345, 1339, 182를 알아보기 쉬운 이름으로 저장하세요. 대사관이나 가족 비상연락처도 저장해두세요.
          my: 112၊ 119၊ 1330၊ 1345၊ 1339 နှင့် 182 ကို နာမည်ရှင်းရှင်းဖြင့် ဖုန်းထဲသိမ်းထားပါ။ ကိုယ့်သံရုံး သို့မဟုတ် မိသားစုအရေးပေါ်ဆက်သွယ်ရန်နံပါတ်ကိုလည်း သိမ်းထားပါ။
        href: ""
      - icon: doc
        title:
          en: Keep your address easy to find
          ko: 주소를 바로 볼 수 있게 준비
          my: လိပ်စာကို လွယ်လွယ်ကြည့်နိုင်အောင်ထားပါ
        body:
          en: Save your home address, school or workplace address, dormitory name, and room number in your phone notes.
          ko: 집 주소, 학교나 직장 주소, 기숙사 이름과 호실을 휴대폰 메모에 저장하세요.
          my: အိမ်လိပ်စာ၊ ကျောင်း သို့မဟုတ် အလုပ်လိပ်စာ၊ Dormitory နာမည်နှင့် အခန်းနံပါတ်ကို ဖုန်း Note ထဲတွင် သိမ်းထားပါ။
        href: ""
      - icon: shield
        title:
          en: Keep important document photos safely
          ko: 중요 서류 사진 보관
          my: အရေးကြီးစာရွက်စာတမ်းဓာတ်ပုံများကို လုံခြုံစွာထားပါ
        body:
          en: Keep secure copies of your passport, ARC, insurance card, and embassy contact. Do not share them publicly or send them to strangers.
          ko: 여권, 외국인등록증, 보험증, 대사관 연락처를 안전하게 보관하세요. 공개적으로 올리거나 모르는 사람에게 보내지 마세요.
          my: Passport၊ နိုင်ငံခြားသားမှတ်ပုံတင်ကတ်၊ အာမခံကတ်နှင့် သံရုံးဆက်သွယ်ရန်အချက်အလက်များကို လုံခြုံစွာသိမ်းထားပါ။ Public တွင် မတင်ပါနှင့်၊ မသိသူများထံ မပို့ပါနှင့်။
        href: ""
  - icon: shield
    title:
      en: Common mistakes to avoid
      ko: 자주 생기는 실수
      my: မလုပ်သင့်သော အမှားများ
    intro:
      en: In a stressful moment, simple mistakes can delay help. Keep the rule simple.
      ko: 긴장한 상황에서는 작은 실수로 도움이 늦어질 수 있습니다. 기준을 간단히 기억하세요.
      my: စိတ်ဖိစီးနေသောအချိန်တွင် အမှားသေးသေးလေးကြောင့် အကူအညီရောက်ရန် နောက်ကျနိုင်ပါသည်။ စည်းမျဉ်းကို ရိုးရိုးလေးမှတ်ထားပါ။
    items:
      - icon: shield
        title:
          en: Do not call 1345 first for danger
          ko: 위험할 때 1345를 먼저 누르지 않기
          my: အန္တရာယ်ရှိချိန်တွင် 1345 ကို အရင်မခေါ်ပါနှင့်
        body:
          en: 1345 is helpful for immigration and interpretation, but for danger, crime, fire, or ambulance, call 112 or 119 first.
          ko: 1345는 출입국과 통역에 도움이 되지만, 위험·범죄·화재·구급차 상황에서는 먼저 112 또는 119로 연락하세요.
          my: 1345 သည် လူဝင်မှုကြီးကြပ်ရေးနှင့် ဘာသာပြန်အတွက် အသုံးဝင်သော်လည်း အန္တရာယ်၊ ရာဇဝတ်မှု၊ မီးလောင်ခြင်း သို့မဟုတ် လူနာတင်ကားလိုသည့်အခါ 112 သို့မဟုတ် 119 ကို အရင်ခေါ်ပါ။
        href: ""
      - icon: search
        title:
          en: Do not forget the location
          ko: 위치를 빠뜨리지 않기
          my: နေရာကို မမေ့ပါနှင့်
        body:
          en: Help can only come quickly if the operator knows where to send it. If you do not know the address, use nearby signs, store names, or map GPS.
          ko: 출동 위치를 알아야 빠르게 도착할 수 있습니다. 주소를 모르면 주변 표지판, 가게 이름, 지도 GPS를 이용하세요.
          my: အကူအညီကို မြန်မြန်ရောက်စေချင်လျှင် Operator က ဘယ်နေရာသို့လာရမလဲ သိရပါမည်။ လိပ်စာမသိပါက အနီးရှိဆိုင်းဘုတ်၊ ဆိုင်နာမည် သို့မဟုတ် Map GPS ကို သုံးပါ။
        href: ""
      - icon: health
        title:
          en: Do not move an injured person without reason
          ko: 다친 사람을 함부로 옮기지 않기
          my: ဒဏ်ရာရသူကို မလိုအပ်ဘဲ မရွှေ့ပါနှင့်
        body:
          en: If there is serious injury, call 119 and follow the operator's instructions. Move the person only when staying there is more dangerous.
          ko: 큰 부상이 있으면 119에 연락하고 상담원의 지시를 따르세요. 그 자리에 있는 것이 더 위험할 때만 옮기세요.
          my: ပြင်းထန်ဒဏ်ရာရှိပါက 119 ကို ခေါ်ပြီး Operator ၏ညွှန်ကြားချက်ကို လိုက်နာပါ။ ထိုနေရာတွင် ဆက်နေခြင်းက ပိုအန္တရာယ်ရှိမှသာ ရွှေ့ပါ။
        href: ""
  - icon: external
    title:
      en: Where to confirm officially
      ko: 공식적으로 확인할 곳
      my: တရားဝင်စစ်ဆေးနိုင်သောနေရာ
    intro:
      en: Phone numbers and support details can change, so check official pages when you prepare your own emergency list.
      ko: 전화번호와 지원 내용은 바뀔 수 있으므로 본인 비상연락처 목록을 만들 때 공식 페이지를 확인하세요.
      my: ဖုန်းနံပါတ်နှင့် အကူအညီပေးသည့်အကြောင်းအရာများ ပြောင်းနိုင်သောကြောင့် ကိုယ့်အရေးပေါ်နံပါတ်စာရင်း ပြင်ထားချိန်တွင် တရားဝင်စာမျက်နှာများကို စစ်ပါ။
    items:
      - icon: external
        title:
          en: VisitKorea emergency situations
          ko: VisitKorea 긴급상황 안내
          my: VisitKorea အရေးပေါ်အချက်အလက်
        body:
          en: Official Korea Tourism Organization page for emergency calls, 1330, 182, and traveler support information.
          ko: 긴급전화, 1330, 182와 여행자 지원 정보를 확인할 수 있는 한국관광공사 공식 페이지입니다.
          my: အရေးပေါ်ဖုန်း၊ 1330၊ 182 နှင့် ခရီးသွားအကူအညီအချက်အလက်များကို စစ်နိုင်သော Korea Tourism Organization ၏တရားဝင်စာမျက်နှာဖြစ်ပါသည်။
        href: https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140042
      - icon: external
        title:
          en: Disaster safety services for international visitors
          ko: 외국인 방문객 재난안전 서비스
          my: နိုင်ငံခြားသားများအတွက် ဘေးအန္တရာယ်ကင်းရှင်းရေးအချက်အလက်
        body:
          en: VisitKorea explains emergency reporting, interpretation requests, and safety apps for international visitors.
          ko: 외국인 방문객을 위한 긴급 신고, 통역 요청과 안전 앱 정보를 안내합니다.
          my: နိုင်ငံခြားသားဧည့်သည်များအတွက် အရေးပေါ်တိုင်ကြားခြင်း၊ ဘာသာပြန်တောင်းခြင်းနှင့် Safety App အချက်အလက်များကို ဖော်ပြထားပါသည်။
        href: https://english.visitkorea.or.kr/svc/contents/contentsView.do?menuSn=217&vcontsId=248145
      - icon: external
        title:
          en: Immigration Contact Center 1345
          ko: 외국인종합안내센터 1345
          my: 1345 လူဝင်မှုကြီးကြပ်ရေး အကူအညီ
        body:
          en: Official Korea Immigration Service page for 1345 service hours, language support, and interpretation service details.
          ko: 1345 상담시간, 언어 지원, 통역서비스를 확인할 수 있는 출입국·외국인정책본부 공식 페이지입니다.
          my: 1345 ဝန်ဆောင်ချိန်၊ ဘာသာစကားအကူအညီနှင့် ဘာသာပြန်ဝန်ဆောင်မှုအသေးစိတ်ကို စစ်နိုင်သော Korea Immigration Service ၏တရားဝင်စာမျက်နှာဖြစ်ပါသည်။
        href: https://www.immigration.go.kr/immigration_eng/1862/subview.do
      - icon: external
        title:
          en: LOST112
          ko: 경찰청 유실물 통합포털
          my: LOST112 ပစ္စည်းပျောက်စစ်ရန်
        body:
          en: Official police lost-and-found portal for checking lost items.
          ko: 분실물을 확인할 수 있는 경찰청 유실물 통합포털입니다.
          my: ပစ္စည်းပျောက်များကို စစ်နိုင်သော ရဲတပ်ဖွဲ့၏ တရားဝင်ပစ္စည်းပျောက် Portal ဖြစ်ပါသည်။
        href: https://www.lost112.go.kr/
