entryTitle: Employment contract and pay information
category: jobs
order: 40
lastReviewed: 2026-07-28
title:
  en: Employment contract & pay information
  ko: 근로계약·급여 정보
  my: အလုပ်ခန့်စာချုပ်နှင့် လစာ အချက်အလက်
description:
  en: A practical checklist for comparing job conditions, reviewing your written contract, and checking pay records after payday.
  ko: 일을 시작하기 전 근로조건부터 서면 계약서, 급여명세서와 실제 입금 내역까지 순서대로 확인할 수 있게 정리했습니다.
  my: အလုပ်မစမီ အလုပ်အခြေအနေများ၊ စာဖြင့်ရေးထားသော စာချုပ်၊ လစာရှင်းတမ်းနှင့် အမှန်တကယ်ငွေဝင်မှုတို့ကို အစဉ်လိုက်စစ်ဆေးနိုင်ရန် စုစည်းထားပါသည်။
sections:
  - icon: search
    title:
      en: Check before you start work
      ko: 일을 시작하기 전에 확인하기
      my: အလုပ်မစမီ စစ်ဆေးရန်
    intro:
      en: Compare the job posting, messages, and verbal explanation. Ask for unclear conditions in writing before your first shift.
      ko: 채용공고, 메시지와 구두 설명을 서로 비교하세요. 분명하지 않은 조건은 첫 근무 전에 서면으로 다시 확인합니다.
      my: အလုပ်ကြော်ငြာ၊ မက်ဆေ့ချ်နှင့် နှုတ်ဖြင့်ရှင်းပြချက်တို့ကို အချင်းချင်းနှိုင်းယှဉ်ပါ။ မရှင်းလင်းသော အခြေအနေများကို ပထမအလုပ်ချိန်မတိုင်မီ စာဖြင့် ပြန်လည်အတည်ပြုပါ။
    items:
      - icon: jobs
        title:
          en: Duties and workplace
          ko: 업무와 근무지
          my: အလုပ်တာဝန်နှင့် အလုပ်နေရာ
        body:
          en: Confirm the actual duties and workplace address. If work at another branch or a changing location is possible, ask when and how you will be notified and keep the posting and messages.
          ko: 실제 담당 업무와 근무지 주소를 확인합니다. 다른 지점 지원이나 장소 변경 가능성이 있다면 언제, 어떤 방식으로 안내받는지도 묻고 공고와 메시지를 보관하세요.
          my: တကယ်လုပ်ရမည့်တာဝန်နှင့် အလုပ်နေရာလိပ်စာကို စစ်ဆေးပါ။ အခြားဆိုင်ခွဲသို့ သွားရနိုင်ခြင်း သို့မဟုတ် နေရာပြောင်းနိုင်ခြင်းရှိပါက မည်သည့်အချိန်၊ မည်သို့ အသိပေးမည်ကို မေးပြီး ကြော်ငြာနှင့် မက်ဆေ့ချ်များကို သိမ်းထားပါ။
        href: ""
      - icon: daily
        title:
          en: Days, hours, and breaks
          ko: 근무일·시간·휴게
          my: အလုပ်ရက်၊ အချိန်နှင့် နားချိန်
        body:
          en: Check start and finish times, working days, and when you can actually take a break. If shifts, weekends, or extra work may occur, also confirm how schedules are announced and working time is recorded.
          ko: 출퇴근 시각, 근무 요일과 실제로 쉴 수 있는 휴게시간을 확인합니다. 교대·주말·추가근무 가능성이 있다면 일정 통보와 근무시간 기록 방식도 함께 살펴보세요.
          my: အလုပ်စတင်ပြီးဆုံးချိန်၊ အလုပ်ရက်နှင့် အမှန်တကယ်နားနိုင်သည့်အချိန်ကို စစ်ဆေးပါ။ အလှည့်ကျ၊ ပိတ်ရက် သို့မဟုတ် အပိုအလုပ်ရှိနိုင်ပါက အချိန်ဇယားအသိပေးပုံနှင့် အလုပ်ချိန်မှတ်တမ်းတင်ပုံကိုလည်း မေးပါ။
        href: ""
      - icon: doc
        title:
          en: Pay and contract period
          ko: 급여와 계약기간
          my: လစာနှင့် စာချုပ်ကာလ
        body:
          en: Check whether pay is hourly, daily, or monthly, which allowances are separate, whether the amount is before deductions, and the pay date and method. Review the contract and probation periods and the conditions that apply during each.
          ko: 시급·일급·월급 중 계산 기준, 별도 수당, 공제 전 금액인지 여부와 지급일·방법을 확인합니다. 계약기간과 수습기간이 있다면 각 기간의 업무와 급여 조건도 따로 살펴보세요.
          my: လစာကို နာရီ၊ နေ့ သို့မဟုတ် လအလိုက်တွက်ခြင်း၊ သီးခြားထောက်ပံ့ကြေးများ၊ ဖြတ်တောက်မှုမတိုင်မီ ပမာဏဟုတ်မဟုတ်နှင့် ပေးချေရက်၊ နည်းလမ်းကို စစ်ဆေးပါ။ စာချုပ်ကာလနှင့် စမ်းသပ်ကာလရှိပါက ကာလတစ်ခုစီ၏ အလုပ်နှင့်လစာအခြေအနေကို သီးခြားကြည့်ပါ။
        href: ""
  - icon: doc
    title:
      en: Review the written contract
      ko: 서면 계약서 확인하기
      my: စာဖြင့်ရေးထားသော စာချုပ်ကို စစ်ဆေးရန်
    intro:
      en: Read the full document before signing. Make sure the written terms match what you understood and keep your own completed copy.
      ko: 서명하기 전에 문서 전체를 읽고, 적힌 조건이 앞서 이해한 내용과 같은지 확인하세요. 작성이 끝난 본인용 사본도 보관합니다.
      my: လက်မှတ်မထိုးမီ စာရွက်စာတမ်းတစ်ခုလုံးကို ဖတ်ပြီး ရေးထားသောအခြေအနေများသည် သင်နားလည်ထားသည့်အရာနှင့် ကိုက်ညီမှုရှိမရှိ စစ်ဆေးပါ။ ပြည့်စုံသော မိမိမိတ္တူကိုလည်း သိမ်းထားပါ။
    items:
      - icon: check
        title:
          en: Compare every core condition
          ko: 핵심 근로조건 비교
          my: အဓိကအလုပ်အခြေအနေများကို နှိုင်းယှဉ်ပါ
        body:
          en: Check the business name, duties, workplace, contract period, working hours, days off, and the composition, calculation, and payment method of wages. Compare each item with the posting and explanation you received.
          ko: 사업장 명칭, 업무, 근무지, 계약기간, 근로시간, 휴일과 임금의 구성·계산·지급 방법을 확인합니다. 공고와 앞서 받은 설명을 항목별로 비교하세요.
          my: လုပ်ငန်းအမည်၊ တာဝန်၊ အလုပ်နေရာ၊ စာချုပ်ကာလ၊ အလုပ်ချိန်၊ နားရက်နှင့် လစာဖွဲ့စည်းပုံ၊ တွက်ချက်ပုံ၊ ပေးချေပုံကို စစ်ဆေးပါ။ အချက်တစ်ခုစီကို ကြော်ငြာနှင့် ရရှိထားသောရှင်းပြချက်တို့နှင့် နှိုင်းယှဉ်ပါ။
        href: ""
      - icon: help
        title:
          en: Clarify blanks and different terms
          ko: 빈칸과 다른 설명 확인
          my: ကွက်လပ်နှင့် ကွဲပြားသောအချက်များကို စစ်ဆေးပါ
        body:
          en: Ask for an explanation or correction before signing any blank, unreadable, or unfamiliar part. If a spoken promise is missing or different, confirm which written condition will actually apply.
          ko: 비어 있거나 읽기 어렵고 이해되지 않는 부분은 서명 전에 설명과 수정을 요청합니다. 말로 들은 약속이 빠졌거나 다르다면 실제 적용될 조건을 서면으로 확인하세요.
          my: ကွက်လပ်၊ ဖတ်မရသော သို့မဟုတ် နားမလည်သောအပိုင်းရှိပါက လက်မှတ်မထိုးမီ ရှင်းပြခြင်းနှင့် ပြင်ဆင်ခြင်းကို တောင်းပါ။ နှုတ်ကတိမပါဝင်ခြင်း သို့မဟုတ် ကွဲပြားခြင်းရှိပါက အမှန်တကယ်သက်ရောက်မည့် စာဖြင့်အခြေအနေကို အတည်ပြုပါ။
        href: ""
      - icon: external
        title:
          en: Official employment-contract guide
          ko: 고용노동부 근로계약 안내
          my: အလုပ်သမားဝန်ကြီးဌာန၏ အလုပ်စာချုပ်လမ်းညွှန်
        body:
          en: Use the Ministry of Employment and Labor guide to see the main fields in a standard written contract. MyanMate does not interpret or complete a contract for you.
          ko: 표준 서면 계약서에 들어가는 주요 항목은 고용노동부 공식 안내에서 확인하세요. MyanMate는 계약 내용을 판단하거나 작성하지 않습니다.
          my: စံစာဖြင့်အလုပ်စာချုပ်တွင် ပါဝင်သော အဓိကအချက်များကို အလုပ်သမားဝန်ကြီးဌာန၏ တရားဝင်လမ်းညွှန်တွင် စစ်ဆေးပါ။ MyanMate သည် စာချုပ်အကြောင်းအရာကို ဆုံးဖြတ်ခြင်း သို့မဟုတ် ရေးသားခြင်းမပြုပါ။
        href: https://www.moel.go.kr/mainpop2.do
  - icon: list
    title:
      en: Check after you are paid
      ko: 급여를 받은 뒤 확인하기
      my: လစာရပြီးနောက် စစ်ဆေးရန်
    intro:
      en: Compare the pay statement, your own working-time record, and the bank deposit for the same pay period. Keep the records together.
      ko: 같은 급여 산정기간의 급여명세서, 본인 근무기록과 실제 입금액을 서로 비교하세요. 관련 기록은 한곳에 모아 보관합니다.
      my: တူညီသောလစာတွက်ကာလအတွက် လစာရှင်းတမ်း၊ မိမိအလုပ်ချိန်မှတ်တမ်းနှင့် ဘဏ်ငွေဝင်ပမာဏကို နှိုင်းယှဉ်ပါ။ သက်ဆိုင်ရာမှတ်တမ်းများကို တစ်နေရာတည်းတွင် သိမ်းထားပါ။
    items:
      - icon: search
        title:
          en: Read the pay statement
          ko: 급여명세서 읽기
          my: လစာရှင်းတမ်းကို ဖတ်ပါ
        body:
          en: Check the pay period and date, total pay, basic pay and allowances, calculation method, deductions, and final amount. If you worked extra, night, or holiday hours, compare the recorded hours and displayed calculation without assuming the result.
          ko: 산정기간과 지급일, 총액, 기본급·수당, 계산 방법, 공제와 최종 지급액을 확인합니다. 추가·야간·휴일근무가 있었다면 기록된 시간과 계산 내역을 함께 비교하되 적용 여부를 임의로 단정하지 마세요.
          my: လစာတွက်ကာလနှင့် ပေးချေရက်၊ စုစုပေါင်း၊ အခြေခံလစာနှင့် ထောက်ပံ့ကြေး၊ တွက်ချက်ပုံ၊ ဖြတ်တောက်မှုနှင့် နောက်ဆုံးပမာဏကို စစ်ဆေးပါ။ အပို၊ ည သို့မဟုတ် ပိတ်ရက်အလုပ်ရှိပါက မှတ်တမ်းတင်ထားသောအချိန်နှင့် တွက်ချက်မှုကို နှိုင်းယှဉ်ပြီး ကိုယ်တိုင်အဆုံးအဖြတ်မချပါနှင့်။
        href: ""
      - icon: list
        title:
          en: Keep records that can be compared
          ko: 비교할 수 있는 기록 보관
          my: နှိုင်းယှဉ်နိုင်သော မှတ်တမ်းများကို သိမ်းပါ
        body:
          en: Keep the contract, pay statements, deposits, attendance or shift records, and messages about changed conditions. If an amount differs, first ask for the calculation basis and note the answer and date.
          ko: 계약서, 급여명세서, 입금내역, 출퇴근·교대표와 조건 변경 메시지를 함께 보관합니다. 금액이 다르면 먼저 계산 근거를 묻고 답변과 날짜를 기록하세요.
          my: စာချုပ်၊ လစာရှင်းတမ်း၊ ငွေဝင်မှတ်တမ်း၊ တက်ဆင်းချိန် သို့မဟုတ် အလှည့်ကျဇယားနှင့် အခြေအနေပြောင်းလဲမှု မက်ဆေ့ချ်များကို အတူသိမ်းပါ။ ပမာဏကွာပါက တွက်ချက်မှုအခြေခံကို အရင်မေးပြီး အဖြေနှင့်ရက်စွဲကို မှတ်ပါ။
        href: ""
      - icon: external
        title:
          en: Ask through an official labor channel
          ko: 공식 노동 상담 확인
          my: တရားဝင်အလုပ်သမားအကြံပေးလမ်းကြောင်း
        body:
          en: If an explanation is unavailable or unpaid wages are suspected, organize the facts and dates and contact the Ministry of Employment and Labor’s Labor Portal or 1350 yourself. MyanMate does not decide whether a violation occurred or handle a complaint.
          ko: 설명을 받지 못했거나 임금 미지급이 의심되면 사실과 날짜를 정리해 노동포털 또는 고용노동부 1350에 직접 문의하세요. MyanMate는 위법 여부를 판단하거나 민원을 처리하지 않습니다.
          my: ရှင်းပြချက်မရခြင်း သို့မဟုတ် လစာမပေးမှုကို သံသယရှိပါက အချက်အလက်နှင့်ရက်စွဲများကို စုစည်းပြီး အလုပ်သမား Portal သို့မဟုတ် အလုပ်သမားဝန်ကြီးဌာန 1350 ကို ကိုယ်တိုင်ဆက်သွယ်ပါ။ MyanMate သည် ဥပဒေချိုးဖောက်မှုကို ဆုံးဖြတ်ခြင်း သို့မဟုတ် တိုင်ကြားမှုကို ကိုင်တွယ်ခြင်းမပြုပါ။
        href: https://labor.moel.go.kr/minwonSysInfo/wagesolway.do
