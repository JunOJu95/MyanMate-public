entryTitle: Public transportation
category: daily
order: 40
lastReviewed: 2026-07-30
title:
  en: Public transportation in Korea
  ko: 한국 대중교통 이용하기
  my: ကိုရီးယား အများသုံးယာဉ်စီးနည်း
description:
  en: Public transportation in Korea is useful once you understand cards, transfers, route apps, and a few basic habits. Check what to prepare before using buses, subways, airport trains, and taxis.
  ko: 한국 대중교통은 교통카드, 환승, 길찾기 앱과 기본 이용 습관을 알면 편리하게 이용할 수 있습니다. 버스, 지하철, 공항철도와 택시를 이용하기 전 확인할 내용을 정리했습니다.
  my: ကိုရီးယားမှာ ဘတ်စ်ကား၊ မြေအောက်ရထား၊ လေဆိပ်ရထားနှင့် တက္ကစီတွေကို သုံးရတာ လွယ်ကူပါသည်။ သို့သော် ယာဉ်စီးကတ်၊ ပြောင်းစီးခြင်း၊ လမ်းကြောင်းရှာ App နှင့် အခြေခံအသုံးပြုနည်းများကို အရင်သိထားလျှင် ပိုမိုအဆင်ပြေပါသည်။
sections:
  - icon: transit
    title:
      en: Main types of public transportation
      ko: 대중교통의 주요 종류
      my: အများသုံးယာဉ် အမျိုးအစားများ
    intro:
      en: Korea has several public transportation options. For daily life, most people use subway, bus, transportation card, route apps, and sometimes taxi or train depending on distance.
      ko: 한국에는 여러 종류의 대중교통이 있습니다. 일상생활에서는 지하철, 버스, 교통카드, 길찾기 앱을 주로 쓰고, 거리와 상황에 따라 택시나 기차도 이용합니다.
      my: ကိုရီးယားတွင် အများသုံးယာဉ်အမျိုးအစားများစွာ ရှိပါသည်။ နေ့စဉ်သွားလာရာတွင် အများအားဖြင့် မြေအောက်ရထား၊ ဘတ်စ်ကား၊ ယာဉ်စီးကတ်နှင့် လမ်းကြောင်းရှာ App ကို သုံးကြပြီး အကွာအဝေးနှင့် အခြေအနေအလိုက် တက္ကစီ သို့မဟုတ် ရထားကိုလည်း သုံးနိုင်ပါသည်။
    items:
      - icon: transit
        title:
          en: Subway and metro
          ko: 지하철
          my: မြေအောက်ရထား
        body:
          en: Useful for moving around big cities such as Seoul, Incheon, Busan, Daegu, Daejeon, and Gwangju. Check the line, direction, transfer station, and exit number before moving.
          ko: 서울, 인천, 부산, 대구, 대전, 광주 같은 큰 도시에서 이동할 때 유용합니다. 노선, 방향, 환승역과 출구 번호를 확인하세요.
          my: Seoul၊ Incheon၊ Busan၊ Daegu၊ Daejeon၊ Gwangju စသော မြို့ကြီးများတွင် သွားလာရာ၌ အသုံးများပါသည်။ ရထားလိုင်း၊ ဦးတည်ရာ၊ ပြောင်းစီးရမည့်ဘူတာနှင့် ထွက်ပေါက်နံပါတ်ကို စစ်ပါ။
        href: ""
      - icon: list
        title:
          en: City bus
          ko: 시내버스
          my: မြို့တွင်းဘတ်စ်ကား
        body:
          en: Good for places that are not close to a subway station. Check the bus number, direction, stop name, and tap your card when getting on and off.
          ko: 지하철역에서 멀리 있는 곳을 갈 때 편리합니다. 버스 번호, 방향, 정류장 이름을 확인하고 탈 때와 내릴 때 카드를 태그하세요.
          my: မြေအောက်ရထားဘူတာနှင့် မနီးသောနေရာများသို့ သွားရာတွင် အသုံးဝင်ပါသည်။ ဘတ်စ်ကားနံပါတ်၊ ဦးတည်ရာ၊ မှတ်တိုင်နာမည်ကို စစ်ပြီး စီးချိန်နှင့် ဆင်းချိန်တွင် ကတ်ထိပါ။
        href: ""
      - icon: external
        title:
          en: Airport train and airport bus
          ko: 공항철도와 공항버스
          my: လေဆိပ်ရထားနှင့် လေဆိပ်ဘတ်စ်ကား
        body:
          en: Useful when going between the airport and the city. Check whether your route is an all-stop train, express train, airport bus, or city bus because travel time and payment can differ.
          ko: 공항과 시내를 오갈 때 이용합니다. 일반열차, 직통열차, 공항버스, 시내버스 중 어떤 경로인지에 따라 시간과 결제 방식이 다를 수 있습니다.
          my: လေဆိပ်နှင့် မြို့အတွင်းကို သွားလာရာတွင် အသုံးများပါသည်။ ရပ်တိုင်းရထား၊ အမြန်ရထား၊ လေဆိပ်ဘတ်စ်ကား သို့မဟုတ် မြို့တွင်းဘတ်စ်ကားလားကို စစ်ပါ။ ကြာချိန်နှင့် ငွေပေးချေမှုကွာနိုင်ပါသည်။
        href: ""
      - icon: doc
        title:
          en: Intercity or express bus
          ko: 시외버스와 고속버스
          my: မြို့အကြားဘတ်စ်ကားနှင့် အဝေးပြေးဘတ်စ်ကား
        body:
          en: Used for traveling between cities. Usually you need to check the terminal, departure time, seat, destination terminal, and whether the ticket must be booked in advance.
          ko: 도시 사이를 이동할 때 이용합니다. 터미널, 출발 시간, 좌석, 도착 터미널과 예매 필요 여부를 확인하세요.
          my: မြို့တစ်မြို့မှ အခြားမြို့သို့ သွားရာတွင် အသုံးပြုပါသည်။ Terminal၊ ထွက်ချိန်၊ ထိုင်ခုံ၊ ရောက်မည့် Terminal နှင့် ကြိုတင်လက်မှတ်ဝယ်ရန်လိုမလိုကို စစ်ပါ။
        href: ""
      - icon: search
        title:
          en: Train and KTX
          ko: 기차와 KTX
          my: ရထားနှင့် KTX
        body:
          en: Useful for longer-distance travel between cities. Check the station name carefully because some cities have more than one train station.
          ko: 도시 간 장거리 이동에 유용합니다. 일부 도시는 기차역이 여러 곳일 수 있으므로 역 이름을 정확히 확인하세요.
          my: မြို့အကြား အကွာအဝေးရှည် သွားရာတွင် အသုံးဝင်ပါသည်။ မြို့အချို့တွင် ရထားဘူတာအများကြီးရှိနိုင်သောကြောင့် ဘူတာနာမည်ကို သေချာစစ်ပါ။
        href: ""
      - icon: shield
        title:
          en: Taxi and public bike
          ko: 택시와 공공자전거
          my: တက္ကစီနှင့် အများသုံးစက်ဘီး
        body:
          en: Taxi is useful late at night or when carrying luggage. Public bikes can be useful for short trips in some cities, but check local rules, payment, and return stations first.
          ko: 택시는 늦은 시간이나 짐이 많을 때 편리합니다. 공공자전거는 일부 도시에서 짧은 이동에 유용하지만 이용 규칙, 결제와 반납 장소를 먼저 확인하세요.
          my: တက္ကစီသည် ညနောက်ကျချိန် သို့မဟုတ် ပစ္စည်းများများသယ်သည့်အခါ အသုံးဝင်ပါသည်။ အများသုံးစက်ဘီးသည် မြို့အချို့တွင် အကွာအဝေးတိုသွားရာတွင် အသုံးဝင်နိုင်သော်လည်း စည်းကမ်း၊ ငွေပေးချေမှုနှင့် ပြန်အပ်ရမည့်နေရာကို အရင်စစ်ပါ။
        href: ""
  - icon: daily
    title:
      en: How to pay for public transportation
      ko: 대중교통 요금 결제 방법
      my: ခရီးစရိတ် ဘယ်လိုပေးရလဲ
    intro:
      en: Payment depends on the transport type. For everyday buses and subways, a transportation card is the easiest. For long-distance buses, trains, and KTX, you usually need a separate ticket.
      ko: 결제 방법은 교통수단에 따라 다릅니다. 일상적인 버스와 지하철은 교통카드가 가장 편하고, 시외버스·기차·KTX는 보통 별도 승차권이 필요합니다.
      my: ခရီးစရိတ်ပေးနည်းသည် ယာဉ်အမျိုးအစားအလိုက် ကွာပါသည်။ နေ့စဉ်သုံး ဘတ်စ်ကားနှင့် မြေအောက်ရထားအတွက် ယာဉ်စီးကတ်က အလွယ်ဆုံးဖြစ်ပြီး မြို့အကြားဘတ်စ်ကား၊ ရထားနှင့် KTX တို့အတွက်တော့ များသောအားဖြင့် သီးခြားလက်မှတ်ဝယ်ရန်လိုပါသည်။
    items:
      - icon: check
        title:
          en: Transportation card
          ko: 교통카드 결제
          my: ယာဉ်စီးကတ်ဖြင့် ပေးခြင်း
        body:
          en: Tmoney, Cashbee, and similar cards are common for buses and subways. Add balance first, then tap the card when entering and exiting.
          ko: 티머니, 캐시비 등 교통카드는 버스와 지하철에서 많이 사용합니다. 먼저 금액을 충전한 뒤 탈 때와 내릴 때 카드를 태그하세요.
          my: Tmoney၊ Cashbee စသော ယာဉ်စီးကတ်များကို ဘတ်စ်ကားနှင့် မြေအောက်ရထားတွင် အသုံးများပါသည်။ အရင်ငွေဖြည့်ထားပြီး စီးချိန်နှင့် ဆင်းချိန်တွင် ကတ်ကို ထိပါ။
        href: ""
      - icon: doc
        title:
          en: Bank or credit card with transit function
          ko: 후불교통 기능이 있는 카드
          my: ယာဉ်စီးခပေးနိုင်သော ဘဏ်ကတ်
        body:
          en: Some Korean debit or credit cards include a transportation-payment function. It must be enabled by the bank or card company, so do not assume every bank card works.
          ko: 일부 한국 체크카드나 신용카드에는 후불교통 기능이 있습니다. 은행이나 카드사에서 기능이 설정되어 있어야 하므로 모든 카드가 되는 것은 아닙니다.
          my: ကိုရီးယားဘဏ်ကတ် သို့မဟုတ် ခရက်ဒစ်ကတ်အချို့တွင် ယာဉ်စီးခပေးနိုင်သော function ပါနိုင်ပါသည်။ ဘဏ် သို့မဟုတ် ကတ်ကုမ္ပဏီဘက်မှ ဖွင့်ထားရသောကြောင့် ဘဏ်ကတ်တိုင်း သုံးနိုင်မည်ဟု မယူဆပါနှင့်။
        href: ""
      - icon: phone
        title:
          en: Mobile transportation card
          ko: 모바일 교통카드
          my: မိုဘိုင်းယာဉ်စီးကတ်
        body:
          en: Some phones and payment apps can work as a transportation card. Availability depends on phone type, NFC setting, app, payment method, and local service support.
          ko: 일부 휴대폰과 결제 앱은 교통카드처럼 사용할 수 있습니다. 휴대폰 종류, NFC 설정, 앱, 결제수단과 서비스 지원 여부에 따라 달라집니다.
          my: ဖုန်းအချို့နှင့် ငွေပေးချေ App အချို့ကို ယာဉ်စီးကတ်လို သုံးနိုင်ပါသည်။ ဖုန်းအမျိုးအစား၊ NFC setting၊ App၊ ငွေပေးချေမည့်နည်းလမ်းနှင့် ဝန်ဆောင်မှုထောက်ပံ့မှုအလိုက် ကွာနိုင်ပါသည်။
        href: ""
      - icon: list
        title:
          en: Single-use ticket
          ko: 1회용 승차권
          my: တစ်ခါစီးလက်မှတ်
        body:
          en: Single-use tickets are mainly for subway rides and are not a general replacement for bus payment. For daily life, a transportation card is usually easier.
          ko: 1회용 승차권은 주로 지하철 이용에 쓰이며 버스 결제의 일반적인 대체수단은 아닙니다. 일상생활에서는 교통카드가 보통 더 편합니다.
          my: တစ်ခါစီးလက်မှတ်သည် အများအားဖြင့် မြေအောက်ရထားအတွက် သုံးပါသည်။ ဘတ်စ်ကားငွေပေးချေခြင်းကို အစားထိုးသုံးနိုင်သော နည်းလမ်းအဖြစ် မယူဆသင့်ပါ။ နေ့စဉ်သွားလာရာတွင် ယာဉ်စီးကတ်က ပိုလွယ်ပါသည်။
        href: ""
      - icon: shield
        title:
          en: Taxi payment
          ko: 택시 결제
          my: တက္ကစီငွေပေးချေခြင်း
        body:
          en: Taxis usually support card payment, and some taxis accept transportation cards if there is enough balance. If you use a taxi app, check whether payment is made inside the app or inside the taxi.
          ko: 택시는 보통 카드 결제가 가능하며, 일부 택시는 잔액이 충분한 교통카드도 사용할 수 있습니다. 택시 앱을 쓰는 경우 앱 결제인지 차량 내 결제인지 확인하세요.
          my: တက္ကစီများတွင် များသောအားဖြင့် ကတ်ဖြင့်ပေးချေနိုင်ပါသည်။ တက္ကစီအချို့တွင် လက်ကျန်ငွေလုံလောက်သော ယာဉ်စီးကတ်ဖြင့်လည်း ပေးနိုင်ပါသည်။ တက္ကစီ App သုံးပါက App ထဲတွင်ပေးရမလား၊ ကားထဲတွင်ပေးရမလားကို စစ်ပါ။
        href: ""
  - icon: daily
    title:
      en: Cards and passes people actually use
      ko: 실제로 많이 쓰는 카드와 패스
      my: ကိုရီးယားမှာ အသုံးများသော ကတ်နှင့် Pass များ
    intro:
      en: These are not all the same. Some are basic rechargeable cards, some are fare refund benefits, and some are tourist-focused passes. Pick based on how long you stay and how often you ride.
      ko: 모두 같은 종류의 카드는 아닙니다. 어떤 것은 기본 충전식 교통카드이고, 어떤 것은 교통비 환급 혜택, 어떤 것은 여행객용 패스입니다. 체류 기간과 이용 빈도에 맞게 선택하세요.
      my: အောက်ပါကတ်များသည် အမျိုးအစားတူ မဟုတ်ပါ။ အချို့သည် အခြေခံငွေဖြည့်ယာဉ်စီးကတ်၊ အချို့သည် ခရီးစရိတ်ပြန်အမ်းအကျိုးခံစားခွင့်၊ အချို့သည် ခရီးသွားများအတွက် Pass ဖြစ်ပါသည်။ ကိုယ်ဘယ်လောက်ကြာကြာနေမလဲ၊ ဘယ်လောက်မကြာခဏစီးမလဲအလိုက် ရွေးပါ။
    items:
      - icon: check
        title:
          en: Tmoney and Cashbee/EZL
          ko: 티머니와 캐시비/EZL
          my: Tmoney နှင့် Cashbee/EZL
        body:
          en: These are basic rechargeable transportation cards. They are useful for buses and subways and can be bought or reloaded at many convenience stores and station machines.
          ko: 기본 충전식 교통카드입니다. 버스와 지하철 이용에 편하고 여러 편의점과 역 충전기에서 구매하거나 충전할 수 있습니다.
          my: ဤကတ်များသည် အခြေခံငွေဖြည့်သုံးသော ယာဉ်စီးကတ်များဖြစ်ပါသည်။ ဘတ်စ်ကားနှင့် မြေအောက်ရထားအတွက် အသုံးဝင်ပြီး Convenience store များနှင့် ဘူတာစက်များတွင် ဝယ်ခြင်း၊ ငွေဖြည့်ခြင်း လုပ်နိုင်ပါသည်။
        href: ""
      - icon: doc
        title:
          en: K-Pass / All K-Pass
          ko: K-패스 / 모두의카드
          my: K-Pass / All K-Pass
        body:
          en: K-Pass is not just a normal recharge card. It is a public-transport fare refund benefit for regular users. Registration, age, residence area, own-name verification, and card registration can apply, so foreign residents should confirm eligibility before choosing it.
          ko: K-패스는 단순 충전식 교통카드가 아니라 정기적으로 대중교통을 이용하는 사람을 위한 교통비 환급 혜택입니다. 연령, 거주지, 본인확인, 카드 등록 조건이 적용될 수 있으므로 외국인 거주자는 가입 가능 여부를 먼저 확인하세요.
          my: K-Pass သည် ပုံမှန်ငွေဖြည့်ယာဉ်စီးကတ်တစ်ခုမျှသာ မဟုတ်ပါ။ အများသုံးယာဉ်ကို ပုံမှန်စီးသူများအတွက် ခရီးစရိတ်ပြန်အမ်းအကျိုးခံစားခွင့်ဖြစ်ပါသည်။ အသက်၊ နေထိုင်ရာဒေသ၊ ကိုယ်တိုင်အတည်ပြုခြင်းနှင့် ကတ်စာရင်းသွင်းခြင်း စသည့်လိုအပ်ချက်များရှိနိုင်သောကြောင့် နိုင်ငံခြားသားနေထိုင်သူများသည် သုံးနိုင်မနိုင်ကို အရင်စစ်ပါ။
        href: https://korea-pass.kr/info/intro.do
      - icon: daily
        title:
          en: Climate Card
          ko: 기후동행카드
          my: Climate Card
        body:
          en: Climate Card is mainly for Seoul-area public transportation. Short-term passes can still be useful for visitors or people who move mostly inside Seoul. Because the 30-day prepaid type has changed, check the current pass type and coverage before buying or recharging.
          ko: 기후동행카드는 주로 서울권 대중교통 이용을 위한 카드입니다. 단기권은 여행자나 서울 안에서 주로 이동하는 사람에게 유용할 수 있습니다. 30일 선불권 운영 방식은 변경되었으므로 구매나 충전 전 현재 이용 가능한 권종과 범위를 확인하세요.
          my: Climate Card သည် အဓိကအားဖြင့် Seoul အတွင်း အများသုံးယာဉ်သုံးရန် ရည်ရွယ်ထားသော ကတ်ဖြစ်ပါသည်။ Seoul ထဲမှာ အများဆုံးသွားလာသူများ သို့မဟုတ် ခဏလာသူများအတွက် Short-term pass များက အသုံးဝင်နိုင်ပါသည်။ 30-day prepaid အမျိုးအစားတွင် ပြောင်းလဲမှုရှိသောကြောင့် ဝယ်မည်၊ ငွေဖြည့်မည်ဆိုလျှင် လက်ရှိသုံးနိုင်သော Pass အမျိုးအစားနှင့် အသုံးပြုနိုင်သောနေရာကို အရင်စစ်ပါ။
        href: https://world.seoul.go.kr/policy/transportation/climate-card/
      - icon: external
        title:
          en: Korea Tour Card and MPASS
          ko: 코리아투어카드와 MPASS
          my: Korea Tour Card နှင့် MPASS
        body:
          en: These are more tourist-focused cards or passes. They can be useful for short visits, but residents and students should compare them with normal transportation cards or K-Pass-type options.
          ko: 여행객 중심의 카드 또는 패스입니다. 단기 방문자에게 유용할 수 있지만 거주자나 학생은 일반 교통카드 또는 K-패스 계열과 비교해보세요.
          my: ဤကတ်များသည် ခရီးသွားများအတွက် ပိုမိုရည်ရွယ်ထားသော ကတ် သို့မဟုတ် Pass များဖြစ်ပါသည်။ ခဏလာသူများအတွက် အသုံးဝင်နိုင်သော်လည်း နေထိုင်သူများနှင့် ကျောင်းသားများအနေဖြင့် ပုံမှန်ယာဉ်စီးကတ် သို့မဟုတ် K-Pass အမျိုးအစားများနှင့် နှိုင်းယှဉ်ကြည့်သင့်ပါသည်။
        href: https://english1.visitkorea.or.kr/enu/TRP/TP_ENG_8_1_2.jsp
  - icon: transit
    title:
      en: What to know first
      ko: 먼저 알아둘 내용
      my: အရင်သိထားရမည့်အချက်များ
    intro:
      en: Most daily trips can be handled with a transportation card and a route app. The important part is tapping correctly and checking the last train or bus time.
      ko: 일상 이동은 교통카드와 길찾기 앱으로 대부분 해결할 수 있습니다. 중요한 것은 승하차 태그와 막차 시간을 확인하는 것입니다.
      my: နေ့စဉ်သွားလာမှုအများစုကို ယာဉ်စီးကတ်နှင့် လမ်းကြောင်းရှာ App ဖြင့် ဖြေရှင်းနိုင်ပါသည်။ အရေးကြီးတာက စီးချိန်/ဆင်းချိန်တွင် ကတ်ကို မှန်မှန်ကန်ကန်ထိခြင်းနှင့် နောက်ဆုံးရထား၊ နောက်ဆုံးဘတ်စ်ကားအချိန်ကို စစ်ခြင်း ဖြစ်ပါသည်။
    items:
      - icon: check
        title:
          en: Use a transportation card
          ko: 교통카드를 준비하세요
          my: ယာဉ်စီးကတ်ကို ပြင်ထားပါ
        body:
          en: Tmoney, Cashbee, and similar cards can be used for buses and subways in many areas. They are easier than buying a single ticket each time and can help with transfer discounts.
          ko: 티머니, 캐시비 등 교통카드는 여러 지역의 버스와 지하철에서 사용할 수 있습니다. 매번 1회권을 사는 것보다 편하고 환승 할인에도 도움이 됩니다.
          my: Tmoney၊ Cashbee စသော ယာဉ်စီးကတ်များကို နေရာအများအပြားရှိ ဘတ်စ်ကားနှင့် မြေအောက်ရထားတွင် သုံးနိုင်ပါသည်။ တစ်ခါစီးလက်မှတ်ကို အကြိမ်တိုင်းဝယ်ခြင်းထက် ပိုလွယ်ပြီး ပြောင်းစီးခွင့်အတွက်လည်း အကျိုးရှိနိုင်ပါသည်။
        href: ""
      - icon: list
        title:
          en: Tap when you get on and off
          ko: 탈 때와 내릴 때 태그하세요
          my: စီးချိန်နှင့် ဆင်းချိန်တွင် ကတ်ထိပါ
        body:
          en: On buses, tap your card when boarding and again before getting off. If you forget to tap off, transfer discounts may not apply or the fare may be calculated differently.
          ko: 버스는 탈 때와 내릴 때 모두 카드를 태그하세요. 내릴 때 태그하지 않으면 환승 할인이 적용되지 않거나 요금 계산이 달라질 수 있습니다.
          my: ဘတ်စ်ကားစီးချိန်တွင် ကတ်ထိပြီး ဆင်းမီလည်း ထပ်ထိပါ။ ဆင်းချိန်တွင် မထိမိပါက ပြောင်းစီးလျှော့စျေး မရနိုင်ခြင်း သို့မဟုတ် ခရီးစရိတ်တွက်ချက်ပုံကွာခြင်း ဖြစ်နိုင်ပါသည်။
        href: ""
      - icon: search
        title:
          en: Use Korean map apps
          ko: 한국 지도 앱을 사용하세요
          my: ကိုရီးယားလမ်းကြောင်းရှာ App ကို သုံးပါ
        body:
          en: Naver Map, KakaoMap, and transit apps are useful for routes, platform exits, transfer stations, and last train or bus times.
          ko: 네이버지도, 카카오맵과 대중교통 앱은 이동 경로, 출구, 환승역, 막차 시간을 확인하는 데 유용합니다.
          my: Naver Map၊ KakaoMap နှင့် အများသုံးယာဉ် App များသည် လမ်းကြောင်း၊ ထွက်ပေါက်၊ ပြောင်းစီးရမည့်ဘူတာနှင့် နောက်ဆုံးရထား/ဘတ်စ်ကားအချိန်ကို စစ်ရာတွင် အသုံးဝင်ပါသည်။
        href: ""
  - icon: doc
    title:
      en: What to prepare
      ko: 준비할 것
      my: ပြင်ထားသင့်သောအရာများ
    intro:
      en: You do not need many documents for normal rides, but you do need a card, enough balance, and a simple backup plan when a route changes.
      ko: 일반적인 대중교통 이용에는 많은 서류가 필요하지 않습니다. 다만 교통카드, 충분한 잔액과 경로가 바뀔 때의 대안을 준비해두면 좋습니다.
      my: ပုံမှန်အများသုံးယာဉ်စီးရန် စာရွက်စာတမ်းများစွာ မလိုပါ။ သို့သော် ယာဉ်စီးကတ်၊ လုံလောက်သောလက်ကျန်ငွေ နှင့် လမ်းကြောင်းပြောင်းသွားပါက သုံးနိုင်မည့်နည်းလမ်းတစ်ခုကို ပြင်ထားလျှင် ကောင်းပါသည်။
    items:
      - icon: daily
        title:
          en: Card and balance
          ko: 카드와 잔액
          my: ကတ်နှင့် လက်ကျန်ငွေ
        body:
          en: Buy and reload transportation cards at convenience stores or station machines. Keep enough balance, especially before late-night trips or airport trips.
          ko: 교통카드는 편의점이나 역 충전기에서 구매하고 충전할 수 있습니다. 특히 늦은 시간 이동이나 공항 이동 전에는 잔액을 확인하세요.
          my: ယာဉ်စီးကတ်ကို Convenience store သို့မဟုတ် ဘူတာရှိစက်များတွင် ဝယ်ပြီး ငွေဖြည့်နိုင်ပါသည်။ ညဘက်သွားလာမည်ဆိုပါက သို့မဟုတ် လေဆိပ်သွားမည်ဆိုပါက လက်ကျန်ငွေကို အရင်စစ်ပါ။
        href: ""
      - icon: phone
        title:
          en: Phone battery and route app
          ko: 휴대폰 배터리와 길찾기 앱
          my: ဖုန်းဘက်ထရီနှင့် လမ်းကြောင်းရှာ App
        body:
          en: Keep your phone charged because route changes, platform numbers, taxi pickup points, and walking directions are easier to check on your phone.
          ko: 경로 변경, 승강장 번호, 택시 승차 위치와 도보 경로는 휴대폰으로 확인하는 것이 편하므로 배터리를 준비하세요.
          my: လမ်းကြောင်းပြောင်းခြင်း၊ ရထားစီးမည့်နေရာနံပါတ်၊ တက္ကစီစောင့်ရမည့်နေရာနှင့် လမ်းလျှောက်ရမည့်လမ်းကြောင်းများကို ဖုန်းဖြင့်စစ်ရတာ ပိုလွယ်သောကြောင့် ဖုန်းဘက်ထရီကို ပြင်ထားပါ။
        href: ""
      - icon: help
        title:
          en: Late-night backup
          ko: 늦은 시간 대안
          my: ညဘက်အတွက် အရန်နည်းလမ်း
        body:
          en: Subways and many buses do not run all night. If you go out late, check the last train or bus first and prepare a taxi or safer route home.
          ko: 지하철과 많은 버스는 밤새 운행하지 않습니다. 늦게 이동할 예정이면 막차를 먼저 확인하고 택시나 안전한 귀가 경로를 준비하세요.
          my: မြေအောက်ရထားနှင့် ဘတ်စ်ကားအများစုသည် တစ်ညလုံး မပြေးဆွဲပါ။ ညနောက်ကျမှပြန်မည်ဆိုပါက နောက်ဆုံးရထား/ဘတ်စ်ကားအချိန်ကို အရင်စစ်ပြီး တက္ကစီ သို့မဟုတ် ပိုလုံခြုံသောပြန်လမ်းကို ပြင်ထားပါ။
        href: ""
  - icon: list
    title:
      en: Common situations
      ko: 자주 겪는 상황
      my: မကြာခဏတွေ့ရသည့်အခြေအနေများ
    intro:
      en: These small habits prevent many beginner mistakes when using buses, subways, airport trains, and taxis.
      ko: 아래 습관을 알면 버스, 지하철, 공항철도와 택시 이용 시 초보자가 자주 겪는 실수를 줄일 수 있습니다.
      my: အောက်ပါအချက်များကို သိထားလျှင် ဘတ်စ်ကား၊ မြေအောက်ရထား၊ လေဆိပ်ရထားနှင့် တက္ကစီသုံးရာတွင် အသစ်ရောက်သူများ မကြာခဏမှားတတ်သည့်အရာများကို လျှော့ချနိုင်ပါသည်။
    items:
      - icon: transit
        title:
          en: Bus direction and stop name
          ko: 버스 방향과 정류장 이름
          my: ဘတ်စ်ကားဦးတည်ရာနှင့် မှတ်တိုင်နာမည်
        body:
          en: Same bus number can feel confusing if you stand on the wrong side of the road. Check the direction, stop name, and next major station before boarding.
          ko: 같은 버스 번호라도 반대편 정류장에서 타면 방향이 달라집니다. 타기 전 방향, 정류장 이름과 다음 주요 정류장을 확인하세요.
          my: ဘတ်စ်ကားနံပါတ်တူသော်လည်း လမ်း၏မှားဘက်မှတ်တိုင်တွင်စောင့်ပါက ဦးတည်ရာကွာနိုင်ပါသည်။ စီးမီ ဦးတည်ရာ၊ မှတ်တိုင်နာမည်နှင့် နောက်ထပ်အဓိကမှတ်တိုင်ကို စစ်ပါ။
        href: ""
      - icon: search
        title:
          en: Subway exit number
          ko: 지하철 출구 번호
          my: မြေအောက်ရထား ထွက်ပေါက်နံပါတ်
        body:
          en: Large stations can have many exits. Check the exit number before leaving the station so you do not walk in the wrong direction.
          ko: 큰 역에는 출구가 많습니다. 역을 나가기 전에 출구 번호를 확인하면 반대 방향으로 걷는 일을 줄일 수 있습니다.
          my: ဘူတာကြီးများတွင် ထွက်ပေါက်များစွာ ရှိတတ်ပါသည်။ ဘူတာမှမထွက်မီ ထွက်ပေါက်နံပါတ်ကို စစ်ပါက မှားဘက်လမ်းလျှောက်ခြင်းကို လျှော့ချနိုင်ပါသည်။
        href: ""
      - icon: shield
        title:
          en: Taxi and address
          ko: 택시와 주소
          my: တက္ကစီနှင့် လိပ်စာ
        body:
          en: For taxis, prepare the Korean address or place name. If you use a taxi app, confirm the pickup point and car plate before getting in.
          ko: 택시를 탈 때는 한국어 주소나 장소명을 준비하세요. 택시 앱을 쓰는 경우 승차 위치와 차량번호를 확인한 뒤 탑승하세요.
          my: တက္ကစီစီးမည်ဆိုပါက ကိုရီးယားလိပ်စာ သို့မဟုတ် နေရာနာမည်ကို ပြင်ထားပါ။ တက္ကစီ App သုံးပါက စီးမည့်နေရာနှင့် ကားနံပါတ်ကို စစ်ပြီးမှ စီးပါ။
        href: ""
  - icon: shield
    title:
      en: Where to confirm
      ko: 확인할 곳
      my: ဘယ်မှာပြန်စစ်မလဲ
    intro:
      en: Fares, card types, transfer rules, and tourist passes can change. Confirm current details before relying on old posts or videos.
      ko: 요금, 교통카드 종류, 환승 규칙과 관광 패스는 바뀔 수 있습니다. 오래된 글이나 영상만 믿기 전에 최신 정보를 확인하세요.
      my: ခရီးစရိတ်၊ ယာဉ်စီးကတ်အမျိုးအစား၊ ပြောင်းစီးစည်းကမ်းနှင့် ခရီးသွားကတ်များသည် ပြောင်းလဲနိုင်ပါသည်။ ပို့စ်အဟောင်း သို့မဟုတ် ဗီဒီယိုအဟောင်းများကိုသာ မယုံကြည်မီ နောက်ဆုံးအချက်အလက်ကို ပြန်စစ်ပါ။
    items:
      - icon: external
        title:
          en: VisitKorea transportation cards
          ko: VisitKorea 교통카드 안내
          my: VisitKorea ယာဉ်စီးကတ်အချက်အလက်
        body:
          en: VisitKorea explains transportation cards such as Tmoney and Cashbee, where to buy and reload them, and basic bus and subway use.
          ko: VisitKorea에서 티머니, 캐시비 등 교통카드, 구매·충전 장소와 버스·지하철 기본 이용 방법을 확인할 수 있습니다.
          my: VisitKorea တွင် Tmoney၊ Cashbee စသော ယာဉ်စီးကတ်များ၊ ဝယ်/ငွေဖြည့်နိုင်သောနေရာများနှင့် ဘတ်စ်ကား/မြေအောက်ရထားအခြေခံအသုံးပြုနည်းများကို စစ်နိုင်ပါသည်။
        href: https://english.visitkorea.or.kr/svc/contents/infoBscView.do?menuSn=479&vcontsId=140663
      - icon: external
        title:
          en: Seoul public transportation
          ko: 서울시 대중교통 안내
          my: Seoul အများသုံးယာဉ်အချက်အလက်
        body:
          en: Seoul Metropolitan Government explains bus and subway use, payment methods, transfer tips, and mobile transportation card notes.
          ko: 서울시에서 버스와 지하철 이용, 결제수단, 환승 팁과 모바일 교통카드 관련 내용을 안내합니다.
          my: Seoul မြို့တော်အစိုးရစာမျက်နှာတွင် ဘတ်စ်ကားနှင့် မြေအောက်ရထားအသုံးပြုနည်း၊ ငွေပေးချေသည့်နည်းလမ်း၊ ပြောင်းစီးခြင်းဆိုင်ရာအချက်များနှင့် မိုဘိုင်းယာဉ်စီးကတ်အကြောင်း စစ်နိုင်ပါသည်။
        href: https://english.seoul.go.kr/service/movement/public-transportation/
      - icon: help
        title:
          en: Route app and station signs
          ko: 길찾기 앱과 역 안내
          my: လမ်းကြောင်းရှာ App နှင့် ဘူတာအချက်ပြများ
        body:
          en: For the actual trip, check the route app and station signs on the day you travel. Platform, exit, and route information can change during construction or delays.
          ko: 실제 이동 당일에는 길찾기 앱과 역 안내를 함께 확인하세요. 공사나 지연 상황에 따라 승강장, 출구와 경로 정보가 바뀔 수 있습니다.
          my: တကယ်သွားမည့်နေ့တွင် လမ်းကြောင်းရှာ App နှင့် ဘူတာအချက်ပြများကိုပါ စစ်ပါ။ ဆောက်လုပ်ရေးလုပ်ငန်း သို့မဟုတ် နှောင့်နှေးမှုကြောင့် စီးရမည့်နေရာ၊ ထွက်ပေါက်နှင့် လမ်းကြောင်းအချက်အလက် ပြောင်းနိုင်ပါသည်။
        href: ""
